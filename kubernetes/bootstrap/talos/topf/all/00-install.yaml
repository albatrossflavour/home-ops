# Every node's boot disk is 54GB. The only other disks in the fleet are the
# Ceph OSD data disks on weatherwax, ogg and magrat (537-591GB), so a size
# selector cannot pick the wrong one the way a raw /dev/sda path can if device
# enumeration order shifts. The virtio disks report no serial or WWID to
# select on.
#
# GB is the metric unit (10^9 bytes), the same as the "< 60GB" this replaced.
# topf fills in installer.image from talosVersion and schematicId.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.size < 60u * GB
  wipe: false
