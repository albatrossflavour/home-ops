# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.13.9
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.3

clusterName: "witches"
endpoint: https://192.168.8.20:6443
clusterPodNets:
  - "10.69.0.0/16"
clusterSvcNets:
  - "10.96.0.0/16"
additionalApiServerCertSans: &sans
  - "192.168.8.20"
  - 127.0.0.1 # KubePrism
additionalMachineCertSans: *sans

# Disable built-in Flannel to use Cilium
cniConfig:
  name: none

# 2026-09-01: every node's installDiskSelector matches on size (< 60GB),
# not a raw /dev/sda path. All 6 nodes' boot disk is consistently 54GB;
# the only other disk anywhere in this fleet (the Ceph OSD data disks on
# weatherwax/ogg/magrat) is 537-591GB - a size selector is immune to a
# device-enumeration-order shift the way a raw path isn't (e.g. if a 4th
# OSD disk is ever added to a worker node - see the audit doc's
# 4th-OSD-failure-domain finding). No serial/WWID available on these
# virtio disks to select on instead - all report as generic "QEMU
# HARDDISK".
nodes:
  - hostname: "weatherwax"
    ipAddress: "192.168.8.10"
    installDiskSelector:
      size: "< 60GB"
    talosImageURL: factory.talos.dev/installer/2dacffae5966040d295675d639c94cde1fc31eef656ae244b07aad3552ac3757
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:95:66:3b"
        dhcp: false
        addresses:
          - "192.168.8.10/24"
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.8.1"
        mtu: 1500
        vip:
          ip: "192.168.8.20"
  - hostname: "ogg"
    ipAddress: "192.168.8.11"
    installDiskSelector:
      size: "< 60GB"
    talosImageURL: factory.talos.dev/installer/2dacffae5966040d295675d639c94cde1fc31eef656ae244b07aad3552ac3757
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:26:e4:81"
        dhcp: false
        addresses:
          - "192.168.8.11/24"
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.8.1"
        mtu: 1500
        vip:
          ip: "192.168.8.20"
  - hostname: "magrat"
    ipAddress: "192.168.8.12"
    installDiskSelector:
      size: "< 60GB"
    talosImageURL: factory.talos.dev/installer/2dacffae5966040d295675d639c94cde1fc31eef656ae244b07aad3552ac3757
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          # 2026-08-31: corrected from bc:24:11:0b:3c:9b, which no longer
          # matched the node's actual NIC (verified live via talosctl).
          # The stale value was harmless until a full machine config was
          # finally pushed via apply-config, which wiped magrat's network
          # config entirely since the deviceSelector matched nothing.
          hardwareAddr: "bc:24:11:e2:60:8b"
        dhcp: false
        addresses:
          - "192.168.8.12/24"
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.8.1"
        mtu: 1500
        vip:
          ip: "192.168.8.20"
  - hostname: "wuffles"
    ipAddress: "192.168.8.13"
    installDiskSelector:
      size: "< 60GB"
    talosImageURL: factory.talos.dev/installer/2dacffae5966040d295675d639c94cde1fc31eef656ae244b07aad3552ac3757
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:38:1a:ea"
        dhcp: false
        addresses:
          - "192.168.8.13/24"
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.8.1"
        mtu: 1500
  - hostname: "aching"
    ipAddress: "192.168.8.14"
    installDiskSelector:
      size: "< 60GB"
    talosImageURL: factory.talos.dev/installer/2dacffae5966040d295675d639c94cde1fc31eef656ae244b07aad3552ac3757
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:b5:59:f8"
        dhcp: false
        addresses:
          - "192.168.8.14/24"
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.8.1"
        mtu: 1500
  - hostname: "greebo"
    ipAddress: "192.168.8.15"
    installDiskSelector:
      size: "< 60GB"
    talosImageURL: factory.talos.dev/installer/2dacffae5966040d295675d639c94cde1fc31eef656ae244b07aad3552ac3757
    controlPlane: false
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:5b:3e:b3"
        dhcp: false
        addresses:
          - "192.168.8.15/24"
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.8.1"
        mtu: 1500

# Global patches
patches:
  - "@./patches/global/cluster-discovery.yaml"
  - "@./patches/global/containerd.yaml"
  - "@./patches/global/disable-search-domain.yaml"
  - "@./patches/global/hostdns.yaml"
  - "@./patches/global/kubelet.yaml"
  - "@./patches/global/openebs-local.yaml"
  - "@./patches/global/sysctl.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/api-access.yaml"
    - "@./patches/controller/cluster.yaml"
    - "@./patches/controller/disable-admission-controller.yaml"
    - "@./patches/controller/etcd.yaml"
