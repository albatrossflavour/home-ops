---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount_v1.json
# Finding #7 convention: every Kyverno controller runs under its own
# dedicated ServiceAccount with real RBAC bound to it, so nothing here uses
# the bare "default" SA. Closing an unused credential, not an active hole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: kyverno
automountServiceAccountToken: false
