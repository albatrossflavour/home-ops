---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/kyverno/charts/kyverno
  ref:
    # Chart 3.9.0 -> Kyverno v1.19.0 (confirmed by reading the chart's own
    # config blob from ghcr, not from the docs).
    #
    # COMPATIBILITY NOTE: Kyverno v1.19 is tested against Kubernetes
    # v1.33-v1.35. This cluster runs v1.36.3, one minor ahead. The chart's
    # own kubeVersion constraint is only ">=1.25.0-0", so nothing in the
    # install path will warn about this - the tested range lives in the
    # docs, not in the chart. Upstream's wording is "may work, but are not
    # tested". Admission review is a stable API so the webhook path should
    # be fine; the background and reports controllers touch far more of the
    # API surface and are the more likely place for a 1.36 surprise.
    tag: 3.9.0
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
