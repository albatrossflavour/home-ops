---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kyverno
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # STAGE 1: the engine only. No policies are installed anywhere in this
    # commit, deliberately.
    #
    # Kyverno rewrites its OWN ValidatingWebhookConfiguration based on the
    # policies that exist (features.autoUpdateWebhooks below). With zero
    # policies it registers webhook rules matching essentially nothing, so
    # this deployment cannot reject a workload even in principle. That is
    # what makes it a safe first step on an untested Kubernetes minor.

    crds:
      # The chart ships 26 CRDs. Note the chart's own values.yaml flags the
      # legacy kyverno.io types (ClusterPolicy, Policy, PolicyException) as
      # deprecated in favour of the policies.kyverno.io group's CEL-based
      # types. Both groups install; which one we author against is a real
      # decision, deferred to stage 2.
      install: true

    features:
      backgroundScan:
        # Chart default is true, meaning the background scan deliberately
        # IGNORES the resourceFilters that admission honours - including the
        # chart's own '[ReplicaSet,*,*]' exclusion. The effect measured here:
        #
        #   799 ReplicaSets exist, 663 of them scaled to 0
        #   2,040 ReplicaSet failures, 1,698 of them from dead revisions
        #   ...all from the same 101 distinct workloads
        #
        # Nothing is leaking - every Deployment sits exactly at its
        # revisionHistoryLimit and Kubernetes GC is working. The reports are
        # accurate; they just re-audit ten dead rollback targets per workload.
        # Setting this false makes the scan honour the same exclusions
        # admission already uses. Violations are still reported against the
        # Deployment and its live Pods, so nothing actionable is lost - only
        # the duplication, plus the bulk of the metric cardinality behind it.
        skipResourceFilters: false
      policyExceptions:
        # OFF by default in the chart, and the failure mode is nasty: a
        # PolicyException applies cleanly, appears in `kubectl get`, and does
        # absolutely nothing. The only signal is an apply-time warning
        # ("PolicyException resources would not be processed until it is
        # enabled") that Flux never surfaces - the Kustomization still goes
        # Ready=True. Caught here by a server-side dry-run before commit.
        enabled: true
        # Confine exceptions to the kyverno namespace rather than "*". An
        # exception is a permission to violate policy, so letting any
        # namespace declare its own exemptions hands the decision to whoever
        # can write to that namespace. Keeping them in one place is what makes
        # them reviewable.
        namespace: kyverno
      excludeBootstrapResources:
        # Excludes Node and CertificateSigningRequest from Fail-policy
        # webhooks. Without this, a full cluster restart with no Kyverno
        # pods running can deadlock: nodes cannot register because the
        # webhook is unreachable, and the webhook cannot start because no
        # node will schedule it.
        #
        # Off by default in the chart. Turned on here specifically because
        # this cluster has already had a control-plane VM disappear at the
        # hypervisor level once (magrat, 2026-09-01) and boot-order
        # behaviour under total power loss is a known-untested area.
        enabled: true

    # Single replica per controller while everything is in audit and the
    # webhooks match nothing. When policies move to Enforce, the admission
    # controller should go to 3 - at that point a restart window becomes a
    # real availability question rather than a theoretical one.
    # Metrics. Prometheus here selects ServiceMonitors from every namespace
    # (serviceMonitorSelector and serviceMonitorNamespaceSelector are both
    # empty), so no extra labels are needed.
    #
    # Both controllers matter and they carry different data:
    #   admission controller -> execution_cause="admission_request"
    #   reports controller   -> execution_cause="background_scan"
    # Only the second sees the whole cluster; the first only sees what has
    # actually been admitted since it started.
    # The chart's dashboard is shipped from this repo instead - see
    # kyverno/policies/app/dashboards/kyverno-engine.json. Its `cluster`
    # variable queries the legacy kyverno_policy_results_total metric, which a
    # CEL-only cluster never emits, so every panel reads "No data". Forked with
    # that one query repointed rather than disabled and lost.
    grafana:
      enabled: false

    admissionController:
      replicas: 1
      serviceMonitor:
        enabled: true
        interval: 30s

    backgroundController:
      replicas: 1
      serviceMonitor:
        enabled: true
        interval: 30s

    reportsController:
      # This is the controller that produces PolicyReport and
      # ClusterPolicyReport objects. For a compliance use case it is the
      # product surface, not overhead - deliberately left on.
      replicas: 1
      # This is the one that carries whole-cluster posture. Its
      # kyverno_validating_policy_results_total is ~5,400 series against the
      # admission controller's ~330, because it re-evaluates every resource
      # rather than only what passes through admission.
      serviceMonitor:
        enabled: true
        interval: 60s

    cleanupController:
      # TTL-based resource deletion. Not needed here, and leaving it off
      # means one fewer controller and one fewer webhook in the cluster.
      enabled: false

    # Resource requests/limits, pod and container securityContexts, and the
    # default resourceFilters are all left at chart defaults on purpose.
    # Verified by reading chart 3.9.0's values.yaml directly:
    #   - securityContexts are already Restricted-compliant
    #   - resourceFilters already exclude kube-system, kube-public,
    #     kube-node-lease and all of Kyverno's own resources
    # Overriding either would be changing something already correct.
