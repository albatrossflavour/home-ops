---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kyverno
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # STAGE 1: the engine only. No policies are installed anywhere in this
    # commit, deliberately.
    #
    # Kyverno rewrites its OWN ValidatingWebhookConfiguration based on the
    # policies that exist (features.autoUpdateWebhooks below). With zero
    # policies it registers webhook rules matching essentially nothing, so
    # this deployment cannot reject a workload even in principle. That is
    # what makes it a safe first step on an untested Kubernetes minor.

    crds:
      # The chart ships 26 CRDs. Note the chart's own values.yaml flags the
      # legacy kyverno.io types (ClusterPolicy, Policy, PolicyException) as
      # deprecated in favour of the policies.kyverno.io group's CEL-based
      # types. Both groups install; which one we author against is a real
      # decision, deferred to stage 2.
      install: true

    config:
      # Kyverno's default resourceFilters exclude kube-system outright. Combined
      # with features.backgroundScan.skipResourceFilters=false (#1667), that
      # meant kube-system stopped being scanned entirely at 11:12 UTC on
      # 2026-09-02. Its 112 PolicyReports froze that morning and never updated
      # again - by 2026-09-03 they sat ~1.1 million resourceVersions behind the
      # cluster while every other namespace tracked within a few thousand. The
      # violations they displayed were historical fiction, and the dashboard
      # showed 222 kube-system failures that Kyverno was not tracking at all.
      #
      # Excluding the namespace holding the CNI and the control plane from a
      # compliance posture is a weak claim to make to anyone. It was also
      # hiding two genuinely fixable findings: coredns running as root with no
      # seccomp profile, and reloader permitting privilege escalation. Neither
      # has any reason to be true.
      #
      # The components that genuinely CANNOT be fixed - cilium (eBPF, host
      # network and PID), spegel (containerd content store), and the
      # Talos-generated static control plane pods, which cannot be edited from
      # inside the cluster at all - are covered by the scoped
      # kube-system-node-infrastructure PolicyException instead. Naming them in
      # an exception with a written justification is the honest representation;
      # a namespace-wide filter that silently covers everything is not.
      #
      # resourceFiltersExclude removes ONE entry from the chart's default list
      # rather than replacing it, so the other ~60 defaults (Event, Node,
      # ReplicaSet, TokenReview, Kyverno's own resources) stay exactly as
      # upstream ships them. Replacing the whole list would mean maintaining a
      # copy of it, including its Helm-templated entries, forever.
      #
      # Cost: more report objects and more etcd write churn. That is not
      # theoretical here - Kyverno's reports pipeline is what took etcd's file
      # from a flat 299MiB to 414MiB in 42 hours on 2026-09-02. Offset in the
      # same change by deleting 674 frozen reports carrying 2067 phantom
      # failures, which is a net reduction in both objects and churn.
      resourceFiltersExclude:
        - "[*/*,kube-system,*]"

      # The second kube-system exclusion, and the one that actually mattered.
      # Removing the resourceFilters entry above changed nothing on its own,
      # because config.webhooks carries its own namespaceSelector excluding
      # kube-system, and Kyverno uses that single setting for BOTH the
      # admission webhook configuration and what the background scan will look
      # at. There is no way to scan the namespace without also admitting it to
      # the webhook path.
      #
      # The shape below is fiddly and was arrived at by rendering the chart,
      # not by reading it. `webhooks: {}` looks like it should work and does
      # nothing at all: Helm merges maps, so an empty map contributes no keys
      # and the chart's default selector survives untouched. The value has to
      # reach down to the matchExpressions LIST, because Helm replaces lists
      # rather than merging them.
      #
      # An empty list is then handled by the chart's kyverno.config.webhooks
      # helper, which APPENDS the kyverno-namespace exclusion to whatever it is
      # given. Supplying [] therefore yields a selector excluding the kyverno
      # namespace and nothing else, which is exactly right - Kyverno still does
      # not police itself, and that is the part of the default worth keeping.
      #
      # Confirmed by `helm template` before committing:
      #   {"namespaceSelector":{"matchExpressions":[{"key":
      #    "kubernetes.io/metadata.name","operator":"NotIn",
      #    "values":["kyverno"]}]}}
      #
      # The bootstrap question, since this genuinely is one. Cilium lives in
      # kube-system, so the CNI now passes through a Kyverno webhook on
      # creation. That is safe here specifically because of choices already
      # made elsewhere in this file: every policy is failurePolicy Ignore,
      # Kyverno removes its own webhooks on graceful shutdown, and
      # excludeBootstrapResources covers Node and CertificateSigningRequest.
      # A cold boot with Kyverno down means cilium hits an unreachable webhook
      # and is admitted regardless. The residual cost is webhook timeout
      # latency in the CNI startup path.
      #
      # This is the setting to revisit first if anything ever moves to
      # failurePolicy Fail. Under Fail, this line becomes a cluster that
      # cannot boot its own network.
      webhooks:
        namespaceSelector:
          matchExpressions: []

      # Stop emitting an Event for every audit failure.
      #
      # 6,810 of the cluster's 9,698 Event objects were Kyverno PolicyViolation
      # events (measured 2026-09-09), 70% of every event in etcd. They are not
      # success noise - generateSuccessEvents is already false and the chart
      # already omits PolicyApplied and PolicySkipped - they are real audit
      # failures, chiefly require-pod-resources (146), disallow-privilege-
      # escalation (95), require-run-as-nonroot (72) and the seccomp pair.
      #
      # WHY THEY ARE SAFE TO DROP HERE. Every policy in this cluster is
      # validationActions [Audit] with failurePolicy Ignore. Nothing blocks.
      # So a PolicyViolation event announces something that was admitted
      # anyway, and it announces it again on every background scan. The durable
      # record is the PolicyReport, which is what the Grafana boards and Policy
      # Reporter UI actually read, and that is untouched.
      #
      # Events carry a TTL, so this is continuous create-and-expire churn
      # against etcd rather than a fixed cost. That matters right now: reads on
      # this cluster run at ~940ms p99 and controllers are losing leader leases
      # mid-scan.
      #
      # THE COST, stated plainly. `kubectl describe pod` will no longer show
      # policy violations inline. That is a genuine convenience loss - it is how
      # the paperless-ai scheduling problem was read on 2026-09-09. The reports
      # still have everything; they are just less convenient to query.
      #
      # Revisit if any policy ever moves to Enforce. A blocked admission is
      # exactly the case where an event IS the signal.
      omitEvents:
        - PolicyApplied
        - PolicySkipped
        - PolicyViolation

    features:
      backgroundScan:
        # Chart default is true, meaning the background scan deliberately
        # IGNORES the resourceFilters that admission honours - including the
        # chart's own '[ReplicaSet,*,*]' exclusion. The effect measured here:
        #
        #   799 ReplicaSets exist, 663 of them scaled to 0
        #   2,040 ReplicaSet failures, 1,698 of them from dead revisions
        #   ...all from the same 101 distinct workloads
        #
        # Nothing is leaking - every Deployment sits exactly at its
        # revisionHistoryLimit and Kubernetes GC is working. The reports are
        # accurate; they just re-audit ten dead rollback targets per workload.
        # Setting this false makes the scan honour the same exclusions
        # admission already uses. Violations are still reported against the
        # Deployment and its live Pods, so nothing actionable is lost - only
        # the duplication, plus the bulk of the metric cardinality behind it.
        skipResourceFilters: false
      policyExceptions:
        # OFF by default in the chart, and the failure mode is nasty: a
        # PolicyException applies cleanly, appears in `kubectl get`, and does
        # absolutely nothing. The only signal is an apply-time warning
        # ("PolicyException resources would not be processed until it is
        # enabled") that Flux never surfaces - the Kustomization still goes
        # Ready=True. Caught here by a server-side dry-run before commit.
        enabled: true
        # Confine exceptions to the kyverno namespace rather than "*". An
        # exception is a permission to violate policy, so letting any
        # namespace declare its own exemptions hands the decision to whoever
        # can write to that namespace. Keeping them in one place is what makes
        # them reviewable.
        namespace: kyverno
      excludeBootstrapResources:
        # Excludes Node and CertificateSigningRequest from Fail-policy
        # webhooks. Without this, a full cluster restart with no Kyverno
        # pods running can deadlock: nodes cannot register because the
        # webhook is unreachable, and the webhook cannot start because no
        # node will schedule it.
        #
        # Off by default in the chart. Turned on here specifically because
        # this cluster has already had a control-plane VM disappear at the
        # hypervisor level once (magrat, 2026-09-01) and boot-order
        # behaviour under total power loss is a known-untested area.
        enabled: true

    # Single replica per controller while everything is in audit and the
    # webhooks match nothing. When policies move to Enforce, the admission
    # controller should go to 3 - at that point a restart window becomes a
    # real availability question rather than a theoretical one.
    # Metrics. Prometheus here selects ServiceMonitors from every namespace
    # (serviceMonitorSelector and serviceMonitorNamespaceSelector are both
    # empty), so no extra labels are needed.
    #
    # Both controllers matter and they carry different data:
    #   admission controller -> execution_cause="admission_request"
    #   reports controller   -> execution_cause="background_scan"
    # Only the second sees the whole cluster; the first only sees what has
    # actually been admitted since it started.
    # The chart's dashboard is shipped from this repo instead - see
    # kyverno/policies/app/dashboards/kyverno-engine.json. Its `cluster`
    # variable queries the legacy kyverno_policy_results_total metric, which a
    # CEL-only cluster never emits, so every panel reads "No data". Forked with
    # that one query repointed rather than disabled and lost.
    grafana:
      enabled: false

    admissionController:
      # Leader election widened from the default retry period of 2s.
      #
      # Kyverno derives its lease duration from this value: the observed lease
      # is 12s against a 2s retry period, so the lease is 6x the retry. All
      # three controllers have been losing their leases and restarting, with
      # the reports controller managing 3 restarts in 10 minutes on 2026-09-09.
      #
      # The cause is read latency, not load. Measured the same day: GET p99
      # 936ms, LIST p99 945ms, LIST on leases specifically 2977ms, against
      # healthy writes (POST 46ms) and no APF queueing or rejections. Kyverno's
      # own client limit is already generous at 300 QPS, so it is not
      # self-throttling.
      #
      # The consequence was not cosmetic. A full background scan takes about
      # five minutes; the reports controller was dying before finishing one, so
      # no PolicyReport had been written cluster-wide for over an hour and the
      # newly added cis-5-1-6 policy produced no results at all. Every report in
      # the cluster was stale while appearing perfectly normal.
      #
      # Same reasoning as the etcd election-timeout change in #1743, one layer
      # up. The cost is slower failover after a genuine controller death, which
      # for audit-only policies that block nothing is not an availability
      # question.
      extraArgs:
        leaderElectionRetryPeriod: 6s
      replicas: 1
      serviceMonitor:
        enabled: true
        interval: 30s

    backgroundController:
      # Leader election widened from the default retry period of 2s.
      #
      # Kyverno derives its lease duration from this value: the observed lease
      # is 12s against a 2s retry period, so the lease is 6x the retry. All
      # three controllers have been losing their leases and restarting, with
      # the reports controller managing 3 restarts in 10 minutes on 2026-09-09.
      #
      # The cause is read latency, not load. Measured the same day: GET p99
      # 936ms, LIST p99 945ms, LIST on leases specifically 2977ms, against
      # healthy writes (POST 46ms) and no APF queueing or rejections. Kyverno's
      # own client limit is already generous at 300 QPS, so it is not
      # self-throttling.
      #
      # The consequence was not cosmetic. A full background scan takes about
      # five minutes; the reports controller was dying before finishing one, so
      # no PolicyReport had been written cluster-wide for over an hour and the
      # newly added cis-5-1-6 policy produced no results at all. Every report in
      # the cluster was stale while appearing perfectly normal.
      #
      # Same reasoning as the etcd election-timeout change in #1743, one layer
      # up. The cost is slower failover after a genuine controller death, which
      # for audit-only policies that block nothing is not an availability
      # question.
      extraArgs:
        leaderElectionRetryPeriod: 6s
      replicas: 1
      serviceMonitor:
        enabled: true
        interval: 30s

    reportsController:
      # Leader election widened from the default retry period of 2s.
      #
      # Kyverno derives its lease duration from this value: the observed lease
      # is 12s against a 2s retry period, so the lease is 6x the retry. All
      # three controllers have been losing their leases and restarting, with
      # the reports controller managing 3 restarts in 10 minutes on 2026-09-09.
      #
      # The cause is read latency, not load. Measured the same day: GET p99
      # 936ms, LIST p99 945ms, LIST on leases specifically 2977ms, against
      # healthy writes (POST 46ms) and no APF queueing or rejections. Kyverno's
      # own client limit is already generous at 300 QPS, so it is not
      # self-throttling.
      #
      # The consequence was not cosmetic. A full background scan takes about
      # five minutes; the reports controller was dying before finishing one, so
      # no PolicyReport had been written cluster-wide for over an hour and the
      # newly added cis-5-1-6 policy produced no results at all. Every report in
      # the cluster was stale while appearing perfectly normal.
      #
      # Same reasoning as the etcd election-timeout change in #1743, one layer
      # up. The cost is slower failover after a genuine controller death, which
      # for audit-only policies that block nothing is not an availability
      # question.
      extraArgs:
        leaderElectionRetryPeriod: 6s
      # This is the controller that produces PolicyReport and
      # ClusterPolicyReport objects. For a compliance use case it is the
      # product surface, not overhead - deliberately left on.
      replicas: 1
      # This is the one that carries whole-cluster posture. Its
      # kyverno_validating_policy_results_total is ~5,400 series against the
      # admission controller's ~330, because it re-evaluates every resource
      # rather than only what passes through admission.
      serviceMonitor:
        enabled: true
        interval: 60s

    cleanupController:
      # TTL-based resource deletion. Not needed here, and leaving it off
      # means one fewer controller and one fewer webhook in the cluster.
      enabled: false

    # Resource requests/limits, pod and container securityContexts, and the
    # default resourceFilters are all left at chart defaults on purpose.
    # Verified by reading chart 3.9.0's values.yaml directly:
    #   - securityContexts are already Restricted-compliant
    #   - resourceFilters already exclude kube-system, kube-public,
    #     kube-node-lease and all of Kyverno's own resources
    # Overriding either would be changing something already correct.
