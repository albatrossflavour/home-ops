---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: policy-reporter
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Reads the PolicyReport objects Kyverno already produces and turns them
    # into something browsable. Read-only: it watches reports, it does not
    # create, evaluate or enforce policy, so it cannot affect admission.

    # Chart defaults are already Restricted-compliant (runAsNonRoot,
    # readOnlyRootFilesystem, drop ALL, seccompProfile RuntimeDefault),
    # verified against the chart's values.yaml - which is what lets this run
    # in the kyverno namespace at enforce: restricted without exceptions.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi

    ui:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
      ingress:
        enabled: true
        className: internal
        annotations:
          # REQUIRED per this repo's convention - a missing target annotation
          # is what produced the orphaned-DNS incidents behind findings
          # smarthome.pdlf.net and staging.toodlepip.com.au.
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Security
          gethomepage.dev/name: "Policy Reporter"
          gethomepage.dev/icon: kyverno.png
          gethomepage.dev/description: "Kyverno policy posture and compliance reports"
        hosts:
          - host: &host policy-reporter.${SECRET_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - *host

    plugin:
      kyverno:
        # Adds Kyverno-specific detail the generic report view cannot show:
        # the policy definition behind a result, and PolicyException
        # visibility - which is the whole point of looking at this ahead of
        # stage 4.
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

    # No external database configured, so results live in the pod's own
    # storage and reset on restart. Fine for evaluating the tool: Kyverno's
    # PolicyReports are the source of truth and are rebuilt on every
    # background scan anyway. A real deployment wanting result history over
    # time would point database.type at postgres - worth noting that
    # "compliance posture over time" needs a database nobody mentions in the
    # quickstart.
