---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./require-pod-resources.yaml
  - ./exception-volsync-movers.yaml
  - ./require-ingress-dns-target.yaml
  - ./require-ingress-class.yaml
  - ./require-image-digest.yaml
  - ./require-homepage-decision.yaml
  - ./require-storageclass-allowlist.yaml
  - ./rbac-volsync-read.yaml
  - ./globalcontext-replicationsources.yaml
  - ./require-pvc-backup.yaml

configMapGenerator:
  - name: kyverno-posture-dashboard
    namespace: kyverno
    files:
      - kyverno-posture.json=./dashboards/kyverno-posture.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Kyverno
