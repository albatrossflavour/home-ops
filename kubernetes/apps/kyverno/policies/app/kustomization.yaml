---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./require-pod-resources.yaml
  - ./exception-volsync-movers.yaml
  - ./exception-pvc-backup-cnpg.yaml
  - ./exception-pvc-backup-monitoring.yaml
  - ./exception-pvc-backup-shitbox.yaml
  - ./require-ingress-dns-target.yaml
  - ./require-ingress-class.yaml
  - ./require-image-digest.yaml
  - ./require-homepage-decision.yaml
  - ./require-storageclass-allowlist.yaml
  - ./rbac-volsync-read.yaml
  - ./globalcontext-replicationsources.yaml
  - ./require-pvc-backup.yaml

# The dashboard JSON uses Grafana's own ${var} template syntax, which
# collides head-on with Flux's postBuild variable substitution: cluster-apps
# patches substituteFrom onto every child Kustomization, envsubst runs over
# the rendered ConfigMap, finds no "datasource" variable and fails the whole
# Kustomization in strict mode. Every occurrence is therefore escaped as
# $${...}, which envsubst emits as a literal ${...} for Grafana to consume.
#
# The other dashboards in this cluster (cilium, cnpg) carry ${DS_PROMETHEUS}
# unescaped and are fine, because they are rendered by Helm and never pass
# through Flux's postBuild at all. Only Kustomize-generated manifests do.
configMapGenerator:
  - name: kyverno-posture-dashboard
    namespace: kyverno
    files:
      - kyverno-posture.json=./dashboards/kyverno-posture.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Kyverno
