---
# Kyverno ships RBAC for core resources only. The CIS policies below read
# resource types it has no default access to, and the failure is silent:
# the GlobalContextEntry never populates, the policy still reports
# "ready for reporting", and it produces zero results forever. That is
# indistinguishable from full compliance.
#
# Learned the hard way on require-pvc-backup, which needed the same grant for
# volsync.backube. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:cis-read
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  # 5.1.3 - wildcard detection needs to read the roles themselves
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "roles"]
    verbs: ["get", "list", "watch"]
  # 5.3.2 - this cluster's policies are Cilium's, not core NetworkPolicy
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
    verbs: ["get", "list", "watch"]
