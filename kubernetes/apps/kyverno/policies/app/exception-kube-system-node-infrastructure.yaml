---
# Node-level infrastructure in kube-system.
#
# Explicitly NOT namespace-wide, and the difference matters more here than
# anywhere else. kube-system holds two very different populations:
#
#   genuinely privileged, cannot be fixed
#     cilium + cilium-operator   CNI. Programs eBPF, needs host network,
#                                host PID and NET_ADMIN to exist at all.
#     spegel                     Registry mirror. Host path onto the
#                                containerd content store by design.
#     kube-apiserver-*           Talos-managed static pods. The machine
#     kube-controller-manager-*  config generates these; they are not
#     kube-scheduler-*           editable from the cluster side at all.
#
#   ordinary workloads that simply have bugs
#     coredns          fails require-run-as-nonroot, restrict-seccomp-strict
#     reloader         fails disallow-privilege-escalation
#     metrics-server   fails require-pod-resources
#     hubble-relay/ui  fails require-pod-resources
#
# A namespace-wide exception would silently absolve the second group. coredns
# has no reason to run as root, and reloader has no reason to allow privilege
# escalation - those are real findings worth fixing, and they are exactly what
# gets lost when someone exempts a namespace because it is "infrastructure".
apiVersion: policies.kyverno.io/v1beta1
kind: PolicyException
metadata:
  name: kube-system-node-infrastructure
  namespace: kyverno
spec:
  policyRefs:
    - {kind: ValidatingPolicy, name: disallow-capabilities}
    - {kind: ValidatingPolicy, name: disallow-capabilities-strict}
    - {kind: ValidatingPolicy, name: disallow-host-namespaces}
    - {kind: ValidatingPolicy, name: disallow-host-path}
    - {kind: ValidatingPolicy, name: disallow-host-ports}
    - {kind: ValidatingPolicy, name: disallow-privileged-containers}
    - {kind: ValidatingPolicy, name: disallow-privilege-escalation}
    - {kind: ValidatingPolicy, name: disallow-selinux}
    - {kind: ValidatingPolicy, name: require-run-as-nonroot}
    - {kind: ValidatingPolicy, name: require-run-as-non-root-user}
    - {kind: ValidatingPolicy, name: restrict-apparmor-profiles}
    - {kind: ValidatingPolicy, name: restrict-seccomp}
    - {kind: ValidatingPolicy, name: restrict-seccomp-strict}
    - {kind: ValidatingPolicy, name: restrict-volume-types}

  matchConditions:
    # Both metadata.name and metadata.generateName are checked, for the reason
    # documented at length on the volsync mover exception: a DaemonSet pod has
    # only generateName ("cilium-") at admission and only a real name
    # ("cilium-4cfv2") by the time the background scan sees it. Matching one
    # form silently misses half the evaluations.
    #
    # The controller objects are matched too (DaemonSet/cilium, DaemonSet/
    # spegel, Deployment/cilium-operator), because Kyverno autogen evaluates
    # the workload as well as its pods.
    #
    # Static control plane pods carry the node name as a suffix
    # (kube-apiserver-weatherwax) and have no generateName at all.
    - name: is-node-infrastructure
      expression: >-
        has(object.metadata.namespace) &&
        object.metadata.namespace == 'kube-system' &&
        (
          (
            has(object.metadata.name) &&
            (
              object.metadata.name == 'cilium' ||
              object.metadata.name == 'spegel' ||
              object.metadata.name.startsWith('cilium-') ||
              object.metadata.name.startsWith('spegel-') ||
              object.metadata.name.startsWith('kube-apiserver-') ||
              object.metadata.name.startsWith('kube-controller-manager-') ||
              object.metadata.name.startsWith('kube-scheduler-')
            )
          ) ||
          (
            has(object.metadata.generateName) &&
            (
              object.metadata.generateName.startsWith('cilium-') ||
              object.metadata.generateName.startsWith('spegel-')
            )
          )
        )

  reportResult: skip

  properties:
    reason: >-
      Cilium programs eBPF into the kernel and cannot function without host
      network and PID namespaces plus NET_ADMIN. Spegel serves a peer-to-peer
      image mirror directly from the containerd content store on each host.
      The kube-apiserver, controller-manager and scheduler static pods are
      generated by Talos machine config and cannot be modified from inside the
      cluster at all - an exception is the only available response to them.
    scope: >-
      cilium, cilium-operator, spegel and the three static control plane
      components only. Deliberately excludes coredns, reloader, metrics-server
      and the hubble components, which fail policies they could pass and
      should be fixed rather than exempted.
    residual-risk: >-
      These components already have node-level access as a condition of doing
      their job; the exception documents that rather than granting it. The
      static control plane pods are the more interesting case, in that Kyverno
      can observe them but never gate them - the webhook cannot sit in front
      of a kubelet reading a file off disk.
    approved-by: tgreen
    reviewed: "2026-09-03"

  # No expiresAt. CNI and the control plane are permanent structural
  # requirements, not temporary workarounds.
