# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nebula-sync
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      nebula-sync:
        type: cronjob
        cronjob:
          schedule: "0 * * * *"
          timeZone: "Australia/Sydney"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: ghcr.io/lovelaze/nebula-sync
              tag: latest@sha256:59c51378460f6dc8707cc91a16aa62dff5cd5dd8b39353658b45cb00d6bfddd8
            env:
              TZ: "Australia/Sydney"
              # Everything a full sync copies, spelt out, because the
              # exclusion below is only honoured when FULL_SYNC is false.
              FULL_SYNC: "false"
              SYNC_CONFIG_DNS: "true"
              SYNC_CONFIG_DHCP: "true"
              SYNC_CONFIG_NTP: "true"
              SYNC_CONFIG_RESOLVER: "true"
              SYNC_CONFIG_DATABASE: "true"
              SYNC_CONFIG_MISC: "true"
              SYNC_CONFIG_DEBUG: "true"
              SYNC_GRAVITY_DHCP_LEASES: "true"
              SYNC_GRAVITY_GROUP: "true"
              SYNC_GRAVITY_AD_LIST: "true"
              SYNC_GRAVITY_AD_LIST_BY_GROUP: "true"
              SYNC_GRAVITY_DOMAIN_LIST: "true"
              SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP: "true"
              SYNC_GRAVITY_CLIENT: "true"
              SYNC_GRAVITY_CLIENT_BY_GROUP: "true"
              # Pi-hole FTL 6.9 refuses misc.dnsmasq_lines over the API, and
              # one refused key fails the whole run. lab-dns-sync reports when
              # the Pi-holes disagree on it instead.
              SYNC_CONFIG_MISC_EXCLUDE: dnsmasq_lines
            envFrom:
              - secretRef:
                  name: nebula-sync-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    serviceMonitor:
      app:
        serviceName: nebula-sync
        enabled: false
