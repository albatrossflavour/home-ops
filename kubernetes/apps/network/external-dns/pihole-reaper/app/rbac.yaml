# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount.json
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns-pihole-reaper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns-pihole-reaper
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-pihole-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns-pihole-reaper
subjects:
  - kind: ServiceAccount
    name: external-dns-pihole-reaper
    namespace: network
---
# The ledger of records the reaper has seen external-dns publish, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-dns-pihole-reaper
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["external-dns-pihole-ledger"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-dns-pihole-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-dns-pihole-reaper
subjects:
  - kind: ServiceAccount
    name: external-dns-pihole-reaper
