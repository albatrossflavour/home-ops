# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-pihole-reaper
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      *app:
        type: cronjob
        cronjob:
          # external-dns syncs every minute. Running as often keeps the window in which an
          # ingress can come and go before the reaper has seen its record very short.
          schedule: "*/1 * * * *"
          timeZone: "Australia/Sydney"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: python
              tag: 3.12-alpine
            command: ["python3", "/app/pihole-reaper.py"]
            env:
              TZ: "Australia/Sydney"
              PIHOLE_URLS: "http://192.168.9.2,http://192.168.9.3,http://192.168.9.4"
              DOMAIN_FILTER: "${SECRET_DOMAIN}"
              # Deletes stay off until the dry run has been read against the live records.
              DRY_RUN: "true"
            envFrom:
              - secretRef:
                  name: external-dns-pihole-reaper-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      create: false
      name: external-dns-pihole-reaper
    persistence:
      script:
        type: configMap
        name: external-dns-pihole-reaper-script
        globalMounts:
          - path: /app
