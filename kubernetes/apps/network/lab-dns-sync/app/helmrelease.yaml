apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lab-dns-sync
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      lab-dns-sync:
        type: cronjob
        cronjob:
          # Every five minutes, so pecdm VMs are resolvable soon after they
          # boot (pecdm waits for DNS before installing PE). Records go to the
          # replicas directly too; nebula-sync's hourly copy then matches.
          schedule: "*/5 * * * *"
          timeZone: "Australia/Sydney"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: python
              tag: 3.12-alpine
            command: ["python3", "/app/lab-dns-sync.py"]
            env:
              TZ: "Australia/Sydney"
              PIHOLE_URL: "http://192.168.9.2"
              # Replicas get managed records directly. nebula-sync only
              # copies on the hour, and clients asking a replica first would
              # miss new records until then.
              PIHOLE_REPLICAS: "http://192.168.9.3,http://192.168.9.4"
              PUPPETDB_URL: "https://puppet.lab.albatrossflavour.com:8081"
              PUPPETDB_CACERT: "/app/puppet-ca.pem"
              PROXMOX_URL: "https://192.168.5.10:8006"
            envFrom:
              - secretRef:
                  name: lab-dns-sync-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    persistence:
      # Built by kustomization.yaml from lab-dns-sync.py, curated.json and
      # puppet-ca.pem.
      script:
        type: configMap
        name: lab-dns-sync-files
        globalMounts:
          - path: /app
