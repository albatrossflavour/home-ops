---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"
        AUTHENTIK_POSTGRESQL__NAME: &dbName authentik
        # Pooled (transaction mode) for ordinary ORM traffic.
        AUTHENTIK_POSTGRESQL__HOST: postgres16-pooler-rw.database.svc.cluster.local
        # Required by authentik behind a transaction-mode pooler — without
        # this its own /-/health/ready/ check throws OperationalError:
        # query_wait_timeout (goauthentik/authentik#14148).
        AUTHENTIK_POSTGRESQL__DISABLE_SERVER_SIDE_CURSORS: "true"
        # Unpooled: Django Channels (LISTEN channels_messages) and the
        # Dramatiq worker (LISTEN authentik.tasks, advisory locks) need a
        # direct connection — authentik's own documented split for this.
        AUTHENTIK_POSTGRESQL__DIRECT__HOST: &dbHost postgres16-rw.database.svc.cluster.local
        AUTHENTIK_POSTGRESQL__USER: &dbUser "{{ .AUTHENTIK_POSTGRESQL__USER }}"
        AUTHENTIK_POSTGRESQL__PASSWORD: &dbPass "{{ .AUTHENTIK_POSTGRESQL__PASSWORD }}"
        AUTHENTIK_REDIS__HOST: dragonfly.database.svc.cluster.local
        AUTHENTIK_REDIS__PORT: "6379"
        AUTHENTIK_REDIS__DB: "3"

#       MAXMIND_ACCOUNT_ID: "{{ .ACCOUNT_ID }}"
#       MAXMIND_LICENSE_KEY: "{{ .LICENSE_KEY }}"

        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: authentik
#   - extract:
#       key: maxmind
    - extract:
        key: cloudnative-pg
