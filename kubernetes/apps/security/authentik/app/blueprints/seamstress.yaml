# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# seamstress.lab's Puppet module reference signs in through this OIDC client
# (seamstress's oauth2-proxy). The client secret is in 1Password
# "seamstress oidc client" and reaches the worker as
# SEAMSTRESS_OIDC_CLIENT_SECRET through authentik-secret. Only authentik
# Admins may use it. The last two entries remove the provider and application
# it had as seamstress, before the module and node were renamed.
version: 1
metadata:
  name: seamstress
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: seamstress
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # A provider made by a blueprint gets no grant types by default, and
      # authentik then refuses the authorisation request as malformed.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: seamstress
      client_secret: !Env SEAMSTRESS_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://seamstress.lab.albatrossflavour.com/oauth2/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: app
    identifiers:
      slug: seamstress
    attrs:
      name: Seamstress
      provider: !KeyOf provider
      meta_launch_url: https://seamstress.lab.albatrossflavour.com/
      meta_description: Puppet module reference for the lab's environments
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: strings-site
  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: strings-site
