# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# The lab's pobs-mcp (Puppet Observability's MCP server on mcp.lab) accepts
# tokens from this OAuth client while observability R1300 trials OAuth. A public
# client, since Claude Code signs in from a laptop and holds no secret, with
# Claude Code's fixed callback port. pobs-mcp takes the PE login from
# preferred_username, which matches PE's logins because PE signs in through
# the puppet blueprint's SAML provider. authentik Admins and Puppet Viewer may
# sign in; PE RBAC then decides who may use it (infrastructure_assistant:use),
# so a Puppet Viewer gets in here and is refused there.
version: 1
metadata:
  name: pobs-mcp
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: pobs-mcp
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      # A provider made by a blueprint gets no grant types by default, and
      # authentik then refuses the authorisation request as malformed.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: pobs-mcp
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:8765/callback
      access_token_validity: hours=1
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
  - model: authentik_core.application
    id: app
    identifiers:
      slug: pobs-mcp
    attrs:
      name: Puppet Observability MCP
      group: Puppet
      provider: !KeyOf provider
      meta_description: Claude Code's sign-in to pobs-mcp on mcp.lab (observability R1300 trial)
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, Puppet Viewer]]
    attrs:
      order: 1
