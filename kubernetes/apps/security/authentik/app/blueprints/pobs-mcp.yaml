# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# The lab's pobs-mcp (Puppet Observability's MCP server on mcp.lab) accepts
# tokens from this OAuth client while observability R1300 trials OAuth. A public
# client, since Claude Code signs in from a laptop and holds no secret, with
# Claude Code's fixed callback port. pobs-mcp takes the PE login from
# preferred_username, which matches PE's logins because PE signs in through
# the puppet blueprint's SAML provider. authentik Admins and Puppet Viewer may
# sign in; PE RBAC then decides who may use it (infrastructure_assistant:use),
# so a Puppet Viewer gets in here and is refused there.
version: 1
metadata:
  name: pobs-mcp
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: pobs-mcp
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      # A provider made by a blueprint gets no grant types by default, and
      # authentik then refuses the authorisation request as malformed.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: pobs-mcp
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:8765/callback
      access_token_validity: hours=1
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
  - model: authentik_core.application
    id: app
    identifiers:
      slug: pobs-mcp
    attrs:
      name: Puppet Observability MCP
      group: Puppet
      provider: !KeyOf provider
      meta_description: Claude Code's sign-in to pobs-mcp on mcp.lab (observability R1300 trial)
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, Puppet Viewer]]
    attrs:
      order: 1
  # PAG and Gatus, which can't sign in through a browser, get tokens through
  # this confidential client with the client-credentials grant. authentik
  # issues them as its own service account for the provider, and a PE user of
  # that name holds infrastructure_assistant:use. Tokens last 30 days because
  # PAG can only send a fixed header and its token is rotated by hand; Gatus
  # fetches its own. The secret is in 1Password "pobs-mcp machines oauth
  # client" and reaches the worker as POBS_MCP_MACHINES_CLIENT_SECRET.
  - model: authentik_providers_oauth2.oauth2provider
    id: machines-provider
    identifiers:
      name: pobs-mcp-machines
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - client_credentials
      client_id: pobs-mcp-machines
      client_secret: !Env POBS_MCP_MACHINES_CLIENT_SECRET
      access_token_validity: days=30
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: machines-app
    identifiers:
      slug: pobs-mcp-machines
    attrs:
      name: Puppet Observability MCP (machines)
      group: Puppet
      provider: !KeyOf machines-provider
      meta_description: PAG's and Gatus's tokens for pobs-mcp on mcp.lab (observability R1300 trial)
      policy_engine_mode: any
