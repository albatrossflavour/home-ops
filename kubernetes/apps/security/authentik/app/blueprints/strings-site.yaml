# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# strings.lab's Puppet module reference signs in through this OIDC client
# (strings_site's oauth2-proxy). The client secret is in 1Password
# "strings oidc client" and reaches the worker as STRINGS_OIDC_CLIENT_SECRET
# through authentik-secret. Only authentik Admins may use it.
version: 1
metadata:
  name: strings-site
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: strings-site
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: strings-site
      client_secret: !Env STRINGS_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://strings.lab.albatrossflavour.com/oauth2/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: app
    identifiers:
      slug: strings-site
    attrs:
      name: Strings
      provider: !KeyOf provider
      meta_launch_url: https://strings.lab.albatrossflavour.com/
      meta_description: Puppet module reference for the lab's environments
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      group: !Find [authentik_core.group, [name, authentik Admins]]
    attrs:
      order: 0
