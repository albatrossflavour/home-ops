---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./external-secret.yaml
  - ./helm-release.yaml
  - ./networkpolicy.yaml
  - ../../../../templates/gatus/external
# Blueprints the worker applies on start and whenever they change. The chart
# mounts the ConfigMap by name (blueprints.configMaps in helm-release.yaml).
configMapGenerator:
  - name: authentik-blueprints
    files:
      - blueprints/seamstress.yaml
      - blueprints/homepage-widget.yaml
generatorOptions:
  disableNameSuffixHash: true
  #  - ./outpost.yaml
