---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
  install:
    # CRDs from the previous out-of-band install (2025-12-27) are still live
    # and orphaned - confirmed via `kubectl get crd` (12 aquasecurity.github.io
    # CRDs, no matching operator Deployment anywhere). CreateReplace ensures
    # this chart's own CRDs win instead of silently trusting whatever schema
    # that old install left behind.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
  values:
    # 2026-08-31: first guess (128Mi/256Mi) OOMKilled immediately - a cold
    # start against ~150 pre-existing cluster-wide workloads is a much
    # bigger initial burst than steady-state. No 24h Thanos peak exists yet
    # for a fresh deploy; revisit once it does.
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 768Mi
    serviceMonitor:
      enabled: true
    trivy:
      ignoreUnfixed: false
    operator:
      # Default is 10. The initial cluster-wide sweep already showed cache
      # lock contention between sibling scan containers in the same job pod
      # (multi-container workloads get one scan container per target
      # container, all sharing that job pod's cache) - lower concurrency
      # to reduce simultaneous Trivy processes fighting over the DB cache.
      scanJobsConcurrentLimit: 3
