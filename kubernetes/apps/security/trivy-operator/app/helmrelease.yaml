---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
  install:
    # CRDs from the previous out-of-band install (2025-12-27) are still live
    # and orphaned - confirmed via `kubectl get crd` (12 aquasecurity.github.io
    # CRDs, no matching operator Deployment anywhere). CreateReplace ensures
    # this chart's own CRDs win instead of silently trusting whatever schema
    # that old install left behind.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
  values:
    # 2026-08-31: first guess (128Mi/256Mi) OOMKilled immediately - a cold
    # start against ~150 pre-existing cluster-wide workloads is a much
    # bigger initial burst than steady-state. No 24h Thanos peak exists yet
    # for a fresh deploy; revisit once it does.
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        # 14d peak 763MiB against the old 768Mi limit, which is 99.3% of it.
        # OOMKilled 03 Sep. p99 is ~593MiB, so the spikes are scan bursts
        # rather than steady growth.
        memory: 1536Mi
    serviceMonitor:
      enabled: true
    trivy:
      ignoreUnfixed: false
    operator:
      # Default is 10. The initial cluster-wide sweep already showed cache
      # lock contention between sibling scan containers in the same job pod
      # (multi-container workloads get one scan container per target
      # container, all sharing that job pod's cache) - lower concurrency
      # to reduce simultaneous Trivy processes fighting over the DB cache.
      scanJobsConcurrentLimit: 3
      # 2026-09-01: node-collector (infra/CIS-benchmark node scanning)
      # cannot work on Talos at all - it hardcodes hostPath mounts like
      # /etc/systemd and /lib/systemd, which don't exist on Talos (no
      # systemd, immutable OS, different filesystem layout entirely).
      # Confirmed live: the container runtime itself refuses to create it
      # ("failed to mkdir /etc/systemd: read-only file system"), a deeper
      # failure than admission control, unrelated to and unfixable by any
      # PodSecurity level. Was retrying forever, generating pure noise.
      # Does not affect image vulnerability scanning (the actual point of
      # this deployment) - that's a separate scanner, unaffected.
      infraAssessmentScannerEnabled: false

      # 2026-09-09: everything except image vulnerability scanning turned off.
      #
      # Trivy was holding 1,832 report objects, 10.6% of every object in etcd
      # (17,325 total, deduplicated across the three apiservers):
      #
      #   710  configauditreports      (602 + 108 cluster)
      #   383  sbomreports             (381 + 2 cluster)
      #   273  rbacassessmentreports   (103 + 170 cluster)
      #   269  exposedsecretreports
      #   190  vulnerabilityreports    (188 + 2 cluster)   <- KEPT
      #     4  clustercompliancereports
      #
      # Disabling the five below removes 1,639 of those and keeps the 190 that
      # anything actually reads.
      #
      # WHAT STILL CONSUMES TRIVY DATA, checked rather than assumed:
      #   dashboard  security/trivy-vulnerabilities-dashboard
      #   alert      observability/critical-ha-alerts -> TrivyFixableCriticalBacklog
      # Both are driven by vulnerabilityreports, so both keep working.
      #
      # THE DUPLICATION ARGUMENT, which matters more than "nobody reads them".
      # configauditreports check privileged containers, runAsNonRoot,
      # capabilities and seccomp - all already covered by
      # disallow-privileged-containers, require-run-as-nonroot,
      # disallow-capabilities and restrict-seccomp in kyverno/policies.
      # rbacassessmentreports overlap cis-5-1-3-no-wildcard-rbac. So 983 of
      # these objects were a second opinion on checks this cluster already
      # runs, in a format nothing consumes.
      #
      # Consistent with the note above: image vulnerability scanning is "the
      # actual point of this deployment".
      #
      # Existing report objects may not be garbage collected on disable. Check
      # and delete the orphaned kinds if they linger.
      configAuditScannerEnabled: false
      rbacAssessmentScannerEnabled: false
      exposedSecretScannerEnabled: false
      sbomGenerationEnabled: false
      clusterComplianceEnabled: false
