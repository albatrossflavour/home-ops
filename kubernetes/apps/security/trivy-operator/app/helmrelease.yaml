---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
  install:
    # CRDs from the previous out-of-band install (2025-12-27) are still live
    # and orphaned - confirmed via `kubectl get crd` (12 aquasecurity.github.io
    # CRDs, no matching operator Deployment anywhere). CreateReplace ensures
    # this chart's own CRDs win instead of silently trusting whatever schema
    # that old install left behind.
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
  values:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
    serviceMonitor:
      enabled: true
    trivy:
      ignoreUnfixed: false
