---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount_v1.json
# Finding #7: this namespace has no pod that calls the Kubernetes API using
# the bare "default" ServiceAccount - everything that genuinely needs API
# access already runs under its own dedicated ServiceAccount with real RBAC
# bound to it. The default SA itself has zero RBAC permissions anywhere in
# this cluster (confirmed live via kubectl auth can-i --list), so this closes
# an unused credential rather than an active hole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: security
automountServiceAccountToken: false

