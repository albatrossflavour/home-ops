---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-fixable-check
spec:
  schedule: "15 6 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          # No pod-level label existed at all before this - CronJob-spawned
          # pods only get per-run job-name/controller-uid labels, nothing
          # stable. Added specifically so the CiliumNetworkPolicy below has
          # something durable to select; without it the policy would
          # silently match zero pods and this CronJob would stay fully
          # unrestricted forever, with no visible error.
          labels:
            app.kubernetes.io/name: trivy-fixable-check
        spec:
          serviceAccountName: trivy-fixable-check
          containers:
            - name: trivy-fixable-check
              image: alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  # Only counts vulnerabilities with a fixedVersion set -
                  # deliberately excludes anything genuinely blocked
                  # upstream (2026-09-01: ~150 of 262 cluster-wide CRITICAL
                  # findings are unfixed Debian/base-image CVEs like the
                  # Perl regex/tar CVEs present in almost every Debian-based
                  # image - alerting on those would page on something
                  # nobody can act on until the distro patches it).
                  #
                  # One series per image repository, counting unique CVE IDs.
                  # The old single total counted per report per package, so
                  # one OpenSSL CVE in one image scored three (libssl,
                  # libcrypto, openssl) and twice again if the image ran in
                  # two namespaces: 206 on 2026-11-03 for ~40 real CVEs,
                  # with no way to tell which image from the alert.
                  kubectl get vulnerabilityreports -A -o json | \
                    jq -r '[.items[] | .report.artifact.repository as $img | .report.vulnerabilities[]? | select(.severity=="CRITICAL" and (.fixedVersion // "") != "") | {img: $img, id: .vulnerabilityID}] | unique | group_by(.img) | .[] | "trivy_critical_fixable{image=\"\(.[0].img)\"} \(length)"' \
                    > /tmp/metric.txt
                  # Pushing to one group replaces it wholesale, so images that
                  # are fixed or removed drop out rather than going stale.
                  wget -q -O- --post-file=/tmp/metric.txt \
                    "http://cert-expiry-pushgateway.kube-system.svc.cluster.local:9091/metrics/job/trivy-fixable-check/instance/cluster"
                  echo "fixable CRITICAL by image:"; cat /tmp/metric.txt
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  # 2026-09-01: 128Mi OOMKilled immediately - the raw
                  # `kubectl get vulnerabilityreports -A -o json` across
                  # ~190 reports is ~15MB on disk, and both kubectl's JSON
                  # decode and jq's array-comprehension processing multiply
                  # that several times over in memory.
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tmp
              emptyDir: {}
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
