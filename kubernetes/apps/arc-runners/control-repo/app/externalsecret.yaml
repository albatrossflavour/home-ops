---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# The 1Password item's field names are github_app_id,
# github_app_installation_id and github_app_private_key, which are exactly the
# keys the gha-runner-scale-set chart expects in the secret it is pointed at.
# That is why there is no template block here: a plain extract produces a
# correctly shaped secret, and a template would be one more place for a typo.
#
# One GitHub App installation covers every repo it is installed on, so the other
# control repos reuse this same item. Only githubConfigUrl differs per scale set.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: arc-github-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: arc-github-app
