---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# The CD4PE webhook token, injected into the runner container as an environment
# variable so the relay workflow never has to hold it.
#
# Deliberately NOT a GitHub Actions secret. The whole reason this runner exists
# is that GitHub cannot reach the lab; putting the lab's own credential back into
# GitHub to solve that would be an odd inversion. This way the token lives in
# 1Password, reaches the pod through external-secrets, and never leaves the
# estate.
#
# The trade-off worth stating: an environment variable on the runner container is
# readable by any job that runs on this scale set. That is acceptable because the
# scale set is dedicated to the relay and the token only authorises "tell CD4PE
# something changed". If this scale set ever takes on general build work, move
# this to a per-job credential instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cd4pe-webhook
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cd4pe-webhook
    creationPolicy: Owner
  data:
    - secretKey: apiToken
      remoteRef:
        key: cd4pe-webhook
        property: apiToken
