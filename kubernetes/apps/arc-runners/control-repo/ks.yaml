---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app arc-runner-control-repo
  namespace: flux-system
spec:
  targetNamespace: arc-runners
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/arc-runners/control-repo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  # The chart creates an AutoscalingRunnerSet, a CRD the controller installs.
  # Without this the first reconcile races and fails on an unknown kind.
  dependsOn:
    - name: actions-runner-controller
      namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
