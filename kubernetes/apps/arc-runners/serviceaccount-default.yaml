---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount_v1.json
# Runner pods get their own ServiceAccount from the chart. The bare default SA
# should never be mounted into a pod that executes code from a repository.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: arc-runners
automountServiceAccountToken: false
