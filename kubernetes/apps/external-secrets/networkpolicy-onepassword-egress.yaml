---
# yaml-language-server: $schema=https://raw.githubusercontent.com/cilium/cilium/main/pkg/k8s/apis/cilium.io/client/crds/v2/CiliumNetworkPolicy.json
# Separate from external-secrets-default deliberately - onepassword-connect
# is the only pod in this namespace that needs internet egress (to
# 1Password's own API), confirmed via the Hubble capture (2026-09-01):
# onepassword-connect -> world:443, nothing else in the namespace calls out.
#
# Rollback: `kubectl delete ciliumnetworkpolicy external-secrets-onepassword-egress -n external-secrets`.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-onepassword-egress
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: onepassword-connect
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
