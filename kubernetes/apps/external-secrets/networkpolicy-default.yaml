---
# yaml-language-server: $schema=https://raw.githubusercontent.com/cilium/cilium/main/pkg/k8s/apis/cilium.io/client/crds/v2/CiliumNetworkPolicy.json
# Baseline policy for external-secrets, derived from a live 2h Hubble capture
# (2026-09-01). Extra care here given this is the widest dependency
# chokepoint in the cluster (~64 transitive dependents per the audit).
# Default-deny is Cilium's own behaviour the moment any CiliumNetworkPolicy
# selects a pod - nothing else needs to opt in.
#
# 1Password's own egress (onepassword-connect -> world:443) is deliberately
# NOT here - see networkpolicy-onepassword-egress.yaml, scoped to just that
# app rather than granting internet egress to the whole namespace.
#
# Rollback: `kubectl delete ciliumnetworkpolicy external-secrets-default -n external-secrets`.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-default
  namespace: external-secrets
spec:
  endpointSelector: {}
  ingress:
    # Kubelet probes (:8081 on all three components) and the apiserver
    # invoking the webhook (:10250) - both manifested as host-family
    # identities in the capture.
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
    # Prometheus scraping metrics (:8080).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
    # Same-namespace mesh - specifically external-secrets -> onepassword-
    # connect:80. Caught live applying this policy: egress was allowed from
    # the caller's side but nothing let onepassword-connect *accept* it -
    # Cilium enforces both ends independently, not just the initiating side.
    - fromEndpoints:
        - {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # external-secrets talks to onepassword-connect's own HTTP API in-cluster.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: onepassword-connect
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # The controller watches/writes Secret objects via the k8s API.
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
