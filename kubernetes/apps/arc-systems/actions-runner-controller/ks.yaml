---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app actions-runner-controller
  namespace: flux-system
spec:
  targetNamespace: arc-systems
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/arc-systems/actions-runner-controller/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  # wait: true, unlike most apps here. The runner scale set in arc-runners
  # depends on this Kustomization, and its CRDs must be established before that
  # HelmRelease is attempted or it fails on unknown kind AutoscalingRunnerSet.
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
