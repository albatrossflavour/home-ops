---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/serviceaccount_v1.json
# Same treatment as utilities: the controller runs under its own ServiceAccount
# created by the chart, with RBAC the chart defines. Nothing here uses the bare
# default SA, so its token is not worth mounting anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: arc-systems
automountServiceAccountToken: false
