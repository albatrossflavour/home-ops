---
# CLAUDE.md: "All container images MUST use SHA256 digest pinning."
#
# Deliberately scoped to default, media and utilities rather than the whole
# cluster, and the measurement is why. Cluster-wide this fails 186 of 432
# containers, but the distribution is rook-ceph 93, observability 20,
# kube-system 16, openebs-system 13 - images chosen by upstream charts, not
# declared by this repo. A policy that reports 186 findings nobody can act on
# is noise, and it buries the one that matters.
#
# In the three namespaces where this repo actually declares image tags, the
# current state is media 0/13 unpinned, utilities 0/15, default 1/30. So this
# protects an almost-clean state rather than describing an unwinnable one.
#
# The single violation: default/grafana-shitbox running
# docker.io/grafana/grafana:12.3.1 with no digest.
#
# If chart-managed namespaces ever need this too, widen the namespaceSelector
# rather than removing it - the scoping is the judgement, not an oversight.
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: require-image-digest
  labels:
    compliance.home.arpa/ism: "true"
    compliance.home.arpa/e8: "true"
  annotations:
    policies.kyverno.io/title: Require SHA256 Digest Pinning
    policies.kyverno.io/category: "Tony's Conventions"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    compliance.home.arpa/ism-controls: >-
      application control (interpreted)
    compliance.home.arpa/e8-strategies: >-
      1 - application control
spec:
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [default, media, utilities]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.contains('@sha256:'))
      message: >-
        Every container image must be digest-pinned, in the form
        repository:tag@sha256:digest (quoted in YAML, because of the @).
    - expression: >-
        !has(object.spec.initContainers) ||
        object.spec.initContainers.all(c, c.image.contains('@sha256:'))
      message: >-
        Every init container image must be digest-pinned, same format.
  validationActions: [Audit]
