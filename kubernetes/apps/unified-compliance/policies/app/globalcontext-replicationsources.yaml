---
# Caches every ReplicationSource in the cluster so a policy evaluating a PVC
# can ask "is this volume backed up?" - a question that needs cross-resource
# lookup and is therefore not expressible in a plain CEL expression over the
# object under review.
#
# The projection flattens each ReplicationSource to "<namespace>/<sourcePVC>",
# which is the key require-pvc-backup matches against.
apiVersion: kyverno.io/v2beta1
kind: GlobalContextEntry
metadata:
  name: replicationsources
spec:
  kubernetesResource:
    group: volsync.backube
    version: v1alpha1
    resource: replicationsources
  projections:
    # The cached value is a bare list of ReplicationSources, not an object
    # with an `items` key. "items[].join(...)" compiles, deploys, and yields
    # null - which made require-pvc-backup fail all 36 replicated PVCs
    # including nine that are demonstrably backed up. Caught only because an
    # independent count said 22.
    - name: pvcs
      jmesPath: "[].join('/', [metadata.namespace, spec.sourcePVC])"
