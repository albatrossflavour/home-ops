---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 30m
  # 2026-08-31: confirmed Drifted=False via warn mode before enabling.
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: cilium-helm-values
  values:
    hubble:
      enabled: true
      tls:
        auto:
          # Default method is 'helm', which mints certs once at install
          # and never rotates them. cronJob regenerates on a schedule.
          method: cronJob
          schedule: "0 0 1 */4 *"
      metrics:
        enabled:
          - dns:query
          - drop
          - tcp
          - flow
          # port-distribution deliberately NOT enabled.
          #
          # It emits one series per destination port, and on this cluster that
          # was hubble_port_distribution_total at 70,885 series - 13.5% of the
          # entire Prometheus TSDB of 524,035 head series, and 6.5x larger than
          # the next biggest metric family. At roughly 8KB/series in the head
          # block that is around 550MiB of Prometheus memory for one metric.
          #
          # Removed at source rather than dropped with metricRelabelings, so
          # Cilium stops computing it as well as Prometheus storing it.
          #
          # THE COST: two panels on the chart's own hubble-dashboard read the
          # metric and will show no data. Nothing else uses it - no
          # PrometheusRule references it, and no alert depends on it (checked
          # 2026-09-09). If those panels are wanted back, re-enabling this line
          # is the whole change, but expect the TSDB to grow by the same 13.5%.
          - icmp
          - http
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: Cilium
      relay:
        enabled: true
        rollOutPods: true
        prometheus:
          serviceMonitor:
            enabled: true
      ui:
        enabled: true
        rollOutPods: true
        ingress:
          enabled: true
          className: internal
          # 2026-09-02: added after Kyverno's require-ingress-dns-target
          # policy flagged this as the only Ingress of 57 without a target
          # annotation. It resolved anyway, but by accident rather than by
          # declaration - which is exactly how smarthome.pdlf.net and
          # staging.toodlepip.com.au ended up with valid certificates and no
          # real DNS record. No tls block needed: the internal controller
          # runs --default-ssl-certificate against the production wildcard,
          # same as grafana and files.
          annotations:
            external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          hosts: ["hubble.${SECRET_DOMAIN}"]
    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        annotations:
          grafana_folder: Cilium
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Cilium
