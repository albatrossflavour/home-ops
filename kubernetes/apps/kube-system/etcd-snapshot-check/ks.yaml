---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app etcd-snapshot-check
  namespace: flux-system
  # In kube-system beside cert-expiry-check because it pushes to the same
  # Pushgateway, which that app owns. It only reads the NAS; the snapshots
  # themselves are taken from the workstation (see the CronJob's comments).
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/kube-system/etcd-snapshot-check/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: cert-expiry-check
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
