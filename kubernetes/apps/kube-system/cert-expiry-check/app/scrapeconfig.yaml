---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name cert-expiry-pushgateway
spec:
  staticConfigs:
    - targets:
        - cert-expiry-pushgateway.kube-system.svc.cluster.local:9091
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
