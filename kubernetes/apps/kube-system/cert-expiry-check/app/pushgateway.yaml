---
# Persistence is not optional here, despite the data being regenerated daily.
#
# Pushgateway keeps everything in memory unless --persistence.file is set. This
# deployment ran without it until 2026-09-06, and the consequence was not a
# gap in a graph: BOTH alerts that depend on pushed metrics went silently
# blind on every pod restart.
#
#   HubbleCiliumCertExpiresSoon  <- cert_expiry_timestamp_seconds
#   TrivyFixableCriticalBacklog  <- trivy_critical_fixable_total
#
# Both were confirmed absent from Prometheus on 2026-09-06 with both alerts
# not firing, while the trivy job had logged "fixable CRITICAL count: 112"
# that same morning against an alert threshold of 10. The Cilium one is the
# worse of the two: those mTLS certs are Helm-templated with no cert-manager
# renewal behind them, so that alert is the only thing watching them.
#
# TrivyFixableCriticalBacklog carries `for: 24h` against a metric pushed once
# daily, so without persistence any restart inside a 24-hour window resets the
# clock and the alert can effectively never fire.
#
# ceph-block rather than openebs-hostpath. hostpath would pin this pod to one
# node, and a node loss would leave the pushgateway permanently Pending rather
# than merely losing a day of samples. Talos upgrades reboot nodes here often
# enough for that to matter.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cert-expiry-pushgateway
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-expiry-pushgateway
spec:
  replicas: 1
  # RWO volume on a Deployment: the default RollingUpdate deadlocks, because
  # the new pod cannot attach the volume while the old one still holds it.
  #
  # maxSurge: 0 is what fixes that - the old pod terminates and releases the
  # volume before a replacement is created. `type: Recreate` expresses the
  # same intent more directly and was tried first, but it cannot be applied
  # in place here: the live Deployment already carries the defaulted
  # spec.strategy.rollingUpdate block, and the API rejects that field
  # alongside type: Recreate, so switching would mean deleting and recreating
  # the Deployment. Not worth a manual step for an identical outcome.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cert-expiry-pushgateway
  template:
    metadata:
      labels:
        app: cert-expiry-pushgateway
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.3@sha256:74fa117cef2d7e383112d25139ff1c2d2e309c35389a9e0554a47136a1482e48
          args:
            - --web.listen-address=:9091
            - --persistence.file=/data/pushgateway.store
            # Default is 5m. These are daily pushes, so the window where a
            # crash could lose the newest sample is what matters, not volume.
            - --persistence.interval=1m
          ports:
            - name: http
              containerPort: 9091
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cert-expiry-pushgateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        # readOnlyRootFilesystem stays true; the persistence file lives on the
        # mounted volume. fsGroup is what makes that volume writable by 65534.
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: cert-expiry-pushgateway
spec:
  selector:
    app: cert-expiry-pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
