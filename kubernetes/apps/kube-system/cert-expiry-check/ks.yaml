---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cert-expiry-check
  namespace: flux-system
  # Runs in kube-system (not observability) because Secret volume mounts are
  # same-namespace only, and the certs this watches (hubble-server-certs,
  # hubble-relay-client-certs, cilium-ca) live there. Still scraped fine from
  # any namespace - Prometheus's ScrapeConfig selector is empty (cluster-wide).
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/kube-system/cert-expiry-check/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
