---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyfin
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
  path: ./kubernetes/apps/media/jellyfin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_SCHEDULE: "15 */4 * * *"
      # Restic cache on ceph-block, not openebs-hostpath: hostpath has no quota,
      # so a wedged backup grew the cache to 26GB and pushed weatherwax into
      # DiskPressure (14 Aug 2026). ceph-block enforces the limit.
      VOLSYNC_CACHE_SNAPSHOTCLASS: ceph-block
      VOLSYNC_CACHE_CAPACITY: 8Gi
