---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # 2026-09-01: PodSecurity enforcement pass. Checked all 11 live pods -
    # zero Baseline violations, no CronJobs/Jobs. Heavy Volsync usage (5
    # apps, 10 ReplicationSources) but no volsync.backube/privileged-movers
    # annotation on this namespace (unlike database) - confirmed live via
    # a real triggered sync and direct mover-pod inspection: capabilities
    # dropped to ALL, privileged: false, no runAsUser override. Genuinely
    # safe for baseline, not privileged.
    pod-security.kubernetes.io/enforce: baseline
