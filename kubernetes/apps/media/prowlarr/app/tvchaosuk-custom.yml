---
id: tvchaosuk-custom
name: TVChaosUK (Custom)
description: "TV Chaos UK (TVCUK) is a Private Torrent Tracker for UK TV"
language: en-GB
type: private
encoding: UTF-8
links:
  - https://tvchaosuk.com/

# TVChaosUK's UNIT3D upgrade moved the torrent filter to a POST /torrents/filter
# request carrying the session CSRF token. A plain GET (what the old definition
# and the official one did) now redirects to /torrents ("must be submitted from
# the search form"), and the JSON API returns "Not implemented". The official
# definition was removed from Prowlarr 2026-05-18 at the tracker's request.
#
# This definition replicates the site's own faceted-search AJAX call:
#   POST /torrents/filter  (X-Requested-With: XMLHttpRequest)
#   body: _token, search, view=list, sorting, direction, qty, categories[]...
# Auth is by pasted cookie; the CSRF _token is pasted separately (same pattern
# as the hdturk definition). Both are session-bound, so re-paste them together
# when searches start failing (the session rolls every few days).

caps:
  categorymappings:
    - {id: 29, cat: TV, desc: "Comedy"}
    - {id: 45, cat: TV, desc: "Current Affairs"}
    - {id: 5, cat: TV/Documentary, desc: "Documentary"}
    - {id: 11, cat: TV, desc: "Drama"}
    - {id: 14, cat: TV, desc: "Entertainment"}
    - {id: 19, cat: TV, desc: "Factual"}
    - {id: 43, cat: TV, desc: "Foreign"}
    - {id: 32, cat: TV, desc: "Kids & Family"}
    - {id: 44, cat: Movies, desc: "Movies"}
    - {id: 54, cat: TV, desc: "News"}
    - {id: 51, cat: Audio, desc: "Radio"}
    - {id: 52, cat: TV, desc: "Reality"}
    - {id: 30, cat: TV, desc: "Soaps"}
    - {id: 33, cat: TV, desc: "Sci-Fi"}
    - {id: 42, cat: TV/Sport, desc: "Sport"}
    - {id: 53, cat: TV, desc: "Holding Bin"}

  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid, tvdbid, tmdbid]
    movie-search: [q, imdbid, tmdbid]
    music-search: [q]

settings:
  - name: cookie
    type: text
    label: Cookie
  - name: csrf_token
    type: text
    label: CSRF Token (_token)
  - name: info_setup
    type: info
    label: How to get the Cookie and CSRF Token
    default: "<ol><li>Log in to TVChaosUK in your browser.</li><li>Cookie: DevTools → Storage/Application → Cookies → https://tvchaosuk.com. Copy at least <b>XSRF-TOKEN</b>, <b>laravel_session</b> and <b>remember_web_*</b> as '; '-separated name=value pairs into the Cookie field.</li><li>CSRF Token: in the DevTools Console run <code>document.querySelector('meta[name=csrf-token]').content</code> and paste the 40-char value here (it also appears as <code>_token=</code> in any torrent sort link).</li><li>Both are tied to the same session and expire together. Re-paste both when searches start failing.</li></ol>"
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false
  - name: sort
    type: select
    label: Sort requested from site
    default: created_at
    options:
      created_at: created
      seeders: seeders
      size: size
      name: title
  - name: type
    type: select
    label: Order requested from site
    default: desc
    options:
      desc: desc
      asc: asc

login:
  method: cookie
  inputs:
    cookie: "{{ .Config.cookie }}"
  test:
    path: /
    selector: a[href$="/logout"]

search:
  paths:
    - path: torrents/filter
      method: post
  inputs:
    $raw: "{{ range .Categories }}categories[]={{.}}&{{end}}"
    _token: "{{ .Config.csrf_token }}"
    search: "{{ if .Query.IMDBID }}{{ else }}{{ .Keywords }}{{ end }}" # for dashboard imdbid search
    imdb: "{{ .Query.IMDBIDShort }}"
    tvdb: "{{ .Query.TVDBID }}"
    tmdb: "{{ .Query.TMDBID }}"
    sorting: "{{ .Config.sort }}"
    direction: "{{ .Config.type }}"
    qty: 100
    freeleech: "{{ if .Config.freeleech }}1{{ else }}{{ end }}"
    view: list
  headers:
    X-Requested-With: [XMLHttpRequest]
    X-CSRF-TOKEN: ["{{ .Config.csrf_token }}"]

  keywordsfilters:
    # if searching for season packs switch S01 to Series 1 #14369
    - name: re_replace
      args: ["(?i)(S0)(\\d{1,2})$", "Series $2"]
    - name: re_replace
      args: ["(?i)(S)(\\d{1,3})$", "Series $2"]

  rows:
    selector: table > tbody > tr

  fields:
    category:
      selector: a[href*="/categories/"]
      attribute: href
      filters:
        - name: regexp
          args: "/categories/(\\d+)"
    title:
      selector: a.view-torrent
      filters:
        - name: re_replace
          args: ["(?i)Series[\\s]+(\\d+)", "S$1"]
    download:
      selector: a[href*="/download/"]
      attribute: href
    details:
      selector: a.view-torrent
      attribute: href
    poster:
      selector: div.torrent-poster img
      attribute: src
      filters:
        - name: prepend
          args: "https://images.weserv.nl/?url=" # for display on dashboard
        - name: append
          args: "&w=180&h=270" # for display on dashboard
        - name: replace
          args: ["https://images.weserv.nl/?url=https://via.placeholder.com/600x900&w=180&h=270", ""]
    genre:
      selector: td:nth-last-child(6)
      filters:
        - name: replace
          args: ["\n", ""]
        - name: re_replace
          args: ["(?i)(Science Fiction)", "Science_Fiction"]
        - name: validate
          args: "Action, Adventure, Animation, Biography, Comedy, Crime, Documentary, Drama, Family, Fantasy, Game-Show, History, Horror, Music, Musical, Mystery, News, Reality-TV, Romance, Science_Fiction, Sitcom, Sport, Talk-Show, Thriller, War, Western"
    description:
      text: "{{ .Result.genre }}"
    size:
      selector: td:nth-last-child(4)
    seeders:
      selector: td:nth-last-child(3)
    leechers:
      selector: td:nth-last-child(2)
    grabs:
      selector: td:nth-last-child(1)
    imdbid:
      selector: a[href*="imdb.com/title/tt"]
      attribute: href
    tmdbid:
      selector: a[href*="themoviedb.org/movie/"], a[href*="themoviedb.org/tv/"]
      attribute: href
    date:
      selector: time
      filters:
        - name: timeago
    downloadvolumefactor:
      case:
        i[class*="fa-id-badge text-orange"]: 0 # 24 Hour FreeLeech From BON Store
        i[class*="fa-trophy text-purple"]: 0 # Special FreeLeech For Certain User Groups
        i[class*="fa-star text-bold"]: 0 # Freeleech From Token
        i[class*="fa-coins text-bold"]: 0 # Freeleech From Token
        i[class*="fa-globe text-blue"]: 0 # Global Freeleech
        i[class*="fa-star text-gold"]: 0 # Freeleech
        i[class*="fa-certificate text-pink"]: 0 # Featured Torrent
        "*": 1
    uploadvolumefactor:
      case:
        i[class*="fa-gem text-green"]: 2 # Single Torrent Double Upload
        i[class*="fa-globe text-green"]: 2 # Global Double Upload
        i[class*="fa-certificate text-pink"]: 2 # Featured Torrent Weekly Freeleech
        "*": 1
    minimumratio:
      text: 0.4
    minimumseedtime:
      # 1 day (as seconds = 24 x 60 x 60)
      text: 86400
# html UNIT3D POST faceted search
