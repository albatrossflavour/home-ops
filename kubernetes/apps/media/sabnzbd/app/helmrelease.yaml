---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  values:
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: "5.1.3@sha256:b1795982db498ed5691a7b1231f0fac7eed2a1d53e9c81b8e834d02695e76104"
            env:
              TZ: Australia/Sydney
              SABNZBD__PORT: &port 80
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.default,
                sabnzbd.default.svc,
                sabnzbd.default.svc.cluster,
                sabnzbd.default.svc.cluster.local,
                sab.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # Restored to 4Gi, the value before 401a07bf. That commit
                # right-sized media from "30d real usage" and read 957Mi for
                # sabnzbd; Thanos over the 14d to 2026-09-06 shows a 3141MiB
                # peak and p99 of 1960MiB on the busiest pod incarnation.
                # Cut to 1Gi on 01 Sep, OOMKilled on 02 Sep. Unpack and par2
                # repair are the spikes, and they do not show up in an idle
                # capture window.
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: *port
    ingress:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Sabnzbd
          gethomepage.dev/icon: sabnzbd.png
          gethomepage.dev/siteMonitor: http://sab.${SECRET_DOMAIN}
          gethomepage.dev/description: Newsgroup Downloader
          gethomepage.dev/widget.type: sabnzbd
          gethomepage.dev/widget.url: http://sab.${SECRET_DOMAIN}
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_SABNZBD_TOKEN}}` }}"
          nginx.ingress.kubernetes.io/configuration-snippet: |
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/html;
            sub_filter '</body>' '<link rel="stylesheet" type="text/css" href="/css/base/sabnzbd/${THEME_PARK_THEME}.css"></body>';
            sub_filter_once on;
          nginx.ingress.kubernetes.io/server-snippet: |
            location /css {
              proxy_pass http://theme-park.default.svc.cluster.local:8080;
            }
        className: internal
        hosts:
          - host: "sab.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: sabnzbd
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      tmp:
        type: emptyDir
      downloads:
        enabled: true
        type: nfs
        server: "192.168.1.22"
        path: /volume1/Media/Torrents
      media:
        enabled: true
        type: nfs
        server: "192.168.1.22"
        path: /volume1/Media
      incomplete:
        type: emptyDir
        globalMounts:
          - path: /incomplete
