---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: ceph-csi-drivers
      version: 1.0.4
      sourceRef:
        kind: HelmRepository
        name: ceph-csi-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-operator
  # Values mirror the upstream recommended file:
  # https://github.com/rook/rook/blob/release-1.20/deploy/charts/ceph-csi-drivers/values.yaml
  # Keep in sync when bumping chart version.
  values:
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        nodePlugin:
          priorityClassName: system-node-critical
        controllerPlugin:
          priorityClassName: system-cluster-critical
          # 2026-09-01: sized from real 24h peaks (rbd's plugin container ran
          # hottest at 50Mi/54m, cephfs's low single digits - shared values
          # here give cephfs comfortable headroom too rather than needing a
          # separate per-driver override). All four sidecars already run with
          # --leader-election=true (confirmed live), so 2 replicas is the
          # standard kubernetes-csi HA pattern, not a guess - only one
          # replica is active per sidecar type at a time.
          replicas: 2
          resources:
            plugin:
              requests: {cpu: 25m, memory: 64Mi}
              limits: {memory: 128Mi}
            provisioner:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 96Mi}
            resizer:
              requests: {cpu: 10m, memory: 24Mi}
              limits: {memory: 64Mi}
            attacher:
              requests: {cpu: 10m, memory: 24Mi}
              limits: {memory: 64Mi}
            snapshotter:
              requests: {cpu: 10m, memory: 24Mi}
              limits: {memory: 64Mi}
            logRotator:
              requests: {cpu: 5m, memory: 16Mi}
              limits: {memory: 32Mi}
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        # 2026-09-01: driverSpecDefaults.controllerPlugin.replicas above is
        # NOT enough on its own - each Driver CR already carries an explicit
        # replicas: 1 (set by this chart at install time), and an explicit
        # per-driver value wins over the shared OperatorConfig default.
        # Confirmed live: resources flowed through the default fine (no
        # per-driver override existed for that field), replicas didn't
        # until this explicit override was added.
        controllerPlugin:
          replicas: 2
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        controllerPlugin:
          replicas: 2
      nfs:
        enabled: false
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
