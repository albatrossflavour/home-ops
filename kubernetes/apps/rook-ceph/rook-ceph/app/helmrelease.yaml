---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: rook-ceph
      version: v1.20.6
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  install:
    remediation:
      # 2026-08-31: was 3. A chokepoint HelmRelease - once retries exhaust,
      # helm-controller marks it Stalled and stops retrying on its own,
      # blocking every dependent app via dependsOn until someone notices
      # and manually unsticks it (exactly what happened during the cephx
      # incident: 3 separate manual "unstick" commits).
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: -1
  dependsOn:
    - name: snapshot-controller
      namespace: volsync-system
  values:
    # CSI driver settings moved to the ceph-csi-drivers chart in Rook v1.20.
    # Only image overrides and the serviceMonitor remain valid under csi.* here.
    # See ./csi-drivers/helmrelease.yaml for driver config.
    csi:
      serviceMonitor:
        enabled: true
      cephcsi:
        # Chart v1.20.6 still defaults to v3.17.0, which predates aes256k cephx
        # support and breaks RBD snapshot RPCs against aes256k-rotated keys
        # (rados: ret=-22, Invalid argument). Drop this override once a rook-ceph
        # chart release bumps its own default past v3.17.1.
        tag: "v3.17.1@sha256:0b62db8afc9b174619186c87084a8952157daa719415c598603be22b63cc1293"
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
      limits: {}
