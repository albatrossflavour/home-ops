---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-reverse-proxy
  namespace: default
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: bitnami-nginx
    namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    image:
      registry: docker.io
      repository: bitnami/nginx
      # 2026-09-01: the old X.Y.Z-debianNN-rN tag scheme is gone from this
      # registry entirely (confirmed live - only "latest"/"latest-metadata"
      # remain), part of Broadcom's 2025 restructuring of free Bitnami
      # images. "latest" is still a genuinely maintained, actively-rebuilt
      # image (this pin's build: 2026-08-22, nginx 1.31.4) - Renovate's
      # digest-pinning tracks a floating tag's digest the same way it did
      # the old versioned one, so this stays auto-updatable going forward,
      # it just won't show a version-number bump in the PR title anymore.
      tag: latest@sha256:14e3a7235f3cde1cd52e073e2eb152522167e6d893e339e42bda054cef6ff44a
    pullPolicy: IfNotPresent
    debug: false
    # Finding #18 (2026-09-02): the chart's own default NetworkPolicy allowed
    # ingress from anywhere. Confirmed live via ingress.yaml this app is only
    # meant to be reached through ingress-nginx-external - scoped ingress to
    # the network namespace instead. Egress deliberately left at the chart
    # default (unrestricted): this proxies to a mix of true internet
    # (bandcamp.tv) and LAN-hosted lab services (puppet.lab/cd4pe.lab/etc)
    # whose IPs aren't worth hardcoding.
    networkPolicy:
      allowExternal: false
      ingressNSMatchLabels:
        kubernetes.io/metadata.name: network
    replicaCount: 1
    updateStrategy:
      type: RollingUpdate
      rollingUpdate: {}
    serverBlock: |-
      server {
        listen 8080;
        server_name www.bandcamp.tv bandcamp.tv;
        return 301 $scheme://albatrossflavour.com;
      }

      server {
        listen 8080;
        server_name puppet.lab.albatrossflavour.com;
        ssl_verify_client off;
        location / {
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $host;

          proxy_pass https://192.168.7.10;

          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_buffer_size 128k;
          proxy_buffers 4 256k;
          proxy_busy_buffers_size 256k;
        #large_client_header_buffers 4 16k;
        }
      }

      server {
        listen 8080;
        server_name cd4pe.lab.albatrossflavour.com;
        location / {
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $host;

          proxy_pass https://192.168.7.11;

          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_buffer_size 128k;
          proxy_buffers 4 256k;
          proxy_busy_buffers_size 256k;
          #large_client_header_buffers 4 16k;
        }
      }


      server {
        listen 8080;
        server_name dashboard.lab.albatrossflavour.com;
        location / {
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $host;
          # TLS is terminated ahead of here, so the origin sees plain HTTP on
          # 80 and would otherwise build http:// URLs for an https:// client.
          proxy_set_header X-Forwarded-Proto $scheme;

          proxy_pass https://192.168.7.13;

          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_buffer_size 128k;
          proxy_buffers 4 256k;
          proxy_busy_buffers_size 256k;
          #large_client_header_buffers 4 16k;
        }
      }

      server {
        listen 8080;
        server_name plex.albatrossflavour.com;
        location / {
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $host;

          proxy_pass http://192.168.1.22:32400;

          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_buffer_size 128k;
          proxy_buffers 4 256k;
          proxy_busy_buffers_size 256k;

          # Plex-specific headers
          proxy_set_header X-Plex-Client-Identifier $http_x_plex_client_identifier;
        }
      }

      server {
        listen 8080;
        server_name scm.lab.albatrossflavour.com;
        location / {
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $host;

          proxy_pass https://192.168.7.12;

          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_buffer_size 128k;
          proxy_buffers 4 256k;
          proxy_busy_buffers_size 256k;
          #large_client_header_buffers 4 16k;
        }
      }

    ingress:
      ingressClassName: "external"
      hostname: "/*"
      annotations:
        external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
      extraHosts:
        - name: dancer.solutions
          path: /
      main:
        enabled: true
        ingressClassName: "external"
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - host: www.bandcamp.tv
            paths:
              - path: /
                pathType: Prefix
          - host: bandcamp.tv
            paths:
              - path: /
                pathType: Prefix
          - host: puppet.lab.albatrossflavour.com
            paths:
              - path: /
                pathType: Prefix
          - host: cd4pe.lab.albatrossflavour.com
            paths:
              - path: /
                pathType: Prefix
          - host: scm.lab.albatrossflavour.com
            paths:
              - path: /
                pathType: Prefix
          - host: dashboard.lab.albatrossflavour.com
            paths:
              - path: /
                pathType: Prefix

    persistence:
      data:
        enabled: false
        existingClaim: nginx-config

    service:
      ports:
        http: &port 8080
      type: ClusterIP
      main:
        ports:
          http:
            port: *port

    resources:
      requests:
        cpu: 15m
        memory: 79M
      limits:
        # 2026-08-31: CPU limit matched the request exactly (15m) - zero
        # burst headroom fronting seven external hostnames. Live usage is
        # ~1m steady-state; request stays put, limit raised for bursts.
        cpu: 200m
        memory: 79M
