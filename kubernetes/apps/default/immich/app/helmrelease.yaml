---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  # disableWait on both, because immich legitimately takes a long time to
  # become ready and Helm's readiness wait turns that into a deadlock.
  #
  # 2026-09-07: a Postgres image bump moved the pgvector extension 0.7.4 ->
  # 0.8.6, which invalidates immich's vector indexes. On the next start it
  # rebuilds clip_index and face_index, and stops answering /api/server/ping
  # while it does. Helm waited for readiness, gave up on the "stalled"
  # Deployment, and rolled back to the previous release - which could not
  # become ready either, for the same reason. Flux then looped:
  #
  #   Released=False   UpgradeFailed    failed early due to stalled resources
  #   Remediated=False RollbackFailed   timeout waiting for Deployment
  #
  # The fix for the probe itself could not be applied, because applying it
  # required the app to already be healthy. Not waiting breaks that circle:
  # Helm applies the manifest and lets Kubernetes converge, which is what the
  # probes are there to police.
  #
  # The trade is that a genuinely broken deploy is no longer caught by Helm.
  # Pod status and the Kubernetes alerts catch it instead, and for this app
  # that is a better division of labour than a rollback loop.
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      immich:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b"
            envFrom: &envFrom
              - secretRef:
                  name: immich-secret
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: "release@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb"
            env:
              # Database
              DB_HOSTNAME: postgres16-rw.database.svc.cluster.local
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              # Redis
              REDIS_HOSTNAME: dragonfly.database.svc.cluster.local
              REDIS_PORT: "6379"
              # Machine Learning
              IMMICH_MACHINE_LEARNING_URL: http://localhost:3003
              # Server port
              IMMICH_PORT: "3001"
            envFrom: *envFrom
            probes:
              # Liveness is deliberately far more tolerant than readiness, and
              # no longer shares readiness' anchor.
              #
              # Upgrading the pgvector extension invalidates immich's vector
              # indexes, so the next start logs "Reindexing clip_index (This
              # may take a while)" and stops answering /api/server/ping while
              # it rebuilds. At failureThreshold 5 x periodSeconds 10 the
              # kubelet SIGTERMs it after 50s, the restart discards the
              # progress, and it can never finish.
              #
              # That happened on 2026-09-07: a Postgres image bump moved
              # vector 0.7.4 -> 0.8.6, and immich crash-looped 112 times over
              # nine hours. It was not memory (985Mi of an 8Gi limit) and not
              # Kyverno (audit-only, blocks nothing) - just a probe too tight
              # for the work the app legitimately does on first start after an
              # extension change.
              #
              # 60 x 10s gives ten minutes. The cost is a slower reaction to a
              # genuinely hung app, which is the right trade for something
              # that reindexes a photo library.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: &port 3001
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              # Readiness stays tight on purpose: while reindexing, immich
              # genuinely cannot serve traffic and should be pulled from the
              # Service. That is correct behaviour, unlike killing it.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              # The probe that actually gates the reindex.
              #
              # #1756 raised liveness, which was necessary but not sufficient:
              # the container never got far enough for liveness to apply.
              # Startup runs first, and at 30 x 5s it killed the container
              # after 150s with "Container app failed startup probe, will be
              # restarted" - almost exactly the observed restart cycle.
              #
              # A startup probe exists for precisely this: an app that is slow
              # to become available on first start but healthy thereafter.
              # 120 x 5s allows ten minutes to rebuild clip_index and
              # face_index, after which liveness takes over on its normal
              # cadence. Nothing is loosened for the steady state.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 120
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                # 512Mi was a guess; measured peak is 1487Mi over 7 days
                # (2026-09-09), so the scheduler was told this needs a third of
                # what it reliably uses. A Burstable pod running above its
                # request is also first in line for eviction under node
                # pressure, which is the wrong pod to pick.
                cpu: 100m
                memory: 1536Mi
              limits:
                memory: 8Gi
          machine-learning:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: "release@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e"
            env:
              # gunicorn 25.1 enables a control socket at /usr/src/gunicorn.ctl by
              # default; the rootless ML container (uid 65534) can't write there, which
              # kills the worker on boot. Immich doesn't use it, so turn it off.
              GUNICORN_CMD_ARGS: --no-control-socket
              TRANSFORMERS_CACHE: /cache
              XDG_CACHE_HOME: /cache
              XDG_CONFIG_HOME: /cache
              MPLCONFIGDIR: /cache/matplotlib
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 3003
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                # Measured peak 380Mi over 7 days, so 512Mi is about right.
                # Left alone deliberately, recorded so the next reader knows it
                # was checked rather than skipped.
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: immich
        ports:
          http:
            port: *port
    ingress:
      app:
        className: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Media"
          gethomepage.dev/name: "Immich"
          gethomepage.dev/icon: "immich.png"
          gethomepage.dev/description: "Self-hosted photo and video management"
        hosts:
          - host: immich.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        existingClaim: immich
      library:
        type: nfs
        server: 192.168.1.22
        path: /volume2/apps/immich
        globalMounts:
          - path: /usr/src/app/upload
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
