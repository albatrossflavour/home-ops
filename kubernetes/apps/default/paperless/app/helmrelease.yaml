---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            supplementalGroups:
              - 65542 # gladius:external-services

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719"
            envFrom:
              - secretRef:
                  name: paperless-secret

        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: "3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84"
            env:
              # Application configuration
              PAPERLESS_URL: https://paperless.${SECRET_DOMAIN}
              PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paperless.${SECRET_DOMAIN}
              PAPERLESS_PORT: "8000"
              PAPERLESS_TIME_ZONE: "Australia/Sydney"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_TASK_WORKERS: "2"
              # Web workers grow with API traffic (paperless-gpt polls constantly) and reached
              # 2.7G each. Granian respawns a worker once it passes this many MiB.
              GRANIAN_WORKERS_MAX_RSS: "1024"

              # Storage paths - split between Ceph (data) and NFS (media)
              PAPERLESS_DATA_DIR: /data/local
              PAPERLESS_MEDIA_ROOT: /data/nas/media
              PAPERLESS_CONSUMPTION_DIR: /data/nas/incoming
              PAPERLESS_EXPORT_DIR: /data/nas/export

              # Export filename format
              PAPERLESS_FILENAME_FORMAT: "{{ `{{ created_year }}/{{ created_year }}-{{ created_month }}-{{ created_day }}_{{ correspondent }}_{{ title }}` }}"

              # Folder importer configuration
              PAPERLESS_CONSUMER_POLLING: "60"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"

              # OCR configuration
              PAPERLESS_OCR_LANGUAGES: eng
              PAPERLESS_OCR_LANGUAGE: eng
              PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'

              # Redis integration
              PAPERLESS_REDIS: redis://localhost:6379

              # Default ownership for newly-consumed documents (private to tgreen)
              PAPERLESS_DEFAULT_PERMISSIONS_OWNER: tgreen

              # User permissions for NFS storage
              USERMAP_GID: "65542" # gladius:external-services

            envFrom:
              - secretRef:
                  name: paperless-secret

            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

            resources:
              requests:
                cpu: 1000m
                memory: 3Gi
              limits:
                cpu: 2000m
                memory: 6Gi

          redis:
            image:
              repository: docker.io/valkey/valkey
              tag: "9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7"
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi

    service:
      app:
        controller: paperless
        ports:
          http:
            port: 8000

    ingress:
      app:
        className: "internal"
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          # Paired with the configuration-snippet on the `login` ingress below. Only one
          # server-snippet per hostname is honoured by ingress-nginx, so the named location
          # has to live here on the first ingress for this host.
          nginx.ingress.kubernetes.io/server-snippet: |
            location @paperless_csrf_retry {
              # The doubled dollar escapes Flux's postBuild substitution, which runs in strict
              # mode and fails on any nginx variable it has never heard of.
              return 302 https://paperless.${SECRET_DOMAIN}$${request_uri};
            }
            location @paperless_api_login {
              # DRF answers an unauthenticated API request with 401 and never a login redirect,
              # so a deep link to a document preview is a dead end in a browser. DRF content
              # negotiates, so a text/html 401 is a browser navigation and a json one is the
              # Angular UI's own XHR. Only the first is bounced to login. The second is passed
              # back as a 401 so the UI's session handling still sees what it expects.
              #
              # The variable name below is assembled from the NGINX_VAR cluster setting, which
              # is a literal dollar. The brace form nginx accepts elsewhere is rejected in an
              # `if` condition, and a bare name would not survive Flux's strict substitution.
              if (${NGINX_VAR}upstream_http_content_type ~* "text/html") {
                return 302 https://paperless.${SECRET_DOMAIN}/accounts/login/?next=$${request_uri};
              }
              return 401;
            }
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Utilities"
          gethomepage.dev/name: "Paperless NGX"
          gethomepage.dev/icon: "paperless.png"
          gethomepage.dev/description: "Document management system"
        hosts:
          - host: paperless.${SECRET_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http

      # Django answers a login POST that arrives without a csrftoken cookie with a bare 403
      # page, which is a dead end on a phone. iOS in-app browsers drop the cookie between the
      # login GET and the POST. Bounce that 403 back to the login page, which issues a fresh
      # cookie, rather than leaving the user stranded. The redirect keeps the original URI, so
      # ?next= survives and the deep link still lands after login.
      #
      # Deliberately scoped to /accounts/login/ and NOT applied to the `/` ingress above:
      # proxy_intercept_errors would otherwise swallow every 403 the Angular UI relies on for
      # permission handling. The GET of this path returns 200, so there is no redirect loop.
      login:
        className: "internal"
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          nginx.ingress.kubernetes.io/configuration-snippet: |
            proxy_intercept_errors on;
            error_page 403 = @paperless_csrf_retry;
        hosts:
          - host: paperless.${SECRET_DOMAIN}
            paths:
              - path: /accounts/login/
                pathType: Prefix
                service:
                  identifier: app
                  port: http

      # Same idea as `login` above, for API deep links. See @paperless_api_login for why this
      # does not disturb the UI's own 401s.
      api:
        className: "internal"
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          nginx.ingress.kubernetes.io/configuration-snippet: |
            proxy_intercept_errors on;
            error_page 401 = @paperless_api_login;
        hosts:
          - host: paperless.${SECRET_DOMAIN}
            paths:
              - path: /api/
                pathType: Prefix
                service:
                  identifier: app
                  port: http

    persistence:
      # Ceph block storage for database data, search index, logs
      data:
        existingClaim: paperless
        advancedMounts:
          paperless:
            app:
              - path: /data/local

      # NFS storage for media files (documents, thumbnails, incoming, export)
      nas:
        type: nfs
        server: 192.168.1.22
        path: /volume2/apps/paperless
        advancedMounts:
          paperless:
            app:
              - path: /data/nas
