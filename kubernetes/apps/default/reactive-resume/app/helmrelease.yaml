---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app resume
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      resume:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b"
            envFrom:
              - secretRef:
                  name: resume-secret
        containers:
          app:
            image:
              repository: amruthpillai/reactive-resume
              tag: "v5.2.7@sha256:656a7ce0409ea1b8fcdb4985320d8b687b94da1201d10af13fd1e2c7c74f6083"
            env:
              TZ: ${TZ}
              PORT: "3000"
              APP_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              # pgbouncer=true disables Prisma's server-side prepared statement
              # cache, required when going through a transaction-mode pooler.
              DATABASE_URL: "postgresql://resume:$(RESUME_DB_PASSWORD)@postgres16-pooler-rw.database.svc.cluster.local:5432/resume?pgbouncer=true"
              MAIL_FROM: "noreply@${SECRET_DOMAIN}"
              STORAGE_PROVIDER: "s3"
              STORAGE_URL: "http://minio.default.svc.cluster.local:9000"
              STORAGE_ENDPOINT: "minio.default.svc.cluster.local"
              STORAGE_PORT: "9000"
              STORAGE_REGION: "us-east-1"
              STORAGE_BUCKET: "resume"
              STORAGE_USE_SSL: "false"
              STORAGE_ACCESS_KEY: "$(MINIO_ROOT_USER)"
              STORAGE_SECRET_KEY: "$(MINIO_ROOT_PASSWORD)"
              CHROME_URL: "ws://localhost:3001"
            envFrom:
              - secretRef:
                  name: resume-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 15m
                memory: 200M
              limits:
                memory: 1G
          browserless:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.56.0@sha256:6f3149efabf5e04a44385974448c85264398db416bc63f884564316d0fcadc3e
            env:
              TOKEN: "$(CHROME_TOKEN)"
              PORT: "3001"
              PUBLIC_URL: "http://localhost:3000"
              ENABLE_CORS: "false"
              ALLOW_GET: "false"
              TIMEOUT: 180000
              CONCURRENT: 1
              PREBOOT_CHROME: false
              KEEP_ALIVE: false
            envFrom:
              - secretRef:
                  name: resume-secret
            resources:
              requests:
                cpu: 50m
                memory: 500M
              limits:
                memory: 2G
    service:
      app:
        controller: resume
        ports:
          http:
            port: 3000
          browserless:
            port: 3001
    ingress:
      app:
        className: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/name: Reactive Resume
          gethomepage.dev/icon: reactive-resume.png
          gethomepage.dev/description: Resume builder
        hosts:
          - host: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data
