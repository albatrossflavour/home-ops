---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app resume
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      # v6 runs Prisma migrations on startup and they do not unwind. A Helm
      # rollback would put v5 in front of a v6 schema, so leave a failed
      # upgrade failed and recover from the pre-upgrade dump instead.
      retries: 0
      remediateLastFailure: false
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      resume:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719"
            envFrom:
              - secretRef:
                  name: resume-secret
        containers:
          app:
            image:
              repository: amruthpillai/reactive-resume
              tag: "v6.0.6@sha256:9ba846665ec3b703c904f61ed75cc0e2c0fe71efd2fd51f45600c6ce23744e78"
            env:
              TZ: ${TZ}
              PORT: "3000"
              # v6 requires this behind a reverse proxy or it falls back to the
              # proxy IP for per-visitor auth limits. Cluster pod CIDR.
              TRUSTED_PROXIES: "10.69.0.0/16"
              APP_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              # pgbouncer=true disables Prisma's server-side prepared statement
              # cache, required when going through a transaction-mode pooler.
              DATABASE_URL: "postgresql://resume:$(RESUME_DB_PASSWORD)@postgres16-pooler-rw.database.svc.cluster.local:5432/resume?pgbouncer=true"
              MAIL_FROM: "noreply@${SECRET_DOMAIN}"
              # v6 renamed every storage variable. The v5 STORAGE_* names are
              # not read at all, and with none of the S3_* names set v6 falls
              # back to local filesystem storage without complaining.
              STORAGE_BACKEND: "s3"
              S3_ENDPOINT: "http://minio.default.svc.cluster.local:9000"
              S3_BUCKET: "resume"
              S3_REGION: "us-east-1"
              S3_ACCESS_KEY_ID: "$(MINIO_ROOT_USER)"
              S3_SECRET_ACCESS_KEY: "$(MINIO_ROOT_PASSWORD)"
              S3_FORCE_PATH_STYLE: "true"
              CHROME_URL: "ws://localhost:3001"
            envFrom:
              - secretRef:
                  name: resume-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 15m
                memory: 200M
              limits:
                memory: 1G
          browserless:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.57.1@sha256:93dc614e2532ee66bac78f68b6229c33392309293c626d2a0899ccdf0c8aac67
            env:
              TOKEN: "$(CHROME_TOKEN)"
              PORT: "3001"
              PUBLIC_URL: "http://localhost:3000"
              ENABLE_CORS: "false"
              ALLOW_GET: "false"
              TIMEOUT: 180000
              CONCURRENT: 1
              PREBOOT_CHROME: false
              KEEP_ALIVE: false
            envFrom:
              - secretRef:
                  name: resume-secret
            resources:
              requests:
                cpu: 50m
                memory: 500M
              limits:
                memory: 2G
    service:
      app:
        controller: resume
        ports:
          http:
            port: 3000
          browserless:
            port: 3001
    ingress:
      app:
        className: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Utilities
          gethomepage.dev/name: Reactive Resume
          gethomepage.dev/icon: reactive-resume.png
          gethomepage.dev/description: Resume builder
        hosts:
          - host: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data
