# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app toodlepip-website
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      toodlepip-website:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/albatrossflavour/toodlepip-site
              # 2026-08-31: digest pinned so Renovate can track it - "latest"
              # alone gives it nothing to diff against.
              tag: "latest@sha256:7ec7b0cad3350ecd50e9a29a4d7f4f8d81496ce09cfbd25c1cbbfdf50f9d5e2d"
              pullPolicy: Always
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
          contact-api:
            image:
              repository: ghcr.io/albatrossflavour/toodlepip-contact-api
              tag: "latest@sha256:84e77b161fc55ff476512c538abe61cc7c7d7f4333300404360474ab094669d9"
              pullPolicy: Always
            env:
              PORT: "3000"
              SMTP_HOST: smtp-relay.default.svc.cluster.local
              SMTP_PORT: "25"
              SMTP_FROM: noreply@toodlepip.com.au
              SMTP_TO: contact@toodlepip.com.au
              ALERT_TO: tgreen@albatrossflavour.com
              NODE_ENV: production
            envFrom:
              - secretRef:
                  name: toodlepip-website-secret
            resources:
              requests:
                cpu: 5m
                memory: 48Mi
              limits:
                memory: 128Mi
      gallery-scanner:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          successfulJobsHistory: 0
          failedJobsHistory: 1
        containers:
          scanner:
            image:
              repository: ghcr.io/albatrossflavour/toodlepip-scanner
              tag: "latest@sha256:7d95d3c2e47fbacb802ad8028d3a86d3f5e5d8833af357bd4ecd691c639cd36a"
              pullPolicy: Always
            env:
              GALLERY_SOURCE: /gallery-source
              GALLERY_OUTPUT: /gallery-output
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    ingress:
      external:
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hosts:
          - host: toodlepip.com.au
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
          - host: www.toodlepip.com.au
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
    persistence:
      contact-data:
        type: nfs
        server: 192.168.1.22
        path: /volume2/apps/toodlepip.com.au/submissions
        advancedMounts:
          toodlepip-website:
            contact-api:
              - path: /data/submissions
      gallery-source:
        type: nfs
        server: 192.168.1.22
        path: /volume2/apps/toodlepip.com.au/gallery
        advancedMounts:
          gallery-scanner:
            scanner:
              - path: /gallery-source
                readOnly: true
      gallery-output:
        type: nfs
        server: 192.168.1.22
        path: /volume2/apps/toodlepip.com.au/gallery-output
        advancedMounts:
          toodlepip-website:
            app:
              - path: /usr/share/nginx/html/gallery-data
                readOnly: true
          gallery-scanner:
            scanner:
              - path: /gallery-output
