---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-checker
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-checker-secret
    template:
      engineVersion: v2
      data:
        PAPERLESS_TOKEN: "{{ .PAPERLESS_TOKEN }}"
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .CLAUDE_CODE_OAUTH_TOKEN }}"
  data:
    # The checker's own paperless superuser, so its edits are told apart from people's in the audit log
    - secretKey: PAPERLESS_TOKEN
      remoteRef:
        key: paperless-checker
        property: PAPERLESS_TOKEN
    # From `claude setup-token`: runs on the subscription, not API credits
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: CLAUDE_CODE_OAUTH_TOKEN
        property: credential
