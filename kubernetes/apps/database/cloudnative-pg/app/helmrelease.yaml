---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.0
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: minio
      namespace: default
    - name: openebs
      namespace: openebs-system
  values:
    crds:
      create: true
    # 2026-08-31: was resources: {} (BestEffort QoS on a control-plane
    # chokepoint). Sized from a 24h historical peak of ~307Mi observed
    # during an unusually busy day (multiple postgres failovers).
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
    monitoring:
      podMonitorEnabled: false
      grafanaDashboard:
        create: true
