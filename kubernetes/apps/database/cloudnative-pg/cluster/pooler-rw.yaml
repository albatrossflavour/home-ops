---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/pooler_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres16-pooler-rw
spec:
  cluster:
    name: postgres16
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      # Clears session state (temp tables, SET, prepared statements) between
      # clients sharing a pooled server connection under transaction pooling.
      server_reset_query: "DISCARD ALL"
