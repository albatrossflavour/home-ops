---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16
spec:
  instances: 3
  # 2026-09-01: was frozen at 16.4-2 (2024-08-08) for the cluster's entire
  # lifetime - confirmed via git history this field was never touched, not
  # even a same-version build-string bump, because Renovate's default
  # docker/kubernetes managers don't recognise CNPG's "imageName" key (only
  # the standard "image:" key). Added a customManagers regex to
  # .github/renovate.json5 to fix that going forward. Bumped directly to
  # 16.15 (2026-08-13) in one jump, not staged - Postgres minor releases
  # within the same major version are always binary-compatible, checked the
  # 16.15 release notes for the one real gotcha (a new output_plugin_libraries
  # allow-list affecting custom logical-decoding plugins) and confirmed live
  # this cluster only uses CNPG's own physical replication slot, not logical.
  # 2026-09-01: "standard" images stopped bundling barman-cloud-* tools in
  # CNPG's Sept 2025 image restructuring - only the deprecated "system"
  # variant still has them, needed for the barmanObjectStore backup config
  # below. Confirmed live: standard-bullseye's WAL archiving fails outright
  # with "barman-cloud-wal-archive: executable file not found in $PATH".
  # Verified system-bullseye is standard-bullseye's exact 4 layers plus one
  # additive layer (barman 3.19.1) before switching - same entrypoint/cmd/
  # user, only new env is a pip build flag.
  # This is a stopgap, not a fix: native in-tree barman-cloud support
  # (this whole backup block) is deprecated and slated for removal in CNPG
  # 1.31 - this operator is on 1.30.0 now. Needs migrating to the Barman
  # Cloud Plugin (ObjectStore CR + spec.plugins) before that lands, see
  # https://cloudnative-pg.io/plugin-barman-cloud/docs/migration/
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-system-bullseye@sha256:34cd4159d07b3410a1b29da35072e2e927a0905e717a61afa3814624a2e8859a
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
    storageClass: ceph-block
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 256MB
      # Freeze well before the PGDatabase alert threshold (150M) so the alert
      # only fires when autovacuum is genuinely stuck
      autovacuum_freeze_max_age: "100000000"
      # 2026-08-29: a weatherwax reboot rescheduled 63 pods at once; radarr and
      # sonarr each opened their full Npgsql pool (MaxPoolSize=100 by default),
      # prowlarr 48, authentik 22, asciinema 19. That hit the old 400 ceiling.
      # The pods were then killed by their probes, but Postgres had no way to
      # notice the peers were gone, so ~390 backends survived with dead sockets
      # and the exhaustion became permanent rather than transient.
      # Keepalives detect a dead peer in roughly two minutes;
      # idle_session_timeout reaps sessions that are merely abandoned.
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "6"
      idle_session_timeout: "600000"
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 500m
      # Request and limit kept equal for Guaranteed QoS - this database must not
      # be evictable. Raised from 2Gi alongside max_connections 400 -> 600: the
      # primary's working set was already 1175Mi at 412 backends.
      memory: 3Gi
    limits:
      memory: 3Gi
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: 10d
    barmanObjectStore: &barmanObjectStore
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://cloudnative-pg/
      endpointURL: http://minio.default.svc.cluster.local:9000
      #endpointURL: https://192.168.1.22:9000
      # Note: serverName version needs to be incremented
      # when recovering from an existing cnpg cluster
      serverName: &currentCluster postgres16-v7
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-secret
          key: aws-secret-access-key
  # Note: previousCluster needs to be set to the name of the previous
  # cluster when recovering from an existing cnpg cluster
  bootstrap:
    recovery:
      source: &previousCluster postgres16-v6
  # Note: externalClusters is needed when recovering from an existing cnpg cluster
  externalClusters:
    - name: *previousCluster
      barmanObjectStore:
        <<: *barmanObjectStore
        serverName: *previousCluster
