---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The Secret the scm chart takes as auth.existingSecret. Key names are the
# sixteen the chart README lists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: scm-secret
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ .SCM_PG_ADMIN_PASSWORD }}"
        comply-db-password: "{{ .SCM_DB_PASSWORD }}"
        keycloak-db-password: "{{ .SCM_KC_DB_PASSWORD }}"
        hasura-admin-secret: "{{ .SCM_HASURA_ADMIN_SECRET }}"
        redis-password: "{{ .SCM_REDIS_PASSWORD }}"
        db-encryption-key: "{{ .SCM_DB_ENCRYPTION_KEY }}"
        keycloak-admin-username: "{{ .SCM_KC_ADMIN_USER }}"
        keycloak-admin-password: "{{ .SCM_KC_ADMIN_PASSWORD }}"
        client-secret: "{{ .SCM_CLIENT_SECRET }}"
        cookie-secret: "{{ .SCM_COOKIE_SECRET }}"
        kc-account-secret: "{{ .SCM_KC_ACCOUNT }}"
        kc-account-console-secret: "{{ .SCM_KC_ACCOUNT_CONSOLE }}"
        kc-admin-cli-secret: "{{ .SCM_KC_ADMIN_CLI }}"
        kc-broker-secret: "{{ .SCM_KC_BROKER }}"
        kc-realm-management-secret: "{{ .SCM_KC_REALM_MANAGEMENT }}"
        kc-security-admin-console-secret: "{{ .SCM_KC_SECURITY_ADMIN_CONSOLE }}"
  dataFrom:
    - extract:
        key: scm
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The certificate the mTLS proxy serves and the PE CA it checks agents
# against. Issued on the PE primary with `puppetserver ca generate` for the
# name in mtlsProxy.hostname. Stored base64 so the PEM line breaks survive.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scm-pe-certs
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: scm-pe-certs
    template:
      engineVersion: v2
      data:
        tls.crt: "{{ .SCM_PE_TLS_CRT_B64 | b64dec }}"
        tls.key: "{{ .SCM_PE_TLS_KEY_B64 | b64dec }}"
        ca.crt: "{{ .SCM_PE_CA_CRT_B64 | b64dec }}"
  dataFrom:
    - extract:
        key: scm
