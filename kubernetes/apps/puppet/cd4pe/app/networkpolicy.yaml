---
# yaml-language-server: $schema=https://raw.githubusercontent.com/cilium/cilium/main/pkg/k8s/apis/cilium.io/client/crds/v2/CiliumNetworkPolicy.json
# The namespace baseline is in ../../networkpolicy-default.yaml.
#
# pipelinesinfra calls out to whatever it is integrated with: the PE primary
# (orchestrator, code manager, PuppetDB), the VCS, and an LDAP or SAML
# provider. Those are set in the UI, so the destinations cannot be listed here.
#
# Rollback: `kubectl delete ciliumnetworkpolicy -n puppet cd4pe-pipelinesinfra-egress cd4pe-ui-ingress cd4pe-backend-ingress`.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cd4pe-pipelinesinfra-egress
  namespace: puppet
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cd4pe
      app.kubernetes.io/component: pipelinesinfra
  egress:
    - toEntities:
        - world
---
# The UI's Ingress (cd4pe-ui-external in ./ingress.yaml) is on the external
# class, so only that controller reaches the UI, on its http port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cd4pe-ui-ingress
  namespace: puppet
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cd4pe
      app.kubernetes.io/component: ui
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: ingress-nginx-external
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# The backend's Ingress (cd4pe-backend-internal) is on the internal class, so
# only that controller reaches pipelinesinfra, on the webhook port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cd4pe-backend-ingress
  namespace: puppet
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cd4pe
      app.kubernetes.io/component: pipelinesinfra
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: ingress-nginx-internal
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
