---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Continuous Delivery for Puppet Enterprise, from the unofficial chart at
# github.com/albatrossflavour/puppet-helm-charts.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cd4pe
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cd4pe
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    hostname: cd4pe.lab.${SECRET_DOMAIN}
    backendHostname: cd4pe-backend.lab.${SECRET_DOMAIN}
    rootUser:
      email: admin@${SECRET_DOMAIN}
    auth:
      existingSecret: cd4pe-secret
    license:
      existingSecret: cd4pe-licence
    signup:
      # CD4PE has no admin "create user": the root account's add user goes
      # through sign-up too. So sign-up stays open to the LAN and closed to
      # the internet. LAN clients reach the external controller from their own
      # address or, with externalTrafficPolicy Cluster, a node's (192.168.8.x).
      # Tunnel traffic reaches it from a cloudflared pod (10.69.x), so it's
      # refused. The controller's X-Real-IP and X-Forwarded-For come from the
      # request's own X-Forwarded-For (enable-real-ip trusts every source), so
      # the address checked is X-Ingress-Peer-Addr, which the Ingress in
      # ./ingress.yaml sets to the connection's address, believed only from
      # the pod network.
      allowedSources:
        - 192.168.0.0/16
      clientAddress:
        header: X-Ingress-Peer-Addr
        trustedProxies:
          - 10.69.0.0/16
    ingress:
      # The chart puts the UI and the backend on one ingress class, and they
      # need different ones, so the two Ingresses are in ./ingress.yaml.
      enabled: false
    queryToken:
      persistence:
        # pipelinesinfra writes the token and query reads it, from two pods.
        storageClass: ceph-filesystem
