---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Continuous Delivery for Puppet Enterprise, from the unofficial chart at
# github.com/albatrossflavour/puppet-helm-charts.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cd4pe
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: cd4pe
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    hostname: cd4pe.lab.${SECRET_DOMAIN}
    backendHostname: cd4pe-backend.lab.${SECRET_DOMAIN}
    rootUser:
      email: admin@${SECRET_DOMAIN}
    auth:
      existingSecret: cd4pe-secret
    license:
      existingSecret: cd4pe-licence
    ingress:
      # The external class, as grafana does, so the cloudflared tunnel and the
      # LAN reach the UI on the one name. The chart puts both Ingresses on one
      # class, so the backend sits there too, but the tunnel only routes
      # cd4pe.lab: webhooks reach the backend from inside the network.
      className: external
      annotations:
        external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        nginx.ingress.kubernetes.io/proxy-body-size: 75m
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    queryToken:
      persistence:
        # pipelinesinfra writes the token and query reads it, from two pods.
        storageClass: ceph-filesystem
