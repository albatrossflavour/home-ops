---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The Secret the cd4pe chart takes as auth.existingSecret. Key names are the
# ones the chart README lists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cd4pe
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cd4pe-secret
    template:
      engineVersion: v2
      data:
        root-password: "{{ .CD4PE_ROOT_PASSWORD }}"
        secret-key: "{{ .CD4PE_SECRET_KEY }}"
        postgres-password: "{{ .CD4PE_PG_ADMIN_PASSWORD }}"
        cd4pe-db-password: "{{ .CD4PE_DB_PASSWORD }}"
        query-db-password: "{{ .CD4PE_QUERY_DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: cd4pe
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The licence file, which the chart mounts at /etc/puppetlabs/cd4pe/license.
# Stored base64 so its line breaks survive.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cd4pe-licence
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cd4pe-licence
    template:
      engineVersion: v2
      data:
        license.lic: "{{ .CD4PE_LICENCE_B64 | b64dec }}"
  dataFrom:
    - extract:
        key: cd4pe
