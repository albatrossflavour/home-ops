# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# The chart comes from ghcr.io. The ExternalSecrets supply what it takes as
# auth.existingSecret and license.existingSecret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
