---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: critical-ha-alerts
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: homelab.critical-ha
      rules:
        - alert: PodRestartLoop
          expr: rate(kube_pod_container_status_restarts_total[10m]) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restart looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value | humanize }} times in the last 10 minutes"

        - alert: PVCStorageNearlyFull
          expr: |
            (
              kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes
            ) > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
            description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full (threshold: 85%)"

        - alert: CertificateExpiresSoon
          expr: |
            (
              certmanager_certificate_expiration_timestamp_seconds - time()
            ) / 86400 < 7
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}"
            description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} will expire in {{ $value | humanizeDuration }}"

        # 2026-09-01: covers hubble-server-certs, hubble-relay-client-certs,
        # cilium-ca - Helm-templated, not cert-manager Certificate objects,
        # so CertificateExpiresSoon above structurally can't see them
        # (certmanager_certificate_expiration_timestamp_seconds only exists
        # for cert-manager-issued certs). hubble.tls.auto: helm doesn't
        # auto-renew on any schedule tied to expiry - confirmed live the
        # server cert has actually regenerated recently, but as an
        # unplanned side effect of unrelated Helm activity, not a real
        # rotation policy - so this gets a much longer lead time than the
        # 7-day cert-manager alert above, there's no automation backstopping
        # a late catch here. Metric pushed daily by cert-expiry-check
        # (kube-system) via a Pushgateway - see that CronJob for the actual
        # cert reads.
        - alert: HubbleCiliumCertExpiresSoon
          expr: |
            (
              cert_expiry_timestamp_seconds - time()
            ) / 86400 < 30
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} cert expires in {{ $value | humanizeDuration }}"
            description: "Cilium/Hubble mTLS cert {{ $labels.instance }} will expire in {{ $value | humanizeDuration }}. This is Helm-templated, not cert-manager - no automatic renewal is guaranteed. Check kubernetes/apps/kube-system/cilium's HelmRelease and the cert-expiry-check CronJob's logs."

        - alert: AuthentikServiceDown
          expr: |
            up{job="authentik-server-metrics"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Authentik identity provider is down"
            description: "Authentik service has been down for more than 5 minutes. Authentication may be unavailable."

        - alert: IngressControllerLowReplicas
          expr: |
            (
              kube_deployment_status_replicas_available{deployment=~"ingress-nginx-.*-controller"}
              < 2
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Ingress controller {{ $labels.deployment }} has only {{ $value }} replicas"
            description: "Ingress controller {{ $labels.deployment }} has {{ $value }} replicas (expected: 2+)"

        - alert: AuthentikLowReplicas
          expr: |
            (
              kube_deployment_status_replicas_available{deployment="authentik-server"}
              < 2
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Authentik has only {{ $value }} replicas available"
            description: "Authentik server has {{ $value }} replicas available (expected: 3)"

        # NVMe endurance is deliberately NOT alerted on. Two drives in the
        # Proxmox estate already report Percentage Used above 100% (ankh
        # nvme1n1 at 143%, morpork nvme0n1 at 150%, both Crucial CT1000P3SSD8
        # as of 2026-09-07) and that number only ever climbs. It is a warranty
        # counter, not a failure predictor, so alerting on it would mean a
        # permanently firing alert that says nothing new.
        #
        # Available spare is the metric that actually predicts failure. It is
        # the proportion of the drive's reserve block pool still unused, and
        # the NVMe spec has each drive publish its own failure threshold
        # (5% or 10% across this estate). Both worn drives still read 100%,
        # so the reserve is completely untouched - which is precisely why a
        # move off 100% is worth knowing about.
        #
        # See docs/operations/proxmox-health-audit.md.
        - alert: NvmeAvailableSpareLow
          expr: |
            nvme_available_spare_ratio * 100 < 90
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.instance }} has consumed reserve blocks"
            description: "Available spare on {{ $labels.device }} ({{ $labels.instance }}) has fallen to {{ $value | humanize }}%, meaning the drive has started retiring blocks into its reserve pool. Every drive in this estate sat at 100% when this alert was written, so any movement is new. Not urgent on its own, but it is the first genuine sign of wear turning into degradation - check `smartctl -A` for Media and Data Integrity Errors alongside it."

        - alert: NvmeAvailableSpareCritical
          expr: |
            nvme_available_spare_ratio <= nvme_available_spare_threshold_ratio
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe {{ $labels.device }} on {{ $labels.instance }} is below its own spare threshold"
            description: "Available spare on {{ $labels.device }} ({{ $labels.instance }}) has dropped to or below the failure threshold the drive itself publishes. The NVMe spec treats this as a device in a degraded state; replacement is the expected response, not investigation. On ankh and morpork the pve volume group holds the Proxmox host root, swap, every VM system disk and the rook-ceph OSD volumes, so a failure there takes a Kubernetes control plane node and a Ceph OSD with it."

        - alert: UPSOnBattery
          expr: |
            network_ups_tools_ups_status{flag="OL"} == 0
          for: 1m
          labels:
            severity: critical
            component: infrastructure
            alert_group: power
          annotations:
            summary: "UPS is running on battery power"
            description: "UPS has lost mains power and is running on battery. Mains power has been offline for more than 1 minute."

        - alert: UPSBatteryLow
          expr: |
            network_ups_tools_battery_charge < 50
          for: 1m
          labels:
            severity: critical
            component: infrastructure
            alert_group: power
          annotations:
            summary: "UPS battery charge is low at {{ $value }}%"
            description: "UPS battery charge is at {{ $value | humanize }}% (threshold: 50%). System shutdown may occur soon if mains power is not restored."

        # 2026-09-01: charge% alone is a poor proxy for time-to-shutdown -
        # this UPS (CyberPower PR1000ELCD) is rated 4min runtime at full
        # load but 16min at half load, so the same 50% charge threshold
        # above means very different things depending on draw. There's no
        # network_ups_tools_battery_runtime metric exported by this NUT
        # setup to alert on directly (checked live - it isn't there).
        # NUT's own LB ("Low Battery") status flag is the better signal:
        # it's the UPS firmware's own runtime estimate, already factoring
        # in actual discharge rate and load internally, not a fixed
        # percentage - this is the standard "act now" signal upsmon-style
        # tooling watches for.
        - alert: UPSLowBatteryRuntime
          expr: |
            network_ups_tools_ups_status{flag="LB"} == 1
          for: 30s
          labels:
            severity: critical
            component: infrastructure
            alert_group: power
          annotations:
            summary: "UPS reports imminent battery exhaustion"
            description: "The UPS's own firmware has raised its Low Battery (LB) flag - its internal runtime estimate, accounting for actual load, is at the point where shutdown should begin. This is a shorter-fuse warning than UPSBatteryLow's fixed 50% charge threshold."

    - name: flux
      rules:
        # 2026-08-31: rewritten off gotk_resource_info. The old expr used
        # gotk_reconcile_condition, which this Flux version's controllers no
        # longer expose (confirmed live: helm-controller's /metrics only has
        # gotk_reconcile_duration_seconds) - this alert could never have
        # fired. Replacement metric comes from the kube-state-metrics
        # customResourceState config added in
        # observability/kube-prometheus-stack's HelmRelease.
        - alert: HelmReleaseNotReady
          expr: |
            gotk_resource_info{customresource_kind="HelmRelease", ready="False"} == 1
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "HelmRelease {{ $labels.exported_namespace }}/{{ $labels.name }} failing"
            description: "HelmRelease {{ $labels.exported_namespace }}/{{ $labels.name }} has been in a non-Ready state for more than 30 minutes."

        - alert: HelmReleaseStalled
          expr: |
            gotk_resource_info{customresource_kind="HelmRelease", stalled="True"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "HelmRelease {{ $labels.exported_namespace }}/{{ $labels.name }} stalled"
            description: "HelmRelease {{ $labels.exported_namespace }}/{{ $labels.name }} has exhausted its install/upgrade retries and stopped reconciling on its own. Everything depending on it via dependsOn is blocked until this is manually unstuck."

        - alert: KustomizationStalled
          expr: |
            gotk_resource_info{customresource_kind="Kustomization", stalled="True"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kustomization {{ $labels.exported_namespace }}/{{ $labels.name }} stalled"
            description: "Kustomization {{ $labels.exported_namespace }}/{{ $labels.name }} is Stalled. Everything depending on it via dependsOn is blocked until this is manually resolved."

        - alert: KustomizationNotReady
          expr: |
            gotk_resource_info{customresource_kind="Kustomization", ready="False"} == 1
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Kustomization {{ $labels.exported_namespace }}/{{ $labels.name }} failing"
            description: "Kustomization {{ $labels.exported_namespace }}/{{ $labels.name }} has been in a non-Ready state for more than 30 minutes. A Kustomization can go non-Ready independently of any HelmRelease it manages."

        # 2026-08-31: external-secrets (HelmRelease) and external-secrets-stores
        # (Kustomization) sit upstream of ~64 and ~63 transitive dependents
        # respectively out of ~120 total Kustomizations - by far the widest
        # blast radius of any single chokepoint in the cluster. A shorter for
        # than the general 30m NotReady rules above, specifically on these two
        # names, so a stuck reconciliation here pages before it cascades wide.
        - alert: ExternalSecretsChokepointNotReady
          expr: |
            gotk_resource_info{name=~"external-secrets|external-secrets-stores", ready="False"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} failing"
            description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been non-Ready for more than 10 minutes. This is a dependency chokepoint - dozens of other Kustomizations depend on it and are blocked."

    - name: spegel
      rules:
        - alert: SpegelMirrorFailureRate
          expr: |
            sum(rate(spegel_mirror_requests_total{cache="miss"}[10m]))
            / sum(rate(spegel_mirror_requests_total[10m])) > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Spegel mirror cache miss rate above 90%"
            description: "Spegel peer-to-peer image mirror has >90% cache miss rate for 15 minutes, indicating possible DHT or connectivity issues."

    - name: image-pull
      rules:
        - alert: ImagePullBackOff
          expr: |
            kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} in ImagePullBackOff"
            description: "Container has been unable to pull its image for more than 10 minutes."

    - name: trivy
      rules:
        # 2026-09-01: deliberately scoped to fixable-only. Cluster-wide
        # CRITICAL count sits around 260+ at any given time, ~150 of which
        # are unfixed Debian/base-image CVEs (a handful of Perl CVEs alone
        # account for 100+, present in almost every Debian-based image
        # whether it uses Perl or not) - genuinely nothing to act on until
        # the distro patches them. Alerting on the raw total would mean a
        # permanently-firing alert nobody can clear. This only counts
        # vulnerabilities where trivy reports a fixedVersion - i.e. only
        # things an image bump could actually resolve. Threshold (10) and
        # for (24h) are both deliberately patient - this is a "worth a
        # dedicated look sometime this week" signal, not a page. Metric
        # pushed daily by trivy-fixable-check (security namespace) via the
        # same Pushgateway cert-expiry-check already uses.
        # Both pushed-metric alerts in this file depend on
        # cert-expiry-pushgateway holding a value between daily CronJob runs.
        # Until 2026-09-06 that gateway had no --persistence.file, so every
        # pod restart emptied it and both alerts went blind with no signal at
        # all: on 2026-09-06 both metrics were absent, neither alert was
        # firing, and the trivy job had logged 112 fixable CRITICALs that
        # morning against a threshold of 10.
        #
        # Persistence is now configured. These two exist so that if it fails
        # again - PVC lost, pod Pending, CronJob broken - the failure is loud
        # instead of looking like good news. An alert that stops firing
        # because its input vanished is indistinguishable from a fixed
        # problem, which is the whole trap.
        - alert: CertExpiryMetricAbsent
          expr: |
            absent(cert_expiry_timestamp_seconds)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "cert_expiry_timestamp_seconds has vanished, HubbleCiliumCertExpiresSoon is blind"
            description: "No cert expiry metric has been present for 2h, so HubbleCiliumCertExpiresSoon cannot fire regardless of the real cert state. These Cilium/Hubble mTLS certs are Helm-templated with no cert-manager renewal behind them, so this alert is the only thing watching them. Check the cert-expiry-pushgateway pod in kube-system and the cert-expiry-check CronJob."

        - alert: TrivyFixableMetricAbsent
          expr: |
            absent(trivy_critical_fixable_total)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "trivy_critical_fixable_total has vanished, TrivyFixableCriticalBacklog is blind"
            description: "No fixable-CRITICAL metric has been present for 2h, so TrivyFixableCriticalBacklog cannot fire. Check the cert-expiry-pushgateway pod in kube-system and the trivy-fixable-check CronJob in security; the job logs the count it computed even when the push does not survive."

        - alert: TrivyFixableCriticalBacklog
          expr: |
            trivy_critical_fixable_total > 10
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} fixable CRITICAL vulnerabilities sitting unaddressed"
            description: "{{ $value }} CRITICAL vulnerabilities across the cluster have a fix already published upstream but haven't been picked up yet - a stale image pin somewhere is the usual cause (see the postgres16/nginx-reverse-proxy fixes in the audit doc for the pattern). Check `kubectl get vulnerabilityreports -A` and cross-reference fixedVersion fields to find which image(s)."

    - name: thanos
      rules:
        # 2026-09-01: the Thanos bucket (cluster Minio, itself NFS-backed at
        # 192.168.1.22:/volume2/k3sminio) is the only copy of years of
        # downsampled metric history - no second copy exists. Confirmed live
        # thanos_objstore_bucket_operation_failures_total was already being
        # scraped with real data (28 series across bucketweb/ruler/compactor/
        # storegateway, all zero at the time) - this just wires an alert onto
        # a metric that already existed, no new instrumentation needed.
        - alert: ThanosBucketOperationFailures
          expr: |
            sum by (job, operation) (
              rate(thanos_objstore_bucket_operation_failures_total[15m])
            ) > 0
          for: 15m
          labels:
            severity: warning
            component: observability
            alert_group: storage
          annotations:
            summary: "Thanos {{ $labels.job }} failing bucket {{ $labels.operation }} operations"
            description: "{{ $labels.job }} has been failing object-store {{ $labels.operation }} operations against the Thanos bucket for 15+ minutes. Recent metrics keep working (served from local Prometheus), but long-term/historical queries and new compaction may be degraded. Bucket is cluster Minio, itself NFS-backed - check NAS reachability first."

    - name: home-sensors
      rules:
        - alert: MqttExporterDown
          expr: |
            up{job="mqtt-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "mqtt-exporter scrape target is down"
            description: "Prometheus cannot scrape mqtt-exporter for 5+ minutes. Home sensor data is being lost."

        - alert: HomeTemperatureDataMissing
          expr: |
            absent(mqtt_temperature{job="mqtt-exporter"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Home temperature sensor data has stopped"
            description: "No mqtt_temperature metrics from mqtt-exporter for 15+ minutes. Check mqtt-exporter logs and EMQX connectivity."

        - alert: HomeTemperatureSensorsLow
          expr: |
            count(mqtt_temperature{job="mqtt-exporter"}) < 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Only {{ $value }} temperature sensors reporting (expected ~18)"
            description: "Fewer than 5 temperature sensors are reporting. The mqtt-exporter may be hitting its metric limit or sensors are offline."

    # The NAS mirror on ankh. Metrics come from scripts/nas-sync.sh via
    # node_exporter's textfile collector (/var/lib/prometheus/node-exporter),
    # the same route smartmon.prom and nvme.prom already use.
    #
    # WHY THIS EXISTS. The previous sync was five rsync lines in cron with
    # output sent to /dev/null. root's SSH key to the NAS stopped
    # authenticating, every run failed silently, and it was eight months before
    # anyone noticed - by which point PlexMediaServer had not moved since 2021.
    # A backup that fails quietly is worse than no backup, because you believe
    # you have one. These alerts exist so that cannot happen twice.
    - name: nas-sync
      rules:
        # The one that matters. Everything else here is detail.
        #
        # The cron runs daily at midnight, so 36h allows a full miss plus the
        # run itself (Media alone took 40h on the initial seed; steady-state
        # incremental runs are far shorter, but the threshold should tolerate a
        # long one rather than page during it).
        - alert: NasSyncStale
          expr: |
            time() - nas_sync_last_success_timestamp_seconds > 36 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "NAS mirror on {{ $labels.instance }} has not completed successfully in {{ $value | humanizeDuration }}"
            description: "nas-sync.sh last finished without a hard failure {{ $value | humanizeDuration }} ago. The cron is daily, so anything past 36h means runs are failing or not starting. Check /var/log/nas-sync.log on ankh. Note the cron still redirects to /dev/null, so this alert and the log are the only signals."

        # absent() is not redundant with the staleness alert above: if the
        # script stops running entirely, or the textfile is removed, the metric
        # disappears and a threshold on it can never fire. Silence is the
        # failure mode this whole thing exists to catch.
        - alert: NasSyncMetricsAbsent
          expr: |
            absent(nas_sync_last_success_timestamp_seconds)
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "NAS mirror metrics have disappeared entirely"
            description: "nas_sync_last_success_timestamp_seconds is not being reported. Either nas-sync.sh is no longer running, or it is no longer writing /var/lib/prometheus/node-exporter/nas_sync.prom. Both mean the mirror is unmonitored, which is exactly how the 2021-2026 gap happened."

        - alert: NasSyncHardFailure
          expr: |
            nas_sync_hard_failures > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NAS mirror had {{ $value }} source(s) fail outright"
            description: "One or more sources failed for a reason other than unreadable files. rsync exits 23 and 24 are classed as partial and deliberately do NOT trigger this, so a hard failure here is a real problem - a dead SSH key, a full disk, or an unmounted destination."

        # Media and PlexMediaServer skip a fixed set of files the tgreen
        # account cannot read - 48 of them as of 2026-09-09. That number being
        # non-zero is expected and is NOT alertable, or the alert would fire
        # every night and be ignored. What matters is the number GROWING, which
        # means new files have become unreadable.
        - alert: NasSyncUnreadableFilesIncreasing
          expr: |
            sum(nas_sync_source_unreadable_files) - sum(nas_sync_source_unreadable_files offset 7d) > 5
          for: 1h
          labels:
            severity: info
          annotations:
            summary: "NAS mirror is skipping {{ $value }} more unreadable files than a week ago"
            description: "The count of files the NAS refuses to hand over has risen. The known baseline is 48 across Media and PlexMediaServer. A rise means new content is being created with permissions the sync account cannot read, so it is silently not being backed up. Check the Permission denied lines in /var/log/nas-sync.log on ankh."
