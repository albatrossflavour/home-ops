---
# Generated by `rake alerts:prometheusrule` from pdctng 0.5.0.
#
# Not managed by Puppet: nothing writes this file in place. Regenerate it
# rather than editing it, or your change is lost the next time somebody does.
# The scrape job these rules name is `puppet`.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pdctng-alerts
  labels:
    prometheus: kube-prometheus
    role: alert-rules
  annotations:
    pdctng.puppet.com/module-version: 0.5.0
spec:
  groups:
  - name: pdctng-backup
    rules:
    - alert: PuppetBackupNeverRun
      expr: puppet_backup_artefacts == 0 and on(instance) (time() - puppet_backup_dir_mtime_epoch)
        > 14 * 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: No PE backup artefact has ever landed on {{ $labels.alias }}
        description: 'No PE backup artefact has ever landed here, so there is nothing
          on this primary to restore from. `puppet_backup_dir_mtime_epoch` says nothing
          has been written to or removed from `pdctng::backup_dir` for 14 days, which
          is what separates never backed up from backed up and moved away; an estate
          that moves its artefact does not fire this. Run `sudo puppet-backup create`
          by hand and watch it. If it says the staging directory is not writable by
          pe-postgres, the directory is fine and the `su` is not, which is an SCE
          control on `/etc/pam.d/su`. docs/troubleshooting.md has the test and the
          fix, and that fault is what this alert was built after. The other cause
          is configuration: a site backing up straight to another path should point
          `pdctng::backup_dir` there, or set `pdctng::enable_backup_metrics` to false.'
    - alert: PuppetBackupShrank
      expr: max by (alias) (puppet_backup_last_bytes) < 0.5 * max by (alias) (max_over_time(puppet_backup_last_bytes[30d]))
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: The newest PE backup on {{ $labels.alias }} is under 0.5 of the largest
          in the last thirty days
        description: 'A backup artefact is present and current, and it is a fraction
          of the size the last thirty days say it should be. The usual cause is a
          tarball truncated by a full disk: nothing can tell a truncated tarball from
          a complete one by stat alone, which is why this watches the size instead
          of asking whether a backup ran. Restore from the previous artefact if you
          need one today, then find what filled the disk. Expect one false positive,
          an estate that has just decommissioned a large part of its fleet: the backup
          really is smaller, and the alert clears itself once the old size ages out
          of the thirty-day window.'
    - alert: PuppetBackupStale
      expr: time() - puppet_backup_last_epoch > 8 * 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: The newest PE backup on {{ $labels.alias }} is over 8 days old
        description: The newest restorable artefact on this primary is 8 days old,
          so a restore today loses everything since. Check the glob before assuming
          no backup ran. `pdctng::backup_pattern` defaults to `*.tgz`, which finds
          PE's own `pe_backup-<timestamp>.tgz` but not an artefact renamed by `puppet-backup
          create --name`, and a mismatch reads exactly like a missing backup. If the
          pattern is right, run `sudo puppet-backup create` and watch it; a staging-directory-not-writable
          error is the `su - pe-postgres` PAM fault documented in docs/troubleshooting.md
          rather than a permissions problem on the directory. A backup completing
          is not proof it is whole, so check `Newest Backup Size` on TAM Check afterwards.
          The default assumes a weekly cadence with a day of margin; set `pdctng::alerts::thresholds.backup_stale_days`
          to your own.
  - name: pdctng-capacity_ceiling
    rules:
    - record: puppet_ceiling_seconds_to_full
      expr: "((1 - puppet_ceiling_utilisation) / deriv(puppet_ceiling_utilisation[2592000s:1d]))
        and deriv(puppet_ceiling_utilisation[2592000s:1d]) > 0"
    - record: puppet_ceiling_utilisation
      expr: label_replace(max by (host) (label_replace((node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}
        - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"})
        / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"},
        "host", "$1", "alias", "(.*)")), "ceiling", "Infrastructure filesystem", "",
        "") or label_replace(max by (host) (puppet_server_jvm_heap_bytes{area="used"}
        / ignoring(area) puppet_server_jvm_heap_bytes{area="max"}), "ceiling", "Puppetserver
        JVM heap", "", "") or label_replace(max by (host) (puppet_db_jvm_heap_bytes{area="used"}
        / ignoring(area) puppet_db_jvm_heap_bytes{area="max"}), "ceiling", "PuppetDB
        JVM heap", "", "") or label_replace(max by (host) (puppet_orchestrator_jvm_heap_bytes{area="used"}
        / ignoring(area) puppet_orchestrator_jvm_heap_bytes{area="max"}), "ceiling",
        "Orchestrator JVM heap", "", "") or label_replace(sum by (host) (puppet_postgres_backends)
        / on(host) group_left() max by (host) (puppet_postgres_max_connections), "ceiling",
        "Postgres connections", "", "") or label_replace(max by (host) (puppet_db_pool_connections{pool="read",state="active"}
        / ignoring(state) puppet_db_pool_connections{pool="read",state="max"}), "ceiling",
        "PuppetDB read pool", "", "") or label_replace(max by (host) (puppet_db_pool_connections{pool="write",state="active"}
        / ignoring(state) puppet_db_pool_connections{pool="write",state="max"}), "ceiling",
        "PuppetDB write pool", "", "") or label_replace(max by (host) (puppet_db_http_threads{state="busy"}
        / ignoring(state) puppet_db_http_threads{state="max"}), "ceiling", "PuppetDB
        Jetty threads", "", "") or label_replace(max by (host) (puppet_server_jvm_file_descriptors{state="used"}
        / ignoring(state) puppet_server_jvm_file_descriptors{state="max"}), "ceiling",
        "Puppetserver file descriptors", "", "") or label_replace(max by (host) ((puppet_server_jruby_pool_size
        - puppet_server_jruby_free) / puppet_server_jruby_pool_size), "ceiling", "JRuby
        pool", "", "") or label_replace(max by (host) (label_replace(puppet_node_count{environment="all"}
        / ignoring(environment) puppet_license_entitled_nodes, "host", "$1", "instance",
        "([^:]+).*")), "ceiling", "Licence nodes", "", "")
  - name: pdctng-capacity_forecast
    rules:
    - alert: PdctngFilesystemFillingSoon
      expr: puppet_infra_filesystem_seconds_to_full < (4 * 86400)
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.device }} on {{ $labels.instance }} is forecast full
          within 4 days"
        description: "{{ $labels.device }} on {{ $labels.instance }} reaches zero
          bytes free in under 4 days at the rate it has been filling over the forecast
          window. This is a projection from a slope, not a measurement: it assumes
          the rate continues and it disappears on its own if the filling stops. Find
          what is growing before adding disk. `df -h`, then `du -x` down the mount,
          and `Time To Filesystem Full` on the Puppet Infrastructure Health board
          for the shape of the trend. **The slope is a thirty-day fit read at a daily
          step**, so this catches a volume that has been taking a gigabyte a day for
          a fortnight and does not catch one going from 90% free to zero in an afternoon.
          PdctngInfraFilesystemLow and PdctngInfraFilesystemCritical are what catch
          that, at 15% and 5%. A runaway log is a different problem from a volume
          the estate has outgrown. A full disk on a PE primary can stop catalogue
          compilation, and it truncates the next backup without failing it, which
          only PuppetBackupShrank catches afterwards; on the monitoring node it stops
          Prometheus, which retention-sizing.md prices. Deleting the wrong thing under
          pressure is the risk in the fix, so identify the growth first."
    - record: puppet_infra_filesystem_seconds_to_full
      expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}
        / -deriv(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}[2592000s:1d]))
        and deriv(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}[2592000s:1d])
        < 0
    - record: puppet_license_seconds_to_exhaustion
      expr: ((puppet_license_entitled_nodes - ignoring(environment) puppet_node_count{environment="all"})
        / ignoring(environment) deriv(puppet_node_count{environment="all"}[2592000s:1d]))
        and ignoring(environment) deriv(puppet_node_count{environment="all"}[2592000s:1d])
        > 0
    - record: puppet_server_jruby_seconds_to_exhaustion
      expr: "(puppet_server_jruby_free / -deriv(puppet_server_jruby_free[21600s]))
        and deriv(puppet_server_jruby_free[21600s]) < 0"
  - name: pdctng-capacity_level
    rules:
    - alert: PdctngInfraFilesystemCritical
      expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}
        / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"})
        * 100 < 5
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: "{{ $labels.device }} on {{ $labels.instance }} has under 5% free"
        description: '{{ $labels.device }} on {{ $labels.instance }} is down to {{
          $value | printf "%.1f" }}% free and is not necessarily filling, which is
          why the forecast alert beside this one may be silent: it exists only while
          a volume is heading somewhere on a thirty-day slope, so a volume that arrived
          and stopped is invisible to it and so is one that filled in an afternoon.
          This is the measurement rather than the projection. A full disk on a PE
          primary stops catalogue compilation, and it truncates the next backup without
          failing it, which only PuppetBackupShrank catches afterwards; on the monitoring
          node it stops Prometheus. `df -h` then `du -x` down the mount, and read
          `Fullest Filesystem` on Puppet Infrastructure Health for which host and
          `Time To Filesystem Full` for whether it is still moving. Deleting the wrong
          thing under pressure is the risk in the fix, so identify what is using the
          space first.'
    - alert: PdctngInfraFilesystemLow
      expr: ((node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}
        / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"})
        * 100 < 15) and ((node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}
        / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"})
        * 100 >= 5)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.device }} on {{ $labels.instance }} has under 15% free"
        description: '{{ $labels.device }} on {{ $labels.instance }} has {{ $value
          | printf "%.1f" }}% free. **This is a level and not a trend**, so it fires
          on a volume that has been full for a year as readily as on one that filled
          last night; the forecast alert beside it is the one that says which. This
          is the reading a TAM engagement check writes down by hand, and it is here
          because two of the four real ones scored against this module found exactly
          this shape and nothing in pdctng could see it. Nothing is broken yet. Find
          what is using the space now, while the choice of what to delete is still
          yours: `df -h`, then `du -x` down the mount, then `Fullest Filesystem` on
          Puppet Infrastructure Health for the shape over the window. Escalates to
          PdctngInfraFilesystemCritical at 5%.'
  - name: pdctng-certificates
    rules:
    - alert: PdctngCaExpiringCritical
      expr: "(puppet_ca_expires_epoch - time()) / 86400 < 30"
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: CA certificate {{ $labels.subject }} expires in under 30 days
        description: '{{ $value | printf "%.0f" }} days left on {{ $labels.subject
          }}, and nothing here gets fixed tonight. When it expires, every certificate
          it signed stops authenticating in the same minute: agents, PuppetDB, the
          orchestrator and PE''s own console and SAML certificates. Replacing a PE
          CA means reissuing every certificate in the estate, so it is scheduled work
          with a change window rather than an afternoon, and at under 30 days you
          are already inside the lead time the warning horizon exists to give you.
          Open PDCTNG Certificate Authority and read the CA Certificates table first:
          PE ships a root and an intermediate, and which of them is the clock decides
          how big the work is. Then get the window booked. Every week of waiting comes
          off the one you have left to do it in.'
    - alert: PdctngCaExpiringSoon
      expr: "(puppet_ca_expires_epoch - time()) / 86400 < 90"
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: CA certificate {{ $labels.subject }} expires in under 90 days
        description: '{{ $value | printf "%.0f" }} days left on {{ $labels.subject
          }}, which is a planning horizon rather than a deadline: this fires at 90
          days because replacing a CA is a project with lead time, and pe_status_check
          flags the CA on the same horizon. When it expires, every certificate it
          signed stops authenticating at once, and replacing a PE CA means reissuing
          every certificate in the estate. Nothing is broken today, which is the point
          of firing this early. Open PDCTNG Certificate Authority and read the CA
          Certificates table: PE ships a root and an intermediate, and which of them
          is the clock decides how big the work is. Book the change while the date
          is still yours to choose. Left alone the same fact returns as PdctngCaExpiringCritical
          at 30 days, by which point the choice of window has gone.'
    - alert: PdctngCertRenewalAssumptionStale
      expr: puppet_agent_cert_renewal_interval_seconds != (30 * 86400)
      for: 6h
      labels:
        severity: warning
      annotations:
        summary: Boards assume a different certificate renewal interval than the estate
          uses
        description: Nothing is broken. The picture is mis-scaled. The estate renews
          at {{ $value | humanizeDuration }} before expiry and the boards are cut
          for 30 days, so the Expiry Spread on PDCTNG Certificate Authority draws
          its healthy band in the wrong place. Where the estate's real interval is
          the shorter of the two, certificates in normal rotation fall into buckets
          the board colours as a problem. Where it is the longer, a certificate whose
          renewal was due and did not happen still lands in an uncoloured bucket and
          reads as healthy, which is the direction that costs you something. Set pdctng::dashboards::thresholds.cert_renewal_interval_days
          to what puppet_agent_cert_renewal_interval_seconds reports, and its alerts
          twin with it. No certificate changes either way, so it keeps until morning.
    - alert: PdctngCertWarningAboveRenewal
      expr: puppet_agent_cert_renewal_interval_seconds <= (14 * 86400)
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: Certificate warning threshold is at or above the renewal interval
        description: Agents renew their own certificates at {{ $value | humanizeDuration
          }} before expiry, and the certificate warning is configured at or above
          that. Every healthy node will trip the warning once per certificate cycle,
          so the alert stops meaning renewal has failed and starts meaning renewal
          is working. Set pdctng::alerts::thresholds.cert_expiry_warning_days below
          the renewal interval, and its dashboards twin with it.
    - alert: PdctngCrlUpdateOverdue
      expr: puppet_crl_next_update_epoch - time() < 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: CRL from {{ $labels.issuer }} has expired
        description: 'The CRL from {{ $labels.issuer }} is past its nextUpdate, and
          anything enforcing CRLs rejects every certificate checked against a stale
          one. That presents as the whole estate failing to authenticate at once rather
          than as one broken node. Confirm the reading is current before anything
          else: `sudo pdctng-ctl status` on the primary lists a failing `ca` collector
          by name, and CRL Freshness on PDCTNG Certificate Authority says how long
          since each CRL was regenerated. The file is `/etc/puppetlabs/puppetserver/ca/ca_crl.pem`
          unless `crl_file` has been moved. If the reading is real this is CA-side
          work on the primary, not something an agent can fix, and it is the classic
          PE support ticket: raise it at the hour it fires, because the failure is
          fleet-wide and does not degrade gently.'
    - alert: PdctngCrlUpdateSoon
      expr: "(puppet_crl_next_update_epoch - time()) / 86400 < 30"
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: CRL from {{ $labels.issuer }} stops being valid in under 30 days
        description: 'The CRL from {{ $labels.issuer }} stops being valid in {{ $value
          | printf "%.0f" }} days. The CA normally regenerates it long before this,
          so the alert firing at all says the refresh has stopped rather than that
          the deadline is close. Nothing is broken yet. Once it lapses, anything enforcing
          CRLs rejects every certificate checked against it, which presents as the
          whole estate failing to authenticate at once. Rule out a stuck reading first,
          because it is the cheap answer: `sudo pdctng-ctl status` on the primary
          lists a failing `ca` collector by name. Then read CRL Freshness on PDCTNG
          Certificate Authority, where an old last refresh beside recent revocations
          is the machinery having stopped. It fires at 30 days out, so it keeps until
          morning. Left alone it becomes PdctngCrlUpdateOverdue.'
    - alert: PuppetCertificateExpiringCritical
      expr: "(puppet_certificate_expires_epoch - time()) / 86400 < 7"
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: Puppet certificate for {{ $labels.node }} is about to expire
        description: '{{ $labels.node }} has {{ $value | printf "%.0f" }} days of
          certificate left and nothing has renewed it. On expiry the node stops authenticating
          to the primary altogether: it stops reporting, so it surfaces as a silent
          node rather than as a failure, and it does not come back on its own. Check
          whether it should still exist first. PDCTNG Triage lists it under Cert renewal
          overdue and puppet_report_timestamp_epoch says when it last reported. A
          node quiet for weeks is usually a destroyed VM whose certificate was never
          cleaned, and `puppetserver ca clean` closes it. A live one wants fixing
          before the date, because afterwards the work starts on the node itself rather
          than on the primary, one host at a time.'
    - alert: PuppetCertificateNotRenewing
      expr: "(puppet_certificate_expires_epoch - time()) / 86400 < 14"
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: Puppet certificate for {{ $labels.node }} is not being renewed
        description: 'The node has stopped renewing; the certificate itself is fine.
          {{ $value | printf "%.0f" }} days left on {{ $labels.node }}, and an auto-renewing
          estate should have replaced it once it came inside its renewal interval,
          which is already past. Check the node before you touch the certificate:
          puppet_report_timestamp_epoch says when it last reported and PDCTNG Node
          Detail carries its run history. A node that went quiet weeks ago is usually
          a machine destroyed without being purged, and `puppetserver ca clean` closes
          it rather than a reissue. One still reporting and not renewing wants the
          Auto-Renewal tile on PDCTNG Certificate Authority, which reads Off where
          the CA will not issue renewals at all. Where nothing auto-renews, renew
          it by hand. Ignored, PuppetCertificateExpiringCritical follows at 7 days.'
  - name: pdctng-cis
    rules:
    - alert: PdctngCisScanStale
      expr: "(time() - puppet_cis_scan_timestamp_epoch) / 86400 > 7"
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: CIS scan for {{ $labels.node }} is {{ $value | printf "%.0f" }} days
          old
        description: This node's compliance score is 7 days stale and every score
          panel draws it exactly like one taken this morning. Nothing is broken; the
          risk is quoting a number to an auditor that the scanner stopped confirming.
          Check the export first. `Last Successful Export` on the CIS board being
          recent means the export is fine and the scanner has stopped for this node
          alone. Then find the node's row in `<scm_dir>/score_data/Summary_Report_API.csv`
          and confirm it is still in scope for scanning in SCM. `Scan Freshness` on
          the same board is the twenty stalest scans, so anything else in this state
          shows up beside it. Left alone it escalates to PdctngCisScanStopped at 30
          days, by which point the score is fiction.
    - alert: PdctngCisScanStopped
      expr: "(time() - puppet_cis_scan_timestamp_epoch) / 86400 > 30"
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: CIS scan for {{ $labels.node }} stopped {{ $value | printf "%.0f"
          }} days ago
        description: '30 days without a scan means the scanner has stopped for this
          node rather than that a run was missed. Its score is fiction, and it still
          counts: the CIS board''s score panels draw it like a current one and Essential
          Eight folds it into its averages and counts with no freshness test at all,
          so any compliance claim covering this node is unevidenced. Check `Last Successful
          Export` on the CIS board first, because recent means the export is healthy
          and the fault is scanning rather than collection. Since R278 there is no
          per-node fact to inspect, so the next look is SCM itself: whether the node
          is still in scope, and whether its last scan errored. `<scm_dir>/score_data/Summary_Report_API.csv`
          holds the row the score came from. Rescanning is cheap and reversible. Leaving
          it means the node keeps a score 30 days old, and only `Oldest Scan` and
          `Scan Freshness` on the CIS board will say so.'
    - alert: PdctngCisScoreWithoutScanTime
      expr: puppet_cis_compliance_score unless on(node) puppet_cis_scan_timestamp_epoch
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: CIS score for {{ $labels.node }} has no scan timestamp
        description: 'This node has a CIS score with no scan timestamp behind it,
          so it is invisible to PdctngCisScanStale and PdctngCisScanStopped, absent
          from `Oldest Scan` and `Scan Freshness`, and can sit on a wrong score indefinitely
          with nothing to catch it. `Unscanned Nodes` does not count it either, because
          it does have a score. The raw timestamp the export delivered rides on the
          score series itself as a `scan_timestamp` label, so read that first: the
          freshness series is dropped when that string is present but cannot be parsed
          into an epoch. A row carrying no node name or no scan timestamp at all is
          skipped by the reader outright and produces no score, so that is not this.
          `<scm_dir>/score_data/Summary_Report_API.csv` has the row, under `Scan Timestamp`.
          The fix is SCM side, the scan has to produce a timestamp the export carries.
          Until then treat this node''s score as unaged and leave it out of any claim.'
  - name: pdctng-collectors
    rules:
    - alert: PdctngCollectorFailing
      expr: puppet_exporter_collector_consecutive_failures > 3
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: pdctng collector {{ $labels.collector }} is failing
        description: '{{ $value }} consecutive failed runs, more than the 3 this rule
          tolerates. Everything {{ $labels.collector }} feeds is stale and nothing
          else says so: the exporter is up, the scrape succeeds, and its families
          keep serving their last good values. Start on the exporter host with `curl
          -sf http://localhost:10050/healthz | jq ''.collectors''`, which gives this
          collector''s `last_error` and `last_success_age_seconds`; the untruncated
          message is in `journalctl -u pdctng | grep "collector ''{{ $labels.collector
          }}''"`. Usually the thing it reads is down or its credentials have expired,
          so fix that and not the exporter. Restarting pdctng resets the counter and
          fixes nothing. "Collector Freshness, and What Goes Stale With It" on PDCTNG
          Internal Operations names the boards that go stale with it. Left alone,
          PdctngCollectorStale escalates this to critical.'
    - alert: PdctngCollectorServingStaleData
      expr: puppet_exporter_collector_partial_failures > 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: pdctng collector {{ $labels.collector }} has served stale data for
          an hour
        description: "{{ $value }} subject(s) {{ $labels.collector }} could not refresh,
          so it is publishing last-known-good for them. It records a clean run either
          way, so `puppet_exporter_collector_success` reads 1 and the Collectors Failing
          tiles read zero: nothing else in the estate shows this. Deliberate for a
          blip, wrong after an hour. Six collectors do it and the subject differs:
          deploy_impact counts environments, code_deploys unresolved code_ids, cd4pe_events
          impact analyses, deploy_observed deployments it could not observe, orchestrator
          its two queries, and classifier node groups whose membership fetch failed.
          `journalctl -u pdctng | grep last-known-good` names the collector and the
          count each cycle, and the warning above it usually names the query that
          failed. Fix the upstream it reads. Nothing breaks while you wait, but a
          stale deploy time is the kind of number people act on without checking its
          age."
    - alert: PdctngCollectorSlow
      expr: puppet_exporter_collector_duration_seconds > puppet_exporter_collector_interval_seconds
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: pdctng collector {{ $labels.collector }} took longer than its own
          run interval
        description: '{{ $labels.collector }}''s last run took longer than the interval
          it is scheduled at, so it cannot keep pace, and because collectors run in
          sequence every one after it in the cycle starts late too. The risk in waiting
          is the watchdog. It stamps progress as each collector completes, so a collector
          that stops completing for longer than three times `pdctng::polling_interval`
          withholds the ping and systemd restarts the daemon under you. "Slowest Collectors"
          and "Poll Cycle Load" on PDCTNG Internal Operations say whether it is one
          collector or the cycle. The cheap move is a longer cadence: seven collectors
          take their own parameter (`pdctng::postgres_interval` and siblings), the
          rest run at `pdctng::polling_interval`. Narrowing what it queries is the
          real fix.'
    - alert: PdctngCollectorStale
      expr: "(time() - puppet_exporter_collector_last_success_timestamp) > (3 * puppet_exporter_collector_interval_seconds)"
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: pdctng collector {{ $labels.collector }} has missed three of its
          own run intervals
        description: '{{ $labels.collector }} has not completed a run in 3 of its
          own scheduled intervals, so every board reading it shows a plausible figure
          that is at least that old rather than No data. A collector that has never
          succeeded since the daemon started reads identically, because `puppet_exporter_collector_last_success_timestamp`
          is 0 until the first success: the "Never Succeeded" panel on PDCTNG Internal
          Operations separates the two, and that is the difference between a broken
          dependency and a misconfiguration. `curl -s http://localhost:10050/healthz
          | jq ''.collectors''` carries `last_error` and the failure streak; `journalctl
          -u pdctng` has the full exception. The threshold is a multiple of this collector''s
          own cadence rather than a clock time, so read it against that collector''s
          `puppet_exporter_collector_interval_seconds` and not against the clock:
          the same rule trips in minutes on a five-minute collector and takes days
          on a daily one.'
    - alert: PdctngSourceFailing
      expr: puppet_exporter_source_consecutive_failures > 3
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: pdctng cannot read {{ $labels.host }} for the {{ $labels.collector
          }} collector
        description: '{{ $value }} consecutive failed reads of {{ $labels.host }},
          more than the 3 this rule tolerates. The {{ $labels.collector }} collector
          itself is fine and still publishing for the hosts it can reach, so `puppet_exporter_collector_success`
          reads 1 and `/healthz` calls the collector healthy: neither of them carries
          per-source state. The Collectors Failing tiles do count it, because they
          add failing sources to failing collectors, but they cannot say which host.
          "Source Freshness, Per Host Behind Each Collector" on PDCTNG Internal Operations
          can, and `journalctl -u pdctng | grep {{ $labels.host }}` has the error.
          Only the service collectors read several hosts, so this is status_service,
          puppetdb_internals or postgres, and the usual causes are the host being
          down, a firewall, or an expired certificate. What that host contributes
          is missing from the numbers, so they under-report rather than being wrong.
          PdctngSourceStale escalates it.'
    - alert: PdctngSourceStale
      expr: time() - puppet_exporter_source_last_success_timestamp > 21600
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: pdctng has not read {{ $labels.host }} for {{ $labels.collector }}
          in 21600s
        description: '{{ $labels.host }} has not been read successfully for the {{
          $labels.collector }} collector in over 21600 seconds and is not coming back
          on its own. Everything that host contributes has been missing from the estate''s
          figures for that long: infrastructure service state, PuppetDB internals
          or Postgres, depending on the collector. The collector reports healthy throughout,
          because it completes on the hosts it can reach. "Source Freshness, Per Host
          Behind Each Collector" on PDCTNG Internal Operations shows the age per host,
          and `journalctl -u pdctng | grep {{ $labels.host }}` has the error. Check
          the host is up, that the primary can reach its port, and that the certificate
          it presents has not expired. A `puppet_exporter_source_last_success_timestamp`
          of 0 means it has never been read at all, which is configuration rather
          than an outage.'
  - name: pdctng-custom_metrics
    rules:
    - alert: PdctngCustomMetricPollStopped
      expr: "(time() - puppet_custom_metric_poll_timestamp_epoch) > 600"
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: pdctng custom metric poll loop on {{ $labels.instance }} has stopped
        description: 'Every custom metric on {{ $labels.instance }} is frozen at its
          last value and still being scraped, so Prometheus is recording numbers that
          stopped moving {{ $value | printf "%.0f" }} seconds ago. The loop ticks
          about once a second when healthy; past 600 the poll thread has died. It
          is a secondary thread, so the process is not torn down and the fleet metrics
          are unaffected. This rule is the only thing that says otherwise. Read the
          cause while you are there, because that one line is the only record of it:
          `journalctl -u pdctng | grep ''custom metric poll thread died''` has the
          exception class and backtrace. Then `systemctl restart pdctng`; the thread
          does not come back on its own. The restart costs an empty fleet store until
          the next poll completes, seconds on a small estate and longer at scale.
          `sudo pdctng-ctl status` confirms the metrics are polling again.'
  - name: pdctng-delivery_health
    rules:
    - alert: PdctngDeploymentStuck
      expr: puppet_delivery_deploy_in_flight_seconds > 3600
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.deployment }} has been deploying for {{ $value | humanizeDuration
          }}"
        description: 'A CD4PE deployment has been in flight far longer than this estate''s
          deployments take, and nothing else reports it: the Code Releases board shows
          it as `running` rather than failed, so the Failed tile reads zero. Check
          whether it is retrying rather than hung -- "Start moved" on that board counts
          how many times CD4PE has revised its start time, and a deployment well above
          the one move a healthy one makes is looping. A deployment stuck this long
          is usually holding an ephemeral `rolling_deployment_<id>` environment open,
          which is its own problem: catalogue compilation pins module load paths into
          those environments and breaks fleet-wide when one is removed underneath
          it (R196).'
    - record: puppet_delivery_change_failure_ratio
      expr: (count by (alias) (puppet_deploy_end_epoch and on(deployment) puppet_deploy_info{state!="done",state!="cancelled"})
        or on(alias) (count by (alias) (puppet_deploy_end_epoch) * 0)) / count by
        (alias) (puppet_deploy_end_epoch)
    - record: puppet_delivery_code_changes_7d
      expr: changes(puppet_code_deploy_timestamp_epoch[7d])
    - record: puppet_delivery_deploy_duration_seconds
      expr: puppet_deploy_end_epoch - on(deployment, alias) puppet_deploy_start_epoch
    - record: puppet_delivery_deploy_in_flight_seconds
      expr: (time() - min_over_time(puppet_deploy_start_epoch[21600s])) and on(deployment)
        (puppet_deploy_info{state=~"running|queued|pending"} == 1)
    - record: puppet_delivery_deploy_start_moves
      expr: changes(puppet_deploy_start_epoch[21600s]) and on(deployment) (puppet_deploy_info
        == 1)
    - record: puppet_delivery_fleet_converged_ratio
      expr: sum by (environment, alias) (puppet_code_deploy_status_nodes) / on(environment,
        alias) max by (environment, alias) (puppet_node_count{environment!="all"})
    - record: puppet_delivery_pipeline_deploys_7d
      expr: count by (environment, alias) ((puppet_deploy_start_epoch > time() - 604800)
        * on(deployment, alias) group_left(environment) puppet_deploy_info)
    - record: puppet_delivery_seconds_unconverged
      expr: (time() - puppet_code_deploy_timestamp_epoch) and on(environment, alias)
        (sum by (environment, alias) (puppet_code_deploy_status_nodes) / on(environment,
        alias) max by (environment, alias) (puppet_node_count{environment!="all"})
        < 1)
  - name: pdctng-exporter
    rules:
    - alert: PdctngExporterDown
      expr: up{job="puppet"} == 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: pdctng exporter on {{ $labels.instance }} is not responding
        description: 'Prometheus cannot scrape the pdctng exporter on {{ $labels.instance
          }}, so every Puppet metric is stale and every rule reading pdctng''s own
          series has gone quiet rather than firing: they all key on series that are
          no longer arriving. Certificate expiry, licence headroom and fleet failure
          are unwatched until this comes back. On the exporter host run `systemctl
          status pdctng`, then `curl -s http://localhost:10050/healthz | jq`. Use
          `-s` and not `-sf` here: the daemon answers 200 when serving and 503 while
          starting or wedged, and `-f` throws away the body in exactly the case you
          are trying to read. If the daemon answers locally it is the network or the
          scrape config, and Prometheus''s own Targets page separates them: `connection
          refused` is a firewall or a moved `listen_port`, `context deadline exceeded`
          is a DROP rule, `lookup ... no such host` is DNS. If it is restarting instead,
          `journalctl -u pdctng | grep -E ''thread died|watchdog withholding''` says
          why.'
    - alert: PdctngMetricsStale
      expr: time() - puppet_exporter_last_scrape_timestamp > 1800
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: pdctng data on {{ $labels.instance }} is over 1800s old
        description: 'The poll loop last completed a cycle {{ $value | humanizeDuration
          }} ago, past the 1800 this rule allows. The stamp is taken at cycle end,
          so this says the loop has not come round, not that any one collector is
          individually overdue. The scrape still succeeds, so the boards read as current.
          Compare 1800 against `pdctng::polling_interval` first: an estate that widened
          the interval wants this widened with it. If the daemon is still running
          at this age the watchdog is still seeing collectors complete, which means
          the cycle is running long rather than wedged. "Poll Cycle Load" and "Slowest
          Collectors" on PDCTNG Internal Operations name the offender, and PdctngCollectorSlow
          usually fires alongside. `curl -s http://localhost:10050/healthz | jq .poll`
          gives the same age plus the last cycle''s duration; do not add `-f`, because
          the daemon is answering 503 at this age and you would get nothing back.
          Nothing recovers on its own while a collector is holding the cycle open.'
    - alert: PdctngPluginLoadFailed
      expr: puppet_exporter_plugin_load_failures > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: pdctng on {{ $labels.instance }} refused {{ $value | printf "%.0f"
          }} plugin collector(s)
        description: '{{ $value | printf "%.0f" }} plugin collector(s) on {{ $labels.instance
          }} were refused at startup, so they publish nothing and read exactly like
          plugins nobody installed: no collector, no failures, no row in the freshness
          table, and the boards fed by their families sit empty. "Which Plugins Were
          Refused, And Why" on PDCTNG Internal Operations carries the plugin and the
          reason, as does `puppet_exporter_plugin_load_failed`. `Errno::EACCES` is
          mode or ownership and is the common one: the plugin directory is root-owned
          and pdctng runs as `pe-puppet`, so 0644 root-owned is the shape that works.
          `SyntaxError` is Ruby nobody ran `ruby -c` over. Loading is decided once
          at boot, so any fix needs `systemctl restart pdctng` before it counts. Nothing
          else is degraded by this and it will not clear on its own, so it can wait
          for the morning.'
    - alert: PdctngRenderSectionFailing
      expr: puppet_exporter_render_sections_failed > 0
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: pdctng on {{ $labels.instance }} cannot render {{ $value | printf
          "%.0f" }} metric section(s)
        description: '{{ $value | printf "%.0f" }} metric section(s) on {{ $labels.instance
          }} raised during the render, so their families are absent from every scrape
          and the panels reading them show No data. The rest of the response is intact,
          which is why nothing else is complaining, and absent families cannot alert,
          so nothing else will tell you either. `puppet_exporter_render_section_failed`
          names the sections; `journalctl -u pdctng | grep ''render section''` has
          the exception class and message for each. Usually one node reporting a fact
          value the renderer did not expect, so the fix is upstream of pdctng and
          identifying the node is the work. A collector plugin publishing into the
          reserved `puppet_*` namespace lands here too, under its own name. A restart
          will not help: the same data renders the same way.'
    - alert: PdctngScrapeConfigMissing
      expr: absent(up{job="puppet"})
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: Prometheus has no pdctng scrape target at all
        description: 'There is no `up` series for the pdctng job at all, so Prometheus
          has no target for it and every rule keyed on pdctng''s own series is inert
          rather than quiet, PdctngExporterDown included. The estate is unmonitored
          by pdctng and nothing else will say so. This is almost never the exporter.
          Compare `pdctng::alerts::prometheus_job` on the Prometheus node against
          `pdctng::scrape_job_name` on the primary and against the job name in the
          scrape config itself. All three default to `puppet`, so one of them has
          been changed and the other two not. If they agree, the scrape config was
          never applied on the Prometheus side: its own Targets page will have no
          pdctng job listed. There is nothing to restart and nothing degrades further
          while you work on it, but you stay blind until it is fixed.'
    - alert: PdctngStoreAtCeiling
      expr: puppet_exporter_store_at_ceiling == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: pdctng node store on {{ $labels.alias }} is at its store ceiling
        description: 'The node store on {{ $labels.alias }} has shed every report
          metric it can and is now refusing new nodes, so the fleet view is missing
          a stable set of machines and the oldest nodes have lost their per-node report
          detail. Nodes already held keep updating, which is why the counts look plausible
          rather than broken. "Store Memory" on PDCTNG Internal Operations shows the
          estimate against the ceiling and "Nodes Refused Since Restart" counts what
          has been turned away, which is `puppet_exporter_store_refused_total`. The
          tile called "Ceiling Used" beside them is a different number, nodes against
          the recommended node ceiling, so do not read it for this. Check the node
          count first: pruning only runs after a cycle that succeeded against every
          configured PuppetDB, so one dead server (PdctngPuppetDBServerDown) means
          departed nodes never leave the store. If the count is genuinely right, raise
          `pdctng::store_ceiling_mb`. That bounds the store and not the process, so
          size the host from `puppet_exporter_process_rss_bytes` before going far.'
  - name: pdctng-fleet
    rules:
    - alert: PdctngAlertExclusionsHigh
      expr: puppet_nodes_alert_excluded > ignoring(environment) 0.2 * puppet_node_count{environment="all"}
      for: 6h
      labels:
        severity: warning
      annotations:
        summary: Over a fifth of the estate is set to alert level none
        description: '{{ $value }} nodes are at alert level none, more than 0.2 of
          the estate, so they count in no fleet ratio and page for nothing. Nothing
          is broken yet. The cost is that PdctngFleetCatastrophe now divides by a
          denominator this much smaller, so an outage confined to the silenced set
          cannot reach its threshold and nobody is told. Triage names them under "Which
          nodes are deliberately silent": the count is Excluded From Alerting, the
          list is Which Nodes, And At What Level. The level comes from pdctng::node_alert_level
          and lands in facts.d/pdctng_alert_level.yaml on the node, so a stale one
          is usually a rebuild nobody tidied up. Clear it with pdctng::node_alert_level::level:
          ~ at a more specific Hiera layer. Expect the hosts you unsilence to start
          paging, which is the point, so work through them in batches.'
    - alert: PdctngFleetCatastrophe
      expr: count by (alias) (puppet_status{state="failed"} == 1 unless on (node)
        puppet_node_alert_level{level="none"}) >= 50 and count by (alias) (puppet_status{state="failed"}
        == 1 unless on (node) puppet_node_alert_level{level="none"}) / on(alias) (puppet_node_lifecycle{state="active"}
        - ignoring(state) puppet_nodes_alert_excluded) >= 0.1
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: 'Fleet-wide Puppet incident: {{ $value }} nodes are failing their
          run'
        description: 'One incident, not {{ $value }} unrelated failures. At least
          50 nodes and 0.1 of the active fleet are failing their run at once, and
          that shape is a single event: a bad code deploy, an expired CA, or puppetserver
          on the floor. Take the cheap reads in order. Code Releases for a deploy
          landing on the same minute, Certificate Authority for expiry, Puppetserver
          for the service, then Convergence for which nodes and since when. A deploy
          is the one thing you can undo, so roll the environment back before debugging
          it. While this fires PdctngNodeRunFailingHigh is inhibited, so per-node
          pages going quiet is not evidence those nodes recovered; critical-tier hosts
          still page. The denominator is PuppetDB active nodes minus the level-none
          set, so an estate that never deactivates dead nodes under-reports. Tune
          fleet_catastrophe_nodes and fleet_catastrophe_ratio under pdctng::alerts::thresholds.'
    - alert: PdctngNoNodesReporting
      expr: puppet_node_count{environment="all"} == 0
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: pdctng knows about zero nodes
        description: 'Every board that counts nodes is empty and every rule that divides
          by the fleet has gone quiet with it, so this and PdctngNodeCountDropped
          are what is left to tell you. The puppetserver, PuppetDB, CA and collector
          rules do not touch the node store and are still live, which is usually where
          the cause is. The nodes may be running Puppet perfectly well: this says
          the exporter cannot see them. The store is built from PuppetDB reports where
          latest_report? = true, so read puppet_node_lifecycle{state="active"} first.
          Nodes there while puppet_node_count sits at zero means PuppetDB kept its
          nodes and lost their reports, usually a report-ttl purge or a restore. Both
          at zero means PuppetDB is empty or puppetdb_urls points at the wrong one,
          and puppet_exporter_server_up at zero means it is not answering at all.
          Then curl -sf http://localhost:10050/healthz | jq and journalctl -u pdctng
          -n 100. docs/troubleshooting.md has the mTLS curl for querying PuppetDB
          by hand, which is what settles it. Restarting the daemon changes nothing:
          it rebuilds the store from the same query.'
    - alert: PdctngNodeCountDropped
      expr: puppet_node_count{environment="all"} < 0.9 * (puppet_node_count{environment="all"}
        offset 1h)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: Puppet node count dropped below 0.9 of an hour ago
        description: 'Confirm the nodes have gone before believing any fleet number.
          puppet_node_count counts nodes with a latest report in PuppetDB, so it falls
          the same way for a decommission, a report-ttl purge and a prune that should
          not have happened. The journal separates them: journalctl -u pdctng | grep
          -E "pruned|pruning with". A "pruned N departed node(s)" line is written
          on every prune, ordinary ones included, so it dates the drop rather than
          explaining it. The line that explains it is "pruning with N server(s) excluded",
          which is the exporter dropping nodes it should have kept because a PuppetDB
          server has been failing longer than the grace; puppet_exporter_server_up
          names which. puppet_node_lifecycle{state="active"} says what PuppetDB still
          holds, and it comes off the nodes endpoint rather than reports, so it survives
          a reports-only loss. Left alone, licence headroom and the alert-exclusion
          ratio measure against a fleet this much smaller, so the estate reads healthier
          than it is. Fixing the server repopulates the store on the next poll.'
    - alert: PdctngNodeRunFailingCritical
      expr: puppet_status{state="failed"} == 1 and on (node) puppet_node_alert_level{level="critical"}
        == 1
      for: 45m
      labels:
        severity: critical
      annotations:
        summary: "{{ $labels.node }} has been failing its Puppet run for 45 minutes"
        description: '{{ $labels.node }} has been failing its Puppet run for 45 minutes,
          and somebody tiered it critical, so its own failure is meant to be the outage.
          Whatever the failing resource guards has not been applied and everything
          downstream of it was skipped, so drift stands there and anything deployed
          in that window has not fully landed. This tier keeps paging through a fleet-wide
          incident, where the high tier is inhibited. Start on Node Detail for this
          node: Run Failed leads, and Why The Last Run Failed carries the message
          Puppet logged and the class chain, where pdctng::dashboard_server::enable_changes_datasource
          is on. Then sudo puppet agent -t and read the middle of the output, not
          the last line: a run that fails on one resource still ends with "Applied
          catalog", and everything depending on it is skipped rather than reported
          again, so the first failure is the only one worth chasing. If the agent
          is not running at all, this is really silence: puppet_status serves the
          last report for ever, so one failure followed by a dead agent holds this
          rule open too, and PdctngNodeSilentCritical is what separates them. A knowingly
          broken host wants pdctng::node_alert_level::level: none rather than a silenced
          rule.'
    - alert: PdctngNodeRunFailingHigh
      expr: puppet_status{state="failed"} == 1 and on (node) puppet_node_alert_level{level="high"}
        == 1
      for: 45m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.node }} has been failing its Puppet run for 45 minutes"
        description: '{{ $labels.node }} has been failing its Puppet run for 45 minutes,
          which is longer than a run interval, so this is not one unlucky run: it
          is a node that will not fix itself. What the failure blocks stays unapplied
          and everything depending on it was skipped, so drift stands there and anything
          deployed in that window has not fully landed, which is a morning job unless
          the host is one you would have tiered critical. Node Detail for this node
          has the last run, and Why The Last Run Failed carries the logged message
          where the changes datasource is on. Then sudo puppet agent -t and read the
          middle of the output, not the last line, since a run that fails on one resource
          still ends with "Applied catalog" and the skipped resources are not reported
          again. The inhibition pdctng ships holds this down only while PdctngFleetCatastrophe
          is actually firing, and that needs both its node count and its ratio, so
          one arriving on its own means no catastrophe is firing, not that nothing
          wider is wrong.'
    - alert: PdctngNodeSilentCritical
      expr: (time() - puppet_report_timestamp_epoch) > 3600 and on (node) puppet_node_alert_level{level="critical"}
        == 1
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: "{{ $labels.node }} has not reported to Puppet in over an hour"
        description: '{{ $labels.node }} is tiered critical and has stopped reporting
          altogether, which is a different fault from failing. puppet_status keeps
          serving whatever it last reported, so every board and every run-failure
          rule goes on showing this node as it was on its last report, indefinitely,
          and this rule is the only thing that pages on it. Rule the certificate out
          from Prometheus before touching the host, where puppet_server is configured
          and those series exist: puppet_certificate_expires_epoch{node="{{ $labels.node
          }}"} in the past means renewal failed and Puppet dropped it. puppet_nodes_without_certificate
          carries no node label, so above zero it tells you a certificate was cleaned
          for some host PuppetDB still holds, not that it was this one. Otherwise
          it is a stopped or disabled agent, or the machine is off. A genuinely decommissioned
          host wants pdctng::node_alert_level::level: none, which takes it out of
          this rule and the fleet ratios; left as it is, this pages until the node
          drops out of the exporter''s store.'
    - alert: PdctngNodeSilentHigh
      expr: (time() - puppet_report_timestamp_epoch) > 3600 and on (node) puppet_node_alert_level{level="high"}
        == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.node }} has not reported to Puppet in over an hour"
        description: '{{ $labels.node }} has gone silent rather than failed, and silence
          is a stopped or disabled agent, an expired certificate, or a machine that
          is off. It is not a failing run: puppet_status serves this node''s last
          report for ever, so no run-failure rule will ever flag it and Convergence''s
          Silent tile is the only other place it shows up. Check puppet_certificate_expires_epoch{node="{{
          $labels.node }}"} first, where puppet_server is configured and that series
          exists, because an expired certificate drops a node out of Puppet without
          a failure anywhere, then the agent service on the host. Nothing on it has
          converged since it went quiet, so it is drifting from what the repository
          says while reading as fine everywhere else, which is why this is worth clearing
          rather than muting. A decommissioned host wants pdctng::node_alert_level::level:
          none, which takes it out of this rule and the fleet ratios at once.'
  - name: pdctng-license
    rules:
    - alert: PdctngLicenseExpiringCritical
      expr: "(puppet_license_expires_epoch - time()) / 86400 < 14"
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: PE licence expires in under 14 days
        description: '{{ $value | printf "%.0f" }} days left on the suite licence,
          and renewal is procurement rather than an operator task, so this does not
          close tonight. The warning fired at 60 days and this is what is left of
          that runway. Confirm what pdctng is reading before escalating: Licence Expires
          In on PDCTNG TAM Check carries the time left, and the Licence table beside
          it names the customer, product and licence type, all decoded from `/etc/puppetlabs/suite-license.lic`
          on the primary. If a replacement licence has already been installed, this
          number will not move until the pdctng service is restarted, so rule that
          out before waking anybody. Otherwise it is a purchase order and whoever
          owns the Puppet contract, today rather than next week.'
    - alert: PdctngLicenseExpiringSoon
      expr: "(puppet_license_expires_epoch - time()) / 86400 < 60"
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: PE licence expires in under 60 days
        description: '{{ $value | printf "%.0f" }} days left on the suite licence.
          Nothing is broken and none of the fix is an operator''s job, which is why
          this fires at 60 days rather than at the certificate horizons: a purchase
          order moves at procurement''s pace. Start on PDCTNG TAM Check. Licence Expires
          In carries the time left, the Licence table names the customer and product
          on the licence as PE reads it, and Ceiling Reached puts a date on when the
          fleet crosses its entitled node count, which is the same procurement conversation
          and cheaper had once. Then hand it to whoever owns the Puppet contract.
          Left to PdctngLicenseExpiringCritical at 14 days, the renewal is being chased
          rather than scheduled.'
    - alert: PdctngLicenseNearLimit
      expr: sum by (alias) (puppet_node_count{environment="all"}) / on(alias) puppet_license_entitled_nodes
        > 0.9
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: PE estate is at {{ $value | humanizePercentage }} of its licensed
          node count
        description: 'The estate on {{ $labels.alias }} is over 0.9 of the node ceiling
          its licence entitles, now at {{ $value | humanizePercentage }}. Nothing
          stops working and nothing needs doing tonight. The useful number is the
          date rather than the percentage: Ceiling Reached on PDCTNG TAM Check projects
          when the fleet crosses the ceiling from its recent growth, and Fleet Against
          The Licensed Ceiling draws the crossing instead of computing it. Ceiling
          Reached showing nothing means the fleet is not growing, which is a real
          answer. The count is every node PuppetDB holds, so check PDCTNG Fleet Churn''s
          Deactivated tile before treating it as growth: decommissioned nodes nobody
          purged still sit in the numerator. Growth from here is a licensing conversation
          and it is cheaper before the ceiling than after.'
    - alert: PdctngLicenseOverLimit
      expr: sum by (alias) (puppet_node_count{environment="all"}) / on(alias) puppet_license_entitled_nodes
        > 1
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: PE estate on {{ $labels.alias }} exceeds its licensed node count
        description: "{{ $labels.alias }} is running more nodes than its suite licence
          entitles. Nothing broke to make this fire: it is two numbers crossing, the
          fleet count and the ceiling read out of the licence file, so the only lever
          is commercial and the work is business hours. Check the count is real first.
          The numerator is every node PuppetDB holds, so PDCTNG Fleet Churn's Deactivated
          tile says how much of the overage is decommissioned hardware nobody purged,
          and purging those out of PuppetDB is the cheap correction and the only one
          available tonight. If the nodes are genuinely there, this is a true-up with
          whoever owns the Puppet contract, and it is a smaller conversation the sooner
          it is had."
  - name: pdctng-pe
    rules:
    - alert: GrafanaBelowSupportedFloor
      expr: puppet_infrastructure_config{grafana_version=~"([0-9]|10)\\..*"}
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: Grafana {{ $labels.grafana_version }} on {{ $labels.grafana_server
          }} is below the supported floor
        description: 'Panels on this Grafana can be wrong without looking wrong. The
          boards are generated at schemaVersion 39, which is Grafana 11, and their
          panel options are validated against 11, so on an older major a panel renders
          as an empty box or drops options silently. Nothing else is at risk: Prometheus
          keeps scraping and every other alert keeps firing, so this can wait for
          the morning. The running version is in this alert''s own summary, read off
          Grafana''s `/api/health` by the health probe that `pdctng::grafana_url`
          points at; curl the same endpoint afterwards to confirm the upgrade landed.
          There is no upper bound, so 11 or newer is fine. `pdctng::dashboard_server::grafana_version`
          is `installed` by default and leaves the upgrade to your patching run, which
          is the risky half. On an apt host that has had a Grafana 13 install succeed
          before, the package''s post-install script cannot move its bundled plugins
          into a directory that is no longer empty, dpkg leaves grafana in `iF`, and
          the old version carries on serving while every dashboard, the datasource
          and the provisioning config quietly stop being managed. Read "The whole
          dashboard node stops being managed after a patch run" in docs/troubleshooting.md
          before you upgrade, not after.'
    - alert: PcpNodesDisconnected
      expr: puppet_pcp_disconnected_nodes > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "{{ $value }} node(s) have been off the PCP broker for 15 minutes"
        description: 'These nodes cannot be given a task, a plan or an orchestrated
          deployment, and nothing else says so: they may still be running Puppet and
          reporting healthily. `puppet_pcp_node_disconnected` names each one and PDCTNG
          Triage lists them as work. The naming is capped at 200 per scrape with the
          remainder counted in `puppet_pcp_node_disconnected_overflow`, so on a big
          outage the list can be shorter than the number, but the number itself stays
          right. Disconnected is a set difference, what PuppetDB knows minus what
          the orchestrator can reach, so a decommissioned host drops out on its own
          and a node that has never run pxp-agent counts as disconnected. On a named
          node, `systemctl status pxp-agent` and `journalctl -u pxp-agent --since
          -1h`; no such unit is as likely an answer as a stopped one. Restarting pxp-agent
          is cheap and reversible, which makes it the first move on a single node.
          A large count points at the broker instead, so read Fleet Disconnected against
          Fleet Connected on the Orchestrator board: forty out of forty-five is an
          outage and forty out of four thousand is a Tuesday. Doing nothing costs
          you the ability to drive the estate during an incident, which is when you
          find out.'
    - alert: PdctngInfraUnitFailed
      expr: node_systemd_unit_state{state="failed",pe_infrastructure="true"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.name }} has failed on {{ $labels.instance }}"
        description: 'A systemd unit on a Puppet infrastructure host has been failed
          for fifteen minutes, so this is the platform being broken rather than being
          slow. Start with `systemctl status {{ $labels.name }}` and `journalctl -u
          {{ $labels.name }} --since -1h` on the host named in {{ $labels.instance
          }}; a restart is the cheap first move and the journal says whether it will
          hold. PDCTNG Puppet Infrastructure Health lists every failed unit under
          Which Unit, On Which Host. What it costs depends entirely on the unit: a
          failed `pe-puppetserver` is an outage and every board goes stale with it,
          while a unit like `puppet_postgres-metrics.service` can sit failed for days
          doing nothing visible. The fifteen minutes has already ruled out a unit
          its own `Restart=` picked back up; what it does not rule out is a oneshot
          on a timer, which reports failed between runs until the next one succeeds.
          Needs the systemd collector, which `pdctng::node_exporter::collectors_enable`
          leaves off by default, so an estate that has not added `systemd` to it gets
          silence rather than health.'
    - alert: PeInfraNodeInNoop
      expr: puppet_noop == 1 and on(node) label_replace(puppet_infra_platform, "node",
        "$1", "host", "(.+)")
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: PE infrastructure server {{ $labels.node }} is running in noop
        description: 'Puppet is changing nothing on a PE infrastructure server, and
          every other board will keep showing the estate as converged while it drifts.
          An hour of it is a configuration state rather than a run that happened to
          be noop, so somebody set it. Check `puppet_noop_pending` for this node first:
          it says whether the last noop run found something to change and did not
          change it, which is the difference between a quiet safety measure and an
          hour of accumulated drift. Noop With Changes on the Convergence board draws
          the same family, though that tile is a fleet count and here you want the
          series for this node. Then on the node, `sudo puppet config print noop --section
          agent` and the `noop` setting in `/etc/puppetlabs/puppet/puppet.conf`; a
          config that reads false means the noop is coming from the run rather than
          from the file, and you want to know which before you go looking for someone
          to blame. Clearing it is a one-line change with a large blast radius: the
          next enforcing run applies everything the noop runs have been reporting,
          on an infrastructure server, so read the pending changes before you flip
          it rather than after. pe_status_check S0003.'
    - alert: PeUpgradeOverdue
      expr: time() - puppet_pe_last_upgrade_epoch > 365 * 86400
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: PE on {{ $labels.alias }} has not been upgraded in over a year
        description: 'Nothing is broken and nothing breaks today. This install is
          more than 365 days past its last upgrade, dated from the mtime of the pe_build
          file, so it is outside the support window for the newest agent versions
          and carries every defect fixed since, security ones included. pe_status_check
          S0034 draws the line in the same place. The metric only exists on a PE primary,
          so this is naming the install itself and not a compiler. `puppet_infrastructure_config`
          carries the running version in its `pe_version` label; check that against
          what Puppet currently supports. Plan the upgrade properly rather than fitting
          it into an afternoon: it wants a maintenance window and a rollback path,
          and it starts with a backup you have confirmed exists (`puppet_backup_last_epoch`,
          and `PuppetBackupNeverRun` if none ever has). The cost of deferring again
          is that every release you fall further behind makes the eventual upgrade
          longer and less well trodden.'
    - alert: TooManyEnvironments
      expr: count by (alias) (count by (alias, environment) (puppet_code_id)) > 100
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: PE {{ $labels.alias }} is serving {{ $value }} environments
        description: Nothing is broken; the cost is disk, file sync time and compile
          latency. Every environment is a full checkout of the control repo plus its
          share of puppetserver's caches, and 100 is where pe_status_check S0038 draws
          the line. What this counts is every environment nodes have reported under,
          from `puppet_code_id`, and that includes CD4PE's ephemeral `rolling_deployment_*`
          and `*_cdpe_ia_*` branches. The Environments board filters those out of
          its Environments Deployed tile and this rule does not, so the two numbers
          will disagree and a rolling deployment in flight can be what tipped you
          over; Ephemeral Environments Seen says how much of the total is that churn.
          `puppet_environment_last_deploy_epoch` is the other half, one series per
          directory under `pdctng::code_dir`, so it sees abandoned branches no node
          reports under at all. Environments With No Nodes and Environments By Age
          are where to read node counts per environment, off `puppet_node_count` and
          not off code_id, which does not populate on an estate that is not using
          Code Manager. Usually this is control-repo feature branches nobody deleted,
          and deleting the branch is what removes the environment, so check the node
          count before deleting one out from under a node.
  - name: pdctng-postgres
    rules:
    - alert: PostgresConnectionsNearLimit
      expr: sum without (db) (puppet_postgres_backends) / puppet_postgres_max_connections
        > 0.9
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: PostgreSQL on {{ $labels.host }} is near its connection limit
        description: 'Open connections on {{ $labels.host }} are past 0.9 of max_connections.
          Nothing is broken yet, and at the ceiling it will be: postgres refuses new
          connections rather than queueing them, so PuppetDB''s pools and anything
          else on this database fail outright instead of slowing down. The "Connection
          Saturation" tile on the PuppetDB board draws the same expression this rule
          fires on. For which database is holding them, read the backends for this
          host rather than summing across the estate: `sum by (db) (puppet_postgres_backends{host="<this
          host>"})`. Then connect to pe-puppetdb and query `pg_stat_activity`, which
          is cluster-wide, filtering on datname; look for sessions idle in transaction
          before raising anything. Raising max_connections is not free either. It
          needs a postgres restart, so PuppetDB and everything else on that database
          lose their connections for the duration, which belongs in a window and not
          at 3am. pe_status_check S0029 watches the same ratio, and the default here
          is its threshold.'
    - alert: PostgresDeadTuplesAccumulating
      expr: puppet_postgres_table_tuples{state="dead"} / ignoring(state) puppet_postgres_table_tuples{state="live"}
        > 0.2 and ignoring(state) puppet_postgres_table_tuples{state="live"} > 100000
      for: 2h
      labels:
        severity: warning
      annotations:
        summary: Dead tuples are accumulating in {{ $labels.table }} on {{ $labels.host
          }}
        description: 'Dead tuples in {{ $labels.table }} on {{ $labels.host }} have
          been past 0.2 of live rows for two hours, on a table with more than 100000
          live rows, so autovacuum is not keeping up with it. Nothing has failed.
          What follows is every query on that table getting slower as the bloat grows,
          and on PuppetDB that arrives as command processing falling behind (PuppetDBQueueGrowing)
          rather than as a database complaint. Read "Dead Tuples by Table" and "Autovacuum
          by Table" together on the PuppetDB board; they sit next to each other for
          exactly this. A dead count climbing while that table''s vacuum rate is flat
          at zero is autovacuum having given up on this table, which is a per-table
          or cost-limit setting rather than a global one. A plain VACUUM is safe and
          online. VACUUM FULL is not: it takes an exclusive lock and rewrites the
          table, so PuppetDB stops for as long as it runs.'
  - name: pdctng-puppetdb
    rules:
    - alert: PdctngPuppetDBErrorRate
      expr: rate(puppet_exporter_server_errors_total[15m]) > 0.1
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: pdctng is seeing query errors against {{ $labels.server }}
        description: Queries against {{ $labels.server }} have been failing at over
          0.1 a second for half an hour, so the data pdctng reads through that server
          is lagging while the exporter as a whole still looks healthy. Run `sudo
          pdctng-ctl preflight` first. It only reads, and it checks that the daemon's
          certificate has not expired and is not close to renewal, plus whether each
          configured endpoint answers from this host. Then `journalctl -u pdctng -n
          100 --no-pager` for the error itself. A busy PuppetDB produces the same
          errors an expiring certificate does, so if preflight is clean, read Queue
          Depth and Pool Wait on the PuppetDB board next. Internal Operations carries
          "PuppetDB Servers", which shows how long since each configured server last
          answered, and "Collector Freshness, and What Goes Stale With It", which
          maps each collector to the boards that read it. It can escalate to PdctngPuppetDBServerDown,
          and then that server contributes nothing at all.
    - alert: PdctngPuppetDBServerDown
      expr: puppet_exporter_server_up == 0
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: pdctng cannot query PuppetDB server {{ $labels.server }}
        description: 'pdctng has not been able to query {{ $labels.server }} for fifteen
          minutes. With several entries in `puppetdb_urls` the exporter fails over
          to the others and no board goes blank, which is the whole reason this rule
          exists: nothing else in the estate reports it. On a single-server config
          everything pdctng reads from PuppetDB is now stale, which is most of the
          fleet view. Start with `sudo pdctng-ctl preflight`, which only reads and
          says whether this host can reach each configured endpoint and whether the
          daemon''s certificate is still good. An unreachable endpoint is a warning
          there and does not fail the run, so read the output rather than the exit
          code. Then `systemctl status pe-puppetdb` on the server itself. The "PuppetDB
          Servers" panel on Internal Operations has the per-server view. Leaving it
          costs more than staleness: node pruning stalls on a dead server, so departed
          nodes accumulate in the store and it can reach its ceiling (PdctngStoreAtCeiling).'
    - alert: PuppetDBCommandsDiscarded
      expr: increase(puppet_db_commands_discarded_total[30m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: PuppetDB on {{ $labels.host }} is discarding commands
        description: 'Commands on {{ $labels.host }} were given up on after exhausting
          their retries, so the reports or catalogues they carried were never stored
          and nothing else will say so. The nodes that sent them go on reporting success,
          so convergence and freshness read better on every board than the estate
          actually is. `/var/log/puppetlabs/puppetdb/puppetdb.log` carries the command
          and the exception that killed it, and that is the first read. Then fork
          on the PuppetDB board: "Waiting on Postgres" above zero is the database,
          "Heap Used" near max is the JVM. "Awaiting Retry" is the leading indicator
          and will have been climbing before this. The lost commands do not come back,
          but once the cause is fixed a `sudo puppet agent -t` on an affected node
          puts that node''s current facts and catalogue back; the reports that were
          dropped stay gone.'
    - alert: PuppetDBCommandsFatal
      expr: increase(puppet_db_commands_fatal_total[30m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: PuppetDB on {{ $labels.host }} has fatally failed commands
        description: 'Commands on {{ $labels.host }} were rejected outright rather
          than retried, so their reports or catalogues are gone and the nodes that
          sent them go on reporting success. Same data loss as PuppetDBCommandsDiscarded,
          different cause: no retry means the submission itself was refused, usually
          malformed or oversized, or a storage-layer error underneath it. `/var/log/puppetlabs/puppetdb/puppetdb.log`
          on that host carries the command and the reason, and unlike a busy-database
          fault the log line is usually enough on its own. Check whether it is one
          certname repeating, which points at that node''s report or catalogue, or
          many, which points at the database. A malformed submission fails the same
          way every run, so a single bad node can stay unrepresented on every board
          indefinitely while looking perfectly healthy.'
    - alert: PuppetDBHeapDeadZone
      expr: puppet_db_jvm_heap_bytes{area="init"} > 31 * 1024 * 1024 * 1024 and puppet_db_jvm_heap_bytes{area="init"}
        < 48 * 1024 * 1024 * 1024
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: PuppetDB heap on {{ $labels.host }} is in the compressed-oops dead
          zone
        description: Nothing is failing, and this is a daylight job rather than a
          3am one. The heap on {{ $labels.host }} is set between 31GB and 48GB, where
          the JVM has switched compressed object pointers off but the extra address
          space has not paid for itself. It holds less usable memory than a 31GB heap
          would, so you are buying RAM PuppetDB cannot use and PuppetDBHeapPressure
          is closer than the number suggests. The setting is `puppet_enterprise::profile::puppetdb::java_args`.
          **`What The Tuner Would Change` on TAM Check draws the recommended value
          beside the current one** where `pdctng::enable_tune_metrics` is on, which
          is the reading without a shell; otherwise `puppet infrastructure tune --compare`
          on the primary prints the same comparison. Drop it to 31GB, or past 48GB
          only if PuppetDB genuinely needs more. Changing it and running Puppet restarts
          pe-puppetdb either way, so ingestion pauses and the queue drains afterwards.
          pe_status_check S0026/S0027.
    - alert: PuppetDBHeapPressure
      expr: puppet_db_jvm_heap_bytes{area="used"} / ignoring(area) puppet_db_jvm_heap_bytes{area="max"}
        > 0.9
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: PuppetDB heap on {{ $labels.host }} is over 0.9 of max
        description: Used heap on {{ $labels.host }} has been over 0.9 of max for
          fifteen minutes. Still that high after a collection is the OOM precursor
          rather than a busy moment. PuppetDB under memory pressure slows command
          processing first, so expect PuppetDBQueueGrowing next and stale data on
          everything reading PuppetDB after that. On the PuppetDB board, "GC Time
          Fraction" moves before the "Heap Used" tile does, and the shape to look
          for on "Heap" is the sawtooth floor rising, each collection recovering less
          than the last, which is a leak rather than a busy hour. "Where The CPU Goes"
          separates a JVM doing work from one collecting garbage. Restarting pe-puppetdb
          clears the heap, but on an undersized heap that only buys time. The durable
          fix is `puppet_enterprise::profile::puppetdb::java_args`, sized from `puppet
          infrastructure tune --compare` rather than guessed.
    - alert: PuppetDBQueueGrowing
      expr: puppet_db_queue_depth > 10 and delta(puppet_db_queue_depth[15m]) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: PuppetDB command queue on {{ $labels.host }} is growing
        description: 'The stockpile queue on {{ $labels.host }} is past 10 and still
          climbing after fifteen minutes, so command processing is losing to arrivals.
          It normally drains to zero between agent runs, and a burst that drains needs
          nothing. Everything PuppetDB serves gets staler the longer this lasts, and
          whatever is stopping the queue draining is usually what starts commands
          retrying and then being discarded, which is data loss nothing else reports
          (PuppetDBCommandsDiscarded). "Waiting on Postgres" on the PuppetDB board
          is the discriminator: above zero PuppetDB is waiting on the database, so
          read "Dead Tuple Ratio" and "Connection Saturation" next; at zero the database
          is keeping up, so read "Heap Used" and "GC Time Fraction" instead. "Commands
          In and Out" draws the Seen against Processed gap, which is the backlog forming.'
    - alert: PuppetDBReplicaSyncStale
      expr: puppet_db_ha_last_sync_age_seconds > 900
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: PuppetDB replica sync on {{ $labels.host }} is stale
        description: 'Nothing is broken while the primary is up, which is what makes
          this one easy to leave. The last successful HA sync on {{ $labels.host }}
          was {{ $value | humanizeDuration }} ago against a normal cadence of about
          two minutes, so promoting this replica today would promote that much missing
          report and catalogue history, and the promotion will not put it back. On
          the PuppetDB board, "Replica Sync" draws sync duration per entity with sync
          failures beside it: duration climbing while failures stay flat is a replica
          falling behind, failures above zero is one that cannot keep up at all. `/var/log/puppetlabs/puppetdb/puppetdb.log`
          on the replica has the reason. Only fires on PE HA estates. The metric is
          absent elsewhere, so a blank "Replica Sync Age" tile means no replica rather
          than a healthy one.'
  - name: pdctng-puppetserver
    rules:
    - alert: PuppetserverHeapDeadZone
      expr: puppet_server_jvm_heap_bytes{area="init"} > 31 * 1024 * 1024 * 1024 and
        puppet_server_jvm_heap_bytes{area="init"} < 48 * 1024 * 1024 * 1024
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: Puppetserver heap on {{ $labels.host }} is in the compressed-oops
          dead zone
        description: 'Nothing is failing; this host is quietly wasting memory. The
          heap is set between 31GB and 48GB. Somewhere around 32GB the JVM turns off
          compressed object pointers, so every reference starts costing eight bytes
          instead of four, and until the extra address space has paid for that a heap
          in this band holds less usable memory than a 31GB one would. `puppet_server_jvm_heap_bytes{area="init"}`
          is the configured size, because PE sets Xms equal to Xmx, and the Heap panel
          on the Puppetserver board draws it against used and max. The setting is
          `Xmx` and `Xms` in the `java_args` hash on `puppet_enterprise::master::puppetserver`:
          bring it down to 31GB, or past 48GB only where the node genuinely needs
          the address space. **`What The Tuner Would Change` on TAM Check says what
          PE would size it at on this hardware** where `pdctng::enable_tune_metrics`
          is on; otherwise `puppet infrastructure tune --compare` on the primary says
          the same. Applying it restarts puppetserver and drops the in-flight compiles,
          so it is a maintenance window and not a 3am fix.'
    - alert: PuppetserverHeapPressure
      expr: puppet_server_jvm_heap_bytes{area="used"} / ignoring(area) puppet_server_jvm_heap_bytes{area="max"}
        > 0.9
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Puppetserver heap on {{ $labels.host }} is over 0.9 of max
        description: 'Used heap has been over 0.9 of max for fifteen minutes, long
          enough that GC is not reclaiming it and this JVM is heading for an OOM kill.
          When it goes, every agent compiling here fails its run. The Heap panel on
          the Puppetserver board draws the two series the expression divides, `area="used"`
          over `area="max"`. Confirm with the rate of `puppet_server_jvm_gc_time_seconds_total`,
          drawn beside it as GC Time Fraction: climbing GC time against flat throughput
          is memory pressure and not load. `journalctl -u pe-puppetserver` and `/var/log/puppetlabs/puppetserver/puppetserver.log`
          carry the OutOfMemoryError if this has already happened once. Restarting
          pe-puppetserver buys time at the price of the in-flight compiles. It is
          not the fix: that is more heap (`Xmx` in `puppet_enterprise::master::puppetserver`''s
          `java_args`, sized with `puppet infrastructure tune --compare`) or fewer
          JRubies competing for what is there. A heap that refills straight after
          a restart is a leak, not a sizing problem.'
    - alert: PuppetserverJRubyBurstExhaustion
      expr: "(sum_over_time((puppet_server_jruby_free == bool 0)[1h:1m]) >= 2) and
        (max_over_time(puppet_server_jruby_wait_seconds[1h]) > 5)"
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Puppetserver on {{ $labels.host }} is running out of JRubies repeatedly
          without staying out
        description: 'The pool reached zero free interpreters in at least 2 separate
          minutes of the last hour, and the worst wait for one in that hour was over
          5 seconds. Agents are queueing for a compiler and getting one, so nothing
          has failed and no run has been refused, which is why this is a warning and
          why none of the other JRuby rules will have fired: each of them waits for
          the condition to hold, and this one never holds. It is the shape that arrives
          before sustained exhaustion does. Two different faults look the same here,
          a fleet that has outgrown its compilers and a slow leak, so check `puppet_node_count`
          against the same window before touching the pool. Raising `max-active-instances`
          is not free: each JRuby wants heap, an oversized pool trades this for PuppetserverHeapPressure,
          and past 12 PuppetserverJRubyPoolOversized fires because more interpreters
          stop buying throughput. Above that the answer is another compiler. `Free
          and Requested JRubies` and `Wait Against Hold Time` on the Puppetserver
          board carry the shape of it.'
    - alert: PuppetserverJRubyExhausted
      expr: puppet_server_jruby_free == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Puppetserver on {{ $labels.host }} has no free JRuby instances
        description: 'Every catalogue request on this host is waiting for an interpreter
          and has been for five minutes. Agents will start timing out, and a run that
          times out does not happen: those nodes drift until their next successful
          one. Short spikes to zero are normal under load, five minutes solid is not.
          Free and Requested JRubies on the Puppetserver board is where the causes
          separate, read against the Pool Size tile above it. Requested pinned above
          free is a pool that is simply too small for the arrival rate; requested
          no higher than usual with free on the floor means something is holding interpreters
          and not giving them back. Wait Against Hold Time shows queueing and hold
          time together, and Costliest Functions or Costliest Resources says what
          is eating the hold time. Restarting pe-puppetserver clears a stuck pool
          and costs every in-flight compile, so try it once and stop if it comes straight
          back. Real capacity is another compiler and not a wider pool: see PuppetserverJRubyPoolOversized.'
    - alert: PuppetserverJRubyFreeAvgLow
      expr: puppet_server_jruby_free_avg < 0.9
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Puppetserver on {{ $labels.host }} averages less than one free JRuby
        description: 'Free interpreters average below 0.9, so most of the time every
          JRuby is busy and agents queue for one. Nothing is failing yet. This is
          the chronic reading behind the instantaneous PuppetserverJRubyExhausted:
          demand has outgrown the pool rather than spiked, and left alone it arrives
          as PuppetserverJRubyQueueLimit, where agents get 503s and their runs do
          not happen. Free and Requested JRubies on the Puppetserver board shows how
          far requested sits above free, and Where Compile Time Actually Goes says
          whether the answer is more capacity or cheaper catalogues. PuppetserverJRubyBurstExhaustion
          fires first where the pool is already emptying in bursts. Add a compiler
          or make catalogues cheaper. Raising `max-active-instances` past 12 buys
          heap pressure and GC time instead of throughput, which is what PuppetserverJRubyPoolOversized
          is for.'
    - alert: PuppetserverJRubyPoolOversized
      expr: puppet_server_jruby_pool_size > 12
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: Puppetserver on {{ $labels.host }} has more than 12 JRubies configured
        description: 'Nothing is failing; this pool costs more than it returns. `puppet_server_jruby_pool_size`,
          the live pool the status service reports, is above 12, the practical ceiling
          PE support encodes: each extra interpreter holds its own heap and adds GC
          time, so past that point throughput stops improving and heap pressure starts.
          Pool Size on the Puppetserver board is the same number. The setting behind
          it is `jruby-puppet.max-active-instances` in `/etc/puppetlabs/puppetserver/conf.d/pe-puppet-server.conf`,
          normally written by `puppet_enterprise::master::puppetserver`. **`What The
          Tuner Would Change` on TAM Check says what PE would size it at on this hardware**
          where `pdctng::enable_tune_metrics` is on; otherwise `puppet infrastructure
          tune --compare` on the primary says the same. Read Heap and GC Time Fraction
          on the same board before changing it, because a pool this wide on a heap
          nobody grew to match is how PuppetserverHeapPressure arrives. Right-sizing
          restarts puppetserver, so it is a maintenance-window change, and the answer
          to genuine demand is another compiler and not a wider pool here. pe_status_check
          S0045.'
    - alert: PuppetserverJRubyQueueLimit
      expr: increase(puppet_server_jruby_queue_limit_hits_total[15m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Puppetserver on {{ $labels.host }} is turning agents away
        description: 'Agents were turned away with 503s and those Puppet runs did
          not happen. The nodes affected are drifting now and stay drifted until their
          next successful run, which on a compiler still refusing may not come. This
          is the failure PuppetserverJRubyWaitTime and PuppetserverJRubyFreeAvgLow
          warn about, arriving. Agents Refused on the Puppetserver board counts them
          and `puppet_server_jruby_queue_limit_hits_total` is the counter behind it.
          `puppet_puppetserver_max_queued_requests` is the ceiling, but read it carefully:
          it carries no `host` label because it is read from the config on the box
          the exporter runs on, so on a multi-compiler estate it is the primary''s
          number and not this compiler''s. Free and Requested JRubies against the
          Pool Size tile tells a pool that is simply too small for the arrival rate
          from one whose interpreters are not coming back. Restarting pe-puppetserver
          clears a stuck pool at the price of the in-flight compiles; if the refusals
          resume immediately it is capacity, and the answer is another compiler and
          not a deeper queue, which PuppetserverQueueLimitTooHigh explains.'
    - alert: PuppetserverJRubyWaitTime
      expr: puppet_server_jruby_wait_seconds > 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Agent requests on {{ $labels.host }} are queuing for JRubies
        description: 'Requests are queuing for an interpreter: mean wait is {{ $value
          | humanizeDuration }} against a 1 second threshold. Nothing has failed yet,
          and demand already exceeds the pool for part of every minute. This is the
          early warning before PuppetserverJRubyExhausted, and then PuppetserverJRubyQueueLimit,
          where runs start being refused outright and the nodes drift. Wait Against
          Hold Time on the Puppetserver board separates the two causes: wait rising
          with `puppet_server_jruby_borrow_seconds` flat means more agents arriving,
          and hold time rising means catalogues have become more expensive, which
          Where Compile Time Actually Goes then attributes. PuppetserverJRubyBurstExhaustion
          fires where the pool has been reaching zero repeatedly alongside these waits.
          Nothing needs doing tonight, and getting to it in business hours is far
          cheaper than getting to the 503s.'
    - alert: PuppetserverQueueLimitTooHigh
      expr: puppet_puppetserver_max_queued_requests > 150
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: puppetserver max-queued-requests is {{ $value }} on {{ $labels.alias
          }}
        description: "`max-queued-requests` is above 150, which PE support treats
          as the practical maximum, and a queue that deep adds no capacity. A request
          joining the back of it has usually timed out at the agent before a JRuby
          frees up, so the setting converts a fast rejection into a slow one and hides
          the JRuby shortage underneath. The setting itself breaks nothing; what it
          is masking may well be. Free and Requested JRubies and Wait Against Hold
          Time on the Puppetserver board carry the two numbers to read first, `puppet_server_jruby_free_avg`
          and `puppet_server_jruby_wait_seconds`, because lowering the limit makes
          refusals appear at once, which looks worse and is more honest. The value
          is `jruby-puppet.max-queued-requests` in `/etc/puppetlabs/puppetserver/conf.d/pe-puppet-server.conf`,
          read from the config on the box the exporter runs on and carrying no `host`
          label, so on a multi-compiler estate this is the primary's ceiling and not
          each compiler's. pe_status_check S0036."
  - name: pdctng-review
    rules:
    - record: puppet_review_subject
      expr: label_replace(sum by (alias) (puppet_status{state="failed"}), "subject",
        "Nodes whose last run failed", "", "") or label_replace(sum by (alias) (puppet_state_overview{state="corrective"}),
        "subject", "Nodes taking corrective change", "", "") or label_replace(count
        by (alias) (puppet_restart_required > 0) or (0 * count by (alias) (puppet_restart_required)),
        "subject", "Nodes awaiting restart", "", "") or label_replace(sum by (alias)
        (puppet_patching_stats{type="nodes_to_patch"}), "subject", "Nodes waiting
        for patches", "", "") or label_replace(count by (alias) (puppet_cis_compliance_score{score_type="base"}
        < 90) or (0 * count by (alias) (puppet_cis_compliance_score{score_type="base"})),
        "subject", "Nodes below the CIS score target", "", "") or label_replace(count
        by (alias) (count by (module, alias) (count by (module, version, alias) (puppet_module_version))
        > 1) or (0 * count by (alias) (puppet_module_version)), "subject", "Modules
        at more than one version", "", "") or label_replace(count by (alias) (puppet_certificate_expires_epoch
        - time() < 14 * 86400) or (0 * count by (alias) (puppet_certificate_expires_epoch)),
        "subject", "Certificates expiring soon", "", "") or label_replace(sum by (alias)
        (puppet_node_lifecycle{state=~"deactivated|expired"}), "subject", "Dead nodes
        not cleaned up", "", "")
  - name: pdctng-scm
    rules:
    - alert: PdctngScmExportFailing
      expr: puppet_scm_export_success == 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: SCM export on {{ $labels.instance }} is failing
        description: 'The CIS export ran and failed, so every `puppet_cis_*` metric
          is frozen at whatever the last good export produced and every board keeps
          drawing those numbers as current. On the CIS board only `Export Failing`
          and `Last Successful Export` say so, and the per-node staleness rules will
          not fire for up to another 7 days, because they age the scan timestamps
          the last good export left behind. The exporter runs inside the daemon (R113/R110),
          so the reason is in the daemon''s own journal and in `scm_export_status.json`
          under `scm_dir`: `journalctl -u pdctng -n 100 | grep -i scm`, and the file''s
          `error_message` field. An HTTP 401 there is the token, an IP restriction,
          or something SCM side rather than anything local. Nothing local is broken
          and this does not need doing at 3am, but every compliance number ages silently
          until it is done.'
    - alert: PdctngScmExportStale
      expr: time() - puppet_scm_export_last_success_timestamp > 172800
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: SCM export on {{ $labels.instance }} has not succeeded in two days
        description: 'No SCM export has succeeded in 172800s. Every CIS score on every
          board is frozen at the last good export and still renders as current. Two
          causes, and they need telling apart: a loop that stopped running reports
          nothing at all, and a loop that has been failing this long reports a failure
          every cycle. `puppet_scm_export_last_run_timestamp` is the discriminator.
          Recent means it is attempting and erroring, and PdctngScmExportFailing should
          be firing beside this; as stale as the success timestamp means the export
          loop is not running. The exporter is a thread inside the daemon, so `sudo
          pdctng-ctl status` ruling the daemon in or out is the first check, and `journalctl
          -u pdctng` carries whatever it last said. Restarting the daemon is the cheap
          reversible step, and an export follows within `scm_export_interval`. The
          threshold is deliberately longer than any sane export schedule so one missed
          run pages nobody.'
  - name: pdctng-service_status
    rules:
    - alert: PuppetInfraServiceError
      expr: puppet_infra_service_up{state="error"} == 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "{{ $labels.component }} on {{ $labels.host }} is in the error state"
        description: 'Trapperkeeper reports the {{ $labels.service }} component {{
          $labels.component }} on {{ $labels.host }} as error rather than running,
          so whatever it backs (catalogue compilation, filesync, the CA, the PCP broker)
          is degraded or down on that host. This is a live fault, not a service still
          coming up. Start with the component''s own status block, `/status/v1/services?level=debug`
          on the port for the service that fired: 8140 puppetserver, 8143 orchestrator,
          4433 console, 8146 patching, 8148 workflow. It is mTLS, so pass the host''s
          own `puppet config print hostcert`, `hostprivkey` and `localcacert`. Then
          `systemctl status` and `journalctl` for the PE unit that owns it. `Which
          Services, And On Which Host` on TAM Check lists everything else out of the
          running state, which separates one faulted component from a fallen host.
          Restarting the PE service clears a stuck component and drops every in-flight
          compile on that host, so on a multi-compiler estate pull it out of the load
          balancer first.'
    - alert: PuppetInfraServiceNotRunning
      expr: puppet_infra_service_up{state!~"running|error"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.component }} on {{ $labels.host }} is stuck in state
          {{ $labels.state }}"
        description: 'The {{ $labels.service }} component {{ $labels.component }}
          on {{ $labels.host }} has sat in state {{ $labels.state }} for fifteen minutes.
          A brief `starting` during a restart is normal and would have cleared before
          this fired; this long means it never came up. `unknown` means the status
          endpoint could not read the component''s state, which is often the endpoint
          rather than the component. Nothing has declared a fault, which is why this
          is a warning and not PuppetInfraServiceError, but the component is not serving.
          Check what it backs before deciding it can wait: on a compiler a stuck `jruby-metrics`
          costs you the JRuby numbers this module reads, where a stuck `server` costs
          catalogues. `/status/v1/services?level=debug` gives the component''s own
          status block, on 8140 for puppetserver, 8143 orchestrator, 4433 console,
          8146 patching, 8148 workflow, and `Which Services, And On Which Host` on
          TAM Check shows whether the rest of that host is up. `journalctl` for the
          PE unit that owns it says why it did not start.'
  - name: pdctng-windows_compat
    rules:
    - record: node_boot_time_seconds
      expr: "(windows_system_boot_time_timestamp_seconds >= 1e9) or (windows_os_time
        - on(instance) group_left() (windows_system_boot_time_timestamp_seconds <
        1e9))"
    - record: node_cpu_seconds_total
      expr: sum without (core) (label_replace(windows_cpu_time_total, "cpu", "$1",
        "core", "(.*)"))
    - record: node_disk_io_time_seconds_total
      expr: sum without (volume) (label_replace(windows_logical_disk_read_seconds_total
        + windows_logical_disk_write_seconds_total, "device", "$1", "volume", "(.*)"))
    - record: node_disk_read_bytes_total
      expr: sum without (volume) (label_replace(windows_logical_disk_read_bytes_total,
        "device", "$1", "volume", "(.*)"))
    - record: node_disk_written_bytes_total
      expr: sum without (volume) (label_replace(windows_logical_disk_write_bytes_total,
        "device", "$1", "volume", "(.*)"))
    - record: node_filesystem_avail_bytes
      expr: sum without (volume) (label_replace(windows_logical_disk_free_bytes, "mountpoint",
        "$1", "volume", "(.*)"))
    - record: node_filesystem_size_bytes
      expr: sum without (volume) (label_replace(windows_logical_disk_size_bytes, "mountpoint",
        "$1", "volume", "(.*)"))
    - record: node_memory_Cached_bytes
      expr: windows_memory_cache_bytes
    - record: node_memory_MemAvailable_bytes
      expr: windows_memory_available_bytes
    - record: node_memory_MemTotal_bytes
      expr: windows_memory_physical_total_bytes
    - record: node_network_receive_bytes_total
      expr: sum without (nic) (label_replace(windows_net_bytes_received_total, "device",
        "$1", "nic", "(.*)"))
    - record: node_network_receive_drop_total
      expr: sum without (nic) (label_replace(windows_net_packets_received_discarded_total,
        "device", "$1", "nic", "(.*)"))
    - record: node_network_receive_errs_total
      expr: sum without (nic) (label_replace(windows_net_packets_received_errors_total,
        "device", "$1", "nic", "(.*)"))
    - record: node_network_transmit_bytes_total
      expr: sum without (nic) (label_replace(windows_net_bytes_sent_total, "device",
        "$1", "nic", "(.*)"))
    - record: node_network_transmit_drop_total
      expr: sum without (nic) (label_replace(windows_net_packets_outbound_discarded_total,
        "device", "$1", "nic", "(.*)"))
    - record: node_network_transmit_errs_total
      expr: sum without (nic) (label_replace(windows_net_packets_outbound_errors_total,
        "device", "$1", "nic", "(.*)"))
    - record: node_uname_info
      expr: label_replace(label_replace(windows_os_info, "sysname", "Windows", "",
        ""), "release", "$1", "version", "(.*)")
