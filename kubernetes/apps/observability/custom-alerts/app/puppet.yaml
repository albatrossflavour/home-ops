---
# Generated by `GET /api/v1/alerts/prometheusrule` from Puppet Observability 0.11.0.
#
# Not managed by Puppet: nothing writes this file in place. Regenerate it
# rather than editing it, or your change is lost the next time somebody does.
# The scrape job these rules name is `puppet`.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pobs-alerts
  labels:
    prometheus: kube-prometheus
    role: alert-rules
  annotations:
    pobs.puppet.com/module-version: 0.11.0
spec:
  groups:
  - name: pobs-backup
    rules:
    - alert: PuppetBackupFailed
      expr: puppet_backup_last_run_success == 0
      for: 5m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: The last PE backup on {{ $labels.alias }} failed
        description: |-
          **What is wrong**
          The last `puppet-backup` run on `{{ $labels.alias }}` logged an error and did not finish.
          **Risk**
          A restore today goes back to the last backup that succeeded, which may be older than the newest artefact suggests: a failed run can still leave a file behind.
          **Severity and why**
          Warning, because the primary is running and nothing is lost until a restore is needed. It waits for working hours.
          **When to act**
          Working hours, and before the next scheduled backup, so the next run does not fail the same way.
          **What to do**
          1. Check: the error. The newest `pe_backup-<stamp>.log` under `/var/log/puppetlabs/pe-backup-tools/` on `{{ $labels.alias }}` names it on a line containing `Puppet (err)`.
          2. Cause: the staging directory is not writable by pe-postgres. The log says so in those words, and names the directory. If it is under a `--dir` other than `/var/puppetlabs/backups`, that directory or a parent is closed to pe-postgres: `sudo -u pe-postgres test -x <dir>` fails. Give it mode 1777, as `/var/puppetlabs/backups` has, or back up to the default directory. If the directory is open, root's `su - pe-postgres` is being refused by PAM; the test and fix are under "puppet-backup create says the staging directory is not writable, and it is" in docs/operate/troubleshooting.md.
          3. Cause: the disk filled. Check free space on the backup directory's filesystem against the size of the last good artefact on the TAM Check board.
          4. Then: rerun with `sudo /opt/puppetlabs/bin/puppet-backup create` and watch it finish.
          The alert clears when a run logs success, on the daemon's next backup read after it.
          **Finding the rest**
          When the failed run ended: `puppet_backup_last_run_end_epoch{alias="{{ $labels.alias }}"}`. How long it ran before failing: `puppet_backup_last_run_duration_seconds{alias="{{ $labels.alias }}"}`. When the newest artefact was written, which may be a partial file: `puppet_backup_last_epoch{alias="{{ $labels.alias }}"}`.
          **Escalate**
          Hand it to the PE administrator with the `Puppet (err)` lines from the log if the cause is not one of the two above.
          **Known noise**
          A run killed by a reboot or an operator logs no error and reads as incomplete rather than failed, so it does not fire this; PuppetBackupStale catches it when the next backup does not arrive.
        where_panel: pobs-tam-check/Last Backup
        where: The "Last Backup" tile on TAM Check, beside how long the run took and
          where its artefact went.
    - alert: PuppetBackupNeverRun
      expr: puppet_backup_artefacts == 0 and on(instance) (time() - puppet_backup_dir_mtime_epoch)
        > 14 * 86400
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: No PE backup artefact has ever landed on {{ $labels.alias }}
        description: |-
          **What is wrong**
          The backup directory on `{{ $labels.alias }}` holds no artefact, and nothing has been written to it or removed from it for 14 days. This primary has not been backed up.
          **Risk**
          There is nothing on this primary to restore from. A loss of the primary is a rebuild from scratch.
          **Severity and why**
          Warning, because nothing is failing and a backup can be taken at any time. It would only be critical if the primary were already lost, and by then this alert is not the one that matters. It waits for working hours.
          **When to act**
          Working hours. Nothing is failing right now, and a backup can be taken at any time.
          **What to do**
          1. Cause: no backup has ever been scheduled. Check `puppet_backup_dir_mtime_epoch{alias="{{ $labels.alias }}"}`; healthy is a recent time, unhealthy is older than 14 days. Run `sudo /opt/puppetlabs/bin/puppet-backup create` on `{{ $labels.alias }}` and watch it complete, then schedule it.
          2. Cause: `puppet-backup create` says the staging directory is not writable by pe-postgres. The directory is fine and root's `su - pe-postgres` is being refused by PAM. The test and the fix are under "puppet-backup create says the staging directory is not writable, and it is" in docs/operate/troubleshooting.md.
          3. Cause: the site backs up to a different path, or artefacts never land on this host. Set `observability::backup_dir` to the real path. If artefacts are written elsewhere entirely, set `observability::enable_backup_metrics` to false.
          The alert clears once an artefact matching `observability::backup_pattern` sits in `observability::backup_dir`, or once the directory's mtime moves. A completed backup clears it on the next scrape.
          **Finding the rest**
          How many artefacts the collector sees: `puppet_backup_artefacts{alias="{{ $labels.alias }}"}`. When the directory last changed: `puppet_backup_dir_mtime_epoch{alias="{{ $labels.alias }}"}`; a site that writes artefacts and moves them away leaves this recent, and this alert needs it over 14 days old. The age the board shows for a primary that has never been backed up is ten years.
          **Escalate**
          Hand it to the PE administrator if `puppet-backup create` fails for a reason other than the PAM case. Give them the command output and the directory listing.
          **Known noise**
          A fresh primary that has not reached its first scheduled backup fires until it does; wait for the schedule or run one by hand. A site that moves artefacts off the primary on write does not trip this, because the directory mtime stays fresh.
        where_panel: pobs-tam-check/Since Last Backup
        where: The "Since Last Backup" tile on TAM Check, which shows how long since
          a backup artefact last landed on the primary.
        thresholds: backup_never_run_days
    - alert: PuppetBackupShrank
      expr: max by (alias) (puppet_backup_last_bytes) < 0.5 * max by (alias) (max_over_time(puppet_backup_last_bytes[30d]))
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: The newest PE backup on {{ $labels.alias }} is under 0.5 of the largest
          in the last thirty days
        description: |-
          **What is wrong**
          The newest backup artefact on `{{ $labels.alias }}` is present and current, and it is less than 0.5 of the largest artefact written in the last thirty days.
          **Risk**
          A tarball truncated by a full disk is the usual shape of this, and a truncated tarball looks complete to everything except its size. A restore from it fails or comes back partial.
          **Severity and why**
          Warning, because a corrupt backup only costs anything when a restore is needed, and the previous artefact is still there. It stays warning because the named harmless case is a fleet decommission, and paging for that is how the rule gets muted. It waits for working hours; a site whose estate never changes size can raise it in its own Hiera.
          **When to act**
          Working hours, today. If a restore is needed before then, use the previous artefact.
          **What to do**
          1. Cause: the fleet shrank. Check whether a large decommission happened since the thirty-day peak; healthy is a known decommission that explains the size, in which case nothing is wrong and the alert clears itself when the old size ages out of the thirty-day window.
          2. Cause: the backup volume filled during the write. Check free space on the backup volume of `{{ $labels.alias }}` and find what filled it; PobsInfraFilesystemLow or PobsInfraFilesystemCritical for the same host says so if it is still full.
          3. Then: free the space and run `sudo /opt/puppetlabs/bin/puppet-backup create` again. Read the new size afterwards; it should return to the previous size.
          The alert clears when a new artefact is at least 0.5 of the thirty-day maximum, or when the old maximum ages out of the window.
          **Finding the rest**
          The size now against the thirty-day peak: `puppet_backup_last_bytes{alias="{{ $labels.alias }}"}` beside `max_over_time(puppet_backup_last_bytes{alias="{{ $labels.alias }}"}[30d])`. When the small artefact was written: `puppet_backup_last_epoch{alias="{{ $labels.alias }}"}`. Widen the time picker past the backup cadence to see the size history.
          **Escalate**
          Hand it to the PE administrator if the fleet did not shrink, the volume was not full, and a fresh backup is still small, because that is a backup that is missing content. Give them the two sizes, the artefact time and the `puppet-backup create` output.
          **Known noise**
          A fleet decommission is the known harmless case and clears itself within thirty days. If an estate changes size often, lower `backup_shrink_ratio` under `observability::alerts::thresholds`.
        where_panel: pobs-tam-check/Newest Backup Size
        where: The "Newest Backup Size" tile on TAM Check, which shows the size of
          the newest backup artefact and its trend once the time picker is wider than
          the backup cadence.
        thresholds: backup_shrink_ratio
    - alert: PuppetBackupStale
      expr: time() - puppet_backup_last_epoch > 8 * 86400
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: The newest PE backup on {{ $labels.alias }} is over 8 days old
        description: |-
          **What is wrong**
          The newest backup artefact on `{{ $labels.alias }}` is more than 8 days old.
          **Risk**
          A restore today loses everything since that artefact: certificates signed, code deployed, classification changed and node data since then.
          **Severity and why**
          Warning, because the primary is running and the gap grows by a day each day, not by an outage. It waits for working hours.
          **When to act**
          Working hours. The default threshold assumes a weekly cadence with a day of margin; a site on a different cadence sets `observability::alerts::thresholds.backup_stale_days` to its own.
          **What to do**
          1. Cause: the glob does not match what the site produces. `observability::backup_pattern` defaults to `*.tgz`, which finds PE's own `pe_backup-<timestamp>.tgz` but not an artefact renamed with `puppet-backup create --name`. Check `puppet_backup_artefacts{alias="{{ $labels.alias }}"}` after a backup; a count that does not move is the mismatch. Fix the pattern to match what the site produces.
          2. Cause: the scheduled backup stopped running. Run `sudo /opt/puppetlabs/bin/puppet-backup create` on `{{ $labels.alias }}` and watch it. A "staging directory is not writable" error is root's `su - pe-postgres` being refused by PAM, with the test and fix under "puppet-backup create says the staging directory is not writable, and it is" in docs/operate/troubleshooting.md.
          3. Then: find out why the scheduled backup stopped, or the alert returns in 8 days.
          4. Last: a backup completing is not proof it is whole. Compare the new artefact's size with the previous one; PuppetBackupShrank fires if it is much smaller.
          The alert clears when an artefact matching the pattern is newer than 8 days. A completed backup clears it on the next scrape.
          **Finding the rest**
          When the newest artefact was written: `puppet_backup_last_epoch{alias="{{ $labels.alias }}"}`. How many artefacts match the pattern: `puppet_backup_artefacts{alias="{{ $labels.alias }}"}`; a count that does not move after a backup is the glob not matching. Whether the directory is changing at all: `puppet_backup_dir_mtime_epoch{alias="{{ $labels.alias }}"}`; recent with a stale `puppet_backup_last_epoch` is artefacts being written under a name the pattern misses, or moved away.
          **Escalate**
          Hand it to the PE administrator if `puppet-backup create` fails for a reason other than the PAM case, or if the schedule is theirs to repair. Give them the command output and the three timestamps above.
          **Known noise**
          A site on a fortnightly or monthly cadence fires every cycle; set `backup_stale_days` under `observability::alerts::thresholds` to the cadence plus a day. A site that moves artefacts off the primary on write reads as stale and needs `observability::backup_dir` pointed at where they land, or `observability::enable_backup_metrics` set to false.
        where_panel: pobs-tam-check/Since Last Backup
        where: The "Since Last Backup" tile on TAM Check, which shows how long since
          a backup artefact last landed on the primary.
        thresholds: backup_stale_days
  - name: pobs-capacity_ceiling
    rules:
    - record: puppet_catalogue_compile_seconds
      expr: sum by (alias, instance) ((puppet_server_http_request_duration_seconds{route="puppet-v3-catalog-/*/"}
        > 0) * increase(puppet_server_http_requests_total{route="puppet-v3-catalog-/*/"}[1h]))
        / sum by (alias, instance) (increase(puppet_server_http_requests_total{route="puppet-v3-catalog-/*/"}[1h])
        and (puppet_server_http_request_duration_seconds{route="puppet-v3-catalog-/*/"}
        > 0)) > 0
    - record: puppet_ceiling_seconds_to_full
      expr: ((1 - puppet_ceiling_utilisation{ceiling=~"Infrastructure filesystem|Infrastructure
        memory|Puppetserver file descriptors|Licence nodes"}) / deriv(puppet_ceiling_utilisation{ceiling=~"Infrastructure
        filesystem|Infrastructure memory|Puppetserver file descriptors|Licence nodes"}[2592000s:1d]))
        and deriv(puppet_ceiling_utilisation{ceiling=~"Infrastructure filesystem|Infrastructure
        memory|Puppetserver file descriptors|Licence nodes"}[2592000s:1d]) > 0
    - record: puppet_ceiling_utilisation
      expr: label_replace(max by (host) (label_replace((node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}
        - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"})
        / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"},
        "host", "$1", "alias", "(.*)")), "ceiling", "Infrastructure filesystem", "",
        "") or label_replace(max by (host) (label_replace((node_memory_MemTotal_bytes{pe_infrastructure="true"}
        - node_memory_MemAvailable_bytes{pe_infrastructure="true"}) / node_memory_MemTotal_bytes{pe_infrastructure="true"},
        "host", "$1", "alias", "(.*)")), "ceiling", "Infrastructure memory", "", "")
        or label_replace(max by (host) (puppet_server_jvm_heap_bytes{area="used"}
        / ignoring(area) puppet_server_jvm_heap_bytes{area="max"}), "ceiling", "Puppetserver
        JVM heap", "", "") or label_replace(max by (host) (puppet_db_jvm_heap_bytes{area="used"}
        / ignoring(area) puppet_db_jvm_heap_bytes{area="max"}), "ceiling", "PuppetDB
        JVM heap", "", "") or label_replace(max by (host) (puppet_orchestrator_jvm_heap_bytes{area="used"}
        / ignoring(area) puppet_orchestrator_jvm_heap_bytes{area="max"}), "ceiling",
        "Orchestrator JVM heap", "", "") or label_replace(sum by (host) (puppet_postgres_backends)
        / on(host) group_left() max by (host) (puppet_postgres_max_connections), "ceiling",
        "Postgres connections", "", "") or label_replace(max by (host) (puppet_db_pool_connections{pool="read",state="active"}
        / ignoring(state) puppet_db_pool_connections{pool="read",state="max"}), "ceiling",
        "PuppetDB read pool", "", "") or label_replace(max by (host) (puppet_db_pool_connections{pool="write",state="active"}
        / ignoring(state) puppet_db_pool_connections{pool="write",state="max"}), "ceiling",
        "PuppetDB write pool", "", "") or label_replace(max by (host) (puppet_db_http_threads{state="busy"}
        / ignoring(state) puppet_db_http_threads{state="max"}), "ceiling", "PuppetDB
        Jetty threads", "", "") or label_replace(max by (host) (puppet_server_jvm_file_descriptors{state="used"}
        / ignoring(state) puppet_server_jvm_file_descriptors{state="max"}), "ceiling",
        "Puppetserver file descriptors", "", "") or label_replace(max by (host) ((puppet_server_jruby_pool_size
        - puppet_server_jruby_free) / puppet_server_jruby_pool_size), "ceiling", "JRuby
        pool", "", "") or label_replace(max by (host) (label_replace(puppet_node_count{environment="all"}
        / ignoring(environment) puppet_license_entitled_nodes, "host", "$1", "instance",
        "([^:]+).*")), "ceiling", "Licence nodes", "", "") or label_replace(max by
        (host) (label_replace(sum by (alias, instance) (1 / (puppet_agent_runinterval_seconds
        > 0)) / (sum by (alias, instance) (puppet_server_jruby_pool_size) / puppet_catalogue_compile_seconds),
        "host", "$1", "instance", "([^:]+).*")), "ceiling", "Compile throughput",
        "", "")
    - record: puppet_orchestrator_job_nodes_max
      expr: max by (alias) (puppet_orchestrator_job_node_count)
    - record: puppet_pe_infrastructure_node
      expr: max by (node) (label_replace(puppet_infra_pe_role, "node", "$1", "host",
        "(.*)")) or max by (node) (label_replace(node_load1{pe_infrastructure="true"}
        * 0 + 1, "node", "$1", "alias", "(.*)"))
  - name: pobs-capacity_forecast
    rules:
    - alert: PobsFilesystemFillingSoon
      expr: puppet_infra_filesystem_seconds_to_full < (4 * 86400)
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $labels.device }} on {{ $labels.instance }} is forecast full
          within 4 days"
        description: |-
          **What is wrong**
          {{ $labels.device }} mounted at {{ $labels.mountpoint }} on {{ $labels.instance }} reaches zero bytes free in under 4 days at the rate it has been filling over the last thirty days, and the forecast has held for an hour. This is a projection from a slope: it assumes the rate continues.
          **Risk**
          A full disk on a PE primary stops catalogue compilation and truncates the next backup without failing it, which only PuppetBackupShrank catches afterwards. On the monitoring node it stops Prometheus.
          **Severity and why**
          Warning, because the volume has days left and the level alerts PobsInfraFilesystemLow and PobsInfraFilesystemCritical page if it gets close before this is worked. It waits for working hours.
          **When to act**
          Within the forecast, so this week. It does not need doing overnight unless the current free space is already near 15%.
          **What to do**
          1. Check: what is growing. On {{ $labels.instance }}, `df -h {{ $labels.mountpoint }}`, then `sudo du -xsh {{ $labels.mountpoint }}/*` and work down the largest directory until you have what is growing. Identify it before deleting anything.
          2. Inferred cause: a runaway, such as a log, a report archive nobody prunes or a leftover dump. Remove or rotate it.
          3. Inferred cause: steady growth the volume has outgrown. Add disk in the next change window.
          Either way: the alert clears on its own once the volume stops losing space over the forecast window, or once the fill stays beyond 4 days away. A fix made today can take days to show, because the slope is fitted over thirty days.
          **Finding the rest**
          The forecast itself: `puppet_infra_filesystem_seconds_to_full{device="{{ $labels.device }}",instance="{{ $labels.instance }}"} / 86400` is days until full. How much is left now: `node_filesystem_avail_bytes{device="{{ $labels.device }}",instance="{{ $labels.instance }}"}`. How fast it moved in the last day: `deriv(node_filesystem_avail_bytes{device="{{ $labels.device }}",instance="{{ $labels.instance }}"}[1d])` is bytes per second, negative while filling; a value much steeper than the long slope is a fill that started recently. `Filesystem Used` on the Puppet Infrastructure Health board has the shape over time.
          **Escalate**
          Hand it to the platform team when the volume needs growing, with the forecast in days and the growth rate. Hand it to the PE administrator when the growth is PE's own data and you are not sure what is safe to prune.
          **Known noise**
          A one-off large write (a restore, a copied archive) inside the forecast window steepens the slope for days after the write has stopped, and the alert clears on its own as the window moves on. A volume that is meant to fill and be rotated wants an Alertmanager silence on its device. Retune `forecast_alert_days` under `observability::alerts::thresholds` if the estate wants more or less warning.
        where_panel: pobs-infrastructure-health/Time To Filesystem Full
        where: The "Time To Filesystem Full" panel on the Puppet Infrastructure Health
          board, which draws how long until each PE infrastructure filesystem reaches
          zero bytes free at its current rate; a line only exists while a volume is
          losing space.
        thresholds: forecast_alert_days, infra_filesystem_free_warning_percent, storage_forecast_window_human
    - record: puppet_infra_filesystem_seconds_to_full
      expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}
        / -deriv(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}[2592000s:1d]))
        and deriv(node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}[2592000s:1d])
        < 0
    - record: puppet_license_seconds_to_exhaustion
      expr: ((puppet_license_entitled_nodes - ignoring(environment) puppet_node_count{environment="all"})
        / ignoring(environment) deriv(puppet_node_count{environment="all"}[2592000s:1d]))
        and ignoring(environment) deriv(puppet_node_count{environment="all"}[2592000s:1d])
        > 0
  - name: pobs-capacity_level
    rules:
    - alert: PobsInfraFilesystemCritical
      expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}
        / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"})
        * 100 < 5
      for: 15m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: "{{ $labels.device }} on {{ $labels.instance }} has under 5% free"
        description: |-
          **What is wrong**
          {{ $labels.device }} mounted at {{ $labels.mountpoint }} on {{ $labels.instance }} has {{ $value | printf "%.1f" }}% free, under 5%, and has for at least fifteen minutes.
          **Risk**
          A full disk on a PE primary stops catalogue compilation, and it truncates the next backup without failing it, which only PuppetBackupShrank catches afterwards. On the monitoring node it stops Prometheus. This is a level, so the volume may have arrived here slowly or in the last hour.
          **Severity and why**
          Critical, because at this level the next large write can take the volume to zero and stop the service on it. It pages. PobsInfraFilesystemLow is the same reading at 15% and waits; Alertmanager holds it down while this fires.
          **When to act**
          Now.
          **What to do**
          1. Check: what is using the space. On {{ $labels.instance }}, `df -h {{ $labels.mountpoint }}` to confirm, then `sudo du -xsh {{ $labels.mountpoint }}/*` and work down the largest directory until you have the thing that is using the space. Identify what it is before deleting anything.
          2. Inferred cause: a runaway file, such as a log, a report archive nobody prunes or a leftover dump. Remove, rotate or move it. Do not delete anything under the PE data directories without knowing what it is; a PostgreSQL data directory looks large because it is meant to.
          3. Inferred cause: steady growth the volume has outgrown. Grow the volume; this is the fix that needs a change window if it means a resize or a reboot.
          Either way: the alert clears on its own once free space is back above 5%. PobsInfraFilesystemLow stays up until it passes 15%.
          **Finding the rest**
          Whether it is still filling: `puppet_infra_filesystem_seconds_to_full{device="{{ $labels.device }}",instance="{{ $labels.instance }}"}` is the seconds until zero bytes free at the rate over the last thirty days, and `Time To Filesystem Full` on the Puppet Infrastructure Health board draws the same series; no result means the volume is flat or rising over that window. How fast it moved in the last day: `deriv(node_filesystem_avail_bytes{device="{{ $labels.device }}",instance="{{ $labels.instance }}"}[1d])` is bytes per second, negative while filling. Which other PE infrastructure volumes are close: `Fullest Filesystem` and `Filesystem Used` on the Puppet Infrastructure Health board.
          **Escalate**
          Hand it to the platform team when the volume needs growing or the host needs more disk, with the `df` output and the growth rate. Hand it to the PE administrator when the space is held by PE's own data (PostgreSQL, reports, the code directory) and you are not sure what is safe to remove.
          **Known noise**
          A backup or nightly job that writes and deletes a large file can dip under the line for less than the fifteen minute `for` and never fires. One that holds the space longer fires every night; move the job's scratch space or raise `infra_filesystem_free_critical_percent` under `observability::alerts::thresholds`. A volume that is deliberately kept near full (a dedicated archive mount) wants an Alertmanager silence on its device.
        where_panel: pobs-infrastructure-health/Filesystem Used
        where: The "Filesystem Used" panel on the Puppet Infrastructure Health board,
          which draws every real filesystem on the PE infrastructure as a fraction
          used, so the shape says whether this one filled slowly or in an afternoon.
        thresholds: infra_filesystem_free_critical_percent, infra_filesystem_free_warning_percent,
          storage_forecast_window_human
    - alert: PobsInfraFilesystemLow
      expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"}
        / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|autofs|nsfs|devtmpfs",pe_infrastructure="true"})
        * 100 < 15
      for: 30m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $labels.device }} on {{ $labels.instance }} has under 15% free"
        description: |-
          **What is wrong**
          {{ $labels.device }} mounted at {{ $labels.mountpoint }} on {{ $labels.instance }} has {{ $value | printf "%.1f" }}% free, under 15%, and has for at least thirty minutes.
          **Risk**
          Nothing is broken yet. Under 5% PobsInfraFilesystemCritical fires, and at zero a PE primary stops compiling catalogues and the monitoring node stops Prometheus. This is a level, so it fires on a volume that has sat here for a year as readily as on one that filled last night.
          **Severity and why**
          Warning, because there is still room and the critical tier at 5% pages before the volume fills. It waits for working hours.
          **When to act**
          Next working day, sooner if the forecast below gives it a date inside the week.
          **What to do**
          1. Check: what is using the space. On {{ $labels.instance }}, `df -h {{ $labels.mountpoint }}`, then `sudo du -xsh {{ $labels.mountpoint }}/*` and work down the largest directory until you have what is using the space.
          2. Inferred cause: a runaway file, such as a log, a report archive nobody prunes or a leftover dump. Remove, rotate or move it once you know what it is.
          3. Inferred cause: steady growth the volume has outgrown. Plan to grow the volume at the next change window, while the choice is still yours.
          Either way: the alert clears on its own once free space is back above 15%.
          **Finding the rest**
          Whether it is still filling and how fast: `puppet_infra_filesystem_seconds_to_full{device="{{ $labels.device }}",instance="{{ $labels.instance }}"}` is the seconds until zero bytes free at the rate over the last thirty days; no result means it is flat or rising over that window. `deriv(node_filesystem_avail_bytes{device="{{ $labels.device }}",instance="{{ $labels.instance }}"}[1d])` is bytes per second over the last day, negative while filling. Which other PE infrastructure volumes are close: `Fullest Filesystem` on the Puppet Infrastructure Health board.
          **Escalate**
          Hand it to the platform team when the volume needs growing, with the `df` output and the growth rate. Hand it to the PE administrator when the space is held by PE's own data and you are not sure what is safe to remove.
          **Known noise**
          A volume built small and sitting just under the line for years fires this permanently. Raise `infra_filesystem_free_warning_percent` under `observability::alerts::thresholds` if that is the estate's normal, or silence the device in Alertmanager. A nightly job that fills and empties a volume for longer than thirty minutes fires every night; move its scratch space.
        where_panel: pobs-infrastructure-health/Filesystem Used
        where: The "Filesystem Used" panel on the Puppet Infrastructure Health board,
          which draws every real filesystem on the PE infrastructure as a fraction
          used over time.
        thresholds: infra_filesystem_free_critical_percent, infra_filesystem_free_warning_percent,
          storage_forecast_window_human
    - alert: PobsInfraMemoryCritical
      expr: (node_memory_MemAvailable_bytes{pe_infrastructure="true"} / node_memory_MemTotal_bytes{pe_infrastructure="true"})
        * 100 < 5
      for: 15m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: "{{ $labels.instance }} has under 5% of its memory available"
        description: |-
          **What is wrong**
          {{ $labels.instance }} has {{ $value | printf "%.1f" }}% of its memory available, under 5%, and has for fifteen minutes. Available already counts page cache the kernel can reclaim, so this is the number that says whether the next allocation succeeds.
          **Risk**
          The OOM killer is the next thing that happens. On a PE primary it reaches whichever JVM is largest, which is often not the one at fault, and that service stops. Most hosts here have no swap, so there is no slow degradation before the kill.
          **Severity and why**
          Critical, because with no swap the step after this is a killed service. It pages. PobsInfraMemoryLow is the same reading at 15% and waits; Alertmanager holds it down while this fires.
          **When to act**
          Now.
          **What to do**
          1. Check: which processes hold the memory. On {{ $labels.instance }}, `free -h` for the shape, then `ps -eo rss,comm --sort=-rss | head` for the largest consumers.
          2. Inferred cause: one process has grown past its normal size. A process well above what it uses on a healthy day is a leak or a runaway; restart it or stop it. Restarting a PE service interrupts agent runs for the duration, so do it in a change window unless the OOM killer is about to do it for you.
          3. Inferred cause: the host is undersized for its JVM tuning. If the largest consumers are the PE JVMs at their configured heaps, growing the VM does not help on its own, because `puppet infrastructure tune` sizes the JVM heaps from host RAM and would hand the extra straight back to them. Grow the VM and retune the heaps together, or reduce the heaps, in a change window.
          Either way: the alert clears on its own once available memory is back above 5%. PobsInfraMemoryLow stays up until it passes 15%.
          **Finding the rest**
          The trend: `node_memory_MemAvailable_bytes{instance="{{ $labels.instance }}"}` over the last day; a steady fall with no change in workload is a leak, a step is a new process or a retune. Whether there is swap to buy time: `node_memory_SwapTotal_bytes{instance="{{ $labels.instance }}"}`, zero on most of this estate. `Memory` on the Puppet Infrastructure Health board draws total against available for each host, and `Memory Used` above it is the current reading.
          **Escalate**
          Hand it to the PE administrator when the consumers are PE JVMs and the heaps need retuning, with the `ps` output and the trend. Hand it to the platform team when the host needs more RAM. Puppet support if a PE JVM is growing past its configured heap.
          **Known noise**
          A nightly job that allocates and frees inside fifteen minutes never fires. One that holds it longer fires every night; move or retime the job, or raise `infra_memory_available_critical_percent` under `observability::alerts::thresholds`.
        where_panel: pobs-infrastructure-health/Memory
        where: The "Memory" panel on the Puppet Infrastructure Health board, which
          draws total against available memory for each PE infrastructure host, so
          the gap between the lines is what is in use and its shape says whether this
          is a leak or a step.
        thresholds: infra_memory_available_critical_percent, infra_memory_available_warning_percent,
          infra_memory_critical_dwell_human
    - alert: PobsInfraMemoryLow
      expr: (node_memory_MemAvailable_bytes{pe_infrastructure="true"} / node_memory_MemTotal_bytes{pe_infrastructure="true"})
        * 100 < 15
      for: 30m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $labels.instance }} has under 15% of its memory available"
        description: |-
          **What is wrong**
          {{ $labels.instance }} has {{ $value | printf "%.1f" }}% of its memory available, under 15%, and has held there for thirty minutes. Available already counts reclaimable page cache.
          **Risk**
          Nothing is broken yet. Under 5% PobsInfraMemoryCritical fires, and after that the OOM killer takes the largest process, on a PE primary a JVM. This is a level, so a host that has been tight for a year fires it as readily as one that started leaking last night.
          **Severity and why**
          Warning, because there is still headroom and the critical tier pages before the OOM killer runs. It waits for working hours.
          **When to act**
          Next working day, sooner if the trend below is falling steadily.
          **What to do**
          1. Check: which processes hold the memory. On {{ $labels.instance }}, `free -h`, then `ps -eo rss,comm --sort=-rss | head` for the largest consumers.
          2. Inferred cause: one process is growing. A steady fall in available memory with no change in workload is a leak; restart the process in a change window and watch whether it climbs again.
          3. Inferred cause: the host is built tight. On a PE host most of the answer is JVM heaps sized by `puppet infrastructure tune` from host RAM, which cannot be stopped and should not be starved. Decide whether to grow the host and retune, reduce the heaps, or move whatever else is on the box, and plan it for a change window.
          Either way: the alert clears on its own once available memory is back above 15%.
          **Finding the rest**
          The trend: `node_memory_MemAvailable_bytes{instance="{{ $labels.instance }}"}` over the last week; a steady fall with no workload change is a leak, flat is a host that was built this tight. `Memory` on the Puppet Infrastructure Health board draws the same series against total for each host.
          **Escalate**
          Hand it to the PE administrator when the heaps need retuning, with the `ps` output and the trend. Hand it to the platform team when the host needs more RAM.
          **Known noise**
          A host built with its heaps sized to leave less than 15% available fires this permanently. Raise `infra_memory_available_warning_percent` under `observability::alerts::thresholds` if that is deliberate. A daily job that holds memory for longer than thirty minutes fires every day; retime it or raise the threshold.
        where_panel: pobs-infrastructure-health/Memory
        where: The "Memory" panel on the Puppet Infrastructure Health board, which
          draws total against available memory for each PE infrastructure host over
          time.
        thresholds: infra_memory_available_critical_percent, infra_memory_available_warning_percent,
          infra_memory_warning_dwell_human
  - name: pobs-certificates
    rules:
    - alert: PobsCaExpiringCritical
      expr: "(puppet_ca_expires_epoch - time()) / 86400 < 30"
      for: 1h
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: CA certificate {{ $labels.subject }} expires in under 30 days
        description: |-
          **What is wrong**
          The CA certificate `{{ $labels.subject }}` has {{ $value | printf "%.0f" }} days left, under 30 days for more than an hour.
          **Risk**
          When it expires, every certificate it signed stops authenticating in the same minute: agents, PuppetDB, the orchestrator and PE's own console and SAML certificates. Replacing a PE CA means reissuing every certificate in the estate.
          **Severity and why**
          Critical, because the remaining time is already inside the lead time the warning at 90 days was meant to give, and the outage on expiry is estate-wide. It pages, although nothing gets fixed tonight.
          **When to act**
          Start the next working day. The fix is a planned CA replacement, so overnight work is reading, not changing.
          **What to do**
          1. Cause: the CA certificate is about to age out and the replacement has not been scheduled. Check: the CA Certificates table on the Certificate Authority board, or `(puppet_ca_expires_epoch - time()) / 86400` in Prometheus, one series per `subject`. PE ships a root and an intermediate; which of them is expiring decides how big the work is. Fix: book the change window for the CA replacement now with the PE administrator; it is change-window work on the primary.
          2. Inferred cause: a replacement already happened and the exporter is reading a stale bundle. Check: `puppet_exporter_collector_success{collector="ca"}` is 1 when the `ca` collector last succeeded. Fix: a failing collector is `sudo /usr/local/bin/pobs-ctl status` on the primary; fix that and re-check.
          3. Whatever the cause: the alert clears when a CA certificate with a later expiry replaces this one and the next poll reads it.
          **Finding the rest**
          Every CA certificate and its expiry: `(puppet_ca_expires_epoch - time()) / 86400` in Prometheus, one series per `subject`. The reissue count: `count(puppet_certificate_expires_epoch)`. Whether the reading is current: `puppet_exporter_collector_success{collector="ca"}`.
          **Escalate**
          Hand it to the PE administrator at the start of the next working day with the subject, the days left and the reissue count, and engage Puppet support for the replacement procedure.
          **Known noise**
          None known.
        where_panel: pobs-ca/CA Certificates
        where: The "CA Certificates" table on the Certificate Authority board, which
          lists each CA certificate in the bundle with its expiry.
        thresholds: ca_expiry_critical_days, ca_expiry_warning_days
    - alert: PobsCaExpiringSoon
      expr: "(puppet_ca_expires_epoch - time()) / 86400 < 90"
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: CA certificate {{ $labels.subject }} expires in under 90 days
        description: |-
          **What is wrong**
          The CA certificate `{{ $labels.subject }}` has {{ $value | printf "%.0f" }} days left, under 90 days for more than an hour.
          **Risk**
          When it expires, every certificate it signed stops authenticating at once: agents, PuppetDB, the orchestrator and PE's own service certificates. Replacing a PE CA means reissuing every certificate in the estate.
          **Severity and why**
          Warning, because there are still 90 days and the horizon is set wide on purpose so the replacement can be planned. It waits for working hours. It returns as `PobsCaExpiringCritical` at 30 days.
          **When to act**
          Working hours. Start planning now, because replacing a CA is a change with lead time.
          **What to do**
          1. Cause: the CA certificate is ageing out on schedule and nobody has started the replacement. Check: the CA Certificates table on the Certificate Authority board, or `(puppet_ca_expires_epoch - time()) / 86400` in Prometheus, one series per `subject`. PE ships a root and an intermediate; which of them is the one expiring decides the size of the work. Fix: book the change window for the CA replacement with the PE administrator while the date is still yours to choose. The replacement itself is change-window work on the primary.
          2. Inferred cause: a CA was already replaced and the exporter is still reading the old bundle. Check: `puppet_exporter_collector_success{collector="ca"}` is 1 when the `ca` collector's last run succeeded, and the CA Certificates table shows one row per certificate in the bundle. Fix: a failing collector is `sudo /usr/local/bin/pobs-ctl status` on the primary; fix that and re-check before planning a replacement.
          3. Whatever the cause: the alert clears when a CA certificate with a later expiry replaces this one and the next poll reads it.
          **Finding the rest**
          Every CA certificate and its expiry: `(puppet_ca_expires_epoch - time()) / 86400` in Prometheus, one series per `subject`. How many node certificates hang off this CA, which is the reissue count: `count(puppet_certificate_expires_epoch)`. Whether the reading is current: `puppet_exporter_collector_success{collector="ca"}`.
          **Escalate**
          This is the PE administrator's work from the start. Hand over the subject, the days left, and the reissue count. Puppet support should be engaged for the replacement procedure itself.
          **Known noise**
          A site that runs an intermediate on a deliberately short life can raise or lower `observability::alerts::thresholds.ca_expiry_warning_days` to suit its own lead time. Otherwise none known.
        where_panel: pobs-ca/CA Certificates
        where: The "CA Certificates" table on the Certificate Authority board, which
          lists each CA certificate in the bundle with its expiry.
        thresholds: ca_expiry_critical_days, ca_expiry_warning_days
    - alert: PobsCertRenewalAssumptionStale
      expr: puppet_agent_cert_renewal_interval_seconds != (30 * 86400)
      for: 6h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Boards assume a different certificate renewal interval than the estate
          uses
        description: |-
          **What is wrong**
          The estate renews agent certificates {{ $value | humanizeDuration }} before expiry, and the certificate boards are drawn for `observability::alerts::thresholds.cert_renewal_interval_days` (30 days). The two have disagreed for six hours.
          **Risk**
          No certificate is affected. The Expiry Spread draws its healthy band in the wrong place: if the estate's real interval is shorter, certificates in normal rotation land in buckets coloured as a problem; if it is longer, a certificate whose renewal was due and did not happen lands in an uncoloured bucket and reads as healthy.
          **Severity and why**
          Warning, because only the board's colouring is wrong and the alert rules themselves read the live interval. It waits for working hours.
          **When to act**
          Working hours.
          **What to do**
          1. Cause: the configured interval does not match what the CA reports. Check: `puppet_agent_cert_renewal_interval_seconds / 86400` in Prometheus is the estate's interval in days; healthy is a value equal to the configured threshold, unhealthy is any other number. Fix: set `observability::alerts::thresholds.cert_renewal_interval_days` in Hiera to that number and run Puppet on the primary and the dashboard node. No change window is needed.
          2. Inferred cause: the CA's `hostcert_renewal_interval` was changed recently and the board setting was never updated. Check: whether `PobsCertWarningAboveRenewal` is firing beside this, which means the warning threshold needs moving at the same time. Fix: change both keys in the same Hiera edit.
          3. Whatever the cause: the alert clears once the rules reload with the new value, and the boards redraw on the same Puppet run.
          **Finding the rest**
          Where the healthy band should sit: `puppet_ca_auto_renewal_cert_ttl_seconds / 86400` is the upper edge (how long a renewed certificate lives) and `puppet_agent_cert_renewal_interval_seconds / 86400` is the lower edge. Every working certificate cycles between the two. Whether the CA renews at all: `puppet_ca_auto_renewal_enabled` is 1 when it does.
          **Escalate**
          None needed for the Hiera change. If the interval the CA reports is not what the site intended, hand the reported value to the PE administrator.
          **Known noise**
          A site that deliberately runs the boards at a different interval from the CA can knock the rule out with `'--'` under `observability::alerts::rule_groups` for the `certificates` group. Otherwise none known.
        where_panel: pobs-ca/Expiry Spread
        where: The "Expiry Spread" panel on the Certificate Authority board, whose
          bucket edges are cut from the configured interval and are in the wrong place
          while this fires.
        thresholds: cert_renewal_interval_days
    - alert: PobsCertWarningAboveRenewal
      expr: puppet_agent_cert_renewal_interval_seconds <= (14 * 86400)
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Certificate warning threshold is at or above the renewal interval
        description: |-
          **What is wrong**
          Agents renew their own certificates {{ $value | humanizeDuration }} before expiry, and `observability::alerts::thresholds.cert_expiry_warning_days` (14 days) is at or above that interval. The condition has held for an hour.
          **Risk**
          Every healthy node trips `PuppetCertificateNotRenewing` once per certificate cycle, so that alert no longer means renewal has failed. A node that has stopped renewing is lost in the noise. No certificate is affected.
          **Severity and why**
          Warning, because this is a misconfigured threshold and nothing in the estate is at risk from it. It waits for working hours; it would never be critical on its own.
          **When to act**
          Working hours.
          **What to do**
          1. Cause: the warning threshold was left at or raised to the renewal interval. Check: `puppet_agent_cert_renewal_interval_seconds / 86400` in Prometheus is the interval the estate uses, in days. Healthy is a warning threshold below that number; unhealthy is equal or above, which is what fired. Fix: set `observability::alerts::thresholds.cert_expiry_warning_days` in Hiera to a value below it, then run Puppet on the dashboard node so the rules and boards pick it up. No change window is needed.
          2. Inferred cause: the estate's renewal interval was shortened and the threshold was not moved with it. Check: the same query against what the threshold was set for. Fix: the same Hiera change, with `cert_renewal_interval_days` updated too if `PobsCertRenewalAssumptionStale` is also firing.
          3. Whatever the cause: the alert clears on the first evaluation after the rules reload with the new threshold.
          **Finding the rest**
          How many certificates sit inside the current threshold today: `count((puppet_certificate_expires_epoch - time()) / 86400 < 14)`; on a working estate that number falls once the threshold is below the renewal interval. Whether the CA renews at all: `puppet_ca_auto_renewal_enabled` is 1 when it does. The renewal interval in seconds, per CA host: `puppet_agent_cert_renewal_interval_seconds`.
          **Escalate**
          This is a Hiera change on the dashboard node and does not need escalating. If the renewal interval itself is wrong for the site, hand the two numbers (the interval in days and the threshold) to the PE administrator, who owns `hostcert_renewal_interval`.
          **Known noise**
          A site that has deliberately set the warning at the renewal interval, because it wants an alert per certificate cycle, should knock this rule out with `'--'` under `observability::alerts::rule_groups` for the `certificates` group. Otherwise none known.
        where_panel: pobs-ca/Agents Renew At
        where: The "Agents Renew At" tile on the Certificate Authority board, which
          shows how close to expiry agents renew, the line the warning threshold has
          to sit below.
        thresholds: cert_expiry_warning_days
    - alert: PobsCrlUpdateOverdue
      expr: puppet_crl_next_update_epoch - time() < 0
      for: 5m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: CRL from {{ $labels.issuer }} has expired
        description: |-
          **What is wrong**
          The CRL from `{{ $labels.issuer }}` is past its nextUpdate and has been for five minutes.
          **Risk**
          Anything enforcing CRLs rejects every certificate checked against a stale one, which presents as the whole estate failing to authenticate at once. It does not degrade gently and it does not recover on its own.
          **Severity and why**
          Critical, because the CRL has already lapsed and the failure mode is estate-wide authentication. It pages.
          **When to act**
          Now.
          **What to do**
          1. Cause: the reading is stale because the `ca` collector is failing. Check: `sudo /usr/local/bin/pobs-ctl status` on the primary lists a failing `ca` collector by name, and `puppet_exporter_collector_success{collector="ca"}` is 1 when its last run succeeded. Fix: fix the collector and re-check before anything else; a failing collector means the figure is stale.
          2. Cause: the CA has stopped regenerating the CRL and it has lapsed. Check: the CRL Freshness table on the Certificate Authority board, or `time() - puppet_crl_last_update_epoch{issuer="{{ $labels.issuer }}"}` for how long since it was regenerated. Fix: this is CA-side work on the primary and not something an agent can fix; raise it with the PE administrator and Puppet support at the hour it fires. The CRL file is `/etc/puppetlabs/puppetserver/ca/ca_crl.pem` unless `crl_file` has been moved.
          3. Whatever the cause: the alert clears when the CA writes a new CRL with a future nextUpdate and the next poll reads it.
          **Finding the rest**
          How long since the CRL was regenerated: `time() - puppet_crl_last_update_epoch{issuer="{{ $labels.issuer }}"}` in Prometheus, in seconds. How long ago it lapsed: `time() - puppet_crl_next_update_epoch{issuer="{{ $labels.issuer }}"}`. Whether the collector is current: `puppet_exporter_collector_success{collector="ca"}` is 1 when its last run succeeded. Whether the exporter's own listener is enforcing CRLs: `puppet_exporter_crl_checking` is 1 when it refuses revoked client certificates.
          **Escalate**
          Straight to the PE administrator once the collector is ruled out, with the issuer, how long since regeneration, how long since the lapse, and whether agent runs are already failing at TLS. Puppet support wants the same plus the `pobs-ctl status` output.
          **Known noise**
          None known.
        where_panel: pobs-ca/CRL Freshness
        where: The "CRL Freshness" table on the Certificate Authority board, which
          shows how long since each CRL was regenerated.
    - alert: PobsCrlUpdateSoon
      expr: "(puppet_crl_next_update_epoch - time()) / 86400 < 30"
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: CRL from {{ $labels.issuer }} stops being valid in under 30 days
        description: |-
          **What is wrong**
          The CRL from `{{ $labels.issuer }}` stops being valid in {{ $value | printf "%.0f" }} days, under 30 days for more than an hour. The CA normally regenerates it long before this, so the refresh has stopped.
          **Risk**
          Nothing is broken yet. Once the CRL lapses, anything enforcing CRLs rejects every certificate checked against it, which presents as the whole estate failing to authenticate at once. Left alone this becomes `PobsCrlUpdateOverdue`.
          **Severity and why**
          Warning, because the CRL is still valid and there are days of margin. It waits for working hours. The paired critical fires the moment the CRL lapses.
          **When to act**
          Working hours, before the date.
          **What to do**
          1. Cause: the figure is stale because the `ca` collector is failing. Check: `sudo /usr/local/bin/pobs-ctl status` on the primary lists a failing `ca` collector by name, and `puppet_exporter_collector_success{collector="ca"}` is 1 when its last run succeeded. Fix: fix the collector first; the CRL figure is only as fresh as its last successful run.
          2. Cause: the CA has stopped regenerating the CRL. Check: the CRL Freshness table on the Certificate Authority board, or `time() - puppet_crl_last_update_epoch{issuer="{{ $labels.issuer }}"}` in seconds; a long time since refresh is the CA-side fault. Fix: this is CA work on the primary, which the PE administrator owns. The CRL file is `/etc/puppetlabs/puppetserver/ca/ca_crl.pem` unless `crl_file` has been moved.
          3. Whatever the cause: the alert clears when the CA writes a new CRL with a later nextUpdate and the next poll reads it.
          **Finding the rest**
          When each CRL was last regenerated: `time() - puppet_crl_last_update_epoch{issuer="{{ $labels.issuer }}"}` in Prometheus, in seconds. Days left on each CRL: `(puppet_crl_next_update_epoch - time()) / 86400`. Whether the collector is current: `puppet_exporter_collector_success{collector="ca"}` is 1 when its last run succeeded.
          **Escalate**
          Once the collector is ruled out, hand the PE administrator the issuer, the days left and the time since the last regeneration. Puppet support wants the same plus the output of `sudo /usr/local/bin/pobs-ctl status`.
          **Known noise**
          A site whose CA is set to regenerate the CRL on a longer cycle can lower `observability::alerts::thresholds.crl_expiry_warning_days`. Otherwise none known.
        where_panel: pobs-ca/CRL Freshness
        where: The "CRL Freshness" table on the Certificate Authority board, which
          shows how long since each CRL was regenerated.
        thresholds: crl_expiry_warning_days
    - alert: PuppetCertificateExpiringCritical
      expr: "(puppet_certificate_expires_epoch - time()) / 86400 < 7"
      for: 1h
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: Puppet certificate for {{ $labels.node }} is about to expire
        description: |-
          **What is wrong**
          The certificate for `{{ $labels.node }}` has {{ $value | printf "%.0f" }} days left, under 7 days for more than an hour, and nothing has renewed it.
          **Risk**
          On expiry the node stops authenticating to the primary. It stops reporting and nothing is enforced on it, and it shows up as a silent node, not a failed run. It does not recover on its own, and after expiry the fix is on the node itself, one host at a time.
          **Severity and why**
          Critical, because the warning at 14 days went unanswered and the node is now days from going silent. It pages.
          **When to act**
          Now, or at least before the expiry date.
          **What to do**
          1. Cause: the node was destroyed without its certificate being cleaned. Check: `puppet_report_timestamp_epoch{node="{{ $labels.node }}"}` in Prometheus is when it last reported. A node quiet for weeks is this case. Fix: on the primary, `sudo /opt/puppetlabs/bin/puppetserver ca clean --certname {{ $labels.node }}` closes it. No change window.
          2. Cause: the node is live and its agent has stopped renewing. Check: a recent report timestamp, and `sudo /opt/puppetlabs/bin/puppet agent -t` on the node for any certificate error. Fix: reissue before the date. On the primary `sudo /opt/puppetlabs/bin/puppetserver ca clean --certname {{ $labels.node }}`, then on the node `sudo /opt/puppetlabs/bin/puppet ssl clean` and `sudo /opt/puppetlabs/bin/puppet agent -t`, then on the primary `sudo /opt/puppetlabs/bin/puppetserver ca sign --certname {{ $labels.node }}` unless autosigning signs it, then `sudo /opt/puppetlabs/bin/puppet agent -t` on the node again. Do the whole sequence in one sitting; the node has no valid certificate between the clean and the sign.
          3. Whatever the cause: the alert clears when the new certificate's expiry is read by the next poll, or when the old one is cleaned and its series disappears.
          **Finding the rest**
          The expiry epoch: `puppet_certificate_expires_epoch{node="{{ $labels.node }}"}`. On the node, `sudo openssl x509 -noout -enddate -in "$(sudo /opt/puppetlabs/bin/puppet config print hostcert)"` prints the date from disk. The Triage board lists it under certificates that have not renewed, and the Node Detail board for the node carries its run history. How many others are this close: `count((puppet_certificate_expires_epoch - time()) / 86400 < 7)`. Whether the CA renews at all: `puppet_ca_auto_renewal_enabled` is 1 when it does.
          **Escalate**
          If the reissue fails, or the count query shows many nodes this close, stop and hand the PE administrator the node names, the agent run output and the expiry dates. Puppet support wants the same plus the `puppetserver ca` command output from the primary.
          **Known noise**
          A decommissioned host whose certificate nobody cleaned fires this until it is cleaned; the fix is step 1, not a silence. Otherwise none known.
        where_panel: pobs-ca/Soonest To Expire
        where: The "Soonest To Expire" table on the Certificate Authority board, which
          lists the twenty node certificates closest to expiry with a link to each
          node's board.
        thresholds: cert_expiry_critical_days, cert_expiry_warning_days
    - alert: PuppetCertificateNotRenewing
      expr: "(puppet_certificate_expires_epoch - time()) / 86400 < 14"
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Puppet certificate for {{ $labels.node }} is not being renewed
        description: |-
          **What is wrong**
          The certificate for `{{ $labels.node }}` has {{ $value | printf "%.0f" }} days left, under 14 days for more than an hour, and has not been renewed although it is already inside the interval an auto-renewing agent would have acted on.
          **Risk**
          The certificate itself is fine for now. The node has stopped renewing, which means it is destroyed, broken, or no longer running Puppet. Ignored, `PuppetCertificateExpiringCritical` follows at 7 days, and on expiry the node stops authenticating and goes silent.
          **Severity and why**
          Warning, because there are still 14 days before anything fails and the fix is a working-hours job. It becomes critical at 7 days through the paired rule.
          **When to act**
          Working hours, before the critical threshold.
          **What to do**
          1. Cause: the node was destroyed without its certificate being cleaned. Check: `puppet_report_timestamp_epoch{node="{{ $labels.node }}"}` in Prometheus is when it last reported, and the Node Detail board for the node carries its run history. A node quiet for weeks is this case. Fix: on the primary, `sudo /opt/puppetlabs/bin/puppetserver ca clean --certname {{ $labels.node }}` revokes and removes the certificate. No reissue is needed and no change window.
          2. Cause: the CA does not renew certificates. Check: the Auto-Renewal tile on the Certificate Authority board, or `puppet_ca_auto_renewal_enabled`; 1 is healthy, 0 means every certificate in the estate is a manual job. Fix: reissue by hand as in step 4, and raise with the PE administrator whether auto-renewal should be on.
          3. Cause: the node is still reporting but its agent is failing to renew. Check: `sudo /opt/puppetlabs/bin/puppet agent -t` on the node and read any certificate error it prints; a clean run with no certificate lines is healthy. Fix: act on the error it prints, then reissue as in step 4 if the run still does not renew.
          4. Last: reissue by hand. On the primary `sudo /opt/puppetlabs/bin/puppetserver ca clean --certname {{ $labels.node }}`, then on the node `sudo /opt/puppetlabs/bin/puppet ssl clean` and `sudo /opt/puppetlabs/bin/puppet agent -t`, then on the primary `sudo /opt/puppetlabs/bin/puppetserver ca sign --certname {{ $labels.node }}` unless autosigning signs it, then `sudo /opt/puppetlabs/bin/puppet agent -t` on the node again. The node runs no Puppet between the clean and the sign, so do it in one sitting.
          5. Whatever the cause: the alert clears when the certificate's expiry moves past 14 days out and the next poll reads it, or when the certificate is cleaned and its series disappears.
          **Finding the rest**
          The exact expiry: `puppet_certificate_expires_epoch{node="{{ $labels.node }}"}`. On the node, `sudo openssl x509 -noout -enddate -in "$(sudo /opt/puppetlabs/bin/puppet config print hostcert)"` prints the same date from the certificate on disk. Whether other nodes are in the same state: the Triage board lists every node whose certificate has not renewed, and `count((puppet_certificate_expires_epoch - time()) / 86400 < 14)` is how many. Whether the CA renews at all: `puppet_ca_auto_renewal_enabled` is 1 when it does.
          **Escalate**
          If the agent run prints a certificate error you cannot clear with the reissue, or auto-renewal is on and many nodes are not renewing, stop and hand the PE administrator the node name, the agent run output and the count query result. Puppet support wants the same plus the CA's `puppetserver` log for the window.
          **Known noise**
          If this fires for most of the estate at once, the warning threshold is at or above the renewal interval and `PobsCertWarningAboveRenewal` should be firing beside it; fix that threshold under `observability::alerts::thresholds.cert_expiry_warning_days` and these clear. A node that is deliberately off for a while can be silenced in Alertmanager by `node` with `amtool` on the dashboard node until it returns.
        where_panel: pobs-ca/Soonest To Expire
        where: The "Soonest To Expire" table on the Certificate Authority board, which
          lists the twenty node certificates closest to expiry with a link to each
          node's board.
        thresholds: cert_expiry_critical_days, cert_expiry_warning_days
  - name: pobs-cis
    rules:
    - alert: PobsCisScanStale
      expr: (time() - puppet_compliance_scan_timestamp_epoch{standard="cis"}) / 86400
        > 7
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: CIS scan for {{ $labels.node }} is {{ $value | printf "%.0f" }} days
          old
        description: |-
          **What is wrong**
          The last CIS scan of `{{ $labels.node }}` is more than 7 days old and has been for more than an hour. Its compliance score is still displayed, and nothing on the score panels marks it as old.
          **Risk**
          Any compliance figure that includes this node is quoting a score the scanner has stopped confirming. Nothing else is broken.
          **Severity and why**
          Warning, because the score is a few days stale and one missed scan does not change what the estate looks like. It waits for working hours. It escalates to `PobsCisScanStopped` at 30 days.
          **When to act**
          Working hours.
          **What to do**
          1. Cause: the whole export is stale, so every node's scan age is climbing together. Check: `Last Successful Export` on the CIS board, or `time() - puppet_scm_export_last_success_timestamp`; recent is healthy and means the scanner has stopped for this node alone. Fix: if it is old, work `PobsScmExportStale` or `PobsScmExportFailing` instead; this clears with them.
          2. Cause: the scanner has stopped scanning this node. Check: the node's row in `score_data/Summary_Report_API.csv` under `observability::scm_dir` (default `/opt/puppetlabs/pobs/data`) on the primary, and confirm its scan timestamp matches what the alert says. Fix: in SCM, check the node is still in scope for scanning and whether its last scan errored, then rescan it.
          3. Whatever the cause: the alert clears when a new scan for this node reaches the export and the next export run picks it up. `sudo /usr/local/bin/pobs-ctl scm export` on the primary runs one now.
          **Finding the rest**
          Which other nodes are in the same state: `Scan Freshness` on the CIS board lists the twenty stalest. In Prometheus, `(time() - puppet_compliance_scan_timestamp_epoch{standard="cis",node="{{ $labels.node }}"}) / 86400` is this node's scan age in days; `count((time() - puppet_compliance_scan_timestamp_epoch{standard="cis"}) / 86400 > 7)` is how many nodes are over the line. `time() - puppet_scm_export_last_success_timestamp` is how long since the export last succeeded.
          **Escalate**
          If the node is in scope and the rescan errors, hand the team that owns the scanner the node name, the scan age and the error from SCM. If many nodes are stale together with a healthy export, the same team, with the count query result.
          **Known noise**
          A node decommissioned without being removed from SCM's scope fires this until it leaves the export; remove it from scope. A site that scans less often than weekly should raise `observability::alerts::thresholds.cis_scan_stale_days` to match its schedule.
        where_panel: pobs-cis/Scan Freshness
        where: The "Scan Freshness" table on the CIS board, which lists the stalest
          scans by node.
        thresholds: cis_scan_stale_days, cis_scan_stopped_days
    - alert: PobsCisScanStopped
      expr: (time() - puppet_compliance_scan_timestamp_epoch{standard="cis"}) / 86400
        > 30
      for: 1h
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: CIS scan for {{ $labels.node }} stopped {{ $value | printf "%.0f"
          }} days ago
        description: |-
          **What is wrong**
          `{{ $labels.node }}` has not been scanned for CIS in 30 days, and the condition has held for more than an hour. Its last score is still displayed as current on the CIS board with no freshness test.
          **Risk**
          Any compliance claim covering this node is unevidenced until it is rescanned.
          **Severity and why**
          Critical, because 30 days without a scan is an evidence gap in any compliance claim, not because anything is down. It pages under the default routing, but there is no overnight action.
          **When to act**
          Working hours.
          **What to do**
          1. Cause: the whole export is stale. Check: `Last Successful Export` on the CIS board, or `time() - puppet_scm_export_last_success_timestamp`; recent is healthy and means the fault is scanning. Fix: if it is old, work `PobsScmExportStale` or `PobsScmExportFailing` instead.
          2. Cause: the node has been decommissioned and left in SCM's scope. Check: whether the node still reports, `puppet_report_timestamp_epoch{node="{{ $labels.node }}"}` in Prometheus. Fix: remove it from SCM's scope so its score drops out of the export.
          3. Cause: the scanner has stopped scanning a live node. Check: the node's row in `score_data/Summary_Report_API.csv` under `observability::scm_dir` (default `/opt/puppetlabs/pobs/data`) on the primary, and confirm its scan timestamp. Fix: in SCM, check the node is still in scope and whether its last scan errored, then rescan it.
          4. Whatever the cause: the alert clears when a new scan for this node reaches the export and the next export run picks it up, or when the node leaves the export. `sudo /usr/local/bin/pobs-ctl scm export` on the primary runs one now.
          **Finding the rest**
          Its age and company: `Oldest Scan` and `Scan Freshness` on the CIS board. In Prometheus, `(time() - puppet_compliance_scan_timestamp_epoch{standard="cis",node="{{ $labels.node }}"}) / 86400` is this node's scan age in days. `puppet_compliance_score{standard="cis",node="{{ $labels.node }}"}` is the score still being displayed. `time() - puppet_scm_export_last_success_timestamp` is how long since the export last succeeded.
          **Escalate**
          If the node is in scope, live, and the rescan errors or never runs, hand the team that owns the scanner the node name, the scan age and the SCM error.
          **Known noise**
          A site that scans less often than monthly should raise `observability::alerts::thresholds.cis_scan_stopped_days`. A site that does not want compliance evidence gaps to page can silence by `alertname` in Alertmanager with `amtool` on the dashboard node, or route the `cis` group's alerts to a non-paging receiver.
        where_panel: pobs-cis/Scan Freshness
        where: The "Scan Freshness" table on the CIS board, which lists the stalest
          scans by node.
        thresholds: cis_scan_stopped_days
    - alert: PobsCisScoreWithoutScanTime
      expr: max without (score_type) (puppet_compliance_score) unless on(alias, node,
        benchmark, profile, standard) puppet_compliance_scan_timestamp_epoch
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Compliance score ({{ $labels.benchmark }}) for {{ $labels.node }}
          has no scan timestamp
        description: |-
          **What is wrong**
          `{{ $labels.node }}` has a compliance score for benchmark `{{ $labels.benchmark }}`, profile `{{ $labels.profile }}`, with no scan timestamp behind it, and has had for more than an hour.
          **Risk**
          The staleness alerts and the `Oldest Scan` and `Scan Freshness` panels only see scans with a timestamp, and `Unscanned Nodes` does not count a node that has a score. This score can sit wrong indefinitely with nothing to flag it.
          **Severity and why**
          Warning, because one node's score has lost its freshness check and nothing is down. It waits for working hours.
          **When to act**
          Working hours. Until it is fixed, leave this node out of any compliance claim.
          **What to do**
          1. Cause: the export carries a scan timestamp for this row that cannot be read as a date. Check: the node's row in `score_data/Summary_Report_API.csv` under `observability::scm_dir` (default `/opt/puppetlabs/pobs/data`) on the primary, and read its `Scan Timestamp` column. A parseable date is healthy; a present but unreadable value is what fired. An empty value does not produce a score at all, so that is a different fault. Fix: rescan the node in SCM so the export carries a readable timestamp.
          2. Then: if the rescan still produces the same value, the fix is on the SCM side; take the row to the team that owns the scanner.
          3. Whatever the cause: the alert clears on the next export run after the scan carries a timestamp the export can read. `sudo /usr/local/bin/pobs-ctl scm export` on the primary runs one now.
          **Finding the rest**
          The score that has no timestamp: `puppet_compliance_score{node="{{ $labels.node }}",benchmark="{{ $labels.benchmark }}"}`. Whether any timestamp exists for the node at all: `puppet_compliance_scan_timestamp_epoch{node="{{ $labels.node }}"}`; a result for a different benchmark means only this scan is affected. `time() - puppet_scm_export_last_success_timestamp` is how long since the export last ran successfully, which bounds how old the row is.
          **Escalate**
          If the rescan does not change the `Scan Timestamp` value, hand the team that owns the scanner the node name, the benchmark and profile, and the row's timestamp text as the export wrote it.
          **Known noise**
          None known.
  - name: pobs-collectors
    rules:
    - alert: PobsCollectorFailing
      expr: puppet_exporter_collector_consecutive_failures > 3
      for: 5m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pobs collector {{ $labels.collector }} is failing
        description: |-
          **What is wrong**
          The `{{ $labels.collector }}` collector has failed {{ $value }} runs in a row, more than the 3 this rule allows, and has stayed that way for five minutes.
          **Risk**
          Everything that collector feeds is stale. The daemon is up and the scrape succeeds, so the boards keep drawing its last good values and look current. Left failing, a collector that has succeeded before escalates to PobsCollectorStale at critical.
          **Severity and why**
          Warning. The boards it feeds are stale, not blank, and the estate itself is unaffected, so it waits for working hours. PobsCollectorStale is the critical page if the collector stays down long enough to miss several of its own intervals.
          **When to act**
          Working hours, unless you need the boards it feeds tonight.
          **What to do**
          1. Check: on the primary, `sudo /usr/local/bin/pobs-ctl status` lists the failing collectors with a shortened error, and `sudo journalctl -u pobs --since '-1h' | grep "collector '{{ $labels.collector }}' failed"` has the full one. A healthy collector is absent from the failing list.
          2. Cause: the PE service the collector reads is down, its URL is wrong, or the certificate or token it authenticates with has expired. Match the error to its fix under "A collector is failing" in docs/operate/troubleshooting.md, and what the collector reads is in the On by default table in docs/reference/defaults.md.
          3. Then: fix the dependency. Do not restart Puppet Observability as a fix; it resets the failure count without fixing the cause and the alert comes back.
          The alert clears once the collector completes a run, on its next scheduled run after the fix, and resolves on the first successful run after it.
          **Finding the rest**
          Which boards go stale with it: `Collector Freshness, and What Goes Stale With It` on the Internal Operations board. Whether it has ever succeeded: `puppet_exporter_collector_last_success_timestamp{collector="{{ $labels.collector }}"}` in Prometheus; 0 means never, which is usually configuration, and the `Never Succeeded` tile on the same board counts those. To confirm the fix: `puppet_exporter_collector_consecutive_failures{collector="{{ $labels.collector }}"}` returns to 0.
          **Escalate**
          If the error names a PE service that is down or refusing the daemon's certificate and you cannot fix that service, hand the PE administrator the collector name, the journal lines from step 1 and the time of the first failure. If the error is inside the daemon itself, `sudo /usr/local/bin/pobs-ctl support-bundle` on the primary writes the file to attach to a report to whoever runs Puppet Observability.
          **Known noise**
          A collector reading a service you have deliberately turned off fails on every run and is not news; knock the collector off in the module's configuration, or silence on `collector` in Alertmanager until it is back. The number of failed runs allowed is `consecutive_failures` under `observability::alerts::thresholds`.
        where_panel: pobs-operations/Collectors Needing Attention
        where: The "Collectors Needing Attention" table on the Internal Operations
          board, which lists each collector that raised on its last run with its failure
          count.
        thresholds: consecutive_failures
    - alert: PobsCollectorServingStaleData
      expr: |-
        puppet_exporter_collector_partial_failures > 0 and puppet_exporter_collector_consecutive_partial_runs >= 2 and (
          puppet_exporter_collector_consecutive_partial_runs * puppet_exporter_collector_interval_seconds >= 3600
          or puppet_exporter_collector_consecutive_partial_runs unless puppet_exporter_collector_interval_seconds
        )
      for: 5m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pobs collector {{ $labels.collector }} has served stale data for
          an hour
        description: |-
          **What is wrong**
          The `{{ $labels.collector }}` collector could not refresh {{ $value }} of its subjects on its last run and has been publishing last-known-good for them for at least an hour, over at least two runs.
          **Risk**
          The figures for those subjects are frozen at their last good value. The collector records a clean run, so `puppet_exporter_collector_success` reads 1 and the Collectors Failing tiles read zero; nothing else says so.
          **Severity and why**
          Warning. The collector completes and most of its subjects are current; only the ones it could not refresh are frozen, so it waits for working hours and does not page.
          **When to act**
          Working hours. Nothing breaks while you wait, the numbers for those subjects are old.
          **What to do**
          1. Check: on the primary, `sudo journalctl -u pobs | grep last-known-good` names the collector and the count each cycle. The warning logged just before it usually names the query or fetch that failed.
          2. Cause: the upstream that fetch reads is refusing or failing the request. The subject depends on the collector: `deploy_impact` counts environments, `code_deploys` unresolved code ids, `cd4pe_events` impact analyses, `deploy_observed` deployments it could not observe, `orchestrator` its two queries, `classifier` node groups whose membership fetch failed. Fix that upstream.
          The alert clears once a run refreshes everything, which resets the partial-run count to zero.
          **Finding the rest**
          How many subjects are affected right now: `puppet_exporter_collector_partial_failures{collector="{{ $labels.collector }}"}` in Prometheus. How many runs in a row: `puppet_exporter_collector_consecutive_partial_runs{collector="{{ $labels.collector }}"}`. The same collector appears on `Collectors Needing Attention` on the Internal Operations board with the reason "Serving stale data".
          **Escalate**
          If the failing fetch is against CD4PE, the orchestrator or the classifier and the service's own logs show it refusing the request, hand the PE administrator or the CD4PE owner the journal warning from step 1 and the time the partial runs began. If the fetch succeeds by hand but the collector still records it as failed, `sudo /usr/local/bin/pobs-ctl support-bundle` on the primary writes the file to send to whoever runs Puppet Observability.
          **Known noise**
          A subject that has gone for good, such as an environment deleted from CD4PE or a node group removed, stays last-known-good until the collector stops tracking it. Silence on `collector` in Alertmanager while it ages out. There is no threshold to tune; the rule is two runs and an hour.
        where_panel: pobs-operations/Collectors Needing Attention
        where: The "Collectors Needing Attention" table on the Internal Operations
          board, which lists this collector with the reason "Serving stale data" and
          the number of subjects.
    - alert: PobsCollectorSlow
      expr: puppet_exporter_collector_duration_seconds > puppet_exporter_collector_interval_seconds
      for: 10m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pobs collector {{ $labels.collector }} took longer than its own run
          interval
        description: |-
          **What is wrong**
          The last run of the `{{ $labels.collector }}` collector took longer than the interval it is scheduled at, and has stayed that way for ten minutes.
          **Risk**
          Collectors run in sequence, so every one after it in the cycle starts late. If a collector stops completing for longer than three times `observability::polling_interval`, the daemon's watchdog withholds its ping and systemd restarts the daemon.
          **Severity and why**
          Warning. One slow collector delays the cycle; it does not stop it, and the daemon restarts itself if it stalls. It waits for working hours unless the whole cycle is near its interval.
          **When to act**
          Working hours, sooner if `Poll Cycle Load` on the Internal Operations board is near 100%.
          **What to do**
          1. Check: `Slowest Collectors` on the Internal Operations board, to see whether it is this one collector or the whole cycle that is slow. `Poll Cycle Load` beside it is the cycle's duration as a share of its interval; near 100% means the cycle cannot keep pace.
          2. Cause: the collector is scheduled more often than its query can finish. Give it a longer cadence. Seven collectors take their own interval parameter (`observability::postgres_interval` and its siblings in manifests/init.pp); the rest run at `observability::polling_interval`. The change applies on the next Puppet run on the primary and needs no change window.
          3. Cause: the service it queries is slow. Narrow the query or fix the service it reads, which is the lasting fix.
          The alert clears once a run completes inside its interval and the next evaluation sees it.
          **Finding the rest**
          Last run duration: `puppet_exporter_collector_duration_seconds{collector="{{ $labels.collector }}"}` in Prometheus, against `puppet_exporter_collector_interval_seconds{collector="{{ $labels.collector }}"}`. The cost of a full sweep, every collector's last run summed: `puppet_exporter_poll_duration_seconds / puppet_exporter_polling_interval_seconds`, which is what `Poll Cycle Load` draws. Restarts of the daemon: `sudo journalctl -u pobs` on the primary.
          **Escalate**
          If the slow part is the PE service the collector queries, hand the PE administrator the collector name, the duration series above and the window it slowed in. If the collector is slow against a service that answers quickly by hand, `sudo /usr/local/bin/pobs-ctl support-bundle` on the primary writes the file for whoever runs Puppet Observability.
          **Known noise**
          A daily collector fires on a single slow run, because ten minutes is less than one of its intervals, and one slow run at that cadence is a real overrun. On a large estate a collector that always takes longer than its interval is a cadence problem, so lengthen its interval parameter instead of silencing. There is no threshold to tune for this rule.
    - alert: PobsCollectorStale
      expr: "(time() - puppet_exporter_collector_last_success_timestamp) > (3 * puppet_exporter_collector_interval_seconds)"
      for: 15m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: pobs collector {{ $labels.collector }} has missed 3 of its own run
          intervals
        description: |-
          **What is wrong**
          The `{{ $labels.collector }}` collector has not completed a run in 3 of its own scheduled intervals, and has stayed that way for fifteen minutes.
          **Risk**
          Every board reading it shows a plausible figure that is at least that old, not No data. Alerts built on its series are judging stale numbers.
          **Severity and why**
          Critical, because the threshold is a multiple of the collector's own cadence, so by the time it fires several runs have been missed and nothing else says so. It pages. PobsCollectorFailing is the warning that comes before it when the collector is failing outright.
          **When to act**
          Now. The threshold is a multiple of this collector's own cadence, so it has already missed several runs: minutes on a five-minute collector, days on a daily one.
          **What to do**
          1. Check: on the primary, `sudo /usr/local/bin/pobs-ctl status` shows the collector with its failure streak and `last_error`, or as late with its last success. `sudo journalctl -u pobs --since '-1h' | grep "collector '{{ $labels.collector }}' failed"` has the full exception.
          2. Cause: the collector is failing. PobsCollectorFailing is firing too and its entry maps the error to the fix.
          3. Cause: the collector is not failing and simply has not run. Check `sudo /usr/local/bin/pobs-ctl status` says the daemon is polling at all, and `Poll Cycle Load` on the Internal Operations board for a cycle that is overrunning its interval; PobsCollectorSlow names the collector holding the cycle up.
          The alert clears once the collector completes a successful run and the next evaluation sees a fresh timestamp.
          **Finding the rest**
          How long since it last succeeded: `time() - puppet_exporter_collector_last_success_timestamp{collector="{{ $labels.collector }}"}` in Prometheus, in seconds. Its scheduled interval: `puppet_exporter_collector_interval_seconds{collector="{{ $labels.collector }}"}`; the alert trips at 3 times that. Which boards it feeds: its row on `Collector Freshness, and What Goes Stale With It`.
          **Escalate**
          If the daemon is up and polling but this collector has stopped being scheduled, or the journal shows an exception you cannot map to a dependency, run `sudo /usr/local/bin/pobs-ctl support-bundle` on the primary and hand the file, the collector name and the time of the last success to whoever runs Puppet Observability. If the cause is a PE service it reads, hand the PE administrator the journal lines instead.
          **Known noise**
          A collector that has never succeeded since the daemon started does not trip this rule, so there is no false start after an install. The multiple is `collector_stale_intervals` under `observability::alerts::thresholds`; a collector you have deliberately stopped should be turned off in the module's configuration, or silenced on `collector` in Alertmanager meanwhile.
        where_panel: pobs-operations/Collector Freshness, and What Goes Stale With
          It
        where: The "Collector Freshness, and What Goes Stale With It" table on the
          Internal Operations board, which lists every collector by time since its
          last success and the boards each one feeds.
        thresholds: collector_stale_intervals
    - alert: PobsSourceFailing
      expr: puppet_exporter_source_consecutive_failures > 3
      for: 30m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pobs cannot read {{ $labels.host }} for the {{ $labels.collector
          }} collector
        description: |-
          **What is wrong**
          The `{{ $labels.collector }}` collector has failed {{ $value }} consecutive reads of `{{ $labels.host }}`, more than the 3 this rule allows, and has stayed that way for thirty minutes.
          **Risk**
          What that host contributes is missing from the numbers, so they under-report. The collector itself completes on the hosts it can reach, so `puppet_exporter_collector_success` reads 1 and nothing else names the host. Left unfixed, PobsSourceStale fires at critical.
          **Severity and why**
          Warning. One host behind a collector is missing while the rest are current, so the figures under-report without going blank. It waits for working hours; PobsSourceStale is the page if the host stays unread.
          **When to act**
          Working hours.
          **What to do**
          1. Check: on the primary, `sudo journalctl -u pobs | grep {{ $labels.host }}` has the error. Only the service collectors read several hosts, so this is `status_service`, `puppetdb_internals` or `postgres`.
          2. Cause: the host is down, the primary cannot reach the port the collector uses on it, or the certificate it presents has expired. Check each in that order and fix the one that fails.
          The alert clears once a read of that host succeeds, which resets the count to zero.
          **Finding the rest**
          Time since the host was last read: `time() - puppet_exporter_source_last_success_timestamp{collector="{{ $labels.collector }}",host="{{ $labels.host }}"}` in Prometheus; a raw value of 0 means never read, which is configuration. Every host behind each collector and its age: `Source Freshness, Per Host Behind Each Collector` on the Internal Operations board. The `Collectors Failing` tiles on the NOC and Internal Operations boards count this host but do not name it.
          **Escalate**
          If the host is up but the port is unreachable from the primary, hand the network or platform team the host, the port and the journal lines. If the host's certificate has expired or the service on it refuses the daemon, hand the PE administrator the same lines and the time of the first failed read.
          **Known noise**
          A compiler or replica that has been decommissioned but is still listed for the collector fails every read until it is removed from the module's configuration; do that instead of silencing. The failed reads allowed is `consecutive_failures` under `observability::alerts::thresholds`.
        where_panel: pobs-operations/Collectors Needing Attention
        where: The "Collectors Needing Attention" table on the Internal Operations
          board, which lists this host under its collector with the reason "Source
          unreachable".
        thresholds: consecutive_failures
    - alert: PobsSourceStale
      expr: "(time() - puppet_exporter_source_last_success_timestamp) > ignoring(host)
        group_left() clamp_min(3 * puppet_exporter_collector_interval_seconds, 3600)"
      for: 15m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: pobs has not read {{ $labels.host }} for {{ $labels.collector }}
          in over an hour
        description: |-
          **What is wrong**
          The `{{ $labels.collector }}` collector has not read `{{ $labels.host }}` successfully for longer than 3 of its own intervals or an hour, whichever is longer, and has stayed that way for fifteen minutes.
          **Risk**
          Everything that host contributes has been missing from the estate's figures for that long: infrastructure service state, PuppetDB internals or Postgres, depending on the collector. The collector reports healthy throughout because it completes on the hosts it can reach.
          **Severity and why**
          Critical, because the host has been unread for several of the collector's intervals and PobsSourceFailing has already been firing at warning without it coming back. It pages.
          **When to act**
          Now. PobsSourceFailing has already been firing at warning and the host has not come back on its own.
          **What to do**
          1. Check: on the primary, `sudo journalctl -u pobs | grep {{ $labels.host }}` has the error.
          2. Cause: the host is down, the primary cannot reach the port the collector uses on it, or the certificate it presents has expired. Check each in that order and fix the one that fails.
          3. Cause: the host has never been read at all. A `puppet_exporter_source_last_success_timestamp` of 0 for this host means that, so check the host list in the module's configuration on the primary before looking for an outage on the host.
          The alert clears once a read of that host succeeds and the next evaluation sees a fresh timestamp.
          **Finding the rest**
          Age of the last successful read: `time() - puppet_exporter_source_last_success_timestamp{collector="{{ $labels.collector }}",host="{{ $labels.host }}"}` in Prometheus, in seconds. The collector's interval, which sets the trip point: `puppet_exporter_collector_interval_seconds{collector="{{ $labels.collector }}"}`. Consecutive failures so far: `puppet_exporter_source_consecutive_failures{collector="{{ $labels.collector }}",host="{{ $labels.host }}"}`.
          **Escalate**
          If the host is up but unreachable from the primary on the collector's port, hand the network or platform team the host, the port and the journal lines. If the service on the host is refusing the daemon's certificate, hand the PE administrator the journal lines and the time of the last successful read.
          **Known noise**
          A decommissioned host still listed for the collector stays stale forever; remove it from the module's configuration. The trip point is `source_stale_intervals` and `source_stale_seconds` under `observability::alerts::thresholds`.
        where_panel: pobs-operations/Source Freshness, Per Host Behind Each Collector
        where: The "Source Freshness, Per Host Behind Each Collector" table on the
          Internal Operations board, which shows the age of the last successful read
          for every host behind each collector.
        thresholds: source_stale_human, source_stale_intervals, source_stale_seconds
    - alert: PobsTextfileParseFailing
      expr: node_textfile_scrape_error{pe_infrastructure="true"} > 0
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: node_exporter on {{ $labels.instance }} cannot parse {{ $value |
          printf "%.0f" }} file(s) in the textfile drop zone
        description: |-
          **What is wrong**
          node_exporter on `{{ $labels.instance }}` could not parse {{ $value | printf "%.0f" }} file(s) in its textfile drop zone, and has been unable to for fifteen minutes.
          **Risk**
          The metrics in those files have stopped arriving while every other family node_exporter serves keeps working. The scrape still succeeds, so the boards those files feed go quiet with no other alert.
          **Severity and why**
          Warning. The host is healthy and the figures from that file are stale, not wrong, so this belongs to whoever runs Puppet Observability and waits for working hours. It does not page.
          **When to act**
          Working hours. Nothing is wrong on the host, the figures from that file are stale.
          **What to do**
          1. Check: which files are in the drop zone and how long since each was written, on the `Textfile Feeds` table on the Internal Operations board. A file whose age is climbing past its writer's interval is one the writer stopped updating; a file written recently and still failing is malformed.
          2. Cause: a file rewritten in place mid-scrape, which gives a transient parse error. It clears itself on the next successful write, so if the alert is still firing after the writer's next interval this is not the cause.
          3. Cause: a malformed file. Copy it to the dashboard node and run `promtool check metrics < the-file.prom` there, where promtool is installed, to see what is wrong with it, then fix the writer's output.
          4. Whatever the cause: fix the writer so it writes to a temporary name and renames into place, because node_exporter reads whatever is in the file when it scrapes. No change window is needed; the change is to the writer, not to PE.
          The alert clears on its own once node_exporter parses every file in the drop zone at a scrape.
          **Finding the rest**
          How many files are failing now: `node_textfile_scrape_error{instance="{{ $labels.instance }}"}` in Prometheus, which is the same number as the `Parse Failures` tile beside `Textfile Feeds`. node_exporter does not publish which file failed, so the list on `Textfile Feeds` is how you narrow it down. For the module's own feed, `systemctl status pobs-tune` on the primary says whether the timer that writes it is running.
          **Escalate**
          If the failing file is written by a plugin or a third-party collector, hand its owner the file, the `promtool check metrics` output and the time the `Textfile Feeds` age started climbing. The module's own feed belongs to whoever runs Puppet Observability.
          **Known noise**
          A writer that rewrites its file in place trips the parse error for one scrape on every write; the fifteen-minute hold absorbs that, so a firing alert is a file that has stayed broken. If the drop zone on a host is not yours to maintain, silence on `instance` in Alertmanager. The rule covers PE infrastructure only unless `observability::alerts::fleetwide_os_alerts` widens it.
        where_panel: pobs-operations/Textfile Feeds
        where: The "Textfile Feeds" table on the Internal Operations board, which
          lists every file in the drop zone with how long since it was written, beside
          the Parse Failures tile that carries this count.
  - name: pobs-custom_metrics
    rules:
    - alert: PobsCustomMetricPollStopped
      expr: "(time() - puppet_custom_metric_poll_timestamp_epoch) > 600"
      for: 5m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pobs custom metric poll loop on {{ $labels.instance }} has stopped
        description: |-
          **What is wrong**
          The custom metric poll loop on {{ $labels.instance }} last completed a cycle {{ $value | printf "%.0f" }} seconds ago, past the 600 seconds this rule allows, and has been past it for five minutes. It ticks about once a second when healthy, so the poll thread has died.
          **Risk**
          Every `puppet_custom_*` metric from this exporter is frozen at its last value and still being scraped, so Prometheus is recording numbers that stopped moving. The fleet metrics are unaffected.
          **Severity and why**
          Warning, because only the site-defined custom metrics freeze and the fleet metrics carry on; a failure of a Puppet Observability feature belongs to whoever runs it, not to whoever is on call for the estate. It waits for working hours.
          **When to act**
          Working hours, unless a custom metric feeds a dashboard or alert someone depends on overnight.
          **What to do**
          1. Cause: the poll thread raised something its rescue does not swallow and died. Check: on {{ $labels.instance }}, `sudo journalctl -u pobs | grep 'custom metric poll thread died'` has the exception class, and the lines after it the backtrace. That is the only record of it, so read it before restarting. Fix: if the backtrace names a custom metric definition, correct that definition first.
          2. Then: `sudo systemctl restart pobs`. The thread does not come back on its own. The restart empties the fleet store until the next poll completes, seconds on a small estate and longer at scale, so on a large estate do it in a quiet period.
          3. Last: `sudo /usr/local/bin/pobs-ctl status` confirms the daemon is up and polling.
          Whatever the cause: the alert clears at the next evaluation after the restart, once the heartbeat advances again.
          **Finding the rest**
          How long the metrics have been frozen: `time() - puppet_custom_metric_poll_timestamp_epoch{instance="{{ $labels.instance }}"}` is the seconds since the last completed cycle. Which metrics are affected: `puppet_custom_metric_enabled{instance="{{ $labels.instance }}"} == 1` lists every enabled custom metric, all of which are stale. `puppet_custom_metric_consecutive_failures{instance="{{ $labels.instance }}"} > 0` names any metric that was already failing before the thread died.
          **Escalate**
          If the thread dies again after the restart with the same backtrace and no custom metric definition explains it, hand the journal lines with the exception and backtrace, and the module version, to Puppet support.
          **Known noise**
          None known. If custom metrics are turned off the series is absent and the rule is inert, so it needs no knock-out.
        where_panel: pobs-custom-metrics/Time Since Last Poll
        where: The "Time Since Last Poll" tile on the Custom Metrics board, which
          shows how long since the poll loop last completed a cycle.
        thresholds: custom_metric_stale_seconds
  - name: pobs-delivery_health
    rules:
    - alert: PobsDeploymentStuck
      expr: puppet_delivery_deploy_in_flight_seconds > 3600
      for: 10m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $labels.deployment }} has been deploying for {{ $value | humanizeDuration
          }}"
        description: |-
          **What is wrong**
          CD4PE deployment `{{ $labels.deployment }}` has been in flight for {{ $value | humanizeDuration }}, measured from the earliest start time seen, over the 3600 second limit, and has not reached a finished state.
          **Risk**
          The code it carries has not landed, and nothing else shows that: the deployment's state is `running` and not `failed`, so the Failed tile on the Code Releases board reads zero and no deploy failure is logged. A deployment held open this long is usually holding its `rolling_deployment_<id>` environment open too, and removing that environment while compiles still reference it fails catalogue compilation fleet-wide.
          **Severity and why**
          Warning, so it waits for working hours. Nothing is down and no agent is affected; a release is late, and the one thing that would make it worse is deleting the environment under it.
          **When to act**
          Working hours. Nothing is down; a release is late.
          **What to do**
          1. Check: which step it is sitting on. Open the deployment in CD4PE and read its log. The Code Releases board's release table links each row to it, and `puppet_deploy_info{deployment="{{ $labels.deployment }}"}` carries the same URL as `deploy_url`.
          2. Check: the start-moved count for the same row on the Code Releases board, or `puppet_delivery_deploy_start_moves{deployment="{{ $labels.deployment }}"}`. CD4PE revises a start time once on a healthy deployment. One or zero moves with the age climbing is a hung step; a count well above one is a retry loop, so the step is failing and being re-queued.
          3. Cause: a hung step. The step's log in CD4PE stops with no error. Cancel the deployment in CD4PE and re-run it; a job waiting on an approval or an agent run that never reported is the usual reason.
          4. Cause: a retry loop. The step's log shows the same failure repeated. Fix what the failure names, then cancel and re-run.
          5. Whatever the cause: do not delete the `rolling_deployment_<id>` environment while the deployment is still in flight. The alert clears when the deployment leaves the `running`, `queued` or `pending` states, by finishing or by being cancelled.
          **Finding the rest**
          `puppet_deploy_info{deployment="{{ $labels.deployment }}"}` carries the environment, state, commit and `deploy_url` as labels. `puppet_delivery_deploy_start_moves{deployment="{{ $labels.deployment }}"}` is how many times the start time has moved: one is normal, several is looping. `puppet_delivery_deploy_in_flight_seconds{deployment="{{ $labels.deployment }}"}` is the age the alert fired on; it is capped at the lookback window, so a value sitting flat at the cap means the deployment is older than the window can show.
          **Escalate**
          If the step log gives no reason or the deployment cannot be cancelled, hand it to whoever owns CD4PE with the deployment URL, the step it is on, the start-moved count and the time it began.
          **Known noise**
          A legitimately long deployment, such as a large repo on a slow pipeline, crosses the limit while still healthy; if an estate's deploys routinely take longer, raise `deploy_stuck_seconds` under `observability::alerts::thresholds`.
        where_panel: pobs-releases/Still Deploying
        where: The "Still Deploying" table on the Code Releases board, which lists
          each CD4PE deployment that has not finished, how long it has been going,
          and how many times its start time has moved.
        thresholds: deploy_stuck_seconds
    - alert: PuppetserverServingOldCode
      expr: puppet_code_manager_file_sync_all_synced == 0
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: A compiler on {{ $labels.alias }} is serving code older than the
          last deploy
        description: |-
          **What is wrong**
          At least one File Sync client on `{{ $labels.alias }}` has not caught up with the primary's code storage for fifteen minutes, so it is compiling catalogues from the previous deploy for the nodes it serves.
          **Risk**
          The fleet is split: nodes behind that compiler get the old code and the rest get the new, and a change reported as deployed has not reached everyone. Until it catches up every run on those nodes applies the wrong catalogue.
          **Severity and why**
          Warning, so it waits for working hours by default. Every node is still getting a catalogue and running; it is the wrong one on part of the fleet, which costs time, not availability.
          **When to act**
          Working hours, or now if a deploy just went out that the whole fleet needs.
          **What to do**
          1. Check: which client. `puppet_code_manager_file_sync_client_synced{alias="{{ $labels.alias }}"} == 0`. The `client` label is the compiler's certname, or the primary's name with `-orchestrator` for the orchestrator's own client.
          2. Cause: the client cannot fetch. On that client, `sudo systemctl status pe-puppetserver` and `sudo grep -i 'file-sync' /var/log/puppetlabs/puppetserver/puppetserver.log | tail -30`. A client that cannot reach the primary on 8140, or whose disk is full, is the usual cause, and the log names which. Fix the reachability or the disk and the client catches up on its next poll.
          3. Then: if the log is quiet and the client still reads unsynced, a restart of pe-puppetserver on that client makes it fetch. On a multi-compiler estate pull it from the load balancer first, since the restart drops its in-flight compiles.
          4. Cause: the primary's File Sync storage, when several clients are behind at once. `sudo puppet infrastructure status` on the primary reports it.
          5. Whatever the cause: the alert clears on the next scrape after every client reports synced.
          **Finding the rest**
          When each client last checked in: `puppet_code_manager_file_sync_client_check_in_epoch{alias="{{ $labels.alias }}"}`, as a Unix time; a client whose check-in is old has stopped polling, one that is current but unsynced is polling and failing to fetch. When the primary last stored a deploy: `puppet_code_manager_file_sync_deploy_epoch{alias="{{ $labels.alias }}"}` per environment.
          **Escalate**
          If the client can reach the primary, has disk, and still does not sync after a restart, or if the primary's own File Sync status reports a fault, hand it to the PE administrator with the client name, the file-sync log lines and the `puppet infrastructure status` output. They take it to Puppet support with the same.
          **Known noise**
          Every client is briefly unsynced during a deploy, and a long deploy of a large repo can sit unsynced for several minutes; the fifteen-minute dwell absorbs the normal case. A deploy that routinely takes longer than that fires this and clears on its own once it lands; if that is the estate's normal, silence the `alias` in Alertmanager for the deploy window.
        where_panel: pobs-releases/File Sync Clients
        where: The "File Sync Clients" table on the Code Releases board, which lists
          each client with whether it has caught up and when it last checked in.
    - record: puppet_delivery_change_failure_ratio
      expr: (count by (alias) (puppet_deploy_end_epoch and on(deployment, alias) puppet_deploy_info{state!="done",state!="cancelled"})
        or on(alias) (count by (alias) (puppet_deploy_end_epoch) * 0)) / count by
        (alias) (puppet_deploy_end_epoch)
    - record: puppet_delivery_code_changes_7d
      expr: changes(puppet_code_deploy_timestamp_epoch[7d])
    - record: puppet_delivery_deploy_duration_seconds
      expr: puppet_deploy_end_epoch - on(deployment, alias) puppet_deploy_start_epoch
    - record: puppet_delivery_deploy_in_flight_seconds
      expr: (time() - min_over_time(puppet_deploy_start_epoch[21600s])) and on(deployment,
        alias) (puppet_deploy_info{state=~"running|queued|pending"} == 1)
    - record: puppet_delivery_deploy_start_moves
      expr: changes(puppet_deploy_start_epoch[21600s]) and on(deployment, alias) (puppet_deploy_info
        == 1)
    - record: puppet_delivery_fleet_converged_ratio
      expr: |-
        sum by (environment, alias) (puppet_code_deploy_status_nodes) / on(environment, alias) (
          count by (environment, alias) ((time() - puppet_report_timestamp_epoch) < 3600)
          or max by (environment, alias) (puppet_node_count{environment!="all"})
        )
    - record: puppet_delivery_pipeline_deploys_7d
      expr: count by (environment, alias) ((puppet_deploy_start_epoch > time() - 604800)
        * on(deployment, alias) group_left(environment) puppet_deploy_info)
    - record: puppet_delivery_seconds_unconverged
      expr: |-
        (time() - puppet_code_deploy_timestamp_epoch) and on(environment, alias) (sum by (environment, alias) (puppet_code_deploy_status_nodes) / on(environment, alias) (
          count by (environment, alias) ((time() - puppet_report_timestamp_epoch) < 3600)
          or max by (environment, alias) (puppet_node_count{environment!="all"})
        ) < 1)
  - name: pobs-exporter
    rules:
    - alert: PobsAlertRulesStale
      expr: count(puppet_exporter_build_info unless on(version) pobs_alert_rules_info)
        > 0
      for: 6h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: The Prometheus rules loaded here are not the ones this Puppet Observability
          ships
        description: |-
          **What is wrong**
          This Prometheus is evaluating a Puppet Observability rule set rendered at a different module version from the exporter it scrapes. The two have disagreed for at least six hours.
          **Risk**
          Rules that were changed or removed in the newer version are still paging at their old thresholds, and rules added since have never arrived. Every page from this Prometheus is suspect until the versions agree.
          **Severity and why**
          Warning, because a module release makes this true until somebody merges and deploys the regenerated rules, and a page on every release would teach people to close it. It waits for working hours; the six-hour dwell rides out a same-day merge.
          **When to act**
          Next working day. Nothing is down; the rule set is behind.
          **What to do**
          1. Cause: the rules are behind the exporter. Check: `count by (version) (pobs_alert_rules_info)` is what the rules say they were rendered at and `count by (version) (puppet_exporter_build_info)` is what the exporter runs. Healthy is one version in each and the same one in both; unhealthy is two different versions, or no `pobs_alert_rules_info` series at all. Fix: render the rule set again at the exporter's version and deploy it. On the primary, `sudo /opt/puppetlabs/puppet/bin/ruby /etc/puppetlabs/code/environments/production/modules/observability/files/pobs_ctl.rb alerts prometheusrule` writes the PrometheusRule for a Kubernetes stack; on a Puppet-managed Prometheus the next Puppet run after the module upgrade writes it.
          2. Cause: the exporter is behind the rules. Check: the same two queries, with the exporter's version the older of the two. Fix: upgrade the module on the primary so the daemon matches the rules. A module upgrade restarts the daemon, so do it in a change window if the estate has one.
          3. Cause: two Prometheuses hold different rule sets. Check: two versions in `pobs_alert_rules_info` at once. Fix: redeploy the rules on the one that is behind, as in step 1.
          Whatever the cause: the alert clears on the next evaluation after both versions match. Nothing clears it without a redeploy.
          **Finding the rest**
          Both versions side by side: `label_replace(puppet_exporter_build_info, "what", "Exporter ships", "", "") or label_replace(pobs_alert_rules_info, "what", "Rules loaded here", "", "")`; a `pobs_alert_rules_info` version with no matching `puppet_exporter_build_info` is the stale copy.
          **Escalate**
          If the regenerated rules have been deployed and the versions still disagree after the next evaluation, hand the two version queries' output and the deploy time to whoever runs the Prometheus (the platform team for a Kubernetes stack, the PE administrator for a Puppet-managed one). The rule file may be coming from a source other than the one that was regenerated.
          **Known noise**
          Fires for up to six hours after every module upgrade until the rules are redeployed; no action beyond the redeploy. If a site deliberately pins its rule set behind the module, silence it with `amtool --alertmanager.url=http://localhost:9093 silence add 'alertname="PobsAlertRulesStale"'` on the dashboard node for the duration of the pin.
        where_panel: pobs-operations/Rule Set Version
        where: The "Rule Set Version" panel on the Internal Operations board, which
          shows the version the exporter ships beside the version of the rules this
          Prometheus has loaded.
    - alert: PobsDuplicateDaemon
      expr: puppet_exporter_peers > 1
      for: 30m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: '{{ $value | printf "%.0f" }} Puppet Observability daemons are polling
          the PuppetDB {{ $labels.instance }} reads'
        description: |-
          **What is wrong**
          PuppetDB says {{ $value | printf "%.0f" }} nodes have been classified with Puppet Observability for thirty minutes, and it belongs on one node per PE installation.
          **Risk**
          Every fleet metric is exported once per daemon under a different alias. With the PE picker set to All, counts read multiplied, and threshold alerts fire at a fraction of their real level.
          **Severity and why**
          Warning, because the figures are wrong by a known factor and nothing is unmonitored; the thirty-minute dwell is there so a planned move between nodes does not page. It waits for working hours.
          **When to act**
          Next working day. If Puppet Observability is being moved between nodes, two is expected until the old one is unclassified, and the thirty-minute dwell covers a normal migration.
          **What to do**
          1. Cause: the class is on an HA replica, DR primary or a node left over from a move. Check: on the primary, `sudo journalctl -u pobs | grep 'classified with Puppet Observability'` names every node PuppetDB returned; healthy is one name. Fix: on the extra node, set `observability::ensure: absent` at a Hiera level only that node reads, deploy, and run `sudo /opt/puppetlabs/bin/puppet agent -t` there. That stops the service, removes the unit and withdraws the scrape target. Removing the class on its own leaves the daemon running.
          2. Then: remove the `observability` class from that node's classification and the Hiera key with it, deploy, and run Puppet there again. The "Every fleet figure reads double" section of docs/operate/troubleshooting.md has the same steps and where to look for the classification.
          Whatever the cause: the alert clears on the next poll after PuppetDB shows one classified node, which is after step 2, not step 1.
          **Finding the rest**
          How many nodes carry the class: `puppet_exporter_peers` counts nodes whose latest catalogue contains class `observability`, so it stays at 2 until step 2 lands; every daemon on the shared PuppetDB reports the same count. Which aliases are exporting: `count by (alias) (puppet_exporter_build_info)` lists one row per daemon, and the extra alias is the extra daemon.
          **Escalate**
          If the classification is managed outside your reach (a node group or a Hiera layer another team owns), hand the extra node's name and the journal line to the PE administrator to remove it.
          **Known noise**
          Fires during a planned move of Puppet Observability between nodes that takes longer than thirty minutes. Silence it for the move with `amtool --alertmanager.url=http://localhost:9093 silence add 'alertname="PobsDuplicateDaemon"'` on the dashboard node.
        where_panel: pobs-operations/Daemons On This Fleet
        where: The "Daemons On This Fleet" tile on the Internal Operations board,
          which reads the number of nodes PuppetDB says carry Puppet Observability.
    - alert: PobsExporterDown
      expr: up{job="puppet"} == 0
      for: 10m
      labels:
        severity: critical
        exporter: pobs daemon
        pobs: 'true'
      annotations:
        summary: The Puppet Observability daemon for {{ $labels.alias }} is not answering
          scrapes on {{ $labels.instance }}
        description: |-
          **What is wrong**
          Prometheus cannot scrape the Puppet Observability daemon for {{ $labels.alias }} at {{ $labels.instance }}, and has not been able to for ten minutes.
          **Risk**
          Every Puppet metric from this primary is stale, and every rule that reads them has gone quiet because its series are no longer arriving. Certificate expiry, licence headroom and fleet failure are unwatched for {{ $labels.alias }} until this comes back.
          **Severity and why**
          Critical, because the whole estate behind this primary is unmonitored and no other Puppet Observability rule can say so. It pages.
          **When to act**
          Now. The estate behind this primary is unmonitored while it stays down.
          **What to do**
          1. Cause: the daemon is not running or is still starting. Check: on the primary, `sudo systemctl status pobs`, then `sudo /usr/local/bin/pobs-ctl status`. The second reads the daemon's `/healthz` and prints NOT RUNNING when nothing answers, or the daemon's state (`starting` or `stale`) when it answers but is not yet serving. Healthy is an active service and a status of serving. Fix: if the service is restarting, `journalctl -u pobs | grep -E 'thread died|watchdog withholding'` says why; fix what it names and let it come up. The "Service restarts on a loop" and "Service fails to start" sections of docs/operate/troubleshooting.md cover the common reasons.
          2. Cause: the daemon answers locally and the fault is between Prometheus and the primary. Check: Prometheus's own Targets page gives the scrape error. `connection refused` is a firewall or a moved `listen_port`, `context deadline exceeded` is a dropped connection, `lookup ... no such host` is DNS, and `server gave HTTP response to HTTPS client` is a daemon on plain HTTP scraped by a job on mTLS. Fix: for the last one, turn on `observability::metrics_tls` on that primary, or for a second PE installation give its `extra_scrape_targets` entry `scheme: http`. For the others, open the port or correct the name wherever the site manages firewalls and DNS.
          Whatever the cause: the alert clears on the first successful scrape after the fix. No restart of Prometheus is needed.
          **Finding the rest**
          Whether it is down or flapping: `changes(up{instance="{{ $labels.instance }}"}[24h])` is how many times the target has changed state today; a high number is a restarting daemon. Whether the other primaries are still being scraped: `up` filtered to the Puppet Observability scrape job (the same job as this alert's expression) lists every target with 1 or 0. The exception behind a restart loop: `sudo journalctl -u pobs -n 100` on the primary.
          **Escalate**
          If the daemon is up and answering locally but the scrape error is a firewall or DNS fault, hand the scrape error text and the port to the platform or network team. If the daemon will not start and the journal names an exception you cannot act on, hand the journal lines and the module version to Puppet support.
          **Known noise**
          Fires during a planned primary rebuild or a Puppet Observability move between nodes. Silence it for the window with `amtool --alertmanager.url=http://localhost:9093 silence add 'alertname="PobsExporterDown" alias="{{ $labels.alias }}"'` on the dashboard node.
    - alert: PobsFilterFactRefused
      expr: puppet_exporter_filter_fact_usable == 0
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pobs on {{ $labels.instance }} stopped applying the {{ $labels.dimension
          }} board filter
        description: |-
          **What is wrong**
          The daemon on {{ $labels.instance }} has refused the `{{ $labels.dimension }}` dimension from `observability::filter_facts` for fifteen minutes. Its values are too close to one per node to work as a grouping label.
          **Risk**
          The `{{ $labels.dimension }}` picker on the boards filters nothing. No data is lost and no other series is affected.
          **Severity and why**
          Warning, because only a board picker is affected and no series is lost. It waits for a change window.
          **When to act**
          Next change window. Nothing is degraded apart from the picker.
          **What to do**
          1. Cause: the fact names machines or changes on every run, so it can never group nodes. Check: the measurement on the Internal Operations board, and `puppet_exporter_filter_fact_nodes{instance="{{ $labels.instance }}",dimension="{{ $labels.dimension }}"}` for how many nodes report it. Healthy is a fact with a handful of values across many nodes. Fix: pick a replacement fact that groups nodes and test it on the primary before configuring it with `sudo /usr/local/bin/pobs-ctl filter-fact <fact path>`, which prints the verdict the daemon would reach. Then replace or remove the dimension in `observability::filter_facts` and let Puppet apply it.
          2. Inferred cause: the fact is a reasonable grouping but only a few nodes report it yet, so its values read as unique. Check: the node count from the query above is small and growing. Fix: leave it; the daemon applies the dimension again once the values settle.
          Whatever the cause: the alert clears when the dimension is removed, or on its own if the fact's values settle and the daemon applies it again.
          **Finding the rest**
          Which dimensions are still applied: `puppet_exporter_filter_fact_usable{instance="{{ $labels.instance }}"} == 1`.
          **Escalate**
          Not an escalation; the fix is a Hiera change by whoever maintains `observability::filter_facts`. Hand them the dimension name and the `pobs-ctl filter-fact` output for the candidate replacement.
          **Known noise**
          Fires while a new fact is being rolled out and most nodes do not report it yet. If the rollout will finish on its own, silence it for the rollout with `amtool --alertmanager.url=http://localhost:9093 silence add 'alertname="PobsFilterFactRefused" dimension="{{ $labels.dimension }}"'` on the dashboard node.
        where_panel: pobs-operations/Board Dimensions
        where: The "Board Dimensions" table on the Internal Operations board, which
          shows each configured dimension as Applied or Refused with the measurement
          behind the verdict.
    - alert: PobsMetricsStale
      expr: time() - puppet_exporter_last_scrape_timestamp > 1800
      for: 5m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pobs data on {{ $labels.instance }} is over thirty minutes old
        description: |-
          **What is wrong**
          The poll loop on {{ $labels.instance }} last completed a cycle {{ $value | humanizeDuration }} ago, past the thirty minutes this rule allows, and has been past it for five minutes. The stamp is written at cycle end, so the whole loop has not come round, not one collector.
          **Risk**
          The scrape still succeeds, so every board reads as current while showing data this old. Threshold rules are comparing against stale values.
          **Severity and why**
          Warning, because the daemon is up and serving and a slow cycle still completes; it would be critical if the daemon had stopped, and PobsExporterDown covers that. It waits for working hours.
          **When to act**
          Next working day unless the age keeps growing past a full poll interval. A loop that is slow still completes; a loop that has stopped needs attention sooner.
          **What to do**
          1. Cause: the polling interval was widened and this threshold was not. Check: compare thirty minutes against `observability::polling_interval` on the primary. Fix: widen `metrics_stale_seconds` and `metrics_stale_human` together under `observability::alerts::thresholds`, and there is nothing else to do.
          2. Cause: one collector is holding the cycle open. Check: on the primary, `sudo /usr/local/bin/pobs-ctl status` shows the same age on its Last poll line, with the last cycle's duration. If the daemon is running, the watchdog is still seeing collectors complete, so the cycle is running long. Fix: find the slow collector on the Internal Operations board and fix what it reads; PobsCollectorSlow usually fires alongside and names it.
          Whatever the cause: the alert clears when a cycle completes inside the allowance. Nothing recovers on its own while a collector holds the cycle open.
          **Finding the rest**
          The cost of a full sweep against the interval: `puppet_exporter_poll_duration_seconds{instance="{{ $labels.instance }}"} / puppet_exporter_polling_interval_seconds{instance="{{ $labels.instance }}"}`, the sum of every collector's last run; above 1 means running them all once takes longer than the interval. The Slowest Collectors table on the Internal Operations board names the collector.
          **Escalate**
          If the slow collector reads PuppetDB or the console and the query itself is slow, hand the collector name, the cycle duration and the time window to the PE administrator; the fix is on the PE side.
          **Known noise**
          Fires once after a daemon restart on a large estate while the first full cycle runs; it clears when that cycle completes. If the estate runs a long `observability::polling_interval` by design, tune `metrics_stale_seconds` and `metrics_stale_human` under `observability::alerts::thresholds` to match.
        where_panel: pobs-operations/Poll Cycle Load
        where: The "Poll Cycle Load" tile on the Internal Operations board, which
          shows the cost of a full sweep, every collector's last run summed, as a
          percentage of the polling interval.
        thresholds: metrics_stale_human, metrics_stale_seconds
    - alert: PobsPluginLoadFailed
      expr: puppet_exporter_plugin_load_failures > 0
      for: 10m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pobs on {{ $labels.instance }} refused {{ $value | printf "%.0f"
          }} plugin collector(s)
        description: |-
          **What is wrong**
          {{ $value | printf "%.0f" }} plugin collector(s) on {{ $labels.instance }} were refused when the daemon started, and the refusal has stood for ten minutes.
          **Risk**
          A refused plugin publishes nothing and looks exactly like one nobody installed: no collector, no failure count, no row in the freshness table. The boards fed by its families sit empty, and no collector rule covers it.
          **Severity and why**
          Warning, because only the site's own plugin metrics are missing and the fleet metrics carry on. It waits for working hours.
          **When to act**
          Working hours. Nothing else is degraded, and it will not clear on its own.
          **What to do**
          1. Cause: file mode or ownership. Check: `puppet_exporter_plugin_load_failed{instance="{{ $labels.instance }}"}` has one series per rejection with `plugin` and `reason` labels; `Errno::EACCES` is this cause. The plugin directory is root-owned and the daemon runs as `pe-puppet`, so a root-owned 0644 file is the shape that loads. Fix: set that mode and owner.
          2. Cause: the plugin's Ruby does not parse or load. Check: the `reason` label is `SyntaxError` or a load error. Fix: `sudo /usr/local/bin/pobs-ctl plugin check <plugin dir>` on the primary reports the problems a plugin has before it is loaded; correct what it names.
          3. Then: `sudo systemctl restart pobs`. Loading is decided once at boot, so a fix does not count until the restart. The restart empties the fleet store until the next poll completes.
          Whatever the cause: the alert clears on the first scrape after a restart that loads every plugin.
          **Finding the rest**
          How many plugins did load: `puppet_exporter_plugins_loaded{instance="{{ $labels.instance }}"}`. Whether a refused plugin also shipped boards or rules that were not provisioned: the Plugin Boards And Rules Refused table on the same board. The daemon's own account of the refusal: `sudo journalctl -u pobs -n 100` on the primary after a restart.
          **Escalate**
          If `pobs-ctl plugin check` passes and the daemon still refuses the plugin, hand the `reason` label and the journal lines from the restart to the plugin's author. If the plugin is one the module ships, hand the same to Puppet support.
          **Known noise**
          Fires for a plugin that was deliberately left in place but broken. Remove the file or silence the alert with `amtool --alertmanager.url=http://localhost:9093 silence add 'alertname="PobsPluginLoadFailed" instance="{{ $labels.instance }}"'` on the dashboard node until it is fixed.
        where_panel: pobs-operations/Which Plugins Were Refused, And Why
        where: The "Which Plugins Were Refused, And Why" table on the Internal Operations
          board, which lists each refused plugin with the reason the daemon gave.
    - alert: PobsPollOverrun
      expr: puppet_exporter_poll_duration_seconds > puppet_exporter_polling_interval_seconds
      for: 10m
      labels:
        severity: warning
        exporter: pobs daemon
        pobs: 'true'
      annotations:
        summary: 'The Puppet Observability daemon for {{ $labels.alias }} is behind:
          its poll takes {{ $value | humanizeDuration }}, longer than its interval'
        description: |-
          **What is wrong**
          The Puppet Observability daemon for {{ $labels.alias }} at {{ $labels.instance }} takes {{ $value | humanizeDuration }} to complete one poll of PE, longer than the interval it is set to poll on, and has for ten minutes. Each sweep starts late, so every figure the daemon serves is as old as the last completed sweep.
          **Risk**
          Nothing the daemon serves is wrong, but all of it is late. Silent-node counts, run states and collector ages read older than they are, PobsFleetSilent and the per-node silence alerts can fire on a stale snapshot, and a collector that misses three cycles trips PobsCollectorStale. The Data Age tile stays green throughout, because it measures the scrape and not the poll.
          **Severity and why**
          Warning. The daemon is up and the scrape succeeds; the data is late, not missing. The silence alerts are held down while this fires, so this is the one notification for the condition.
          **When to act**
          Next working day if the value is steady; today if it is climbing, because a sweep that keeps lengthening ends in PobsCollectorStale and then blank boards.
          **What to do**
          1. Cause: PuppetDB is slow to answer, usually a command backlog after a mass change or a fill. Check: the Queue Depth tile on the PuppetDB board for the same window, and `puppet_exporter_collector_duration_seconds{instance="{{ $labels.instance }}", collector="fleet"}` for the fleet collector's share of the sweep. Fix: let the backlog drain; the alert clears on its own once sweeps complete inside the interval.
          2. Cause: the estate has outgrown the interval. Check: `puppet_exporter_nodes{instance="{{ $labels.instance }}"}` against the sizing page's ladder, and the Sweep Cost panel on Internal Operations for which collector carries the time. Fix: a longer `observability::polling_interval`, or the collector-level intervals for the slow one, per the sizing page.
          3. Cause: the primary is starved. Check: load and CPU on the primary's host board. Fix: what is competing with it; a mass agent run or a PuppetDB garbage collection passes on its own.
          Whatever the cause: the alert clears once ten minutes of sweeps complete inside the interval.
          **Finding the rest**
          The sweep against its interval over time: `puppet_exporter_poll_duration_seconds{instance="{{ $labels.instance }}"} / puppet_exporter_polling_interval_seconds{instance="{{ $labels.instance }}"}`, above 1 while behind. Which collector: `topk(5, puppet_exporter_collector_duration_seconds{instance="{{ $labels.instance }}"})`. How stale the fleet snapshot is: `time() - puppet_exporter_collector_last_success_timestamp{instance="{{ $labels.instance }}", collector="fleet"}`.
          **Escalate**
          If sweeps stay over the interval with PuppetDB idle and the primary quiet, hand the Sweep Cost panel's breakdown and the node count to whoever sizes the monitoring: the fix is an interval or a split estate, not a daemon change.
          **Known noise**
          Fires through a synthetic fill or a mass catalogue change while PuppetDB ingests, and clears when the ingest does. Silence it for the window with `amtool --alertmanager.url=http://localhost:9093 silence add 'alertname="PobsPollOverrun" alias="{{ $labels.alias }}"'` on the dashboard node.
        where_panel: pobs-noc/Poll Lag
        where: The "Poll Lag" line across the top of the NOC, the sweep as a share
          of its interval; the Sweep Cost panel on Internal Operations says which
          collector.
    - alert: PobsPrometheusConfigNotLoaded
      expr: prometheus_config_last_reload_successful == 0
      for: 10m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: Prometheus on {{ $labels.instance }} rejected its configuration and
          is running the previous one
        description: |-
          **What is wrong**
          Prometheus on {{ $labels.instance }} refused its configuration on the last reload and has been evaluating the one before it for ten minutes.
          **Risk**
          Anything written since the last good reload is on disk and not in effect: new or changed rules, scrape jobs, thresholds somebody raised. The old rules still run, so a threshold that was changed is still paging at the old value. Every board looks normal because the old configuration still works, and the Puppet run that wrote the file reported success.
          **Severity and why**
          Critical, because every alert and every silence from this Prometheus is untrustworthy while it runs a configuration nobody can see. It pages.
          **When to act**
          Now. Until it is fixed, treat every alert from this Prometheus as suspect, and treat silence as suspect too.
          **What to do**
          1. Cause: a rule file in the rules directory does not parse. Prometheus loads every rule file or none, so one bad file from any component takes out the whole set. Check: on {{ $labels.instance }}, `promtool check rules /etc/prometheus/rules/*.yaml`. Healthy prints SUCCESS for every file; unhealthy names the file and the line. Fix: correct or remove that file and reload Prometheus. A file written by a component outside Puppet Observability belongs to that component's owner; removing it loses only their rules, so that is the safe immediate step.
          2. Cause: the main configuration itself is bad. Check: every rule file passes and `journalctl -u prometheus --since -1h | grep -i 'error loading config'` on {{ $labels.instance }} has the message. Fix: correct what it names and reload.
          Whatever the cause: the alert clears on the first successful reload. Nothing clears it without one.
          **Finding the rest**
          Whether the rules now loaded are the ones the exporter ships: `count by (version) (pobs_alert_rules_info)`, which PobsAlertRulesStale also watches. What the reload said: `journalctl -u prometheus --since -1h` on {{ $labels.instance }}.
          **Escalate**
          If the failing file belongs to another team's component, hand them the `promtool` output and the file path; do not edit their rules beyond removing the file to restore alerting. If the main configuration is wrong and it is Puppet-managed, hand the journal lines and the time of the last Puppet run to the PE administrator.
          **Known noise**
          None known. Where Prometheus does not scrape itself the series is absent and the rule is silent, which is a configuration choice and not noise.
        where_panel: pobs-operations/Rules Config Loaded
        where: The "Rules Config Loaded" tile on the Internal Operations board, which
          reads 0 while Prometheus is running a configuration it rejected.
    - alert: PobsRenderSectionFailing
      expr: puppet_exporter_render_sections_failed > 0
      for: 15m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: pobs on {{ $labels.instance }} cannot render {{ $value | printf "%.0f"
          }} metric section(s)
        description: |-
          **What is wrong**
          {{ $value | printf "%.0f" }} metric section(s) on {{ $labels.instance }} raised an exception during the last render and have kept failing for fifteen minutes. Their metric families are missing from every scrape.
          **Risk**
          The panels that read those families show No data, and no rule that reads them can fire, because an absent series does not alert. The rest of the response is intact, so nothing else reports this.
          **Severity and why**
          Critical, because the failing section may be the one that carries certificate, licence or fleet series, and the alert cannot tell which until someone reads the section label. It pages.
          **When to act**
          Now. Whatever the failing section carries is unwatched.
          **What to do**
          1. Cause: one node is reporting a fact value in a shape the renderer did not expect. Check: `puppet_exporter_render_section_failed{instance="{{ $labels.instance }}"}` has one series per failed section, named in its `section` label, and on the primary `sudo journalctl -u pobs | grep 'render section'` has the exception class and message for each. Healthy is no series and no lines. Fix: the message names the value; find the node and fix the fact at its source. No restart is needed.
          2. Cause: a collector plugin is publishing into the reserved `puppet_*` namespace. Check: the failed section's label is the plugin's own section name. Fix: change the plugin's metric names out of that namespace, then `sudo systemctl restart pobs` so the plugin reloads.
          Whatever the cause: the alert clears on the first render after the input data changes. A restart on its own does not help, because the same data renders the same way.
          **Finding the rest**
          How long each section has been failing: `changes(puppet_exporter_render_section_failed{instance="{{ $labels.instance }}"}[7d])` is 0 for a section that has failed on every render this week. Which families a section carries: `files/lib/pobs/collector_families.yaml` in the module.
          **Escalate**
          If the fact at fault is correct for the node and the renderer still refuses it, hand the journal line with the exception and the fact value to Puppet support. If the section belongs to a plugin, hand the same to the plugin's owner.
          **Known noise**
          None known.
        where_panel: pobs-operations/Render Sections Failed
        where: The "Render Sections Failed" tile on the Internal Operations board,
          which counts the sections missing from the current scrape.
    - alert: PobsScrapeConfigMissing
      expr: absent(up{job="puppet"})
      for: 10m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: Prometheus has no Puppet Observability scrape target at all
        description: |-
          **What is wrong**
          Prometheus has had no `up` series for the Puppet Observability job for ten minutes, so it has no scrape target for it at all.
          **Risk**
          Every rule keyed on Puppet Observability's own series is inert, PobsExporterDown included. The estate is unmonitored by Puppet Observability. Nothing degrades further while this stands.
          **Severity and why**
          Critical, because it is the one failure the other rules cannot see: with no target there is no series for them to compare. It pages.
          **When to act**
          Now.
          **What to do**
          1. Cause: the job name differs between the three places it is set. Check: `observability::alerts::prometheus_job` on the Prometheus node, `observability::scrape_job_name` on the primary, and the `job_name` in the scrape config on the Prometheus host. All three default to `puppet`. Healthy is three identical values; unhealthy is one that differs. Fix: change the other two to match the one that was changed, and let Puppet apply it.
          2. Cause: the scrape config was never applied on the Prometheus side. Check: all three names agree and Prometheus's own Targets page lists no Puppet Observability job. Fix: apply the config and reload Prometheus.
          Whatever the cause: the alert clears on the first scrape, successful or not, because `up` exists from the first attempt. There is nothing to restart on the primary.
          **Finding the rest**
          What jobs Prometheus does have: `count by (job) (up)` lists every job name it is scraping; the Puppet Observability one appearing under a different spelling is the mismatch in step 1. Whether the primary is serving at all: on the primary, `sudo /usr/local/bin/pobs-ctl status`, which does not need Prometheus.
          **Escalate**
          If the three names agree and the scrape job is still absent after a Puppet run on the Prometheus node, hand the `count by (job) (up)` output and the time of that run to whoever owns the Prometheus configuration (the PE administrator where `observability::dashboard_server` manages it, the platform team otherwise).
          **Known noise**
          Fires for a few minutes on a fresh install before the first scrape config lands, and on a dashboard node rebuild. Both clear on the first scrape and need no action.
    - alert: PobsScrapeSlow
      expr: scrape_duration_seconds{job="puppet"} > 30
      for: 15m
      labels:
        severity: warning
        exporter: pobs daemon
        pobs: 'true'
      annotations:
        summary: Scrapes of the Puppet Observability daemon for {{ $labels.alias }}
          are taking {{ $value | humanizeDuration }}, close to the scrape timeout
        description: |-
          **What is wrong**
          Prometheus's scrapes of the Puppet Observability daemon for {{ $labels.alias }} at {{ $labels.instance }} are taking {{ $value | humanizeDuration }}, over the 30 s this rule allows, and have been for fifteen minutes. The scrape is still succeeding.
          **Risk**
          The scrape job has a timeout, 45 s as the module ships it. A scrape that crosses it is abandoned, Prometheus records nothing for that target, and every board and rule that reads the daemon's metrics goes blank at once; PobsExporterDown then fires once that has persisted. This rule is the warning before it.
          **Severity and why**
          Warning, because the scrapes are completing and the data is current. It waits for working hours.
          **When to act**
          Next working day, unless the Scrape Time sparkline is still climbing, in which case treat it as the day's work: once it crosses the timeout the estate behind this primary is unmonitored.
          **What to do**
          1. Cause: the daemon's render is the slow part. Check: `puppet_exporter_render_duration_seconds{instance="{{ $labels.instance }}"}` against this alert's value; if the render is most of it, the Slowest Render Sections panel on the Internal Operations board names the section. Fix: a slow `render_node_metrics` means the per-node families are large for this estate; set `observability::enable_per_node_metrics` to the families the boards need or turn it off, per the sizing page. A slow `collector:<name>` is a plugin collector doing fleet-sized work in its render.
          2. Cause: the render is quick and the time is in transfer and Prometheus's parse. Check: the gauge above is small next to this alert's value, and `puppet_exporter_nodes{instance="{{ $labels.instance }}"}` is large. Fix: fewer series per scrape, which is the same per-node setting, or a longer `observability::dashboard_server::scrape_interval`, which raises the timeout with it (the module sets the timeout from the interval). Splitting the estate across daemons is the lasting fix past about 100,000 nodes.
          3. Cause: the primary is busy with something else and the daemon is starved. Check: load and CPU on the primary's host board for the same window; a PuppetDB command backlog or a mass agent run shows there. Fix: wait for it to pass; the alert clears on its own.
          Whatever the cause: the alert clears once fifteen minutes of scrapes complete under the threshold. Raising `scrape_slow_seconds` under `observability::alerts::thresholds` clears it too, and is only right if the timeout was raised with it.
          **Finding the rest**
          How far from the timeout: `scrape_duration_seconds{instance="{{ $labels.instance }}"}` is this alert's value over time, and the timeout is `scrape_timeout` on the job in `/etc/prometheus/prometheus.yaml` on the dashboard node. The daemon's share: `puppet_exporter_render_duration_seconds{instance="{{ $labels.instance }}"}`, and `topk(8, puppet_exporter_render_section_duration_seconds{instance="{{ $labels.instance }}"})` for which section. The size of the body: `scrape_samples_scraped{instance="{{ $labels.instance }}"}` is how many samples Prometheus parsed on the last scrape.
          **Escalate**
          If the render is quick and the samples are what the estate needs, hand whoever sizes the monitoring the sample count and the scrape time: the fix is a bigger Prometheus or a split estate, not a daemon change.
          **Known noise**
          Fires for the duration of a synthetic fill or a mass catalogue change, when PuppetDB's ingest competes with the daemon for the primary's CPU. Silence it for the window with `amtool --alertmanager.url=http://localhost:9093 silence add 'alertname="PobsScrapeSlow" alias="{{ $labels.alias }}"'` on the dashboard node.
        where_panel: pobs-operations/Scrape Time
        where: The "Scrape Time" stat on the Internal Operations board, with Render
          Time beside it for the daemon's share and Slowest Render Sections below
          for which section.
        thresholds: scrape_slow_seconds
    - alert: PobsStoreAtCeiling
      expr: puppet_exporter_store_at_ceiling == 1
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pobs node store on {{ $labels.alias }} is at its store ceiling
        description: |-
          **What is wrong**
          The node store on {{ $labels.alias }} has reached `observability::store_ceiling_mb` and has stayed there for fifteen minutes. It has already dropped every node's per-node report detail it can and is now refusing new nodes.
          **Risk**
          The fleet view is missing a stable set of machines, and the oldest nodes have no per-node report metrics. Nodes already held keep updating, so the counts look plausible while a fixed set is invisible.
          **Severity and why**
          Warning, because the gap is stable and the daemon keeps serving everything it already holds; it would be critical if the store were shedding nodes it had, and it is not. It waits for working hours.
          **When to act**
          Next working day. The data gap is stable and does not widen on its own.
          **What to do**
          1. Cause: departed nodes have not been pruned. Pruning only runs after a poll cycle that succeeded against every configured PuppetDB, so one unreachable server leaves departed nodes in the store forever. Check: whether PobsPuppetDBServerDown is also firing, and whether `puppet_exporter_nodes{alias="{{ $labels.alias }}"}` is higher than the node count PE reports. Fix: repair the PuppetDB connection first; the store shrinks on the next successful cycle.
          2. Cause: the fleet is genuinely larger than the ceiling allows. Check: the node count matches PE and no PuppetDB rule is firing. Fix: raise `observability::store_ceiling_mb` on the primary and let Puppet apply it. The ceiling bounds the store estimate, not the process, so read `puppet_exporter_process_rss_bytes{alias="{{ $labels.alias }}"}` first and size the host for it before going far.
          Whatever the cause: the alert clears when the store falls under the ceiling, either because pruning removed departed nodes or because the ceiling was raised. Refused nodes are picked up on the next poll after that.
          **Finding the rest**
          How full the store is: `puppet_exporter_store_estimated_mb{alias="{{ $labels.alias }}"}` against `puppet_exporter_store_ceiling_mb{alias="{{ $labels.alias }}"}`. How many nodes have been turned away since the daemon started: `puppet_exporter_store_refused_total{alias="{{ $labels.alias }}"}`. How many nodes lost report detail: `puppet_exporter_store_shed_total{alias="{{ $labels.alias }}"}`. How many nodes the store holds: `puppet_exporter_nodes{alias="{{ $labels.alias }}"}`. The Ceiling Used tile on the same board is a different figure, nodes against the recommended node ceiling, so do not read it for this. The "Memory ceiling reached" section of docs/operate/troubleshooting.md has the same steps.
          **Escalate**
          If raising the ceiling would need more memory than the primary has, hand the RSS figure and the node count to the PE administrator to size the host or move Puppet Observability to a node that can hold it.
          **Known noise**
          Fires for the week after a large decommission, because departed nodes are kept for a week before pruning resumes. If the count will fall on its own, silence it for the week with `amtool --alertmanager.url=http://localhost:9093 silence add 'alertname="PobsStoreAtCeiling" alias="{{ $labels.alias }}"'` on the dashboard node.
        where_panel: pobs-operations/Store Memory
        where: The "Store Memory" tile on the Internal Operations board, which shows
          the store estimate against the ceiling; Nodes Refused Since Restart beside
          it counts what has been turned away.
    - record: pobs_alert_rules_info
      expr: vector(1)
      labels:
        version: 0.11.0
  - name: pobs-findings
    rules:
    - alert: PobsFindingsClockSkew
      expr: puppet_findings_clock_skew_seconds > 300
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Scanner {{ $labels.source }} claims its newest scan is {{ $value
          | humanizeDuration }} into the future
        description: |-
          **What is wrong**
          The newest scan from findings source `{{ $labels.source }}` carries a scan time {{ $value | humanizeDuration }} ahead of the primary's clock, more than 300 seconds for fifteen minutes.
          **Risk**
          The scanner's clock, or the primary's, is wrong. While they disagree, that source's scan age reads as zero, so a scanner that has stopped scanning looks current on every board and in every answer the MCP server gives about findings, until the gap closes.
          **Severity and why**
          Warning, because no finding is lost and the only damage is a freshness reading that cannot be trusted for one source. It waits for working hours.
          **When to act**
          Working hours.
          **What to do**
          1. Cause: the scanner host's clock is fast. Check: compare the clock on the scanner host with the clock on the primary; one of them is off by about the value in the summary, and matching clocks are healthy. Fix: restore time sync on the host that is wrong and let the scanner run again.
          2. Inferred cause: the primary's clock is slow, in which case other time-based alerts will be misbehaving too. Check: the primary against a third host. Fix: restore the primary's time sync; this is the PE administrator's host.
          3. Whatever the cause: the alert clears when a scan with a sane time arrives from that source and the gauge drops under 300 seconds.
          **Finding the rest**
          The skew per source: `puppet_findings_clock_skew_seconds` on the primary's metrics port or in Explore. Which source it is: the `source` label is the name the scanner pushed its findings under. `puppet_findings_source_age_seconds{source="{{ $labels.source }}"}` is the age that is being clamped; it reads near zero while this alert is firing.
          **Escalate**
          If the scanner host is not yours, hand the team that owns the scanner the source name, the skew value and the time it started. If the primary's clock is the one that is wrong, the PE administrator.
          **Known noise**
          A scanner that reports scan times in a timezone other than UTC fires this with a skew of whole hours; the fix is on the scanner side. A site with known drift it will not fix can raise `observability::alerts::thresholds.findings_clock_skew_seconds`.
        thresholds: findings_clock_skew_seconds
  - name: pobs-fleet
    rules:
    - alert: PobsAlertExclusionsHigh
      expr: puppet_nodes_alert_excluded > ignoring(environment) 0.2 * puppet_node_count{environment="all"}
      for: 6h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $value }} nodes are set to alert level none, over the 0.2 share
          of the estate this rule allows"
        description: |-
          **What is wrong**
          {{ $value }} nodes are set to alert level none, which is more than 0.2 of the estate, and has been for six hours.
          **Risk**
          Nothing is broken yet. Those nodes count in no fleet ratio and no per-node rule, so PobsFleetCatastrophe and PobsFleetSilent divide by a fleet this much smaller and an outage confined to the excluded set reaches no threshold.
          **Severity and why**
          Warning, because the cost is a blind spot and nothing is failing. It waits for working hours; the six hour `for` already filters a batch of hosts being rebuilt.
          **When to act**
          Working hours.
          **What to do**
          1. Likely cause: nodes that were rebuilt or returned to service never had their level cleared. Open Triage and read the two panels under "Which nodes are deliberately silent". Excluded From Alerting is the count, and Which Nodes, And At What Level is the list. For each node on the list, decide whether it still needs excluding.
          2. Then: clear a level with `observability::node_alert_level::level: ~` at a more specific Hiera layer than the one that set it, and let the node's next Puppet run rewrite `facts.d/pobs_alert_level.yaml`. Unsilenced hosts that are broken start paging, so work through them in batches.
          3. Inferred cause: a Hiera layer sets `none` too broadly, for a whole role or environment. The list showing a whole group at `none` points at the layer; narrow it to the hosts that need it.
          Either way: the alert clears when the excluded count drops below 0.2 of `puppet_node_count` and stays there for six hours. Each node needs a Puppet run after the Hiera change for its level to update.
          **Finding the rest**
          Which nodes and at what level: `puppet_node_alert_level{level="none"}` in Prometheus lists them by node and environment. The excluded count against the whole fleet: `puppet_nodes_alert_excluded / ignoring(environment) puppet_node_count{environment="all"}` is the share this rule compares with 0.2. On a node, `/opt/puppetlabs/facter/facts.d/pobs_alert_level.yaml` is the file the level is read from.
          **Escalate**
          Hand it to the PE administrator or whoever owns the control repo's Hiera data when the levels come from a layer you cannot change, with the list from Which Nodes, And At What Level.
          **Known noise**
          A large planned rebuild or migration excludes many hosts at once on purpose. Silence this alert in Alertmanager for the length of the work, or raise `alert_exclusion_ratio` under `observability::alerts::thresholds` if the estate keeps a large excluded set by design.
        where_panel: pobs-triage/Which Nodes, And At What Level
        where: The "Which Nodes, And At What Level" table on the Triage board, which
          lists every node carrying an operator-set alert level and which level it
          is at.
        thresholds: alert_exclusion_ratio
    - alert: PobsFleetCatastrophe
      expr: count by (alias) (puppet_status{state="failed"} == 1 unless on (node)
        puppet_node_alert_level{level="none"}) >= 50 and count by (alias) (puppet_status{state="failed"}
        == 1 unless on (node) puppet_node_alert_level{level="none"}) / on(alias) (puppet_node_lifecycle{state="active"}
        - ignoring(state) puppet_nodes_alert_excluded) >= 0.1
      for: 10m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: 'Fleet-wide Puppet incident: {{ $value }} nodes are failing their
          run'
        description: |-
          **What is wrong**
          At least 50 nodes and 0.1 of the active fleet on primary `{{ $labels.alias }}` have been failing their Puppet run at the same time for ten minutes. Nodes set to alert level none are left out of both counts.
          **Risk**
          Nothing on those nodes is being enforced, and whatever broke them is still in place. While this fires PobsNodeRunFailingHigh is inhibited for the same primary, so per-node pages going quiet is not evidence those nodes recovered. Critical-tier hosts still page.
          **Severity and why**
          Critical, because failure on this scale is one incident with one cause, usually a deploy, a CA or the server, and every run that lands while it is open fails. It pages.
          **When to act**
          Now. The sooner the cause is found the fewer runs land on it.
          **What to do**
          1. Likely cause: a code deploy broke a shared module. Open Code Releases and read Last Deploy. A deploy that landed just before the failures started is the one you can undo; roll the environment back before debugging it. `count by (environment) (puppet_status{state="failed"} == 1)` with one environment carrying all the failures points at a deploy to that environment.
          2. Cause: an expired CA or CRL. Open Certificate Authority and read CA Expires In and CRL Valid For. Either expired fails every agent at once and is the PE administrator's to renew.
          3. Cause: puppetserver is refusing agents or out of heap. Open Puppetserver and read Agents Refused and Heap. A server turning agents away or at its heap ceiling fails runs across the estate.
          4. Check: the error itself. Open Convergence. Nodes Needing Attention lists the failing nodes with the reason, and Compile Failures In Detail says whether the failures are catalogue compiles. Pick one failing node and run `sudo /opt/puppetlabs/bin/puppet agent -t` on it to read the error.
          Whatever the cause: the alert clears on the first evaluation after the failing count drops below either threshold, which needs a successful run on enough nodes after the fix. The thresholds are `fleet_catastrophe_nodes` and `fleet_catastrophe_ratio` under `observability::alerts::thresholds`.
          **Finding the rest**
          How many are failing and on which primary: `count by (alias) (puppet_status{state="failed"} == 1)`. The denominator the ratio divides by: `puppet_node_lifecycle{state="active"} - ignoring(state) puppet_nodes_alert_excluded`, which is PuppetDB's active nodes minus the ones set to alert level none; an estate that never deactivates dead nodes has a denominator larger than its live fleet. Which environment the failures are in: `count by (environment) (puppet_status{state="failed"} == 1)`.
          **Escalate**
          Hand it to the PE administrator as soon as the cause is the CA, the CRL or puppetserver itself, and to whoever owns the control repo if a deploy is the cause and you cannot roll it back yourself. Hand over the time the failures started, the failing count per primary, the environment breakdown and the error from one agent run. Puppet support if a rollback does not clear it.
          **Known noise**
          A planned change that breaks many hosts at once (a mass rebuild, a deliberately failing environment) fires this. Silence the primary in Alertmanager for the change window, or set the affected hosts to `observability::node_alert_level::level: none` so they leave both counts. On a small estate where `fleet_catastrophe_nodes` is a large share of the fleet, retune it under `observability::alerts::thresholds`.
        where_panel: pobs-convergence/Nodes Needing Attention
        where: The "Nodes Needing Attention" table on the Convergence board, which
          lists every failing or silent node with the reason, so you can see which
          nodes are failing and whether they share an environment.
        thresholds: fleet_catastrophe_nodes, fleet_catastrophe_ratio
    - alert: PobsFleetSilent
      expr: ( count by (alias) ((time() - puppet_report_timestamp_epoch) > 3600 unless
        on (node) puppet_node_alert_level{level="none"}) >= 5 and count by (alias)
        ((time() - puppet_report_timestamp_epoch) > 3600 unless on (node) puppet_node_alert_level{level="none"})
        / on(alias) (puppet_node_lifecycle{state="active"} - ignoring(state) puppet_nodes_alert_excluded)
        >= 0.2 ) or ( sum by (alias) (puppet_node_exception_count{reason="not_reporting"})
        >= 5 and sum by (alias) (puppet_node_exception_count{reason="not_reporting"})
        / on(alias) (puppet_node_lifecycle{state="active"} - ignoring(state) puppet_nodes_alert_excluded)
        >= 0.2 unless on (alias) count by (alias) (puppet_report_timestamp_epoch)
        )
      for: 15m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: 'Fleet-wide Puppet silence: {{ $value }} nodes have stopped reporting'
        description: |-
          **What is wrong**
          At least 5 nodes and 0.2 of the active fleet on primary `{{ $labels.alias }}` have sent no Puppet report for over an hour, and that has held for fifteen minutes. Nodes set to alert level none are left out of both counts.
          **Risk**
          Nothing on those nodes is being enforced, and every board still shows them as they were on their last report. While this fires PobsNodeSilentHigh is inhibited for the same primary, so per-node silence pages going quiet is not evidence those nodes came back. Critical-tier hosts still page.
          **Severity and why**
          Critical, because silence on this scale is agents that cannot reach the primary, and the per-node rules only cover tiered hosts, so this is the only page for the untiered majority. It pages.
          **When to act**
          Now. It does not recover on its own.
          **What to do**
          1. Cause: an expired CA or CRL. Open Certificate Authority and read CA Expires In and CRL Valid For. Either expired stops every agent authenticating and is the PE administrator's to renew.
          2. Cause: puppetserver is refusing agents or not running. Open Puppetserver and read Agents Refused. A server turning agents away, or down, silences the estate at once; PuppetInfraServiceNotRunning fires beside this if the service is down. Restarting the service is the fix for a stopped one.
          3. Check: when the nodes went quiet. Open Convergence. Silent Nodes lists which nodes and since when. Nodes that went quiet at the same time share a cause; a spread of times is agents stopping one by one, which points at the agents and not the server.
          4. Check: the error from one agent. Pick one silent node and run `sudo /opt/puppetlabs/bin/puppet agent -t` on it. The error it prints names the cause: a certificate, a connection refused, a DNS failure, an agent that is disabled, or a scheduled run that stopped estate-wide.
          Whatever the cause: the alert clears when the silent count drops below both thresholds for the rule's `for` period, which needs those nodes to report again after the fix. Decommissioned hosts belong at `observability::node_alert_level::level: none`, which takes them out of both counts. The thresholds are `fleet_silent_nodes` and `fleet_silent_ratio` under `observability::alerts::thresholds`.
          **Finding the rest**
          How many are silent per primary: `count by (alias) ((time() - puppet_report_timestamp_epoch) > 3600)`, or on an estate with per-node metrics off `sum by (alias) (puppet_node_exception_count{reason="not_reporting"})`, with the oldest of them named on Triage's Listed By The Daemon. Whether they are also recorded as failing: `count by (alias) (puppet_status{state="failed"} == 1)`, which stays at its old value because a silent node's last state is served until it reports again. When the quiet started: `max(puppet_report_timestamp_epoch) by (alias)` is the newest report the primary has received; well in the past means no agent at all is reporting and the primary or the exporter's PuppetDB connection is the place to look, in which case PobsNoNodesReporting or PobsPuppetDBServerDown may be firing too.
          **Escalate**
          Hand it to the PE administrator if the CA, CRL or puppetserver is the cause, and to the network team if agents report connection refused or DNS failures to a server that is up. Hand over the time the silence started, the Silent Nodes list and the error from one agent run. Puppet support if the server is up, the CA is valid and agents still cannot report.
          **Known noise**
          A planned outage of the primary, a network change window or a mass power-down fires this. Silence the primary in Alertmanager for the window. Decommissioned hosts left in PuppetDB fire it once enough accumulate; set them to `observability::node_alert_level::level: none` or deactivate them. On a small estate where `fleet_silent_nodes` is a large share of the fleet, retune it under `observability::alerts::thresholds`.
        where_panel: pobs-convergence/Silent Nodes
        where: The "Silent Nodes" table on the Convergence board, which lists every
          node that has not reported for longer than the Silent for picker, oldest
          first, with its last report time. The picker starts above this alert's threshold;
          set it to an hour to see the nodes this alert counts.
        thresholds: fleet_silent_nodes, fleet_silent_ratio, node_silent_human, node_silent_seconds
    - alert: PobsNoNodesReporting
      expr: puppet_node_count{environment="all"} == 0
      for: 15m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: pobs knows about zero nodes
        description: |-
          **What is wrong**
          The exporter holds no nodes at all. `puppet_node_count` has read zero for 15 minutes.
          **Risk**
          Every board that counts nodes is empty, and every per-node and fleet rule has gone quiet with it, so no node failure or silence pages anybody until this is fixed. The nodes themselves may be running Puppet perfectly well; this says the exporter cannot see them.
          **Severity and why**
          Critical, because monitoring of the whole fleet is off while it fires and nothing else will page for a node failure in the meantime. It pages.
          **When to act**
          Now.
          **What to do**
          1. Check: whether PuppetDB still has its nodes. In Prometheus read `puppet_node_lifecycle{state="active"}`. Above zero while `puppet_node_count` is zero means PuppetDB still has its nodes and has lost their reports, which is a report-ttl purge or a restore, and the count returns as agents report. Zero as well means PuppetDB is empty or the exporter is reading the wrong one.
          2. Cause: the exporter's PuppetDB query is failing. Read `puppet_exporter_server_up`. Zero means the last query to that PuppetDB failed; PobsPuppetDBServerDown fires beside this when it does. On the primary run `sudo /usr/local/bin/pobs-ctl status` and `sudo journalctl -u pobs -n 100`. The status output names failing collectors and the journal carries the PuppetDB error.
          3. Cause: the exporter is pointed at the wrong PuppetDB. Check `observability::puppetdb_urls` points at the right one, and query PuppetDB by hand with the `pdbq` helper in docs/operate/troubleshooting.md to confirm it returns nodes.
          Whatever the cause: the alert clears when the next poll reads at least one node from PuppetDB. Restarting the daemon does not help on its own, because it rebuilds the store from the same query.
          **Finding the rest**
          Whether the rest of the stack is alive: the puppetserver, PuppetDB, CA and collector rules do not read the node store and are still firing if their subject is broken, so a quiet Runbook board apart from this alert means those are healthy. How the collectors are doing: Collectors Needing Attention on Internal Operations. Which PuppetDB servers are answering: PuppetDB Servers on the same board.
          **Escalate**
          Hand it to the PE administrator if PuppetDB is empty or refusing the exporter's queries, with the journal lines and the `pdbq` output. Puppet support if PuppetDB has lost its nodes with no restore or purge to explain it.
          **Known noise**
          A fresh install before any agent has reported, or a PuppetDB restore in progress, reads zero until the first reports land. Silence it in Alertmanager for the duration of the work.
        where_panel: pobs-operations/PuppetDB Servers
        where: The "PuppetDB Servers" table on the Internal Operations board, which
          shows each PuppetDB server the exporter queries and whether its last query
          succeeded.
    - alert: PobsNodeCountDropped
      expr: puppet_node_count{environment="all"} < 0.9 * (puppet_node_count{environment="all"}
        offset 1h)
      for: 30m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Puppet node count dropped below 0.9 of an hour ago
        description: |-
          **What is wrong**
          The number of nodes the exporter holds has fallen below 0.9 of what it was an hour ago, and has stayed there for 30 minutes.
          **Risk**
          Every fleet number is measured against a smaller estate until this is explained. Licence headroom, the alert exclusion share and the fleet ratios all read healthier than they are, and if the nodes were dropped in error nothing on them is being watched.
          **Severity and why**
          Warning, because a planned decommission or a PuppetDB purge is the ordinary cause and needs nothing done. It waits for working hours unless another alert says the nodes did not leave on purpose.
          **When to act**
          Working hours, unless no decommission is known and PobsPuppetDBServerDown or PobsNoNodesReporting is firing with it, in which case now.
          **What to do**
          1. Likely cause: the nodes really went. A planned decommission or a PuppetDB report-ttl purge of dead nodes is the ordinary case and needs nothing done. `puppet_node_lifecycle{state="active"}` falling with the count confirms PuppetDB deactivated or expired them.
          2. Cause: the exporter pruned nodes it should have kept because a PuppetDB server has been failing for longer than its grace. On the primary run `sudo journalctl -u pobs | grep -E "pruned|pruning with"`. A "pruned N departed node(s)" line is written on every prune, including ordinary ones, so it dates the drop. A "pruning with N server(s) excluded" line is the unhealthy one.
          3. Then: if a server was excluded, open Internal Operations and read PuppetDB Servers for which one, then fix it or remove it from `observability::puppetdb_urls`.
          Either way: the alert clears on its own once an hour has passed at the new count, since the comparison is against one hour ago. If a server was at fault, fixing it repopulates the store on the next poll and the count returns.
          **Finding the rest**
          What PuppetDB still holds: `puppet_node_lifecycle{state="active"}` comes off the nodes endpoint, not reports, so it stays high when only the reports were lost and falls when the nodes were deactivated or expired. The current count against an hour ago: `puppet_node_count{environment="all"}` and `puppet_node_count{environment="all"} offset 1h`. Which PuppetDB servers are answering: `puppet_exporter_server_up` is 1 per server that answered its last query. Which environment lost nodes: `puppet_node_count - puppet_node_count offset 1h` by environment, and one environment carrying the whole drop points at a decommission or a purge scoped to it.
          **Escalate**
          Hand it to the PE administrator if a PuppetDB server is failing its queries and you cannot restore it, with the journal lines and the PuppetDB Servers table. Confirm with whoever runs decommissions before treating a drop as planned.
          **Known noise**
          A planned decommission or a report-ttl purge of long-dead nodes fires this every time. No tuning is needed; it clears an hour later. An estate that decommissions in large batches can raise `node_count_drop_ratio` under `observability::alerts::thresholds` or knock the rule out with `'--'`.
        where_panel: pobs-fleet-churn/Nodes By Lifecycle State
        where: The "Nodes By Lifecycle State" chart on the Fleet Churn board, which
          shows active, deactivated and expired node counts over time, so you can
          see whether PuppetDB deactivated the nodes or only the exporter lost them.
        thresholds: node_count_drop_ratio
    - alert: PobsNodeRunFailingCritical
      expr: puppet_status{state="failed"} == 1 and on (node) puppet_node_alert_level{level="critical"}
        == 1
      for: 45m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: "{{ $labels.node }} has been failing its Puppet run for 45 minutes"
        description: |-
          **What is wrong**
          `{{ $labels.node }}` is tiered critical and its last Puppet run failed, and it has stayed failed for 45 minutes, which is longer than a run interval.
          **Risk**
          Whatever the failing resource manages is not applied, and every resource that depends on it was skipped. Drift on this host stands until a run succeeds, and anything deployed to it since has not fully landed.
          **Severity and why**
          Critical, because an operator tiered this host critical, meaning its own failure is an outage. It pages, and it keeps paging through a fleet-wide incident because PobsFleetCatastrophe inhibits only the high tier.
          **When to act**
          Now.
          **What to do**
          1. Cause: a resource on the host is failing to apply. Open Node Detail for `{{ $labels.node }}`. Run Failed confirms the state, and Why The Last Run Failed carries the message Puppet logged and the class chain, when `observability::dashboard_server::enable_changes_datasource` is on. On the node run `sudo /opt/puppetlabs/bin/puppet agent -t` and read the first error in the output. A run that fails on one resource still ends with "Applied catalog", and the skipped resources are not reported again, so the first failure is the one to fix. Fix the failing resource, or the thing it depends on, and run the agent again.
          2. Cause: the agent has stopped and the failed report is stale. `puppet_status` serves the last report for ever, so one failure followed by a dead agent holds this rule open. `puppet_report_timestamp_epoch{node="{{ $labels.node }}"}` older than an hour means the agent has stopped. Check PobsNodeSilentCritical for the same node and work that instead.
          3. Check: whether this is one of many. `count by (alias) (puppet_status{state="failed"} == 1)` is how many nodes are failing per primary, and a large number means PobsFleetCatastrophe is the one to work.
          Either way: the alert clears when a run succeeds and the next poll reads its report, within one `observability::polling_interval`. A host that is knowingly broken wants `observability::node_alert_level::level: none` in its Hiera, which takes it out of this rule and the fleet ratios.
          **Finding the rest**
          When the node last reported: `puppet_report_timestamp_epoch{node="{{ $labels.node }}"}` in Prometheus is the epoch of the report this alert is reading. Which other nodes are failing: Nodes Needing Attention on the Convergence board lists them with the reason.
          **Escalate**
          Hand it to the team that owns the failing resource once the first error names something outside Puppet (a package repository, a mount, a service account). Hand it to the PE administrator if the error is a catalogue compile failure or the agent cannot reach the primary. Pass on the first error line from the agent run, the report time and the node name.
          **Known noise**
          A host being rebuilt or deliberately broken fires this until its level is cleared. Set `observability::node_alert_level::level: none` for it, or silence the node in Alertmanager for the length of the work. A single failed run never fires, because the 45 minute `for` outlasts one run interval.
        where_panel: pobs-node-detail/Why The Last Run Failed
        where: The "Why The Last Run Failed" table on the Node Detail board, which
          shows the message Puppet logged when a resource failed and the class chain
          that led to it. It is filled only where `observability::dashboard_server::enable_changes_datasource`
          is on.
    - alert: PobsNodeRunFailingHigh
      expr: puppet_status{state="failed"} == 1 and on (node) puppet_node_alert_level{level="high"}
        == 1
      for: 45m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $labels.node }} has been failing its Puppet run for 45 minutes"
        description: |-
          **What is wrong**
          `{{ $labels.node }}` is tiered high and its last Puppet run failed, and it has stayed failed for 45 minutes, which is longer than a run interval.
          **Risk**
          Whatever the failing resource manages is not applied, and every resource that depends on it was skipped. Drift on this host stands until a run succeeds, and anything deployed to it since has not fully landed.
          **Severity and why**
          Warning, because the high tier is for hosts that matter but whose failure is not an outage on its own; the critical tier is for those. It waits for working hours, and while PobsFleetCatastrophe fires for the same primary it is inhibited.
          **When to act**
          Working hours, unless this host matters tonight. One arriving on its own means no fleet incident has reached its threshold.
          **What to do**
          1. Cause: a resource on the host is failing to apply. Open Node Detail for `{{ $labels.node }}`. Run Failed confirms the state, and Why The Last Run Failed carries the message Puppet logged and the class chain, when `observability::dashboard_server::enable_changes_datasource` is on. On the node run `sudo /opt/puppetlabs/bin/puppet agent -t` and read the first error in the output. A run that fails on one resource still ends with "Applied catalog", and the skipped resources are not reported again. Fix the failing resource, or the thing it depends on, and run the agent again.
          2. Cause: the agent has stopped and the failed state is stale. `puppet_report_timestamp_epoch{node="{{ $labels.node }}"}` older than an hour means the agent is not running. Check PobsNodeSilentHigh for the same node and work that instead.
          3. Check: how many nodes are failing with it. `count by (alias) (puppet_status{state="failed"} == 1)` per primary; a large number is a fleet incident and PobsFleetCatastrophe is the one to work.
          Either way: the alert clears when a run succeeds and the next poll reads its report, within one `observability::polling_interval`. A host that is knowingly broken wants `observability::node_alert_level::level: none` in its Hiera.
          **Finding the rest**
          When the node last reported: `puppet_report_timestamp_epoch{node="{{ $labels.node }}"}` in Prometheus. Which nodes are failing: Nodes Needing Attention on the Convergence board.
          **Escalate**
          Hand it to the team that owns the failing resource once the first error names something outside Puppet. Hand it to the PE administrator if the error is a catalogue compile failure or the agent cannot reach the primary. Pass on the first error line from the agent run, the report time and the node name.
          **Known noise**
          A host being rebuilt or deliberately broken fires this until its level is cleared. Set `observability::node_alert_level::level: none` for it, or silence the node in Alertmanager for the length of the work.
        where_panel: pobs-node-detail/Why The Last Run Failed
        where: The "Why The Last Run Failed" table on the Node Detail board, which
          shows the message Puppet logged when a resource failed and the class chain
          that led to it. It is filled only where `observability::dashboard_server::enable_changes_datasource`
          is on.
    - alert: PobsNodeSilentCritical
      expr: (time() - puppet_report_timestamp_epoch) > 3600 and on (node) puppet_node_alert_level{level="critical"}
        == 1 or (puppet_node_exception{reason="not_reporting"} and on (node) puppet_node_alert_level{level="critical"}
        == 1) unless on (node) puppet_report_timestamp_epoch
      for: 15m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: "{{ $labels.node }} has not reported to Puppet in over an hour"
        description: |-
          **What is wrong**
          `{{ $labels.node }}` is tiered critical and has sent no Puppet report for over an hour, and that has held for fifteen minutes.
          **Risk**
          Nothing on the host has been enforced since its last report. Every board and every run-failure rule still shows the node as it was on that report, so this rule is the only thing that says it has stopped.
          **Severity and why**
          Critical, because an operator tiered this host critical and a silent agent does not come back on its own. It pages. The high tier of the same rule waits.
          **When to act**
          Now.
          **What to do**
          1. Cause: the agent's certificate has expired. Check from Prometheus before touching the host: `puppet_certificate_expires_epoch{node="{{ $labels.node }}"}` in the past means the certificate expired and the agent cannot authenticate. Reissue it: on the primary run `sudo /opt/puppetlabs/bin/puppetserver ca clean --certname {{ $labels.node }}`, then on the node `sudo /opt/puppetlabs/bin/puppet ssl clean` and `sudo /opt/puppetlabs/bin/puppet agent -t`, then on the primary `sudo /opt/puppetlabs/bin/puppetserver ca sign --certname {{ $labels.node }}` unless autosigning signs it, and finally `sudo /opt/puppetlabs/bin/puppet agent -t` on the node again.
          2. Cause: the agent service is stopped or disabled. On the node, `sudo systemctl status puppet` says whether the service is running, and `sudo /opt/puppetlabs/bin/puppet agent -t` runs it in the foreground and prints the error. An agent that says it is administratively disabled wants `sudo /opt/puppetlabs/bin/puppet agent --enable`; a stopped service wants starting.
          3. Cause: the machine is off or gone. Decide whether it should exist. A decommissioned host wants `observability::node_alert_level::level: none`, which takes it out of this rule and the fleet ratios; left as it is, this pages until the node drops out of the exporter's store.
          Whatever the cause: the alert clears when the node sends a report and the next poll reads it, within one `observability::polling_interval`.
          **Finding the rest**
          When it last reported: `puppet_report_timestamp_epoch{node="{{ $labels.node }}"}`, or on an estate with per-node metrics off `puppet_node_exception{node="{{ $labels.node }}", reason="not_reporting"}`, the seconds since. Why It Is Silent on Node Detail says whether it is not reporting, not compiling, or has a revoked certificate. Whether others went silent with it: `count by (alias) ((time() - puppet_report_timestamp_epoch) > 3600)` is the silent count per primary, and a large number means PobsFleetSilent is the one to work. `puppet_nodes_without_certificate` above zero means some node PuppetDB holds has had its certificate cleaned; it carries no node label, so it does not say which.
          **Escalate**
          Hand it to the team that owns the host if the machine is down or unreachable, with the last report time. Hand it to the PE administrator if the agent runs but cannot authenticate and the certificate steps above do not fix it, with the output of the foreground agent run.
          **Known noise**
          A host that is powered off on purpose, or being rebuilt, fires this. Set `observability::node_alert_level::level: none` for it or silence the node in Alertmanager for the length of the work. An estate whose run interval is longer than an hour needs `node_silent_seconds` raised under `observability::alerts::thresholds`.
        where_panel: pobs-node-detail/Why It Is Silent
        where: The "Why It Is Silent" tile on the Node Detail board, which says whether
          the node is not reporting, is reporting but not compiling, or has had its
          certificate revoked.
        thresholds: node_silent_human, node_silent_seconds
    - alert: PobsNodeSilentHigh
      expr: (time() - puppet_report_timestamp_epoch) > 3600 and on (node) puppet_node_alert_level{level="high"}
        == 1 or (puppet_node_exception{reason="not_reporting"} and on (node) puppet_node_alert_level{level="high"}
        == 1) unless on (node) puppet_report_timestamp_epoch
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $labels.node }} has not reported to Puppet in over an hour"
        description: |-
          **What is wrong**
          `{{ $labels.node }}` is tiered high and has sent no Puppet report for over an hour, and that has held for fifteen minutes.
          **Risk**
          Nothing on the host has been enforced since its last report. Every board and every run-failure rule still shows the node as it was on that report.
          **Severity and why**
          Warning, because the high tier is for hosts that matter but whose silence is not an outage on its own. It waits for working hours, and while PobsFleetSilent fires for the same primary it is inhibited.
          **When to act**
          Working hours, or now if the host matters tonight. If PobsFleetSilent is firing for the same primary, work that one first.
          **What to do**
          1. Cause: the agent's certificate has expired. Check from Prometheus before touching the host: `puppet_certificate_expires_epoch{node="{{ $labels.node }}"}` in the past means the certificate expired and the agent cannot authenticate. Reissue it: on the primary run `sudo /opt/puppetlabs/bin/puppetserver ca clean --certname {{ $labels.node }}`, then on the node `sudo /opt/puppetlabs/bin/puppet ssl clean` and `sudo /opt/puppetlabs/bin/puppet agent -t`, then on the primary `sudo /opt/puppetlabs/bin/puppetserver ca sign --certname {{ $labels.node }}` unless autosigning signs it, and finally `sudo /opt/puppetlabs/bin/puppet agent -t` on the node again.
          2. Cause: the agent service is stopped or disabled. On the node, `sudo systemctl status puppet` says whether the service is running, and `sudo /opt/puppetlabs/bin/puppet agent -t` runs it in the foreground and prints the error. An agent that says it is administratively disabled wants `sudo /opt/puppetlabs/bin/puppet agent --enable`.
          3. Cause: the host is decommissioned. It wants `observability::node_alert_level::level: none`, which takes it out of this rule and the fleet ratios.
          Whatever the cause: the alert clears when the node sends a report and the next poll reads it, within one `observability::polling_interval`.
          **Finding the rest**
          When it last reported: `puppet_report_timestamp_epoch{node="{{ $labels.node }}"}`, or on an estate with per-node metrics off `puppet_node_exception{node="{{ $labels.node }}", reason="not_reporting"}`, the seconds since. Why It Is Silent on Node Detail says whether it is not reporting, not compiling, or has a revoked certificate. On the node, `sudo openssl x509 -noout -enddate -in "$(sudo /opt/puppetlabs/bin/puppet config print hostcert)"` prints the certificate expiry date. Whether others went silent with it: `count by (alias) ((time() - puppet_report_timestamp_epoch) > 3600)` is the silent count per primary.
          **Escalate**
          Hand it to the team that owns the host if the machine is down or unreachable, with the last report time. Hand it to the PE administrator if the agent runs but cannot authenticate and the certificate steps above do not fix it, with the output of the foreground agent run.
          **Known noise**
          A host that is powered off on purpose, or being rebuilt, fires this. Set `observability::node_alert_level::level: none` for it or silence the node in Alertmanager for the length of the work. An estate whose run interval is longer than an hour needs `node_silent_seconds` raised under `observability::alerts::thresholds`.
        where_panel: pobs-node-detail/Why It Is Silent
        where: The "Why It Is Silent" tile on the Node Detail board, which says whether
          the node is not reporting, is reporting but not compiling, or has had its
          certificate revoked.
        thresholds: node_silent_human, node_silent_seconds
  - name: pobs-license
    rules:
    - alert: PobsLicenseExpiringCritical
      expr: "(puppet_license_expires_epoch - time()) / 86400 < 14"
      for: 1h
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: PE licence expires in under 14 days
        description: |-
          **What is wrong**
          The PE suite licence expires in {{ $value | printf "%.0f" }} days, under 14 days for more than an hour. The warning fired at 60 days and the renewal has not landed.
          **Risk**
          If the licence lapses before a replacement is installed, PE runs unlicensed. The runway left is shorter than a purchase order normally takes.
          **Severity and why**
          Critical, because the warning horizon has been used up and the remaining days are fewer than a renewal normally needs. It pages, although the fix is a licence file from Puppet and nothing can be done overnight.
          **When to act**
          Today, in business hours.
          **What to do**
          1. Cause: a replacement licence has already been installed and the daemon has not read it. Check: on the primary, whether `/etc/puppetlabs/suite-license.lic` is newer than the alert, and `puppet_license_expires_epoch` still shows the old date. Fix: the daemon re-reads the file on its next licence poll; if the file did not exist when the daemon started, `sudo systemctl restart pobs` on the primary.
          2. Cause: the renewal has not landed. Check: the `Licence Expires In` tile on the TAM Check board and the `Licence` table beside it for the customer, product and licence type on the file. Fix: escalate to whoever owns the Puppet contract with the expiry date. Ask for the replacement file, not just the order confirmation, then install it at `/etc/puppetlabs/suite-license.lic` on the primary.
          3. Whatever the cause: the alert clears once the licence file on the primary carries an expiry more than 14 days away and the daemon has re-read it.
          **Finding the rest**
          Which PE installation, when there is more than one: `puppet_license_expires_epoch` in Prometheus, one series per primary with its `alias` label. `(puppet_license_expires_epoch - time()) / 86400` is the days left on each. `puppet_license_info` carries the customer, product and licence type as labels. Whether the reading is current: `puppet_exporter_collector_success{collector="license"}` is 1 when the last read succeeded.
          **Escalate**
          Immediately, to whoever owns the Puppet contract, with the expiry date and the `Licence` table contents. Puppet support issues the replacement file.
          **Known noise**
          None known.
        where_panel: pobs-tam-check/Licence Expires In
        where: The "Licence Expires In" tile on the TAM Check board, which shows the
          time left on the soonest-expiring licence.
        thresholds: license_expiry_critical_days, license_expiry_warning_days
    - alert: PobsLicenseExpiringSoon
      expr: "(puppet_license_expires_epoch - time()) / 86400 < 60"
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PE licence expires in under 60 days
        description: |-
          **What is wrong**
          The PE suite licence expires in {{ $value | printf "%.0f" }} days, under 60 days for more than an hour.
          **Risk**
          Nothing is broken today. If the licence lapses before a replacement is installed, PE runs unlicensed and the renewal becomes an emergency purchase.
          **Severity and why**
          Warning, because the licence is still valid and the horizon is set far enough out for a purchase order to crawl. It waits for working hours. `PobsLicenseExpiringCritical` follows at 14 days.
          **When to act**
          Next business day. Renewal is a purchase order and moves at procurement's pace, which is why this fires 60 days out.
          **What to do**
          1. Cause: the licence is ageing out on schedule and the renewal has not started. Check: the `Licence Expires In` tile on the TAM Check board, and the `Licence` table beside it for the customer, product and licence type PE is reading from `/etc/puppetlabs/suite-license.lic` on the primary. Fix: hand it to whoever owns the Puppet contract, with the expiry date and the node count from `Ceiling Reached` on the same board if it shows one, since a renewal and a ceiling increase are the same conversation.
          2. Then: install the replacement licence at `/etc/puppetlabs/suite-license.lic` on the primary. The daemon re-reads the file on its next licence poll, so nothing needs restarting unless the file did not exist when the daemon started, in which case `sudo systemctl restart pobs` on the primary.
          3. Whatever the cause: the alert clears once the licence file on the primary carries an expiry more than 60 days away and the next poll has read it.
          **Finding the rest**
          Which PE installation, when there is more than one: `puppet_license_expires_epoch` in Prometheus, one series per primary with its `alias` label. `(puppet_license_expires_epoch - time()) / 86400` is the days left on each. `puppet_license_info` carries the customer, product and licence type as labels. Whether the reading is current: `puppet_exporter_collector_success{collector="license"}` is 1 when the last read succeeded.
          **Escalate**
          To whoever owns the Puppet contract, with the expiry date, the `Licence` table contents and the node count. Puppet support issues the file; ask for the replacement file, not just the order confirmation.
          **Known noise**
          A site whose procurement runs faster or slower than the default horizon can tune `observability::alerts::thresholds.license_expiry_warning_days`. A perpetual licence emits no expiry series and never fires this. Otherwise none known.
        where_panel: pobs-tam-check/Licence Expires In
        where: The "Licence Expires In" tile on the TAM Check board, which shows the
          time left on the soonest-expiring licence.
        thresholds: license_expiry_critical_days, license_expiry_warning_days
    - alert: PobsLicenseNearLimit
      expr: sum by (alias) (puppet_node_count{environment="all"}) / on(alias) puppet_license_entitled_nodes
        > 0.9
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PE estate is at {{ $value | humanizePercentage }} of its licensed
          node count
        description: |-
          **What is wrong**
          The node count PuppetDB holds for `{{ $labels.alias }}` is at {{ $value | humanizePercentage }} of the node ceiling its licence entitles, above the 0.9 line for more than an hour.
          **Risk**
          Nothing stops working. If the fleet keeps growing it crosses the ceiling and `PobsLicenseOverLimit` fires, and a licence increase takes as long as a renewal to buy.
          **Severity and why**
          Warning, because the estate is still inside its licence and the point is to start the purchase before the ceiling is crossed. It waits for working hours.
          **When to act**
          Next business day.
          **What to do**
          1. Cause: deactivated nodes nobody purged are inflating the count. Check: the `Deactivated` tile on the Fleet Churn board, or `puppet_node_lifecycle{state="deactivated",alias="{{ $labels.alias }}"}`; a count near zero is healthy, a large one is the cause. Fix: purge those from PuppetDB, which lowers the count without a purchase. No change window.
          2. Cause: the fleet is really growing towards the ceiling. Check: `Ceiling Reached` on the TAM Check board for the projected crossing date, or `puppet_license_seconds_to_exhaustion{alias="{{ $labels.alias }}"} / 86400` in days; no value means the fleet is not growing and the alert sits at this level until the fleet or the licence changes. Fix: hand the crossing date to whoever owns the Puppet contract.
          3. Whatever the cause: the alert clears when the count drops below 0.9 of the ceiling, by purging nodes or by a licence with a higher ceiling being installed at `/etc/puppetlabs/suite-license.lic` on the primary. The daemon re-reads the file on its next licence poll; if the file did not exist when the daemon started, `sudo systemctl restart pobs` on the primary.
          **Finding the rest**
          The two numbers: `sum(puppet_node_count{environment="all",alias="{{ $labels.alias }}"})` is the count and `puppet_license_entitled_nodes{alias="{{ $labels.alias }}"}` is the ceiling. `puppet_node_lifecycle{state="deactivated",alias="{{ $labels.alias }}"}` is how many of the count are deactivated. `puppet_license_seconds_to_exhaustion{alias="{{ $labels.alias }}"} / 86400` is the days until the crossing at the fleet's recent growth rate; no result means no growth to project.
          **Escalate**
          To whoever owns the Puppet contract once the count is confirmed real, with the count, the ceiling and the projected crossing date. The PE administrator owns the PuppetDB purge.
          **Known noise**
          A site that runs deliberately close to its ceiling can raise `observability::alerts::thresholds.license_near_limit_ratio`. Otherwise none known.
        where_panel: pobs-tam-check/Fleet Against The Licensed Ceiling
        where: The "Fleet Against The Licensed Ceiling" graph on the TAM Check board,
          which draws the node count against the licensed ceiling so the crossing
          is visible.
        thresholds: license_near_limit_ratio
    - alert: PobsLicenseOverLimit
      expr: sum by (alias) (puppet_node_count{environment="all"}) / on(alias) puppet_license_entitled_nodes
        > 1
      for: 1h
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: PE estate on {{ $labels.alias }} exceeds its licensed node count
        description: |-
          **What is wrong**
          The node count PuppetDB holds for `{{ $labels.alias }}` has been above the node ceiling its licence entitles for more than an hour.
          **Risk**
          Nothing stops working. The estate is out of compliance with its licence until it is trued up or the count comes down.
          **Severity and why**
          Critical, because the licence terms are already breached and the warning at 0.9 of the ceiling went unanswered. It pages, although the fix is commercial or a purge and neither needs doing overnight.
          **When to act**
          Next business day.
          **What to do**
          1. Cause: deactivated nodes nobody purged are inflating the count. Check: the `Deactivated` tile on the Fleet Churn board, or `puppet_node_lifecycle{state="deactivated",alias="{{ $labels.alias }}"}`; if that is larger than the overage, a purge clears it. Fix: purge those from PuppetDB, the only correction available without a purchase. No change window.
          2. Cause: the nodes are real and the fleet has outgrown the licence. Check: the count and the ceiling from `Fleet Against The Licensed Ceiling` on the TAM Check board. Fix: take both numbers to whoever owns the Puppet contract for a true-up.
          3. Whatever the cause: the alert clears when the count drops to or below the ceiling, by purging nodes or by a licence with a higher ceiling being installed at `/etc/puppetlabs/suite-license.lic` on the primary. The daemon re-reads the file on its next licence poll; if the file did not exist when the daemon started, `sudo systemctl restart pobs` on the primary.
          **Finding the rest**
          The two numbers: `sum(puppet_node_count{environment="all",alias="{{ $labels.alias }}"})` is the count and `puppet_license_entitled_nodes{alias="{{ $labels.alias }}"}` is the ceiling. `puppet_node_lifecycle{state="deactivated",alias="{{ $labels.alias }}"}` is how many of the count are deactivated.
          **Escalate**
          To whoever owns the Puppet contract, with the count, the ceiling and how many of the count are deactivated. The PE administrator owns the PuppetDB purge.
          **Known noise**
          A bulk provisioning run that will be followed by a purge can be silenced in Alertmanager by `alias` with `amtool` on the dashboard node for the duration. Otherwise none known.
        where_panel: pobs-tam-check/Fleet Against The Licensed Ceiling
        where: The "Fleet Against The Licensed Ceiling" graph on the TAM Check board,
          which draws the node count against the licensed ceiling.
        thresholds: license_near_limit_ratio
  - name: pobs-patching
    rules:
    - alert: PobsMaintenanceWindowStalled
      expr: puppet_patching_maintenance_window_next_epoch < time()
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Maintenance window {{ $labels.name }} schedule has stopped
        description: |-
          **What is wrong**
          The next opening recorded for maintenance window `{{ $labels.name }}` has been in the past for an hour and has not moved forward, so no patch run will fire for it.
          **Risk**
          Every patch group this window serves stays unpatched until the schedule advances again. No run fires, and the nodes' `pe_patch` facts keep reporting their last real run as current.
          **Severity and why**
          Warning, because the nodes are unpatched and not down, and this is a configuration state that recovers for nobody until someone edits it. It waits for working hours.
          **When to act**
          Before the window was next due to open. It does not need doing overnight.
          **What to do**
          1. Cause: the window's schedule has been deleted or disabled. Open the window on the console Patch management page and check its schedule is present and enabled; healthy is a future opening shown, unhealthy is none or a date in the past.
          2. Cause: no patch job is attached to the window. A window with a schedule and no job never produces a next opening. Check a job is attached.
          3. Then: re-enable or recreate the schedule, or attach a job, and confirm on the same page that a future opening now shows.
          The alert clears once the window reports a next opening in the future. It does not need a run to clear.
          **Finding the rest**
          When it last had an opening: `puppet_patching_maintenance_window_next_epoch{name="{{ $labels.name }}"}` is the stale timestamp; how far behind the clock it sits is how long patching has been missed. Whether this window also has groups with no job: `puppet_patching_maintenance_window_unwired_groups{name="{{ $labels.name }}"}` is the count, and PobsMaintenanceWindowUnwired fires on it. A date in the past on the Patching board's window table marks a stopped schedule.
          **Escalate**
          Hand it to the PE administrator if the schedule is present and enabled with a job attached and the next opening still does not advance. Give them the window name, the stale timestamp and a screenshot of the console page.
          **Known noise**
          A window deliberately retired but not deleted fires for ever; delete it or silence its `name` label in Alertmanager.
        where_panel: pobs-patching/Next Patch Windows
        where: The "Next Patch Windows" table on the Patching board, which shows when
          each maintenance window next opens; a date in the past is a schedule that
          has stopped firing.
    - alert: PobsMaintenanceWindowUnwired
      expr: puppet_patching_maintenance_window_unwired_groups > 0
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Maintenance window {{ $labels.name }} has {{ $value }} patch group(s)
          with no job
        description: |-
          **What is wrong**
          Maintenance window `{{ $labels.name }}` has listed {{ $value }} patch group(s) that no patch job targets for an hour. The window opens on schedule and patches nothing for them.
          **Risk**
          The nodes in those groups are never patched by this window, and nothing else shows it: no run fires, so PobsPatchJobRunFailed stays quiet; the schedule keeps advancing, so PobsMaintenanceWindowStalled stays quiet; and the nodes' `pe_patch` facts keep reporting their last real run as a success.
          **Severity and why**
          Warning, because the nodes are unpatched and not down, and this is a stable configuration gap. One unserved group out of several still fires. It waits for working hours.
          **When to act**
          Before the window next opens, so the next opening patches the group. It does not need doing overnight.
          **What to do**
          1. Check: open the window on the console Patch management page and read the patch groups it lists against the jobs attached to it.
          2. Cause: a group was added to the window with no job, or its job was removed. For each group with no patch job, create one or attach an existing one to this window.
          The alert clears once every group the window lists has a job wired to it. It does not need a run to clear.
          **Finding the rest**
          How many groups are unserved, over time: `puppet_patching_maintenance_window_unwired_groups{name="{{ $labels.name }}"}`; a step up marks when a group was added or a job removed. Which nodes are in each group: `Patch Group Overview` on the Patching board. Whether any job exists at all: `sum(puppet_patching_patch_jobs)` is the count of configured patch jobs, and zero means nothing patches anywhere regardless of windows. When this window next opens: `puppet_patching_maintenance_window_next_epoch{name="{{ $labels.name }}"}`.
          **Escalate**
          Hand it to the PE administrator if you do not own patching, or if attaching a job does not bring the count down. Give them the window name, the group list and the time the count stepped up.
          **Known noise**
          A group kept in a window on purpose with no job, as a holding group, fires for ever; move it out of the window or silence that `name` label in Alertmanager.
        where_panel: pobs-patching/Windows Missing A Job
        where: The "Windows Missing A Job" table on the Patching board, which lists
          each maintenance window that has a patch group no job targets and how many
          such groups it has.
    - alert: PobsPatchJobRunFailed
      expr: puppet_patching_patch_job_last_run_failed == 1
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Patch job {{ $labels.patch_job }} last run failed
        description: |-
          **What is wrong**
          The last run of patch job `{{ $labels.patch_job }}` failed on pe-patching-service, and no run has succeeded in the fifteen minutes since.
          **Risk**
          The nodes in this job's patch group were not patched and will not be until a run succeeds. The node `pe_patch` facts do not show it: the task was never dispatched, so each node still reports its last successful run as current.
          **Severity and why**
          Warning, because the nodes are unpatched and not down, and the series holds until the next run so a page would only repeat itself. It waits for the next window, or working hours.
          **When to act**
          Before the job's maintenance window next opens, so the next run lands. It does not need doing overnight unless the window opens before the morning.
          **What to do**
          1. Check: open the failed run on the console Patch runs page and read which stage failed and the error it gave. The stage separates the causes below.
          2. Cause: the run fired outside its window. A `task-creation` rejection reading "not currently in a maintenance window" is this. Compare the job's schedule with the window's start and end on the console and realign one to the other. Retrying at the same time fails the same way.
          3. Cause: the run reached the nodes and failed there, through agents unreachable, the `pe_patch` task erroring on a node's package manager, or a pre or post script exiting non-zero. The run's per-node output names which. Fix it on the node and run the job again in the window.
          4. Cause: no eligible targets, from an empty or mis-scoped patch group. Check the group's membership on the console and run the job again.
          The alert clears when a run succeeds. Nothing clears it without a run.
          **Finding the rest**
          Which nodes are in the group: `Patch Group Overview` on the Patching board. How often it has failed: `Failures In Window` on the same board. In Prometheus, `puppet_patching_patch_job_last_run_epoch{patch_job="{{ $labels.patch_job }}"}` is when the failed run fired. `puppet_patching_maintenance_window_next_epoch` is when each window next opens; a run that sits outside its window's hours fired outside it. `increase(puppet_patching_patch_job_runs_total{patch_job="{{ $labels.patch_job }}",result="failure"}[7d])` is how many runs of this job have failed this week.
          **Escalate**
          Hand it to the PE administrator if the schedule and window agree and `task-creation` still rejects the run, and to Puppet support if the console shows no reason for the failure. Give them the run's error text, the job and window schedules and the time the run fired.
          **Known noise**
          A job retired but not deleted holds its last failure for ever; delete the job or silence its `patch_job` label in Alertmanager.
        where_panel: 'pobs-patching/Patch Jobs: Last Run'
        where: 'The "Patch Jobs: Last Run" table on the Patching board, which shows
          when each job last ran against when its window opened.'
    - alert: PobsRemediationSlaAtRisk
      expr: sum by (alias, kind, item_severity) (label_replace(puppet_remediation_items{state="at_risk"},
        "item_severity", "$1", "severity", "(.*)")) > 0
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $value }} {{ $labels.item_severity }} {{ $labels.kind }} item(s)
          on {{ $labels.alias }} are close to their remediation SLA"
        description: |-
          **What is wrong**
          {{ $value }} outstanding {{ $labels.kind }} item(s) of severity {{ $labels.item_severity }} on primary `{{ $labels.alias }}` have passed 0.75 of their remediation SLA and not yet the SLA itself.
          **Risk**
          Each will breach the estate's remediation commitment unless it is fixed first, and a breach is what an audit against that commitment reports.
          **Severity and why**
          Warning. Nothing is broken; a deadline is close. It waits for working hours.
          **When to act**
          This week, before the next patch window that can take them.
          **What to do**
          1. Check: which items. The Breached And At Risk table on Patching names each node, what is outstanding, how long, and the SLA.
          2. Cause: the fix is available and not scheduled. For a security patch, put the node in a patch group with a window that runs before the SLA; for a vulnerability, the Known vulnerabilities row on Patching says whether a patch is already scheduled.
          3. Cause: patching runs and fails on these nodes. The Whether it ran row on Patching and PobsPatchJobRunFailed name the job and the nodes.
          4. Cause: the SLA is not the estate's. Set the `remediation_sla_*_days` keys under `observability::alerts::thresholds` to the commitments the estate has made.
          Whatever the cause: the alert clears when no item of this kind and severity is at risk, because each was fixed or crossed into breach, for an hour.
          **Finding the rest**
          The items: `puppet_remediation_item{state="at_risk", kind="{{ $labels.kind }}", severity="{{ $labels.item_severity }}"}`, valued in seconds outstanding. The SLA in force: `puppet_remediation_sla_seconds{kind="{{ $labels.kind }}", severity="{{ $labels.item_severity }}"}`. Ages count from the first poll that saw each item, so an item outstanding before Puppet Observability was deployed is older than it reads.
          **Escalate**
          Hand the list to whoever owns the patch schedule, with the SLA dates, if the windows cannot take the items in time.
          **Known noise**
          Fires once for every item when a tighter SLA is first set, and on the first day after a large vulnerability disclosure lands on many nodes.
        where_panel: pobs-patching/Breached And At Risk
        where: The "Breached And At Risk" table on the Patching board, longest outstanding
          first.
        thresholds: remediation_at_risk_ratio
    - alert: PobsRemediationSlaBreached
      expr: sum by (alias, kind, item_severity) (label_replace(puppet_remediation_items{state="breached"},
        "item_severity", "$1", "severity", "(.*)")) > 0
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $value }} {{ $labels.item_severity }} {{ $labels.kind }} item(s)
          on {{ $labels.alias }} are past their remediation SLA"
        description: |-
          **What is wrong**
          {{ $value }} outstanding {{ $labels.kind }} item(s) of severity {{ $labels.item_severity }} on primary `{{ $labels.alias }}` have been outstanding longer than their remediation SLA.
          **Risk**
          The estate is outside the remediation commitment it has made, and each day adds to the time the item has been exposed. An audit against that commitment reports these.
          **Severity and why**
          Warning. The commitment is already missed, and nothing done at night changes that; it is the first item of the working day, and the estate routes it wherever its escalation goes.
          **When to act**
          The next working day.
          **What to do**
          1. Check: which items. The Breached And At Risk table on Patching names each node, what is outstanding, how long, and the SLA.
          2. Then: fix or schedule each one, a security patch through its patch group's next window, a vulnerability through the fix VRS lists for it.
          3. Last: if an item cannot be fixed in time, record why and who accepted the risk where the estate keeps exceptions; this alert cannot see that record and keeps firing until the item is gone.
          Whatever the cause: the alert clears when no item of this kind and severity is past its SLA, for an hour.
          **Finding the rest**
          The items: `puppet_remediation_item{state="breached", kind="{{ $labels.kind }}", severity="{{ $labels.item_severity }}"}`, valued in seconds outstanding. The SLA in force: `puppet_remediation_sla_seconds{kind="{{ $labels.kind }}", severity="{{ $labels.item_severity }}"}`. Ages count from the first poll that saw each item.
          **Escalate**
          Hand the list to whoever owns the remediation commitment, with how far past it each item is.
          **Known noise**
          Fires for items left deliberately unpatched under an accepted exception. Silence the alert for that kind and severity, or raise its SLA, if the exception is standing.
        where_panel: pobs-patching/Breached And At Risk
        where: The "Breached And At Risk" table on the Patching board, longest outstanding
          first.
  - name: pobs-pe
    rules:
    - alert: GrafanaBelowSupportedFloor
      expr: puppet_infrastructure_config{grafana_version=~"([0-9]|10)\\..*"}
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Grafana {{ $labels.grafana_version }} on {{ $labels.grafana_server
          }} is below the supported floor
        description: |-
          **What is wrong**
          Grafana on `{{ $labels.grafana_server }}` has reported version `{{ $labels.grafana_version }}` for an hour, which is older than 11, the oldest major the boards are built for.
          **Risk**
          Panels on an older major can render as an empty box or drop options with no error shown. Prometheus keeps scraping and every other alert keeps firing.
          **Severity and why**
          Warning, because the data is intact and only the rendering is at risk. It waits for working hours.
          **When to act**
          Working hours. Nothing is lost while it waits.
          **What to do**
          1. Check: confirm the running version by curling `/api/health` under `observability::grafana_url`, the same endpoint the probe reads. A version of 11 or newer means the probe read something stale and the alert clears on the next scrape.
          2. Cause: the Grafana package was never upgraded past 10, or a package upgrade half-completed. Read "The whole dashboard node stops being managed after a patch run" in docs/operate/troubleshooting.md before upgrading. On an apt host that has had a Grafana install succeed before, the package upgrade can leave `grafana` half-installed in dpkg (`iF`), with the old version still serving and every dashboard, the datasource and the provisioning config no longer managed.
          3. Then: upgrade Grafana to 11 or newer. `observability::dashboard_server::grafana_version` is `installed` by default, so the upgrade normally arrives with your patching run; there is no upper bound. A Grafana restart is part of the upgrade, so do it when nobody needs the boards.
          The alert clears on the first scrape that reads a version of 11 or newer from `/api/health`.
          **Finding the rest**
          In Prometheus, `puppet_infrastructure_config{grafana_server="{{ $labels.grafana_server }}"}` carries the version as its `grafana_version` label; a series with no `grafana_version` label is a probe that read nothing, which this rule does not fire on. The same table lists the PE and CD4PE versions beside it.
          **Escalate**
          Hand it to whoever owns the dashboard node's patching if the package upgrade is blocked or dpkg is left half-installed. Give them the `/api/health` output and the dpkg state.
          **Known noise**
          None known.
        where_panel: pobs-tam-check/Component Versions
        where: The "Component Versions" table on the TAM Check board, which lists
          the Grafana version beside the PE it serves.
    - alert: PcpNodesDisconnected
      expr: puppet_pcp_disconnected_nodes > 0
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $value }} node(s) are off the PCP broker"
        description: |-
          **What is wrong**
          {{ $value }} nodes PuppetDB knows about are not connected to the orchestrator's PCP broker: more than 0 are off, and have been for fifteen minutes. Nodes can drop and return inside that window, so no single node need have been off the whole time.
          **Risk**
          A node off the broker cannot be given a task, a plan or an orchestrated deployment. It may still be running Puppet and reporting normally.
          **Severity and why**
          Warning, because the nodes are still reporting and only orchestration is lost. It is as urgent as a critical when the count is a large share of the fleet, because that points at the broker. It does not page.
          **When to act**
          Working hours for a handful of nodes. Now if the count is a large share of the fleet, because that points at the broker and blocks every orchestration job.
          **What to do**
          1. Check: read `Fleet Disconnected` against `Fleet Connected` on the Orchestrator board. A large share disconnected is the broker or the network to it, and that goes to the PE administrator now. A few is per-node, below.
          2. Cause: pxp-agent is stopped or was never installed on the node. Pick a named node from the Triage board and on it run `systemctl status pxp-agent` and `journalctl -u pxp-agent --since -1h`. No such unit is as likely as a stopped one, because a node that has never run pxp-agent counts as disconnected.
          3. Then: `systemctl restart pxp-agent` on one node first. It is cheap and reversible, and if the node reconnects, repeat on the rest.
          4. Cause: nodes that are off the broker by design. Set `observability::alerts::thresholds.pcp_disconnected_nodes` to that number.
          The alert clears once the disconnected count stays at or below 0 for a scrape. A decommissioned host drops out on its own once PuppetDB forgets it.
          **Finding the rest**
          Which nodes: `Every Node With Something Wrong` on the Triage board, reason "Off the PCP broker". In Prometheus, `puppet_pcp_node_disconnected == 1` is one series per disconnected node. The naming is capped at 200 per scrape; `puppet_pcp_node_disconnected_overflow` is how many more were dropped from the list, and the `Nodes Withheld` tile on Triage shows the same. The headline count is right regardless of the cap.
          **Escalate**
          Hand it to the PE administrator when a large share of the fleet is off, because the broker is theirs, and to the network team if the nodes can reach everything except the orchestrator port. Give them the count over time, the node list and a pxp-agent journal from one affected node.
          **Known noise**
          Decommissioned hosts PuppetDB has not yet purged count as disconnected until the purge. Nodes without pxp-agent by design are the threshold above.
        where_panel: pobs-orchestrator/Fleet Disconnected
        where: The "Fleet Disconnected" tile on the Orchestrator board, read against
          Fleet Connected beside it, which says whether this is a few machines or
          the broker.
        thresholds: pcp_disconnected_nodes
    - alert: PeInfraNodeInNoop
      expr: puppet_noop == 1 and on(node) label_replace(puppet_infra_platform, "node",
        "$1", "host", "(.+)")
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PE infrastructure server {{ $labels.node }} is running in noop
        description: |-
          **What is wrong**
          Puppet has run in noop on `{{ $labels.node }}`, a PE infrastructure server, for at least an hour, so it is reporting what it would change and changing nothing.
          **Risk**
          The infrastructure settings Puppet manages on this server are not being enforced, and every board keeps showing the node as converged while it drifts.
          **Severity and why**
          Warning, because the services are running and noop on a fleet node is a posture somebody chose. It is scoped to infrastructure servers because there it means PE's own configuration has stopped being managed. It waits for working hours unless changes are already pending.
          **When to act**
          Working hours, unless `puppet_noop_pending` shows changes waiting (step 1), in which case find out what they are today.
          **What to do**
          1. Check: `puppet_noop_pending{node="{{ $labels.node }}"}` in Prometheus. 1 means the last noop run found something to change and did not change it; 0 means noop has so far cost nothing.
          2. Cause: noop is set in the agent's configuration. On the node, run `sudo /opt/puppetlabs/bin/puppet config print noop --section agent` and read the `noop` setting in `/etc/puppetlabs/puppet/puppet.conf`. A config that prints false means noop is being passed on the run command, not set in the file, and the two are fixed in different places.
          3. Then: before turning noop off, read the pending changes in the node's last report. The next enforcing run applies everything the noop runs have been reporting, on an infrastructure server, so treat it as a change and do it in a window if the pending list is long.
          4. Last: remove the noop setting and run the agent.
          The alert clears after the next agent run that reports with noop off.
          **Finding the rest**
          The Convergence board lists nodes in noop with the reason "Running in noop" and counts the fleet nodes with pending changes in its `Noop With Changes` tile. pe_status_check indicator S0003 fails on the same condition, so expect `PeStatusCheckFailing` for S0003 on the same node.
          **Escalate**
          Hand it to the PE administrator if the pending changes touch PE services or you do not know who set noop. Give them the pending change list from the last report and the `puppet config print` output.
          **Known noise**
          An infrastructure server put in noop on purpose during a change holds this for as long as the change takes; silence it in Alertmanager for the window and turn noop off at the end.
        where_panel: pobs-convergence/Nodes Needing Attention
        where: The "Nodes Needing Attention" table on the Convergence board, which
          lists every node with something wrong and names noop as the reason.
    - alert: PeStatusCheckFailing
      expr: puppet_pe_status_check_failing == 1
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pe_status_check {{ $labels.check }} is failing on {{ $labels.node
          }}
        description: |-
          **What is wrong**
          PE's own health check `{{ $labels.check }}` has returned false on `{{ $labels.node }}` for an hour, which is two consecutive agent runs.
          **Risk**
          Depends on the indicator. The code names one of about forty conditions PE checks on its infrastructure nodes, from a service not running to a certificate near expiry, and the indicator's runbook entry says what it costs.
          **Severity and why**
          Warning, always, because this is PE's judgement being relayed, and critical is kept for conditions this module checks itself. An indicator that deserves a page has an alert of its own in this module on the same condition. It waits for working hours unless the indicator's own entry says otherwise.
          **When to act**
          Working hours by default. The indicator's own entry says if it is more urgent than that.
          **What to do**
          1. Check: open the indicator's entry on the Runbook board, linked below. It says what PE checks, why it matters and what to do.
          2. Check: for a code newer than this module's runbook, read PE's own table at https://github.com/puppetlabs/puppetlabs-pe_status_check#fact-pe_status_check.
          3. Whatever the cause: fix the underlying condition and run the agent on `{{ $labels.node }}`.
          The alert clears after the next agent run on which the check passes. Several indicators have an alert of their own in this module on the same condition (S0003, S0034, S0036 and S0038 among them), so two alerts can be one fault.
          **Finding the rest**
          Every indicator with its result, on the node: `facter -p pe_status_check`. In Prometheus, `puppet_pe_status_check_failing{node="{{ $labels.node }}"}` is one series per failing check on this node, so several codes failing at once on one node read as one event.
          **Escalate**
          Follow the indicator's own entry. Otherwise hand it to the PE administrator with the indicator code, the `facter -p pe_status_check` output and when it started failing.
          **Known noise**
          An indicator PE evaluates in a way the site has decided not to follow fires for ever; silence that `check` label in Alertmanager so the rest of the family keeps alerting.
        where: "[{{ $labels.check }} on the Runbook](/d/pobs-runbook/?var-alert={{
          $labels.check }}), PE's entry for this indicator and what to do about it."
    - alert: PeUpgradeOverdue
      expr: time() - puppet_pe_last_upgrade_epoch > 365 * 86400
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PE on {{ $labels.alias }} has not been upgraded in over 365 days
        description: |-
          **What is wrong**
          The PE install on `{{ $labels.alias }}` is more than 365 days past its last upgrade, dated from the mtime of its `pe_build` file.
          **Risk**
          The install is outside the support window for the newest agent versions and carries every defect fixed since, security fixes included. Nothing breaks today.
          **Severity and why**
          Warning, because this is configuration posture and holds until the next upgrade. It waits for the next planning cycle; nothing about it gets worse overnight.
          **When to act**
          Next planning cycle.
          **What to do**
          1. Check: read the running version from the `pe_version` label on `puppet_infrastructure_config{alias="{{ $labels.alias }}"}` and check it against what Puppet currently supports. A version inside the support window with an old `pe_build` mtime is a patch release that did not touch the file, and the alert stands until the next full upgrade.
          2. Then: confirm a backup exists before planning the upgrade. `puppet_backup_last_epoch{alias="{{ $labels.alias }}"}` is when the newest artefact was written, and `PuppetBackupNeverRun` fires if none ever has.
          3. Last: schedule the upgrade in a maintenance window with a rollback path.
          The alert clears once an upgrade rewrites `pe_build` and the next poll reads the new mtime. The metric exists only on a PE primary, so this names the install, never a compiler.
          **Finding the rest**
          The exact date: `puppet_pe_last_upgrade_epoch{alias="{{ $labels.alias }}"}` in Prometheus. PE's own health check S0034 watches the same thing, and its entry on this board has PE's steps.
          **Escalate**
          This is the PE administrator's to plan from the start. Give them the running version and the upgrade date.
          **Known noise**
          A site on a slower upgrade cadence by policy raises `pe_upgrade_overdue_days` under `observability::alerts::thresholds` to match it.
        where_panel: pobs-tam-check/Since PE Upgrade
        where: The "Since PE Upgrade" tile on the TAM Check board, which shows how
          long since the oldest primary in the selection was upgraded.
        thresholds: pe_upgrade_overdue_days
    - alert: PobsInfraTimerInactive
      expr: node_systemd_unit_state{state="active",pe_infrastructure="true",name=~"pobs-.*\\.timer"}
        == 0
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $labels.name }} is not active on {{ $labels.instance }}"
        description: |-
          **What is wrong**
          The Puppet Observability timer `{{ $labels.name }}` on `{{ $labels.instance }}` has not been active for fifteen minutes. systemd still knows the unit, so it has been stopped, disabled or masked. A timer that failed shows on `PobsInfraUnitFailed`.
          **Risk**
          Nothing runs on this timer's schedule until somebody starts it. On a quarterly timer like `pobs-tam-report.timer` that is a quarter with no report.
          **Severity and why**
          Warning, because a stopped timer costs a report or an artefact and no service. It waits for working hours.
          **When to act**
          Working hours. The job it drives is already late by its own schedule and a few more hours changes little.
          **What to do**
          1. Check: on the host, run `systemctl status {{ $labels.name }}` and `systemctl list-timers {{ $labels.name }}` to see whether it is stopped, disabled or masked and when it last fired.
          2. Cause: it was stopped by hand or by a package action. `systemctl enable --now {{ $labels.name }}` starts it again. A masked unit needs `systemctl unmask {{ $labels.name }}` first. No window needed.
          3. Cause: Puppet manages the timer and keeps it stopped. Check whether the next agent run reverts your change; if it does, the Puppet code is where to fix it.
          The alert clears once the timer reads active for a scrape.
          **Finding the rest**
          In Prometheus, `node_systemd_unit_state{name=~"pobs-.*\\.timer",instance="{{ $labels.instance }}"} == 1` shows which state each Puppet Observability timer on this host is in. The rule needs the systemd collector on the host (`observability::node_exporter::collectors_enable`), so a host without it gets no alert.
          **Escalate**
          Hand it to the PE administrator if Puppet keeps stopping the timer and you cannot find where. Give them the `systemctl status` output and the agent run report.
          **Known noise**
          A site that has turned a Puppet Observability feature off but left its timer unit installed fires for ever; remove or mask the unit, or silence that `name` label in Alertmanager.
    - alert: PobsInfraUnitFailed
      expr: node_systemd_unit_state{state="failed",pe_infrastructure="true"} == 1
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $labels.name }} has failed on {{ $labels.instance }}"
        description: |-
          **What is wrong**
          The systemd unit `{{ $labels.name }}` on `{{ $labels.instance }}`, a Puppet infrastructure host, has been in the failed state for fifteen minutes.
          **Risk**
          Depends on the unit. A failed `pe-puppetserver` is an outage and every board goes stale with it; a metrics unit can sit failed for days with nothing visible until the data it feeds is missed.
          **Severity and why**
          Warning, because the rule cannot tell a PE service from a metrics oneshot and most failed units on an infrastructure host are the latter. Treat a `pe-*` unit as a critical when you read it. It does not page.
          **When to act**
          Now if the unit is a PE service (`pe-*`). Working hours for anything else, after reading what the unit does.
          **What to do**
          1. Check: on the host, run `systemctl status {{ $labels.name }}` and `journalctl -u {{ $labels.name }} --since -1h` and read why it failed.
          2. Then: restart it with `systemctl restart {{ $labels.name }}`. The journal says whether the restart will hold. Restarting a `pe-*` service drops its clients for the restart, so for a compiler or PuppetDB do it at a quiet moment.
          3. Last: if it fails again, fix the cause the journal names before restarting a second time.
          The alert clears once the unit leaves the failed state and stays out of it. A oneshot unit on a timer reports failed between runs until the next run succeeds, so a fixed oneshot clears on its next scheduled run.
          **Finding the rest**
          In Prometheus, `node_systemd_unit_state{state="failed",pe_infrastructure="true",instance="{{ $labels.instance }}"} == 1` lists every failed unit on this host. This rule needs the systemd collector on the host (`observability::node_exporter::collectors_enable`), which is off by default, so a host without it has no series and gets no alert.
          **Escalate**
          Hand it to the PE administrator if the unit is a `pe-*` service and the second restart does not hold, and to Puppet support if the journal names a PE internal error. Give them the unit name, the journal lines and the time of the first failure.
          **Known noise**
          A oneshot on a short timer that fails once reads failed until its next run, which the fifteen minute dwell usually covers. A unit a site has retired but not removed sits failed for ever; disable it or silence that `name` label in Alertmanager.
        where_panel: pobs-infrastructure-health/Which Unit, On Which Host
        where: The "Which Unit, On Which Host" table on the Puppet Infrastructure
          Health board, which lists every failed unit on the selected infrastructure
          hosts.
    - alert: PobsScheduledJobStuck
      expr: |-
        label_replace(
          changes(node_systemd_timer_last_trigger_seconds[14400s]) == 0
          and node_systemd_timer_last_trigger_seconds > 0
          and node_systemd_timer_last_trigger_seconds offset 14400s,
          "name", "$1.service", "name", "(.+)\\.timer")
        and on (instance, name) (node_systemd_unit_state{state=~"activating|failed"} == 1) and on (instance, name) (max_over_time(node_systemd_unit_state{state="inactive"}[14400s]) == 0) unless on (instance, name) (node_systemd_unit_state{state="failed",pe_infrastructure="true"} == 1)
      for: 5m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $labels.name }} on {{ $labels.instance }} has not completed since
          its timer started it"
        description: |-
          **What is wrong**
          A timer started `{{ $labels.name }}` on `{{ $labels.instance }}` more than four hours ago, has not fired it again, and the unit has not once returned to `inactive` since. It is either still running, which for a scheduled job is usually a hang, or it failed.
          **Risk**
          Whatever this job produces was not produced this cycle, and anything downstream keeps reading the last run's output with nothing saying it is old. systemd will not start a unit that is still running, so a hang also skips the next scheduled run.
          **Severity and why**
          Warning, because the cost is one missed cycle of whatever the job produces, and a failed unit on PE infrastructure is left to PobsInfraUnitFailed. It waits for working hours or the next scheduled start, whichever is sooner.
          **When to act**
          Before the next scheduled start, which `systemctl list-timers` shows. Otherwise working hours.
          **What to do**
          1. Check: on the host, run `systemctl status {{ $labels.name }}`. `activating` means still running; `failed` means it finished badly.
          2. Check: run `journalctl -u {{ $labels.name }} --since -1d` and read whether the run logged a finish and what it was doing when it stopped logging.
          3. Cause: the job hung. `systemctl stop {{ $labels.name }}` kills it so the next timer firing can start a clean run. Check first whether the job writes an artefact other things read, so a half-written one is removed with it.
          4. Cause: the job failed. Fix what the journal names and let the timer run it again, or start it by hand.
          The alert clears when the timer next fires the unit and it completes. A unit with `TimeoutStartSec` set moves itself from hanging to failed when the timeout expires, and this alert keeps firing through that until the timer fires again.
          **Finding the rest**
          In Prometheus, `node_systemd_unit_state{name="{{ $labels.name }}",instance="{{ $labels.instance }}"} == 1` is the unit's current state, and `node_systemd_timer_last_trigger_seconds{instance="{{ $labels.instance }}"}` is when each timer on the host last fired. This rule needs the systemd collector on the host (`observability::node_exporter::collectors_enable`) and the unit inside any `--collector.systemd.unit-include` pattern the host sets. A timer whose `Unit=` names a service of a different name is not matched.
          **Escalate**
          Hand it to whoever owns the job (the scanner team for a scan, the PE administrator for a Puppet Observability timer) if the journal shows the same hang on two runs. Give them the journal lines, the timer's last trigger time and how long the unit sat in `activating`.
          **Known noise**
          A job whose normal run time is longer than four hours reads as stuck on every run; raise `scheduled_job_stuck_seconds` and `scheduled_job_stuck_human` together under `observability::alerts::thresholds`. A job a site does not care about is a silence on its `name` label in Alertmanager.
        thresholds: scheduled_job_stuck_human, scheduled_job_stuck_seconds
    - alert: TooManyEnvironments
      expr: count by (alias) (count by (alias, environment) (puppet_code_id)) > 100
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PE {{ $labels.alias }} is serving {{ $value }} environments
        description: |-
          **What is wrong**
          Nodes on PE `{{ $labels.alias }}` have reported under {{ $value }} distinct environments for an hour, over the 100 this rule allows.
          **Risk**
          Every environment is a full checkout of the control repo plus its share of puppetserver's caches, so the count costs disk, file sync time and compile latency. Nothing is broken.
          **Severity and why**
          Warning, because it is a cost that grows slowly and a cleanup is routine work. It waits for the next change window.
          **When to act**
          Next change window.
          **What to do**
          1. Cause: a rolling deployment in flight has created transient environments. Check `Ephemeral Environments Seen` on the Environments board; this rule counts every environment in `puppet_code_id`, including CD4PE's transient `rolling_deployment_*` and `*_cdpe_ia_*` branches. If most of the excess is ephemeral, wait for the deployment to finish and the alert clears on its own.
          2. Cause: control-repo feature branches nobody deleted. Check `Environments With No Nodes` and `Environments By Age` on the same board for the durable environments nobody reports under.
          3. Then: delete the branch for each abandoned environment in the control repo. Check its node count in `Environments By Age` first, so you do not remove an environment out from under a node. A branch delete is a code deploy, so do it in the change window.
          The alert clears once the count of environments in `puppet_code_id` drops to 100 or below. `puppet_code_id` is only populated where Code Manager is in use.
          **Finding the rest**
          The `Environments Deployed` tile on the Environments board filters ephemeral branches out and this rule does not, so the two numbers differ. In Prometheus, `count by (environment) (puppet_code_id{alias="{{ $labels.alias }}"})` lists every environment this rule counted. `puppet_environment_last_deploy_epoch` is one series per directory under `observability::code_dir`, so it also shows branches no node reports under, and `sum by (environment) (puppet_node_count{alias="{{ $labels.alias }}",environment!="all"})` is how many nodes each has. PE's own health check S0038 watches the same thing, and its entry on this board has PE's steps.
          **Escalate**
          Hand the branch list to whoever owns the control repo, because deleting branches is theirs. Give them the `Environments By Age` output with node counts.
          **Known noise**
          A site that runs many environments on purpose raises `max_environments` under `observability::alerts::thresholds`. A large CD4PE rolling deployment tips the count for its duration and clears on its own.
        where_panel: pobs-environments/Environments By Age
        where: The "Environments By Age" table on the Environments board, which lists
          every durable environment with its node count and how long since it was
          deployed, stalest first.
        thresholds: max_environments
  - name: pobs-postgres
    rules:
    - alert: PeDatabasesMaintenanceFailed
      expr: puppet_pe_databases_last_run_failed == 1
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pe_databases maintenance for {{ $labels.tables }} tables failed on
          {{ $labels.alias }}
        description: |-
          **What is wrong**
          The last pg_repack run of the pe_databases `{{ $labels.tables }}` job on `{{ $labels.alias }}` failed, and it has not succeeded in the hour since.
          **Risk**
          Nothing breaks today. The tables that job maintains grow dead tuples and transaction age with nobody reclaiming them, which surfaces later as PuppetDB slowing down, the data partition filling, and in the end a transaction ID wraparound alert.
          **Severity and why**
          Warning, because the outcome is weeks or months away and PostgresDeadTuplesAccumulating and PostgresTransactionIdWraparound fire on it before it hurts. It waits for working hours; the next timer firing is the retry.
          **When to act**
          Working hours.
          **What to do**
          1. Cause: the run collided with PuppetDB's own work and hit a lock timeout. Check `sudo systemctl status pe_databases-{{ $labels.tables }}.service` and `sudo journalctl -u 'pe_databases-{{ $labels.tables }}*' --since '-2 days'` on `{{ $labels.alias }}`; healthy is a clean exit, unhealthy is a lock timeout in the journal. Let the timer retry, or run it by hand at a quieter time; no window needed.
          2. Cause: the data partition is full. Check the same journal for a disk full error and PobsInfraFilesystemLow for the host; free the space before anything else.
          3. Then: run it by hand once the cause is cleared with `sudo systemctl start pe_databases-{{ $labels.tables }}.service`, and watch the journal from step 1.
          The alert clears on the next scrape after a run succeeds, whether by the timer or by hand.
          **Finding the rest**
          When each job last ran: `puppet_pe_databases_last_run_epoch{alias="{{ $labels.alias }}"}`, as a Unix time, 0 for never. When the timer fires next: `puppet_pe_databases_next_run_epoch{alias="{{ $labels.alias }}"}`. Whether bloat is already showing: `puppet_postgres_table_tuples{state="dead"}` per table on the PuppetDB board. Whether the failed run has been retried and failed again: `puppet_pe_databases_last_run_failed{alias="{{ $labels.alias }}",tables="{{ $labels.tables }}"}` staying at 1 past the next run time.
          **Escalate**
          Hand it to the PE administrator if the run fails a second time with the cause cleared, or if the journal names a table or an index error. Give them the journal lines and the last and next run times.
          **Known noise**
          One failure on a busy table is normal and is what the hour of dwell absorbs. An estate that has stopped a job on purpose should disable its timer, which removes the series.
        where_panel: pobs-tam-check/pg_repack Schedule
        where: The "pg_repack Schedule" panel on TAM Check, which lists each pe_databases
          job with its last and next run.
    - alert: PostgresConnectionsNearLimit
      expr: sum without (db) (puppet_postgres_backends) / puppet_postgres_max_connections
        > 0.9
      for: 10m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PostgreSQL on {{ $labels.host }} is near its connection limit
        description: |-
          **What is wrong**
          Open connections on `{{ $labels.host }}`, summed across its databases, have been above 0.9 of `max_connections` for ten minutes.
          **Risk**
          At the ceiling PostgreSQL refuses new connections instead of queueing them. PuppetDB's pools and anything else on this database then fail outright, and PuppetDB command processing and queries stop with it.
          **Severity and why**
          Warning, because connections are still being accepted and most instances sit flat just over the line. It is as urgent as a critical if the count is still climbing, because the failure at the limit is sudden and total. It does not page; read the trend when you pick it up.
          **When to act**
          Now if it is still climbing, because the failure at the limit is sudden. If it is flat just over the line, working hours.
          **What to do**
          1. Cause: one database holds most of the connections, usually through sessions idle in transaction. Check `sum by (db) (puppet_postgres_backends{host="{{ $labels.host }}"})`; healthy is each database's count well under its share, unhealthy is one database carrying most of the total. Connect to pe-puppetdb and query `pg_stat_activity`, filtering on `datname` for that database; end the idle in transaction sessions before raising anything. No window needed.
          2. Inferred cause: the ceiling is too low for the load. Check `puppet_postgres_max_connections{host="{{ $labels.host }}"}` against the summed backends with nothing idle. Raising `max_connections` needs a PostgreSQL restart, which drops every connection PuppetDB and anything else on the database holds, so it belongs in a maintenance window.
          The alert clears once the ratio has been under 0.9 for ten minutes. Ending idle sessions clears it on the next scrape.
          **Finding the rest**
          The ratio the rule fires on: `sum without (db) (puppet_postgres_backends{host="{{ $labels.host }}"}) / puppet_postgres_max_connections{host="{{ $labels.host }}"}`. The configured ceiling: `puppet_postgres_max_connections{host="{{ $labels.host }}"}`. Whether an open transaction is behind the held sessions: `puppet_postgres_oldest_transaction_seconds{host="{{ $labels.host }}",state="idle in transaction"}`; a value in hours is a session that has been holding a connection that long. PE's own health check S0029 watches the same thing, and its entry on this board has PE's steps.
          **Escalate**
          Hand it to the PE administrator if the connections are live and not idle, or if `max_connections` needs raising. Give them the per-database counts, the `pg_stat_activity` output and the time the ratio started climbing.
          **Known noise**
          A brief spike over the line during a large deploy clears inside the ten minute dwell. An estate that runs close to the ceiling by design raises `postgres_connections_ratio` under `observability::alerts::thresholds`.
        where_panel: pobs-puppetdb/Connection Saturation
        where: The "Connection Saturation" tile on the PuppetDB board, which draws
          the same expression this rule fires on.
        thresholds: postgres_connections_ratio
    - alert: PostgresDeadTuplesAccumulating
      expr: puppet_postgres_table_tuples{state="dead"} / ignoring(state) puppet_postgres_table_tuples{state="live"}
        > 0.2 and ignoring(state) puppet_postgres_table_tuples{state="live"} > 100000
      for: 2h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Dead tuples are accumulating in {{ $labels.table }} on {{ $labels.host
          }}
        description: |-
          **What is wrong**
          Dead tuples in table `{{ $labels.table }}` on `{{ $labels.host }}` have been above 0.2 of live rows for two hours, on a table with more than 100000 live rows. Autovacuum is not keeping up with this table.
          **Risk**
          Nothing has failed yet. Every query on the table gets slower as the bloat grows, and on PuppetDB that shows up as command processing falling behind, which is when PuppetDBQueueGrowing fires.
          **Severity and why**
          Warning, because the database is still answering and the cost is query time, not an outage. It would be critical if it stopped PuppetDB processing commands, and PuppetDBQueueGrowing is the alert that says so. It waits for working hours.
          **When to act**
          Working hours. It becomes urgent only if PuppetDBQueueGrowing fires beside it.
          **What to do**
          1. Cause: autovacuum has stopped working on this table. Check `rate(puppet_postgres_vacuums_total{host="{{ $labels.host }}",table="{{ $labels.table }}"}[1h])`; healthy is a non-zero rate on at least one `kind`, unhealthy is zero on both while the dead count climbs. The fix is the per-table or cost-limit autovacuum setting on the database, which the PE administrator changes; it does not need a window.
          2. Cause: an open transaction is holding old rows alive, so vacuums run and reclaim nothing. Check `puppet_postgres_oldest_transaction_seconds{host="{{ $labels.host }}"}`; healthy is seconds to minutes, unhealthy is hours on `state="idle in transaction"`. `pg_stat_activity` on pe-puppetdb, filtered on state, names the session; end it.
          3. Then: reclaim the bloat. A plain `VACUUM` on the table is safe and online and needs no window. `VACUUM FULL` is not: it takes an exclusive lock and rewrites the table, so PuppetDB stops for as long as it runs. Do not run it outside a window.
          The alert clears once the dead to live ratio has been under 0.2 for the evaluation period. A vacuum that completes clears it on the next scrape; a setting change clears it after autovacuum has caught up.
          **Finding the rest**
          Dead against live for this table: `puppet_postgres_table_tuples{host="{{ $labels.host }}",table="{{ $labels.table }}"}`; the `state="dead"` series over `state="live"` is the ratio the rule fires on. Whether autovacuum is touching the table: `rate(puppet_postgres_vacuums_total{host="{{ $labels.host }}",table="{{ $labels.table }}"}[1h])`; zero on both `kind` values while dead rows climb is autovacuum skipping the table. Whether an open transaction is blocking reclaim: `puppet_postgres_oldest_transaction_seconds{host="{{ $labels.host }}"}`; hours on `state="idle in transaction"` is a session to find and end. The per-table and autovacuum panels for `{{ $labels.host }}` are further down the PuppetDB board.
          **Escalate**
          Hand it to the PE administrator if vacuums are running, no transaction is open for long, and the ratio still climbs, or if the table needs a `VACUUM FULL`. Give them the table name, the two queries above with their output over the last day, and the `pg_stat_activity` rows you found.
          **Known noise**
          A table that has just had a large delete reads as bloated until autovacuum gets to it, and clears on its own within the dwell. If a known busy table sits just over the line, raise `postgres_dead_tuple_ratio` or `postgres_dead_tuple_floor` under `observability::alerts::thresholds` instead of silencing it.
        where_panel: pobs-puppetdb/Dead Tuple Ratio
        where: The "Dead Tuple Ratio" tile on the PuppetDB board, which shows dead
          against live tuples estate wide; the per-table and autovacuum panels for
          `{{ $labels.host }}` are further down the same board.
        thresholds: postgres_dead_tuple_floor, postgres_dead_tuple_ratio
    - alert: PostgresInactiveSlotRetainingWal
      expr: puppet_postgres_replication_slot_retained_bytes{active="false"} > 1073741824
      for: 30m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Replication slot {{ $labels.slot }} on {{ $labels.host }} is inactive
          and holding WAL
        description: |-
          **What is wrong**
          Replication slot `{{ $labels.slot }}` on `{{ $labels.host }}` has had no reader for half an hour and is holding back more than a gigabyte of WAL.
          **Risk**
          PostgreSQL keeps that WAL until the slot is read or dropped. Left alone it fills the database volume, and a full database volume stops PE.
          **Severity and why**
          Warning, because a gigabyte of held WAL is a problem on a timescale of days on most volumes. It is only as urgent as a critical when the database volume is already low, which PobsInfraFilesystemLow on the same host says. It waits for working hours.
          **When to act**
          Working hours, unless the database volume is already low. Check PobsInfraFilesystemLow on the same host before deciding it can wait.
          **What to do**
          1. Check: find what the slot belongs to with `SELECT slot_name, active, restart_lsn FROM pg_replication_slots` on pe-puppetdb. A slot name that matches a known replica is step 2; one nobody recognises is step 3.
          2. Cause: the replica that reads the slot is down. Check the replica host; healthy is it reconnecting and the `active` label flipping to `true`, unhealthy is it still off. Bring the replica back and the WAL drains on its own. No window needed.
          3. Cause: the slot belongs to a replica or consumer that no longer exists. Drop it with `SELECT pg_drop_replication_slot('{{ $labels.slot }}')` on pe-puppetdb. Do not drop a slot a live replica uses, because that replica then needs re-provisioning.
          The alert clears once the slot is active again or dropped. Dropping it releases the WAL at the next checkpoint.
          **Finding the rest**
          How much WAL the slot holds and whether it has gone active: `puppet_postgres_replication_slot_retained_bytes{host="{{ $labels.host }}",slot="{{ $labels.slot }}"}`; the `active` label flipping to `true` is the replica reconnecting. How much room is left on the volume: `PobsInfraFilesystemLow` for `{{ $labels.host }}` if it is already firing.
          **Escalate**
          Hand it to the PE administrator if you cannot tell what the slot belongs to, because dropping the wrong slot costs a replica rebuild. Give them the `pg_replication_slots` output and the retained bytes over the last day.
          **Known noise**
          A replica restarting for patching leaves its slot inactive for a few minutes and well under a gigabyte, so it does not fire. A planned replica outage longer than half an hour is a silence in Alertmanager for its duration.
        where_panel: pobs-tam-check/WAL Held By Idle Slots
        where: The "WAL Held By Idle Slots" tile on TAM Check, which shows the WAL
          that slots with no reader are holding back.
    - alert: PostgresTransactionIdWraparound
      expr: puppet_postgres_xid_age > 1000000000
      for: 1h
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: Database {{ $labels.db }} on {{ $labels.host }} is halfway to transaction
          ID wraparound
        description: |-
          **What is wrong**
          Database `{{ $labels.db }}` on `{{ $labels.host }}` has gone more than a billion transactions without being frozen, and has been there for an hour. Healthy autovacuum keeps this in the low millions.
          **Risk**
          At about two billion PostgreSQL refuses writes to protect itself, and PE stops. Something is already preventing autovacuum from freezing this database.
          **Severity and why**
          Critical, because the end state is PE refusing every write and the age only comes down with a freeze that reads every table. It pages, so that the cause is found tonight even if the freeze waits for a window.
          **When to act**
          Now. Find the cause tonight; the freeze itself can wait for a window if the age is not close to two billion.
          **What to do**
          1. Cause: a transaction has been open for days and stops autovacuum freezing anything newer. Check `puppet_postgres_oldest_transaction_seconds{host="{{ $labels.host }}"}`; healthy is seconds to minutes, unhealthy is days on either state. `pg_stat_activity` on pe-puppetdb, filtered on `state = 'idle in transaction'`, names the session; end it.
          2. Cause: an inactive replication slot. Check `SELECT slot_name, active FROM pg_replication_slots` on pe-puppetdb; healthy is every slot active, unhealthy is one with no reader. PostgresInactiveSlotRetainingWal firing beside this is the same cause, and its entry says when to drop the slot.
          3. Inferred cause: autovacuum is disabled on a table in this database. Check the per-table autovacuum settings on pe-puppetdb and re-enable it where it is off.
          4. Then: with the cause cleared, run `VACUUM (FREEZE, VERBOSE)` on `{{ $labels.db }}` as pe-postgres, in a window. It reads every table.
          The alert clears once the age has been under a billion for an hour. Only a freeze brings the age down; clearing the cause alone does not.
          **Finding the rest**
          The age now and whether it is still climbing: `puppet_postgres_xid_age{host="{{ $labels.host }}",db="{{ $labels.db }}"}`. Whether an open transaction is the cause: `puppet_postgres_oldest_transaction_seconds{host="{{ $labels.host }}"}`; days on either state is the blocker. Whether an idle slot is the cause: `puppet_postgres_replication_slot_retained_bytes{host="{{ $labels.host }}",active="false"}`; any series here is a slot with no reader.
          **Escalate**
          Hand it to the PE administrator as soon as the cause is found, because the freeze and any slot drop are theirs to schedule, and to Puppet support if none of the three causes fits. Give them the age query over the last week, the `pg_stat_activity` and `pg_replication_slots` output, and the time the age started climbing.
          **Known noise**
          None known.
        where_panel: pobs-tam-check/Transaction ID Age
        where: The "Transaction ID Age" tile on TAM Check, which shows how far the
          least recently frozen database is towards wraparound.
  - name: pobs-puppetdb
    rules:
    - alert: PobsPuppetDBErrorRate
      expr: rate(puppet_exporter_server_errors_total[15m]) / rate(puppet_exporter_server_queries_total[15m])
        * 100 > 25
      for: 30m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: pobs is seeing query errors against {{ $labels.server }}
        description: |-
          **What is wrong**
          More than 25% of Puppet Observability's queries against `{{ $labels.server }}` have failed over the last fifteen minutes, and the share has stayed there for half an hour.
          **Risk**
          The data read through that server lags while the exporter as a whole still looks healthy. If the failures continue it becomes `PobsPuppetDBServerDown` and the server contributes nothing.
          **Severity and why**
          Warning. Some queries still succeed so the data lags without stopping. It waits for working hours; `PobsPuppetDBServerDown` is the page if the server stops answering altogether.
          **When to act**
          Working hours, unless `PobsPuppetDBServerDown` fires alongside it.
          **What to do**
          1. Check: on the Puppet Observability host run `sudo /usr/local/bin/pobs-ctl preflight`. It only reads, and it reports the daemon's certificate and CRL expiry and runs one query against each configured PuppetDB. A failure on either names the cause.
          2. Check: `journalctl -u pobs -n 100 --no-pager` on the same host for the error text. An expiring certificate and a busy PuppetDB produce the same errors, so read the preflight output alongside it.
          3. Cause: PuppetDB is slow and queries are timing out. With preflight clean, read Queue Depth and Pool Wait on the PuppetDB board. A deep queue or a rising pool wait is PuppetDB slow, and `PuppetDBQueueGrowing` is the rule to follow from there.
          The alert clears as soon as the error share over the last fifteen minutes drops below 25%.
          **Finding the rest**
          `rate(puppet_exporter_server_errors_total{server="{{ $labels.server }}"}[15m]) / rate(puppet_exporter_server_queries_total{server="{{ $labels.server }}"}[15m])` is the current error share as a fraction. `puppet_exporter_server_query_duration_seconds{server="{{ $labels.server }}"}` is how long the last query took, and one near `observability::puppetdb_timeout` is a timeout. How long since each server last answered and how long its last query took: the PuppetDB Servers table on the Internal Operations board. Which boards go stale while the data lags: Collector Freshness, and What Goes Stale With It on the same board.
          **Escalate**
          If the errors are timeouts and the PuppetDB board shows the server itself under load, hand the PE administrator the server name, the error share query output and the journal lines over the window. If PuppetDB is idle and the errors are in the daemon, `sudo /usr/local/bin/pobs-ctl support-bundle` writes the file for whoever runs Puppet Observability.
          **Known noise**
          A server that is busy on a schedule, such as during a mass agent run, can cross the share briefly; the thirty-minute hold absorbs most of that. If it recurs on a known schedule, raise `puppetdb_error_percent` under `observability::alerts::thresholds` or lengthen `observability::puppetdb_timeout`.
        where_panel: pobs-operations/PuppetDB Servers
        where: The "PuppetDB Servers" table on the Internal Operations board, which
          shows how long since each server last answered and how long its last query
          took.
        thresholds: puppetdb_error_percent
    - alert: PobsPuppetDBServerDown
      expr: puppet_exporter_server_up == 0
      for: 15m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: pobs cannot query PuppetDB server {{ $labels.server }}
        description: |-
          **What is wrong**
          Puppet Observability has not had a successful query against `{{ $labels.server }}` for fifteen minutes.
          **Risk**
          With several entries in `puppetdb_urls` the exporter fails over to the others, no board goes blank and nothing else reports it. On a single-server config everything read from PuppetDB is stale, which is most of the fleet view. Node pruning also stalls on a dead server, so departed nodes stay in the store and it can reach its ceiling (`PobsStoreAtCeiling`).
          **Severity and why**
          Critical, because every board reads through these servers and on a single-server configuration the whole fleet view is stale. It pages.
          **When to act**
          Now. Every board reads through these servers.
          **What to do**
          1. Check: on the Puppet Observability host run `sudo /usr/local/bin/pobs-ctl preflight`. It only reads. It runs one query against each configured PuppetDB over the daemon's own certificate and fails the run on any that refuses, cannot complete the TLS handshake or does not answer, and the line says which.
          2. Cause: a TLS or certificate failure, which is on this host. Preflight also reports the daemon's certificate and CRL expiry in the same run. Fix the certificate and the next poll recovers on its own.
          3. Cause: a refused or unanswered query, which is on the server. `systemctl status pe-puppetdb` on `{{ $labels.server }}`, then `/var/log/puppetlabs/puppetdb/puppetdb.log` there for the reason.
          The alert clears on the first successful query after the fault is fixed. No restart of pobs is needed.
          **Finding the rest**
          `puppet_exporter_server_up` lists every server with 1 or 0, so a 0 beside other 1s is a single failed server with failover in effect. `rate(puppet_exporter_server_errors_total{server="{{ $labels.server }}"}[15m])` is how fast queries against it are failing; zero with the server still down means the poller has stopped trying it until the backoff expires. How long each configured server has been silent, whether the poller is backing off it and how long its last query took: the PuppetDB Servers table on the Internal Operations board.
          **Escalate**
          If pe-puppetdb on the server is down or refusing connections and you cannot bring it back, hand the PE administrator the server name, the preflight output and the puppetdb.log lines from the time it stopped answering. If PuppetDB is up and answering other clients but refuses the daemon's certificate, the same handover goes to the PE administrator with the certificate expiry preflight printed.
          **Known noise**
          A server listed in `puppetdb_urls` that has been decommissioned fires this until it is removed from the list; remove it. A planned PuppetDB outage longer than fifteen minutes should be silenced on `server` in Alertmanager for the window.
        where_panel: pobs-operations/PuppetDB Servers
        where: The "PuppetDB Servers" table on the Internal Operations board, which
          shows how long since each configured server last answered and whether the
          poller is backing off it.
    - alert: PuppetDBCommandsDiscarded
      expr: increase(puppet_db_commands_discarded_total[30m]) > 0
      for: 5m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: PuppetDB on {{ $labels.host }} is discarding commands
        description: |-
          **What is wrong**
          PuppetDB on `{{ $labels.host }}` has given up on commands after exhausting their retries in the last half hour. The reports, facts or catalogues they carried were never stored.
          **Risk**
          The nodes that sent them go on reporting success, so convergence and freshness read better on every board than the estate is. The dropped reports do not come back.
          **Severity and why**
          Critical, because every discarded command is data that is gone for good and the nodes that sent it show no sign of it. It pages.
          **When to act**
          Now. Every command discarded while this stands is more history gone.
          **What to do**
          1. Check: `/var/log/puppetlabs/puppetdb/puppetdb.log` on `{{ $labels.host }}` for the discarded command and the exception that killed it. The discarded commands themselves are parked under `/opt/puppetlabs/server/data/puppetdb/stockpile/discard/`.
          2. Cause: the database. On the PuppetDB board read Waiting on Postgres. Above zero, follow `PuppetDBQueueGrowing` step 1.
          3. Cause: the PuppetDB JVM, with Waiting on Postgres at zero. Read Heap Used; near max, follow `PuppetDBHeapPressure`.
          4. Whatever the cause: once it is fixed, `sudo /opt/puppetlabs/bin/puppet agent -t` on an affected node puts that node's current facts and catalogue back. The reports that were dropped stay gone.
          The alert clears once thirty minutes have passed with no discard. Fixing the cause clears it on its own; nothing needs resetting.
          **Finding the rest**
          `increase(puppet_db_commands_discarded_total{host="{{ $labels.host }}"}[30m])` is how many were dropped in the last half hour. `max(puppet_db_commands_awaiting_retry{host="{{ $labels.host }}"})` is how many more are queued for retry and at risk of the same fate; it will have been climbing before this fired. Whether discards are still happening: Command Failures on the PuppetDB board. The log lines with the reason, where log shipping is on: Why A Command Failed on the same board.
          **Escalate**
          If the exception in puppetdb.log is not a database or heap fault you can fix, hand Puppet support the log excerpt, the contents of the discard directory and the half-hour window. If it is a database fault, the PE administrator gets the same with the Postgres panel readings.
          **Known noise**
          None known.
        where_panel: pobs-puppetdb/Command Failures
        where: The "Command Failures" panel on the PuppetDB board, which shows whether
          commands are still being discarded and how many are awaiting retry behind
          them.
    - alert: PuppetDBCommandsFatal
      expr: increase(puppet_db_commands_fatal_total[30m]) > 0
      for: 5m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: PuppetDB on {{ $labels.host }} has fatally failed commands
        description: |-
          **What is wrong**
          PuppetDB on `{{ $labels.host }}` rejected commands outright in the last half hour, with no retry. The reports, facts or catalogues they carried were never stored.
          **Risk**
          The nodes that sent them go on reporting success, so every board reads better than the estate is. A submission that is rejected once is rejected the same way every run, so an affected node stays missing from every board until it is fixed.
          **Severity and why**
          Critical, because the data is gone and the affected nodes will keep being rejected on every run until someone looks. It pages, so that the scale can be found; a single node can then wait.
          **When to act**
          Now, to find out whether it is one node or many. One node can then wait for working hours.
          **What to do**
          1. Check: `/var/log/puppetlabs/puppetdb/puppetdb.log` on `{{ $labels.host }}` for the command and the reason. For a fatal rejection the log line is normally enough on its own.
          2. Cause: one node's report or catalogue, typically malformed or oversized, when one certname repeats. Fix it at the node and run `sudo /opt/puppetlabs/bin/puppet agent -t` there to resubmit.
          3. Cause: the storage layer underneath PuppetDB, when many certnames appear. Check `sudo systemctl status pe-postgresql` and read Waiting on Postgres and Connection Saturation on the PuppetDB board.
          The alert clears thirty minutes after the last fatal command. Fixing the cause clears it on its own.
          **Finding the rest**
          `increase(puppet_db_commands_fatal_total{host="{{ $labels.host }}"}[30m])` is how many were rejected in the last half hour. `increase(puppet_db_commands_discarded_total{host="{{ $labels.host }}"}[30m])` above zero at the same time means retried commands are also being dropped, which points at the database. Whether fatal commands are still arriving: Command Failures on the PuppetDB board. The log lines, where log shipping is on: Why A Command Failed on the same board.
          **Escalate**
          If one node's submission is rejected and nothing in its catalogue or facts explains why, hand Puppet support the puppetdb.log line and the certname. If many certnames are rejected and PostgreSQL is healthy, hand Puppet support the log excerpt and the half-hour window; if PostgreSQL is the fault, the PE administrator first.
          **Known noise**
          None known.
        where_panel: pobs-puppetdb/Command Failures
        where: The "Command Failures" panel on the PuppetDB board, which shows whether
          commands are still being rejected.
    - alert: PuppetDBHeapDeadZone
      expr: puppet_db_jvm_heap_bytes{area="init"} > 31 * 1024 * 1024 * 1024 and puppet_db_jvm_heap_bytes{area="init"}
        < 48 * 1024 * 1024 * 1024
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PuppetDB heap on {{ $labels.host }} is in the compressed-oops dead
          zone
        description: |-
          **What is wrong**
          The PuppetDB JVM heap on `{{ $labels.host }}` is set between 31GB and 48GB, and has been for an hour. In that band the JVM holds less usable memory than a 31GB heap would.
          **Risk**
          Nothing is failing. RAM is allocated that PuppetDB cannot use, and `PuppetDBHeapPressure` is closer than the configured number suggests.
          **Severity and why**
          Warning, because it is a configuration that wastes memory and nothing is failing. It waits for a change window and does not page.
          **When to act**
          Next change window. Changing the heap restarts pe-puppetdb, so pick a time when a pause in ingestion is acceptable.
          **What to do**
          1. Check: what the tuner recommends. Where `observability::enable_tune_metrics` is on, What The Tuner Would Change on the TAM Check board shows the recommended value beside the current one; otherwise `puppet infrastructure tune --compare` on the primary prints the same comparison.
          2. Cause: `puppet_enterprise::profile::puppetdb::java_args` set inside the band. Set it to 31GB, or past 48GB only if PuppetDB needs more than that.
          3. Then: run Puppet on `{{ $labels.host }}` in the change window. It restarts pe-puppetdb, ingestion pauses, and the queue drains afterwards.
          The alert clears once the restarted JVM reports a heap outside the band.
          **Finding the rest**
          `puppet_db_jvm_heap_bytes{host="{{ $labels.host }}",area="init"} / 1024 / 1024 / 1024` is the configured heap in GB. `puppet_db_jvm_heap_bytes{host="{{ $labels.host }}",area="used"} / ignoring(area) puppet_db_jvm_heap_bytes{host="{{ $labels.host }}",area="max"}` is how much of it is in use, which says whether dropping to 31GB is safe or the heap needs to go up instead. The current setting and whether the tuner would change it: What The Tuner Would Change on the TAM Check board, and Tuner Verdict By Host on the same board. PE's own health check S0027 watches the same thing, and its entry on this board has PE's steps.
          **Escalate**
          The heap change goes through the PE administrator. If the tuner recommends a heap inside the band, hand Puppet support the tuner output and the heap usage ratio above.
          **Known noise**
          None known. A heap deliberately set in the band is still losing usable memory, so the fix is to change it, and the rule can be knocked out with `'--'` under `observability::alerts::rule_groups` only once that decision is recorded.
        where_panel: pobs-tam-check/What The Tuner Would Change
        where: The "What The Tuner Would Change" table on the TAM Check board, which
          shows the recommended heap beside the configured one.
        thresholds: heap_dead_zone_max_gb, heap_dead_zone_min_gb
    - alert: PuppetDBHeapPressure
      expr: puppet_db_jvm_heap_bytes{area="used"} / ignoring(area) puppet_db_jvm_heap_bytes{area="max"}
        > 0.9
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PuppetDB heap on {{ $labels.host }} is over 0.9 of max
        description: |-
          **What is wrong**
          Used heap on the PuppetDB JVM on `{{ $labels.host }}` has been over 0.9 of max for fifteen minutes.
          **Risk**
          Heap still that high after a collection is the step before an OutOfMemoryError. Command processing slows first, so expect `PuppetDBQueueGrowing` next and stale data on everything that reads PuppetDB after that.
          **Severity and why**
          Warning, because high heap on its own slows PuppetDB without losing anything; it waits for working hours. It becomes urgent when the queue starts growing with it, and `PuppetDBQueueGrowing` carries that.
          **When to act**
          Working hours if the queue is flat. Now if `PuppetDBQueueGrowing` is firing with it.
          **What to do**
          1. Check: the Heap panel on the PuppetDB board. A sawtooth whose floor rises, each collection recovering less than the last, is a leak and a restart is the only short-term relief. A floor that is flat and high is a heap sized too small for the estate. Where The CPU Goes on the same board separates a JVM doing work from one collecting garbage.
          2. Cause: a leak, with the rising floor. `sudo systemctl restart pe-puppetdb` on `{{ $labels.host }}` clears the heap. Queued commands survive the restart.
          3. Cause: a heap sized too small for the estate, with the flat high floor. A restart only buys time. The durable fix is `puppet_enterprise::profile::puppetdb::java_args`, sized from `puppet infrastructure tune --compare` on the primary. Where `observability::enable_tune_metrics` is on, What The Tuner Would Change on the TAM Check board shows the recommended value beside the current one. The resize restarts pe-puppetdb when Puppet applies it, so pick a change window.
          The alert clears as soon as used heap drops below 0.9 of max. A restart clears it at once; a resize clears it after the run that applies it.
          **Finding the rest**
          `puppet_db_jvm_heap_bytes{host="{{ $labels.host }}",area="used"} / ignoring(area) puppet_db_jvm_heap_bytes{host="{{ $labels.host }}",area="max"}` is the ratio now. `puppet_db_jvm_heap_bytes{host="{{ $labels.host }}",area="max"}` is the configured ceiling in bytes, which is the number to compare with the tuner's recommendation. `puppet_db_queue_depth{host="{{ $labels.host }}"}` says whether the pressure has started to show as backlog. The headline ratio: Heap Used on the PuppetDB board. Whether the JVM is spending its time collecting: GC Time Fraction on the same board, which moves before the Heap Used tile does.
          **Escalate**
          If the floor keeps rising after a restart and the heap is already at the tuner's recommendation, hand Puppet support the Heap panel over a few days, the configured `java_args` and the queue depth over the same window. The resize itself goes through the PE administrator.
          **Known noise**
          A heap that sits just over the ratio and is stable, with GC Time Fraction low, is a JVM using the memory it was given. Raise `heap_pressure_ratio` under `observability::alerts::thresholds` if that is how this estate runs.
        where_panel: pobs-puppetdb/Heap
        where: The "Heap" panel on the PuppetDB board, which shows the sawtooth and
          whether its floor is rising.
        thresholds: heap_pressure_ratio
    - alert: PuppetDBPersistenceRegressed
      expr: puppet_db_command_stage_seconds{stage="persistence"} > 0 > 2 * quantile_over_time(0.9,
        puppet_db_command_stage_seconds{stage="persistence"}[7d]) and present_over_time(puppet_db_command_stage_seconds{stage="persistence"}[7d]
        offset 3d)
      for: 30m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PuppetDB on {{ $labels.host }} is taking {{ $value | humanizeDuration
          }} to persist a command, well over its own last week
        description: |-
          **What is wrong**
          The mean time PuppetDB on `{{ $labels.host }}` takes to write a command to PostgreSQL is {{ $value | humanizeDuration }}, more than 2 times the 90th percentile of the last seven days, and has been for thirty minutes.
          **Risk**
          Nothing is lost yet. Commands queue behind the slow writes, and if the rate of arrival stays above the rate of persistence the queue grows, reports and facts arrive late in the console, and the queue depth alert follows.
          **Severity and why**
          Warning, because slow writes on their own lose nothing; it waits for working hours. `PuppetDBQueueGrowing` is the one that escalates if the writes fall behind the arrivals.
          **When to act**
          Working hours, unless the queue depth on the PuppetDB board is already climbing.
          **What to do**
          1. Cause: PostgreSQL is the slow part. `puppet_db_pool_wait_seconds{host="{{ $labels.host }}",pool="write"}` rising with this means PuppetDB is waiting for a connection; `puppet_postgres_lock_waiting_sessions{host="{{ $labels.host }}"}` above zero means writes are blocked behind a lock.
          2. Cause: something changed on the database host, such as a pe_databases maintenance run, a backup, or the data partition filling. `sudo journalctl -u 'pe_databases-*' --since '-1 day'` and `df -h /opt/puppetlabs/server/data/postgresql` on the host show which.
          3. Cause: the host itself is short, when every command type slowed together and PostgreSQL is idle. CPU on `puppet_db_cpu_percent{host="{{ $labels.host }}"}` and memory on the Infrastructure Health board.
          The alert clears once the mean has been back under the threshold for thirty minutes, which it reaches on its own as fresh commands refill the mean.
          **Finding the rest**
          The baseline it was compared with: `quantile_over_time(0.9, puppet_db_command_stage_seconds{host="{{ $labels.host }}",stage="persistence"}[7d])`. The other stages, to confirm it is the write and not parsing or queue wait: `puppet_db_command_stage_seconds{host="{{ $labels.host }}"}`. Which command type is slowest: `puppet_db_command_duration_seconds{host="{{ $labels.host }}"}`.
          **Escalate**
          If PostgreSQL is slow with no lock, no maintenance run and a healthy partition, hand the PE administrator the host, the persistence series against its baseline over the window and the pe_databases journal. If the database host is out of CPU or memory, the platform team gets the Infrastructure Health readings.
          **Known noise**
          A pe_databases maintenance run slows writes for its duration and the mean recovers afterwards. If the estate's normal variance crosses the factor, raise `latency_regression_factor` under `observability::alerts::thresholds`. The rule stays quiet for the first week after install, because it needs seven days of history to compare with.
        where_panel: pobs-puppetdb/Pipeline Stage Times
        where: The "Pipeline Stage Times" panel on the PuppetDB board, which draws
          parse, queue wait and persistence side by side so the slow stage is the
          tall one.
        thresholds: latency_regression_factor
    - alert: PuppetDBPoolStarved
      expr: puppet_db_pool_wait_seconds > 0 > on (host, pool) puppet_db_pool_usage_seconds
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PuppetDB {{ $labels.pool }} pool on {{ $labels.host }} queues requests
          longer than it serves them
        description: |-
          **What is wrong**
          A request to PuppetDB's `{{ $labels.pool }}` pool on `{{ $labels.host }}` waits a mean {{ $value | humanizeDuration }} for a connection, longer than a connection is then held, and has for fifteen minutes. Requests spend most of their time queuing for the pool.
          **Risk**
          Every query and every command write is delayed by the wait. On the write pool that is commands backing up; on the read pool it is slow console pages and slow catalogue compiles, because puppetserver waits on PuppetDB queries during a compile.
          **Severity and why**
          Warning, because requests are delayed and still served. It waits for working hours; `PuppetDBQueueGrowing` is the one that fires if the write pool's delay turns into backlog.
          **When to act**
          Working hours.
          **What to do**
          1. Check: whether the pool is full, with `puppet_db_pool_connections{host="{{ $labels.host }}",pool="{{ $labels.pool }}"}` by state. `active` at `max` means every connection is busy, and `pending` above zero confirms the queue.
          2. Cause: PostgreSQL is slow, so connections are held for long. `puppet_postgres_lock_waiting_sessions{host="{{ $labels.host }}"}` above zero, or `puppet_db_pool_usage_seconds{host="{{ $labels.host }}",pool="{{ $labels.pool }}"}` itself climbing, confirms it. Fix that first; a bigger pool against a slow database just queues inside PostgreSQL instead.
          3. Cause: the pool is simply full while PostgreSQL is fast. Raise the `{{ $labels.pool }}` pool's maximum size on the PuppetDB class in the console, within what PostgreSQL's `max_connections` leaves spare: `puppet_postgres_max_connections{host="{{ $labels.host }}"}` against `puppet_postgres_backends{host="{{ $labels.host }}"}`. The change restarts pe-puppetdb when Puppet applies it, so use a change window.
          The alert clears once the mean wait has been under the mean hold time for fifteen minutes.
          **Finding the rest**
          Wait against hold over time: `puppet_db_pool_wait_seconds{host="{{ $labels.host }}",pool="{{ $labels.pool }}"}` and `puppet_db_pool_usage_seconds{host="{{ $labels.host }}",pool="{{ $labels.pool }}"}`. The pool as a ceiling: `puppet_ceiling_utilisation{ceiling="PuppetDB {{ $labels.pool }} pool",host="{{ $labels.host }}"}`.
          **Escalate**
          If PostgreSQL is holding locks or running slow and the Postgres rules do not say why, hand the PE administrator the host, the pool, the wait and hold series over the window and the lock waiting count. The pool size change goes through the PE administrator.
          **Known noise**
          A burst of commands after a pe-puppetdb restart queues briefly for the pool; the fifteen-minute hold absorbs it. There is no threshold to tune, because the rule compares wait with hold on the same pool.
        where_panel: pobs-puppetdb/Pool Wait
        where: The "Pool Wait" panel on the PuppetDB board, which draws the wait per
          pool so a queue forming shows as a rising line.
    - alert: PuppetDBQueueGrowing
      expr: puppet_db_queue_depth > 10 and delta(puppet_db_queue_depth[15m]) > 0
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PuppetDB command queue on {{ $labels.host }} is growing
        description: |-
          **What is wrong**
          The PuppetDB command queue on `{{ $labels.host }}` is past 10 and has kept growing for fifteen minutes. Reports, facts and catalogues are arriving faster than PuppetDB stores them.
          **Risk**
          Every board that reads PuppetDB falls behind the estate by the queue's age. A queue that keeps growing ends in commands retried and then discarded (`PuppetDBCommandsDiscarded`), which is lost data.
          **Severity and why**
          Warning, because a growing queue is still a queue and nothing has been lost; the data is late, not gone. It waits for the hour; `PuppetDBCommandsDiscarded` is the critical page if it ends in discards.
          **When to act**
          Within the hour. A burst after a code deploy or a mass run that drains on its own needs nothing, so check the trend before touching anything.
          **What to do**
          1. Cause: PostgreSQL is slow and PuppetDB is waiting on it. On the PuppetDB board read Waiting on Postgres. Above zero, read Dead Tuple Ratio and Connection Saturation on the same board, check `sudo systemctl status pe-postgresql`, and follow `PostgresDeadTuplesAccumulating` or `PostgresConnectionsNearLimit` if either is firing.
          2. Cause: the PuppetDB JVM is the bottleneck, with Waiting on Postgres at zero. Read Heap Used and GC Time Fraction and follow `PuppetDBHeapPressure` if heap is near max. `sudo systemctl restart pe-puppetdb` on `{{ $labels.host }}` buys time; queued commands survive it because the queue is kept on disk under `/opt/puppetlabs/server/data/puppetdb/stockpile`.
          3. Check: on `{{ $labels.host }}`, `curl -s http://localhost:8080/status/v1/services/puppetdb-status | jq .status.queue_depth` gives the current depth, and `sudo grep -E 'WARN|ERROR' /var/log/puppetlabs/puppetdb/puppetdb.log | tail -50` shows which commands are retrying and why.
          The alert clears as soon as the queue stops growing, which can be while it is still deep. It is fixed when Commands In and Out shows Processed level with Seen and the curl above returns 0.
          **Finding the rest**
          `puppet_db_queue_depth{host="{{ $labels.host }}"}` is the depth now. `max(puppet_db_commands_awaiting_retry{host="{{ $labels.host }}"})` above zero means commands are already failing and being retried, which is the step before discards. `rate(puppet_db_commands_seen_total{host="{{ $labels.host }}"}[15m]) - rate(puppet_db_commands_processed_total{host="{{ $labels.host }}"}[15m])` is how fast the backlog is growing per second; negative means it is draining. The current depth and its direction: Queue Depth and Queue Trend on the PuppetDB board. The depth over time: Queue Depth Over Time.
          **Escalate**
          If Waiting on Postgres is above zero and the Postgres rules do not explain it, hand the PE administrator the host, the queue depth over the window and the puppetdb.log WARN and ERROR lines. If a restart does not drain the queue and the log shows the same commands retrying, hand Puppet support the log excerpt and the queue depth history.
          **Known noise**
          A code deploy or a mass agent run pushes the queue past the depth and it drains within the hour; the growth condition and the fifteen-minute hold are there for that. If the estate's normal bursts are deeper, raise `puppetdb_queue_depth` under `observability::alerts::thresholds`.
        where_panel: pobs-puppetdb/Queue Depth Over Time
        where: The "Queue Depth Over Time" panel on the PuppetDB board, which shows
          whether the queue is a burst draining or a backlog that keeps climbing.
        thresholds: puppetdb_queue_depth
    - alert: PuppetDBReplicaSyncFailing
      expr: increase(puppet_db_ha_sync_failures_total[1h]) > 0
      for: 1m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PuppetDB on {{ $labels.host }} has failed a replica sync in the last
          hour
        description: |-
          **What is wrong**
          PuppetDB on `{{ $labels.host }}` has had {{ $value | humanize }} replica sync attempts fail in the last hour.
          **Risk**
          The replica is falling behind the primary by the length of each failed cycle. If it keeps failing the sync age passes its threshold and a failover would lose the reports and facts that did not cross.
          **Severity and why**
          Warning, because a failed attempt is retried on the next cycle and the primary is unaffected. It waits for working hours; `PuppetDBReplicaSyncStale` carries the escalation if the replica stays behind.
          **When to act**
          Working hours. Sooner if the replica sync age is already climbing on the PuppetDB board.
          **What to do**
          1. Check: the error on the primary, with `sudo grep -iE 'sync' /var/log/puppetlabs/puppetdb/puppetdb.log | grep -iE 'error|fail|exception' | tail -30`.
          2. Cause: the replica or the network, when the error is a connection refused or a certificate error. Check the replica is up and reachable from the primary on 8081, and that PE's own replica health is clean: `sudo puppet infrastructure status` on the primary.
          3. Cause: the replica too slow for one entity, when the error is a timeout on that entity. `puppet_db_ha_sync_duration_seconds{host="{{ $labels.host }}"}` per entity names it.
          The alert clears once an hour passes with no new failure. A sync that then succeeds clears `PuppetDBReplicaSyncStale` separately.
          **Finding the rest**
          Whether the replica is also behind: `puppet_db_ha_last_sync_age_seconds{host="{{ $labels.host }}"}`, in seconds. Which entity is slow: `puppet_db_ha_sync_duration_seconds{host="{{ $labels.host }}"}` per entity. Failure count over the day: `increase(puppet_db_ha_sync_failures_total{host="{{ $labels.host }}"}[24h])`.
          **Escalate**
          If every attempt fails, hand Puppet support the log excerpt from step 1 and the output of `sudo puppet infrastructure status`. A replica unreachable on 8081 from the primary goes to the network or platform team with the time it stopped.
          **Known noise**
          A single failed attempt during a replica restart or a Puppet run on it fires this for the hour and clears on its own. A one-hour silence on `host` in Alertmanager covers a planned replica restart. There is no threshold to tune; the rule is any failure in the hour.
        where_panel: pobs-puppetdb/Replica Sync
        where: The "Replica Sync" panel on the PuppetDB board, which draws sync failures
          beside the duration per entity.
    - alert: PuppetDBReplicaSyncStale
      expr: puppet_db_ha_last_sync_age_seconds > 900 and on(alias) (count by (alias)
        (puppet_infra_pe_role{role="puppet/server"}) > 1)
      for: 10m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: PuppetDB replica sync on {{ $labels.host }} is stale
        description: |-
          **What is wrong**
          The last successful HA sync on the PuppetDB replica `{{ $labels.host }}` was {{ $value | humanizeDuration }} ago, past 900 seconds for ten minutes. The normal cadence is about two minutes.
          **Risk**
          Nothing is lost while the primary is up. Promoting this replica now would promote that much missing report and catalogue history, and the promotion does not put it back.
          **Severity and why**
          Warning, because the primary is up and nothing is lost until someone fails over. It waits for working hours; the one thing it rules out is a failover before it clears.
          **When to act**
          Working hours. Do not fail over to this replica until it clears.
          **What to do**
          1. Check: `/var/log/puppetlabs/puppetdb/puppetdb.log` on `{{ $labels.host }}` for the sync error.
          2. Cause: the replica is falling behind, usually load or the link, when the Replica Sync panel on the PuppetDB board shows sync duration climbing while failures stay flat. The duration per entity names the slow one.
          3. Cause: the replica cannot complete a sync at all, when failures are above zero. The log line from step 1 says why; `PuppetDBReplicaSyncFailing` is firing too.
          4. Check: `systemctl status pe-puppetdb` on both the replica and the primary, and that the replica can still reach the primary's PuppetDB port over TLS.
          The alert clears on the first scrape after a sync succeeds. A restart on its own does not clear it; a sync has to complete.
          **Finding the rest**
          `puppet_db_ha_last_sync_age_seconds{host="{{ $labels.host }}"}` is the age in seconds now. `rate(puppet_db_ha_sync_failures_total{host="{{ $labels.host }}"}[15m])` above zero means syncs are being attempted and failing; zero with the age still climbing means they are not completing or not being attempted. `puppet_db_ha_sync_duration_seconds{host="{{ $labels.host }}"}` per entity shows which entity is the slow one. The headline age: Replica Sync Age on the PuppetDB board.
          **Escalate**
          If syncs are attempted and fail with an error the replica's log does not explain, hand Puppet support the puppetdb.log excerpt from both hosts, the sync age over the window and `sudo puppet infrastructure status` from the primary. A network fault between the two hosts goes to the network or platform team with the port and the time it stopped.
          **Known noise**
          After `puppet infrastructure promote replica` the promoted primary keeps the last sync timestamp from its replica days; the rule is gated on a replica existing, so a lone primary waiting for a new replica does not fire. The age threshold is `replica_sync_stale_seconds` under `observability::alerts::thresholds`.
        where_panel: pobs-puppetdb/Replica Sync
        where: The "Replica Sync" panel on the PuppetDB board, which shows sync duration
          per entity with sync failures beside it.
        thresholds: replica_sync_stale_seconds
  - name: pobs-puppetserver
    rules:
    - alert: PuppetserverCompileOverCapacity
      expr: puppet_ceiling_utilisation{ceiling="Compile throughput"} > 1
      for: 30m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: Agents on {{ $labels.host }} ask for more catalogues than its compilers
          can produce
        description: |-
          **What is wrong**
          The fleet reporting to `{{ $labels.host }}` has, for thirty minutes, requested catalogues at {{ $value | humanize }} times the rate its JRuby interpreters can compile them at the current mean compile time.
          **Risk**
          Agents queue for an interpreter and then time out, so runs are missed and changes do not land. As the queue grows the compilers fall further behind and do not catch up on their own.
          **Severity and why**
          Critical, and it pages. Over 1 means the fleet asks for more catalogues a second than the compilers can produce, at any estate size, and the next thing that happens is agents missing runs; a compile time that has merely grown against its own past is the warning `PuppetserverCompileRegressed`.
          **When to act**
          Now. Every run interval this stays over 1 is a share of the fleet that did not run.
          **What to do**
          1. Check: whether compile time or demand moved. Mean compile time per server: `puppet_server_http_request_duration_seconds{route="puppet-v3-catalog-/*/"}`. Catalogues a second the fleet asks for: `sum(1 / (puppet_agent_runinterval_seconds > 0))`. Interpreters per server: `puppet_server_jruby_pool_size`. Whichever of the first two changed recently is the cause.
          2. Cause: compile time rose. The Puppetserver board's compile time breakdown says which phase, and a slow PuppetDB query or a function in the catalogue is the usual cause. Fix that before adding capacity.
          3. Cause: demand rose. Either the fleet grew or a run interval was shortened; `bottomk(20, puppet_agent_runinterval_seconds)` names the nodes running most often. Lengthen `runinterval` for the nodes that do not need it, or add JRubies or a compiler.
          4. Whatever the cause: the alert clears once demand over capacity has been under 1 for the dwell, which a fix to compile time reaches on its own within an hour as the mean refreshes.
          **Finding the rest**
          The ratio over time: `puppet_ceiling_utilisation{ceiling="Compile throughput",host="{{ $labels.host }}"}`. Whether agents are already being refused: `increase(puppet_server_jruby_queue_limit_hits_total[15m])` per host; above zero means runs have already been lost. Which nodes run most often: `bottomk(20, puppet_agent_runinterval_seconds)`.
          **Escalate**
          If compile time is flat and the fleet needs the capacity, hand it to the PE administrator with the ratio graph, the fleet demand figure and the per-server pool sizes; a compiler is their decision. If the slow phase is Puppet code, hand the profiler panel to the team that owns it.
          **Known noise**
          A compiler that has just restarted drops out of the mean until it compiles again, which overstates the ratio for the minutes until the next agent reaches it; the thirty-minute dwell is there to absorb that, so a firing that follows a restart and clears on its own needs no action.
        where_panel: pobs-capacity/Every Ceiling, Ranked
        where: The "Every Ceiling, Ranked" table on the Capacity board, where the
          Compile throughput row is this ratio beside every other ceiling on the estate.
    - alert: PuppetserverCompileRegressed
      expr: puppet_catalogue_compile_seconds > 2 * quantile_over_time(0.9, puppet_catalogue_compile_seconds[7d])
        and present_over_time(puppet_catalogue_compile_seconds[7d] offset 3d)
      for: 30m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Catalogue compile time on {{ $labels.alias }} is {{ $value | humanizeDuration
          }}, well over its own last week
        description: |-
          **What is wrong**
          The mean catalogue compile time on `{{ $labels.alias }}` over the last hour is {{ $value | humanizeDuration }}, more than 2 times the 90th percentile of the last seven days, and has been for thirty minutes.
          **Risk**
          Nothing is failing yet. Each catalogue holds a JRuby interpreter for longer, so fewer agents are served per minute, and if it keeps rising the compilers fall behind the fleet and runs are missed.
          **Severity and why**
          Warning, so it waits for working hours. Agents are still being served; demand passing what the compilers can produce is the critical `PuppetserverCompileOverCapacity`.
          **When to act**
          Working hours, unless a change to Puppet code or PuppetDB went out today, in which case look now while the change is fresh.
          **What to do**
          1. Check: which phase grew. The Puppetserver board's compile time breakdown splits the compile into phases. A function or a PuppetDB query at the top is a code or query problem; a catalogue phase that grew everywhere is the server itself.
          2. Cause: a code deployment. The Code Releases board lists what went out and when; a release that lines up with the rise is the cause, and the slowest functions and resources panels on the Puppetserver board name the code to fix or roll back.
          3. Cause: PuppetDB got slow. `PuppetserverPuppetDBRegressed` firing beside this, or query time up on the PuppetDB board, puts the cause there; its runbook has the steps.
          4. Check: whether one compiler or all of them moved. Per-server means: `puppet_server_http_request_duration_seconds{route="puppet-v3-catalog-/*/"}`. One server slow with the rest flat is that host, so check its heap and GC time.
          5. Whatever the cause: the alert clears once the hour's mean drops back under the threshold, which happens on its own within an hour of the cause being fixed.
          **Finding the rest**
          The baseline the alert compared against: `quantile_over_time(0.9, puppet_catalogue_compile_seconds{alias="{{ $labels.alias }}"}[7d])`. Compile time over the week: `puppet_catalogue_compile_seconds{alias="{{ $labels.alias }}"}`; the point it stepped up is the time to match against deploys. Catalogues served per server over the same hour, to confirm the mean rests on real work: `increase(puppet_server_http_requests_total{route="puppet-v3-catalog-/*/"}[1h])`.
          **Escalate**
          If the slow code belongs to another team, hand them the release and the slowest functions and resources. If the phase that grew is the server itself on every compiler, hand it to the PE administrator with the week's compile time graph and the per-server means.
          **Known noise**
          A fresh install has no baseline and stays quiet by design. A planned change that makes catalogues legitimately dearer, such as a large module added to every node, fires this for a week until the baseline catches up; silence the `alias` in Alertmanager for that week.
        where_panel: pobs-puppetserver/Where Compile Time Actually Goes
        where: The "Where Compile Time Actually Goes" panel on the Puppetserver board,
          which breaks the compile into phases so the one that grew is visible.
        thresholds: compile_time_regression_factor
    - alert: PuppetserverHeapDeadZone
      expr: puppet_server_jvm_heap_bytes{area="init"} > 31 * 1024 * 1024 * 1024 and
        puppet_server_jvm_heap_bytes{area="init"} < 48 * 1024 * 1024 * 1024
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Puppetserver heap on {{ $labels.host }} is in the compressed-oops
          dead zone
        description: |-
          **What is wrong**
          The puppetserver JVM heap on `{{ $labels.host }}` has been configured between 31GB and 48GB for an hour.
          **Risk**
          Nothing is failing. In that band the JVM has switched compressed object pointers off, so each reference costs eight bytes instead of four and the heap holds less usable memory than a 31GB one would. Memory is being paid for that the service cannot use.
          **Severity and why**
          Warning, so it waits for working hours. This is configuration posture that holds until the heap is resized; nothing about it fails on its own.
          **When to act**
          Next maintenance window. Changing the heap restarts puppetserver and drops the compiles in flight.
          **What to do**
          1. Check: what PE would size it at on this hardware. The TAM Check board's tuner comparison lists it where `observability::enable_tune_metrics` is on; otherwise `puppet infrastructure tune --compare` on the primary prints the same comparison.
          2. Check: how much of the heap is in use. `puppet_server_jvm_heap_bytes{area="used",host="{{ $labels.host }}"}` well under 31GB means bringing it down costs nothing; used near the configured size means the host needs a heap above 48GB or fewer interpreters.
          3. Cause: the heap was set in the band. Set `Xmx` and `Xms` in the `java_args` hash on `puppet_enterprise::master::puppetserver` to 31GB, or above 48GB only where the host has the memory and the compiles need it. Run Puppet on the host in the window; the restart is what applies it.
          4. Whatever the cause: the alert clears once the service restarts with the new size and `puppet_server_jvm_heap_bytes{area="init"}` reads outside the band.
          **Finding the rest**
          The configured size: `puppet_server_jvm_heap_bytes{area="init",host="{{ $labels.host }}"}`; PE sets Xms equal to Xmx, so init is the configured heap. How much of it is in use: `puppet_server_jvm_heap_bytes{area="used",host="{{ $labels.host }}"}`. GC time: `rate(puppet_server_jvm_gc_time_seconds_total{host="{{ $labels.host }}"}[5m])`. PE's own health check S0026 watches the same thing, and its entry on this board has PE's steps.
          **Escalate**
          If the heap size is owned by another team's hiera or the change window needs approval, hand it to the PE administrator with the tuner comparison and the used-against-init graph.
          **Known noise**
          None known.
        where_panel: pobs-puppetserver/Heap
        where: The "Heap" panel on the Puppetserver board, which draws used heap against
          max for this host.
        thresholds: heap_dead_zone_max_gb, heap_dead_zone_min_gb
    - alert: PuppetserverHeapPressure
      expr: puppet_server_jvm_heap_bytes{area="used"} / ignoring(area) puppet_server_jvm_heap_bytes{area="max"}
        > 0.9
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Puppetserver heap on {{ $labels.host }} is over 0.9 of max
        description: |-
          **What is wrong**
          Used JVM heap on `{{ $labels.host }}` has been over 0.9 of max for fifteen minutes. GC is not reclaiming it.
          **Risk**
          This JVM is heading for an OutOfMemoryError. When it goes, every agent compiling on this host fails its run until the service comes back.
          **Severity and why**
          Warning, so it waits for working hours by default. The service is still serving and a restart recovers it; it does not page because the metric cannot tell a heap that sits high and stable from one about to go, which is why the GC time fraction decides the urgency below.
          **When to act**
          Now if the GC time fraction is also climbing, because the OOM is close. Otherwise before the next business day.
          **What to do**
          1. Check: whether it has already happened once. `journalctl -u pe-puppetserver` and `/var/log/puppetlabs/puppetserver/puppetserver.log` on the host carry the OutOfMemoryError. One already in the log means the service has been restarting itself and the fix below is urgent.
          2. Then: `sudo systemctl restart pe-puppetserver` on the host buys time. The compiles in flight fail and those agents retry at their next run. A heap that refills to the same level straight after the restart is a leak, and resizing will not fix it.
          3. Cause: a heap too small for the pool. The TAM Check board's tuner comparison lists what PE would set `Xmx` to on this hardware where `observability::enable_tune_metrics` is on; otherwise `puppet infrastructure tune --compare` on the primary prints the same. `Xmx` is set in the `java_args` hash on `puppet_enterprise::master::puppetserver`. Applying it restarts the service, so it is a maintenance-window change.
          4. Cause: a pool too wide for the heap. `puppet_server_jruby_pool_size{host="{{ $labels.host }}"}` above 12 means shrinking the pool is the cheaper fix, and `PuppetserverJRubyPoolOversized` has the steps.
          5. Whatever the cause: the alert clears when used heap has been under 0.9 of max for fifteen minutes. A restart clears it until the heap fills again; a resize clears it for good.
          **Finding the rest**
          Used against max: `puppet_server_jvm_heap_bytes{area="used",host="{{ $labels.host }}"}` and `puppet_server_jvm_heap_bytes{area="max",host="{{ $labels.host }}"}`; the shape to look for is each collection recovering less than the last. GC time: `rate(puppet_server_jvm_gc_time_seconds_total{host="{{ $labels.host }}"}[5m])`; climbing against flat compile throughput is memory pressure. Pool size competing for the heap: `puppet_server_jruby_pool_size{host="{{ $labels.host }}"}`. Compile throughput: `rate(puppet_server_jruby_borrows_total{host="{{ $labels.host }}"}[5m])`.
          **Escalate**
          If the heap refills to the same level after a restart with the pool and `Xmx` already at the tuner's numbers, hand it to the PE administrator as a suspected leak, with the time window, the used-against-max graph and the OutOfMemoryError lines from the log. They take it to Puppet support with the same material.
          **Known noise**
          A JVM that runs just under its ceiling between collections and recovers at each one fires this when the ratio is set tight; if the GC time fraction is flat and the heap always recovers, raise `heap_pressure_ratio` under `observability::alerts::thresholds`.
        where_panel: pobs-puppetserver/Heap
        where: The "Heap" panel on the Puppetserver board, which draws used heap against
          max for this host.
        thresholds: heap_pressure_ratio, jruby_pool_max
    - alert: PuppetserverJRubyBorrowTimeouts
      expr: increase(puppet_server_jruby_borrow_timeouts_total[15m]) > 0
      for: 1m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Agents on {{ $labels.host }} gave up waiting for a JRuby
        description: |-
          **What is wrong**
          In the last fifteen minutes {{ $value | humanize }} agent requests on `{{ $labels.host }}` timed out waiting for a JRuby interpreter. The queue had room; the wait outlasted the agent.
          **Risk**
          Each timeout is a Puppet run that did not happen, and the node stays on its last catalogue until its next run gets through. If this keeps up the queue fills and the host starts refusing agents outright.
          **Severity and why**
          Warning, so it waits for working hours by default. Runs are being lost, but one at a time and before the queue fills; the queue filling and refusing agents is the critical `PuppetserverJRubyQueueLimit`.
          **When to act**
          Working hours if it is a handful, now if it is still counting up.
          **What to do**
          1. Check: the pool on the host: `curl -s --cacert /etc/puppetlabs/puppet/ssl/certs/ca.pem "https://{{ $labels.host }}:8140/status/v1/services/jruby-metrics?level=debug" | jq '.status.experimental.metrics | {free: ."num-free-jrubies", size: ."num-jrubies", borrowed: ."borrowed-instances"}'`. `borrowed` says what each interpreter is serving and for how long.
          2. Cause: a slow compile or a slow PuppetDB. Interpreters held for minutes in `borrowed`. The Puppetserver board's compile time breakdown says which phase. Fix that before adding capacity.
          3. Cause: a pool too small for the arrival rate. Interpreters turning over quickly with `puppet_server_jruby_requested_avg` above `puppet_server_jruby_pool_size`. Add JRubies if the host has the memory, or a compiler; past 12 interpreters raises `PuppetserverJRubyPoolOversized`.
          4. Whatever the cause: the alert clears once fifteen minutes pass with no new timeouts.
          **Finding the rest**
          How many timed out and when: `increase(puppet_server_jruby_borrow_timeouts_total{host="{{ $labels.host }}"}[1h])`. Mean wait for an interpreter: `puppet_server_jruby_wait_seconds{host="{{ $labels.host }}"}`. Whether the queue has filled since: `increase(puppet_server_jruby_queue_limit_hits_total{host="{{ $labels.host }}"}[1h])`; above zero means agents are now being refused as well.
          **Escalate**
          If the count keeps rising with the pool at 12 and no compiler to add, hand it to the PE administrator with the hour's timeout count, the wait graph and the `jruby-metrics` output.
          **Known noise**
          A single timeout in a quarter hour on a busy estate fires this; if an estate accepts the odd one, silence the `host` in Alertmanager for the burst, since the rule has no threshold to raise.
        where_panel: pobs-puppetserver/Agents Refused
        where: The "Agents Refused" panel on the Puppetserver board, which draws borrow
          timeouts beside queue-limit refusals so the two are read together.
        thresholds: jruby_pool_max
    - alert: PuppetserverJRubyBurstExhaustion
      expr: "(sum_over_time((puppet_server_jruby_free == bool 0)[1h:1m]) >= 2) and
        (max_over_time(puppet_server_jruby_wait_seconds[1h]) > 5)"
      for: 10m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Puppetserver on {{ $labels.host }} is running out of JRubies repeatedly
          without staying out
        description: |-
          **What is wrong**
          The JRuby pool on `{{ $labels.host }}` reached zero free interpreters in at least 2 separate minutes of the last hour, and the worst wait for one in that hour was over 5 seconds. The pool is emptying repeatedly without staying empty long enough to fire `PuppetserverJRubyExhausted`.
          **Risk**
          Agents are queueing and getting a compiler, so no run has failed or been refused. The pool is at its limit under bursts, and a modest rise in demand turns this into `PuppetserverJRubyExhausted` and then refusals.
          **Severity and why**
          Warning, so it waits for working hours. Every agent is still being served; the pool staying empty for five minutes is the critical alert this one precedes.
          **When to act**
          Working hours.
          **What to do**
          1. Check: whether the fleet has grown. `puppet_node_count{environment="all"}` over the last month. Growth that matches the saturation is capacity. A flat fleet with a pool now saturating is compiles that got slower, or interpreters being held.
          2. Cause: capacity. Add a compiler. Raising `max-active-instances` costs heap for each interpreter and past 12 raises `PuppetserverJRubyPoolOversized`.
          3. Cause: compiles got slower. `puppet_server_jruby_borrow_seconds{host="{{ $labels.host }}"}` rising over the same period confirms it. The Puppetserver board's compile time breakdown says what the time is spent on, and its slowest functions and slowest resources panels name the code to make cheaper.
          4. Inferred cause: agents scheduled together. `puppet_server_jruby_free{host="{{ $labels.host }}"} == 0` at the same minutes each interval is a burst of agents arriving at once. Spreading their run times, or a splay, smooths it without adding capacity.
          5. Whatever the cause: the alert clears once an hour has passed with fewer than 2 minutes at zero, or with no wait over 5 seconds.
          **Finding the rest**
          When in the hour the pool emptied: `puppet_server_jruby_free{host="{{ $labels.host }}"} == 0`; a regular pattern is agents scheduled together. Demand against the pool: `puppet_server_jruby_requested_avg{host="{{ $labels.host }}"}` against `puppet_server_jruby_pool_size{host="{{ $labels.host }}"}`. Whether hold time grew: `puppet_server_jruby_borrow_seconds{host="{{ $labels.host }}"}` over the same period; rising means each compile is more expensive. Whether anyone has been refused: `increase(puppet_server_jruby_queue_limit_hits_total{host="{{ $labels.host }}"}[1h])`; above zero means it has already gone past a warning.
          **Escalate**
          If the code the profiler names is not yours, hand the slowest functions and resources to the team that owns it. If the pool is at 12 already and the host cannot take another compiler, hand it to the PE administrator with the hour's free and wait graphs.
          **Known noise**
          Brief saturation is routine on a busy estate; this rule needs both halves to fire. If an estate accepts a given level of bursting, raise `jruby_saturation_minutes` or `jruby_saturation_wait_seconds` under `observability::alerts::thresholds`.
        where_panel: pobs-puppetserver/Free and Requested JRubies
        where: The "Free and Requested JRubies" panel on the Puppetserver board, which
          shows the free count touching zero in bursts while requested demand rises
          above it.
        thresholds: jruby_pool_max, jruby_saturation_minutes, jruby_saturation_wait_seconds
    - alert: PuppetserverJRubyExhausted
      expr: puppet_server_jruby_free == 0
      for: 5m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: Puppetserver on {{ $labels.host }} has no free JRuby instances
        description: |-
          **What is wrong**
          Puppetserver on `{{ $labels.host }}` has had no free JRuby interpreters for five minutes. Every agent compiling there is queueing for one.
          **Risk**
          Agents behind this host cannot get a catalogue or submit a report while this lasts. Runs that wait past the agent timeout do not happen, and if the queue fills agents start being refused with 503s. Node silence and run-failure alerts for nodes served by this host are this fault, so start here.
          **Severity and why**
          Critical, and it pages. Five minutes at zero free means runs are already being lost; the slower forms of the same shortage, a wait above threshold or an average below one, are the warnings beside it.
          **When to act**
          Now.
          **What to do**
          1. Check: the pool on the host, or from anywhere that reaches its port 8140: `curl -s --cacert /etc/puppetlabs/puppet/ssl/certs/ca.pem "https://{{ $labels.host }}:8140/status/v1/services/jruby-metrics?level=debug" | jq '.status.experimental.metrics | {free: ."num-free-jrubies", size: ."num-jrubies", borrowed: ."borrowed-instances"}'`. `borrowed` lists what each interpreter is serving and how long it has held it; healthy entries turn over in seconds, entries held for minutes are stuck.
          2. Cause: a pool too small for the arrival rate. Requested sitting above the pool size on the Puppetserver board, or `puppet_server_jruby_requested_avg` above `puppet_server_jruby_pool_size`, is demand outgrowing the pool. Add a compiler. Widening the pool past 12 raises `PuppetserverJRubyPoolOversized` instead of fixing it.
          3. Cause: interpreters being held. Requested no higher than usual with free pinned at zero is a few compiles holding interpreters for minutes. `borrowed` from step 1 says by what, and the Puppetserver board's compile time breakdown says what the compile time is spent on, such as a slow PuppetDB query. Fix the slow call or code; adding capacity to a held pool only delays the next exhaustion.
          4. Last: `sudo systemctl restart pe-puppetserver` on the host clears a stuck pool. Every compile in flight fails and those agents retry at their next run. Try it once; if the pool empties again straight away it is capacity, go back to step 2.
          5. Whatever the cause: the alert clears at the next evaluation after `puppet_server_jruby_free` leaves zero. A restart clears it at once; a capacity or code fix clears it as demand drops.
          **Finding the rest**
          How long it has been at zero: `puppet_server_jruby_free{host="{{ $labels.host }}"}` over the last few hours. Demand against the pool: `puppet_server_jruby_requested_avg{host="{{ $labels.host }}"}` against `puppet_server_jruby_pool_size{host="{{ $labels.host }}"}`; requested above size means more agents than interpreters. Whether agents are already being refused: `increase(puppet_server_jruby_queue_limit_hits_total{host="{{ $labels.host }}"}[15m])`; above zero means runs have been lost. The server's own log: `sudo grep -iE 'jruby|borrow|OutOfMemory' /var/log/puppetlabs/puppetserver/puppetserver.log | tail -50` on the host. PE's own health check S0019 watches the same thing, and its entry on this board has PE's steps.
          **Escalate**
          If a restart does not free the pool, or the pool is the right size and compiles are still held with nothing in the profiler to explain it, hand it to the PE administrator with the time the pool emptied, the `jruby-metrics` output from step 1 and the grep from the server log. They take it to Puppet support with S0019 and what has been tried.
          **Known noise**
          None known. A pool that touches zero for under five minutes is the burst alert's territory and does not fire this one.
        where_panel: pobs-puppetserver/Free and Requested JRubies
        where: The "Free and Requested JRubies" panel on the Puppetserver board, which
          shows how far requested demand sits above the free count on this host.
        thresholds: jruby_pool_max
    - alert: PuppetserverJRubyFreeAvgLow
      expr: puppet_server_jruby_free_avg < 0.9
      for: 10m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Puppetserver on {{ $labels.host }} averages less than one free JRuby
        description: |-
          **What is wrong**
          Free JRuby interpreters on `{{ $labels.host }}` have averaged below 0.9 for ten minutes. Most of the time every interpreter is busy and agents queue for one.
          **Risk**
          Nothing is failing yet. Demand has outgrown the pool, and left alone it arrives as refused agents and runs that do not happen.
          **Severity and why**
          Warning, so it waits for working hours. This is the chronic form of the shortage; the pool pinned at zero for five minutes is the critical `PuppetserverJRubyExhausted`.
          **When to act**
          Working hours.
          **What to do**
          1. Check: how far demand sits above the pool and whether the fleet has grown. `puppet_node_count{environment="all"}` over the last month against `puppet_server_jruby_free{host="{{ $labels.host }}"}` over the same period. A fleet that grew as free fell is capacity; a flat fleet is compiles that got dearer.
          2. Cause: capacity. Add a compiler. Raising `max-active-instances` costs heap per interpreter, and past 12 raises `PuppetserverJRubyPoolOversized`.
          3. Cause: expensive catalogues. `puppet_server_jruby_borrow_seconds{host="{{ $labels.host }}"}` rising confirms it. The Puppetserver board's compile time breakdown says what the compile time is spent on, and its slowest functions and slowest resources panels name the code to make cheaper.
          4. Whatever the cause: the alert clears once the average free count is back at or above 0.9, which a capacity or code change does on its own.
          **Finding the rest**
          Demand against the pool: `puppet_server_jruby_requested_avg{host="{{ $labels.host }}"}` against `puppet_server_jruby_pool_size{host="{{ $labels.host }}"}`. How long requests are waiting: `puppet_server_jruby_wait_seconds{host="{{ $labels.host }}"}`. Whether the pool is already emptying: `sum_over_time((puppet_server_jruby_free{host="{{ $labels.host }}"} == bool 0)[1h:1m])` is minutes at zero in the last hour. Whether anyone has been refused: `increase(puppet_server_jruby_queue_limit_hits_total{host="{{ $labels.host }}"}[1h])`; above zero means it has gone past a warning.
          **Escalate**
          If the code the profiler names belongs to another team, hand them the slowest functions and resources. If the pool is at 12 and the estate cannot add a compiler, hand it to the PE administrator with the demand and free graphs over the last month.
          **Known noise**
          A small pool sized exactly to its load runs under one free by design; if that is accepted, lower `jruby_free_avg_min` under `observability::alerts::thresholds`.
        where_panel: pobs-puppetserver/Free and Requested JRubies
        where: The "Free and Requested JRubies" panel on the Puppetserver board, which
          shows the free count sitting under one while requested demand runs above
          it.
        thresholds: jruby_free_avg_min, jruby_pool_max
    - alert: PuppetserverJRubyPoolOversized
      expr: puppet_server_jruby_pool_size > 12
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Puppetserver on {{ $labels.host }} has more than 12 JRubies configured
        description: |-
          **What is wrong**
          The live JRuby pool on `{{ $labels.host }}` has been wider than 12 interpreters for an hour.
          **Risk**
          Nothing is failing. Each interpreter holds its own heap and adds GC time, and past 12 more interpreters stop adding throughput. A pool this wide on a heap that was not grown to match is how heap pressure on this host starts.
          **Severity and why**
          Warning, so it waits for working hours. This is configuration posture, not a live fault, and it holds until the pool is resized; the heap filling as a result is `PuppetserverHeapPressure`.
          **When to act**
          Next maintenance window. Resizing the pool restarts puppetserver and drops the compiles in flight.
          **What to do**
          1. Check: what PE would size the pool at on this hardware. The TAM Check board's tuner comparison lists it where `observability::enable_tune_metrics` is on; otherwise `puppet infrastructure tune --compare` on the primary prints the same comparison.
          2. Check: whether the heap is already paying for it. Read used heap against max and the GC time fraction on the Puppetserver board for this host before changing anything. GC time rising with the heap near max means the extra interpreters are already costing compiles.
          3. Cause: the pool was widened by hand. Bring `jruby-puppet.max-active-instances` in `/etc/puppetlabs/puppetserver/conf.d/pe-puppet-server.conf` down to 12 or below. It is normally written by `puppet_enterprise::master::puppetserver`, so change it there and run Puppet on the host. This restarts puppetserver, so do it in the window.
          4. Cause: the pool was widened for demand. `puppet_server_jruby_requested_avg` close to the pool size means the extra interpreters are in use. Add a compiler instead of shrinking the pool on its own, or the shortage moves to `PuppetserverJRubyFreeAvgLow`.
          5. Whatever the cause: the alert clears once `puppet_server_jruby_pool_size` reads 12 or below after the restart.
          **Finding the rest**
          The live pool size: `puppet_server_jruby_pool_size{host="{{ $labels.host }}"}`. How much of it is used: `puppet_server_jruby_requested_avg{host="{{ $labels.host }}"}`; demand well under 12 means the extra interpreters are idle and shrinking costs nothing. Heap against max: `puppet_server_jvm_heap_bytes{area="used",host="{{ $labels.host }}"}` against `puppet_server_jvm_heap_bytes{area="max",host="{{ $labels.host }}"}`. GC time: `rate(puppet_server_jvm_gc_time_seconds_total{host="{{ $labels.host }}"}[5m])`. Each server's pool side by side: the Puppetserver board's table of catalogues by server. PE's own health check S0045 watches the same thing, and its entry on this board has PE's steps.
          **Escalate**
          If the pool was widened on purpose and nobody knows why, or the change window needs approval, hand it to the PE administrator with the tuner comparison, the demand graph and the heap and GC graphs.
          **Known noise**
          A pool deliberately held above 12 on a host with the heap to carry it fires this for as long as it stays that way; if that is the accepted design, raise `jruby_pool_max` under `observability::alerts::thresholds` to match.
        where_panel: pobs-puppetserver/Catalogues by Server
        where: The "Catalogues by Server" table on the Puppetserver board, which lists
          each server's pool size beside the catalogues it compiled.
        thresholds: jruby_pool_max
    - alert: PuppetserverJRubyQueueLimit
      expr: increase(puppet_server_jruby_queue_limit_hits_total[15m]) > 0
      for: 5m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: Puppetserver on {{ $labels.host }} is turning agents away
        description: |-
          **What is wrong**
          Puppetserver on `{{ $labels.host }}` has refused agent requests with a 503 in the last fifteen minutes because its JRuby request queue was full, and the count has stayed above zero for five minutes.
          **Risk**
          Each refused request is a Puppet run that did not happen. Those nodes are unmanaged until their next successful run, which does not come while this host keeps refusing. Node silence alerts for nodes served by this host follow from this.
          **Severity and why**
          Critical, and it pages. Runs are already being refused, which is the outcome every other JRuby alert warns about; agents giving up before the queue fills is the warning `PuppetserverJRubyBorrowTimeouts`.
          **When to act**
          Now.
          **What to do**
          1. Check: the pool on the host, or from anywhere that reaches its port 8140: `curl -s --cacert /etc/puppetlabs/puppet/ssl/certs/ca.pem "https://{{ $labels.host }}:8140/status/v1/services/jruby-metrics?level=debug" | jq '.status.experimental.metrics | {free: ."num-free-jrubies", size: ."num-jrubies", borrowed: ."borrowed-instances"}'`. `borrowed` says what each interpreter is serving and for how long; entries held for minutes are stuck, entries turning over in seconds with free at zero are demand.
          2. Cause: a pool too small for the arrival rate. Requested above free on the Puppetserver board, or `puppet_server_jruby_requested_avg` above `puppet_server_jruby_pool_size`, with the pool already at its largest. Add a compiler. Deepening `max-queued-requests` adds no capacity; a request at the back of a deeper queue times out at the agent before it is served.
          3. Cause: a stuck pool. Interpreters held for minutes with requested no higher than usual. `sudo systemctl restart pe-puppetserver` on the host clears it; the compiles in flight fail and those agents retry at their next run. If refusals resume straight after, it is capacity, go back to step 2.
          4. Whatever the cause: the alert clears once fifteen minutes pass with no new refusals.
          **Finding the rest**
          How many were refused and when: `increase(puppet_server_jruby_queue_limit_hits_total{host="{{ $labels.host }}"}[1h])`. The queue ceiling they hit: `puppet_puppetserver_max_queued_requests`; it has no `host` label because it is read from the config file on the host the daemon runs on, so on a multi-compiler estate it is the primary's setting and this compiler may differ. Demand against the pool: `puppet_server_jruby_requested_avg{host="{{ $labels.host }}"}` against `puppet_server_jruby_pool_size{host="{{ $labels.host }}"}`. Requests that gave up waiting as well as being refused: `increase(puppet_server_jruby_borrow_timeouts_total{host="{{ $labels.host }}"}[1h])`.
          **Escalate**
          If a restart does not stop the refusals and there is no compiler to add, hand it to the PE administrator with the time window, the refusal count and the `jruby-metrics` output from step 1. They take it to Puppet support with the same material.
          **Known noise**
          None known.
        where_panel: pobs-puppetserver/Agents Refused
        where: The "Agents Refused" panel on the Puppetserver board, which shows the
          rate of 503s and borrow timeouts on this host.
    - alert: PuppetserverJRubyWaitTime
      expr: puppet_server_jruby_wait_seconds > 1
      for: 10m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Agent requests on {{ $labels.host }} are queuing for JRubies
        description: |-
          **What is wrong**
          Requests on `{{ $labels.host }}` have waited a mean of {{ $value | humanizeDuration }} for a JRuby interpreter, over the 1 second threshold, for ten minutes.
          **Risk**
          Nothing has failed. Demand exceeds the pool for part of every minute, so runs are slower, and if it grows the pool empties (`PuppetserverJRubyExhausted`) and then agents are refused outright (`PuppetserverJRubyQueueLimit`) and the nodes drift.
          **Severity and why**
          Warning, so it waits for working hours. Agents are still being served, only later; the pool sitting at zero for five minutes is the critical alert beside it.
          **When to act**
          Working hours.
          **What to do**
          1. Check: which of two causes it is. Graph `puppet_server_jruby_wait_seconds{host="{{ $labels.host }}"}` and `puppet_server_jruby_borrow_seconds{host="{{ $labels.host }}"}` together. Wait rising while hold time stays flat is more agents arriving. Wait rising with hold time rising too is catalogues getting more expensive.
          2. Cause: more agents arriving. `puppet_node_count{environment="all"}` over the last month rising with the wait confirms it. Add a compiler. Widening the pool past 12 raises `PuppetserverJRubyPoolOversized`.
          3. Cause: more expensive catalogues. The Puppetserver board's compile time breakdown attributes the compile time to functions, resources and calls out, and its slowest functions and slowest resources panels name the code. Make that code or query cheaper.
          4. Whatever the cause: the alert clears when the mean wait has been under 1 seconds at every evaluation for the `for` period. A code or capacity fix clears it on its own as demand drops.
          **Finding the rest**
          Wait against hold time: `puppet_server_jruby_wait_seconds{host="{{ $labels.host }}"}` and `puppet_server_jruby_borrow_seconds{host="{{ $labels.host }}"}` on the same graph; the one that moved first is the cause. How often the pool has actually emptied in the last hour: `sum_over_time((puppet_server_jruby_free{host="{{ $labels.host }}"} == bool 0)[1h:1m])`; above zero means the waits are already saturating the pool in bursts. Whether anyone has been refused yet: `increase(puppet_server_jruby_queue_limit_hits_total{host="{{ $labels.host }}"}[1h])`; above zero means it is past a warning.
          **Escalate**
          If the cause is in Puppet code, hand the slowest functions and resources to the team that owns that code. If the pool is the right size and the wait is still climbing, hand it to the PE administrator with the time window and the wait and hold graphs.
          **Known noise**
          An estate whose agents are scheduled to run together sees the wait climb every interval and settle again; if that is accepted, raise `jruby_wait_seconds` under `observability::alerts::thresholds` to a number the estate sits under, or spread the agent schedule.
        where_panel: pobs-puppetserver/Wait Against Hold Time
        where: The "Wait Against Hold Time" panel on the Puppetserver board, which
          shows whether the wait is rising because more agents are arriving or because
          each compile holds an interpreter longer.
        thresholds: jruby_pool_max, jruby_wait_seconds
    - alert: PuppetserverPuppetDBRegressed
      expr: puppet_server_http_client_duration_seconds{operation=~"puppetdb\\..*"}
        > 0 > 2 * quantile_over_time(0.9, puppet_server_http_client_duration_seconds{operation=~"puppetdb\\..*"}[7d])
        and present_over_time(puppet_server_http_client_duration_seconds{operation=~"puppetdb\\..*"}[7d]
        offset 3d)
      for: 30m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: Puppetserver on {{ $labels.host }} is waiting {{ $value | humanizeDuration
          }} on PuppetDB for {{ $labels.operation }}, well over its own last week
        description: |-
          **What is wrong**
          The mean time puppetserver on `{{ $labels.host }}` spends on each `{{ $labels.operation }}` call to PuppetDB is {{ $value | humanizeDuration }}, more than 2 times the 90th percentile of the last seven days, and has been for thirty minutes.
          **Risk**
          Every catalogue compile that makes this call holds its JRuby for the extra wait, so the compiler serves fewer agents per minute. If it keeps rising the compile time alerts follow, with the cause in PuppetDB and none of it in the Puppet code.
          **Severity and why**
          Warning, so it waits for working hours. Compiles are slower but still completing; the compile throughput ceiling being passed is the critical alert beside it.
          **When to act**
          Working hours, unless catalogue compile time on the Puppetserver board is already up.
          **What to do**
          1. Cause: the command pipeline, for a `command.*` operation. `puppet_db_command_stage_seconds{host="{{ $labels.host }}"}` says which stage grew. A healthy pipeline has every stage flat; one stage up is where PuppetDB is spending the time, and the PuppetDB board's runbook entries for the command queue have the steps.
          2. Cause: the read path, for a `query` or `resource.search` operation. `puppet_db_pool_wait_seconds{host="{{ $labels.host }}",pool="read"}` for the pool and the PuppetDB board's query threads for Jetty. Pool wait up means the read pool is too small or PostgreSQL is slow; threads at their limit means too many concurrent queries.
          3. Inferred cause: the wire or puppetserver's HTTP client. If PuppetDB's own numbers are flat, check the network between the compiler and PuppetDB, and `puppet_server_http_client_requests_total{host="{{ $labels.host }}"}` for a rate change that says the compiler is simply making more calls.
          4. Whatever the cause: the alert clears once the mean has been back under the threshold for thirty minutes, which it reaches on its own as fresh calls refill the mean.
          **Finding the rest**
          The baseline: `quantile_over_time(0.9, puppet_server_http_client_duration_seconds{host="{{ $labels.host }}",operation="{{ $labels.operation }}"}[7d])`. Every outbound operation on the host, to see whether one or all moved: `puppet_server_http_client_duration_seconds{host="{{ $labels.host }}"}`; all of them up together points at the wire or PuppetDB as a whole, one up points at that operation's path.
          **Escalate**
          If PuppetDB's own numbers are flat and the network between compiler and PuppetDB is suspect, hand it to the platform or network team with the time window and the duration graph for both ends. If PuppetDB's stage or pool times grew and the PuppetDB runbook steps do not bring them down, hand it to the PE administrator with the same.
          **Known noise**
          A PuppetDB restart or a GC pause slows every call for a few minutes and the thirty-minute dwell absorbs it. A fresh install has no baseline and stays quiet by design.
        where_panel: 'pobs-puppetserver/Calls Out: $host'
        where: 'The "Calls Out: $host" panel on the Puppetserver board, one per compiler,
          which draws the mean duration of each outbound call so the one that grew
          stands out.'
        thresholds: latency_regression_factor
    - alert: PuppetserverQueueLimitTooHigh
      expr: puppet_puppetserver_max_queued_requests > 150
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: puppetserver max-queued-requests is {{ $value }} on {{ $labels.alias
          }}
        description: |-
          **What is wrong**
          `jruby-puppet.max-queued-requests` on the primary for `{{ $labels.alias }}` has read {{ $value }} for an hour, above 150.
          **Risk**
          The setting breaks nothing by itself. A queue deeper than 150 adds no capacity: a request joining the back has usually timed out at the agent before an interpreter frees up, so agents fail slowly instead of being refused quickly, and the JRuby shortage underneath is hidden from `PuppetserverJRubyQueueLimit`.
          **Severity and why**
          Warning, so it waits for working hours. This is configuration posture that holds until somebody changes the setting; the shortage it can hide has its own alerts.
          **When to act**
          Next change window. The setting itself is breaking nothing.
          **What to do**
          1. Check: the pool before lowering the limit, because a lower limit makes refusals visible at once. `puppet_server_jruby_free_avg` under one and `puppet_server_jruby_wait_seconds` above 1 on any host means the deep queue is already masking a shortage; fix that capacity first or expect `PuppetserverJRubyQueueLimit` to fire when the limit drops.
          2. Cause: the limit was raised to stop 503s. Set `jruby_puppet_max_queued_requests` on the Puppet Server class in the console's PE Master node group to 150 or below. The file it writes is `/etc/puppetlabs/puppetserver/conf.d/pe-puppet-server.conf` on the primary, and the change takes a puppetserver restart, so it is a change-window job.
          3. Whatever the cause: the alert clears once the change has landed in that file and the next poll reads `puppet_puppetserver_max_queued_requests` at 150 or below.
          **Finding the rest**
          The metric has no `host` label because it is read from the config file on the host the daemon runs on, so on a multi-compiler estate it is the primary's setting and a compiler may differ; check `pe-puppet-server.conf` on each compiler by hand. Free interpreters per host: `puppet_server_jruby_free_avg`. Wait per host: `puppet_server_jruby_wait_seconds`. Whether the queue has been hit anyway: `increase(puppet_server_jruby_queue_limit_hits_total[24h])` per host; above zero means even the deep queue fills. PE's own health check S0036 watches the same thing, and its entry on this board has PE's steps.
          **Escalate**
          If the limit was raised on purpose during an incident and the shortage behind it is still there, hand it to the PE administrator with the per-host free and wait readings and the change that raised it. They take the capacity question to Puppet support with S0036.
          **Known noise**
          An estate whose support case agreed a higher limit fires this for as long as it stands; raise `max_queued_requests` under `observability::alerts::thresholds` to the agreed number.
        where_panel: pobs-puppetserver/Queue Ceiling
        where: The "Queue Ceiling" tile on the Puppetserver board, which shows the
          configured max-queued-requests the refusals beside it are measured against.
        thresholds: jruby_wait_seconds, max_queued_requests
  - name: pobs-review
    rules:
    - record: puppet_review_subject
      expr: label_replace(sum by (alias) (puppet_status{state="failed"}), "subject",
        "Nodes whose last run failed", "", "") or label_replace(sum by (alias) (puppet_state_overview{state="corrective"}),
        "subject", "Nodes taking corrective change", "", "") or label_replace(count
        by (alias) (puppet_restart_required > 0) or (0 * count by (alias) (puppet_restart_required)),
        "subject", "Nodes awaiting restart", "", "") or label_replace(sum by (alias)
        (puppet_patching_stats{type="nodes_to_patch"}), "subject", "Nodes waiting
        for patches", "", "") or label_replace(count by (alias) (count by (alias,
        node) (puppet_compliance_score{score_type="base",standard="cis"} < 90)) or
        (0 * count by (alias) (puppet_compliance_score{score_type="base",standard="cis"})),
        "subject", "Nodes below the CIS score target", "", "") or label_replace(count
        by (alias) (count by (module, alias) (count by (module, version, alias) (puppet_module_version))
        > 1) or (0 * count by (alias) (puppet_module_version)), "subject", "Modules
        at more than one version", "", "") or label_replace(count by (alias) (puppet_certificate_expires_epoch
        - time() < 14 * 86400) or (0 * count by (alias) (puppet_certificate_expires_epoch)),
        "subject", "Certificates expiring soon", "", "") or label_replace(sum by (alias)
        (puppet_node_lifecycle{state=~"deactivated|expired"}), "subject", "Dead nodes
        not cleaned up", "", "")
  - name: pobs-scm
    rules:
    - alert: PobsScmExportFailing
      expr: puppet_scm_export_success == 0
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: SCM export on {{ $labels.instance }} is failing
        description: |-
          **What is wrong**
          The last three SCM exports from the daemon on `{{ $labels.instance }}` ran and failed, which is fifteen minutes of failures at the export interval.
          **Risk**
          Every `puppet_compliance_*` metric is frozen at the last good export, and every board keeps drawing those numbers as current.
          **Severity and why**
          Warning, because the compliance numbers are stale, not wrong, and nothing on a node is affected. It waits for working hours.
          **When to act**
          Working hours. Nothing local is broken and no node is affected.
          **What to do**
          1. Check: read the error first. `sudo /usr/local/bin/pobs-ctl scm status` on the primary prints the last export's result, and the `error_message` field in `scm_export_status.json` under `observability::scm_dir` (default `/opt/puppetlabs/pobs/data`) carries the same text. `sudo journalctl -u pobs -n 100 | grep -i scm` has the lines around it.
          2. Cause: the SCM token is wrong or expired. Check: an HTTP 401 in the error text. Fix: check `observability::scm_auth_token` or `observability::scm_auth_token_file` against what SCM expects, and whether SCM restricts the primary's IP. The exporter reads a new token on its next run, so after changing it, run `sudo /usr/local/bin/pobs-ctl scm export` to test it now.
          3. Cause: the primary cannot reach SCM. Check: a connection or TLS error in the error text. Fix: `observability::scm_host` or the network between the primary and SCM; the latter is the network team's.
          4. Last: any other error text is SCM side; take it to the team that owns SCM.
          5. Whatever the cause: the alert clears once an export succeeds. `sudo /usr/local/bin/pobs-ctl scm export` runs one now, so a fix does not have to wait for the next `scm_export_interval`.
          **Finding the rest**
          How long since the last good export: `time() - puppet_scm_export_last_success_timestamp{instance="{{ $labels.instance }}"}`. Whether the loop is still attempting: `puppet_scm_export_last_run_timestamp{instance="{{ $labels.instance }}"}` moving every `scm_export_interval` means it is trying and erroring. The same two facts on the CIS board: `Export Failing` and `Last Successful Export`.
          **Escalate**
          Once the token and the network are ruled out, hand the team that owns SCM the error text from `pobs-ctl scm status`, the journal lines and the time of the first failure.
          **Known noise**
          An SCM outage or maintenance window fires this for its duration; silence by `alertname` in Alertmanager with `amtool` on the dashboard node for the window. Otherwise none known.
        where_panel: pobs-cis/Export Failing
        where: The "Export Failing" tile on the CIS board, read beside Last Successful
          Export, which together say whether the export is trying and erroring or
          has stopped running.
    - alert: PobsScmExportStale
      expr: time() - puppet_scm_export_last_success_timestamp > 172800
      for: 1h
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: SCM export on {{ $labels.instance }} has not succeeded in two days
        description: |-
          **What is wrong**
          No SCM export from the daemon on `{{ $labels.instance }}` has succeeded in two days, and the condition has held for more than an hour.
          **Risk**
          Every CIS score on every board is frozen at the last good export and still renders as current. Any compliance claim read from a board since then is unevidenced.
          **Severity and why**
          Warning, because the compliance numbers are stale, not wrong, and no node is affected. It waits for working hours.
          **When to act**
          Working hours. Nothing local is broken and no node is affected.
          **What to do**
          1. Cause: the export loop is running and every export is erroring. Check: whether `PobsScmExportFailing` is firing beside this. Fix: follow that alert; this clears with it.
          2. Cause: the export loop has stopped because the daemon is down or restarting. Check: `sudo /usr/local/bin/pobs-ctl status` on the primary says whether it is up, and `sudo journalctl -u pobs --since '-1h'` carries what it last said about SCM. The exporter is a thread inside the daemon, so a daemon that is down or restarting takes the loop with it. Fix: `sudo systemctl restart pobs`, which is cheap and reversible, and an export follows within `scm_export_interval`.
          3. Whatever the cause: the alert clears once an export succeeds. `sudo /usr/local/bin/pobs-ctl scm export` runs one now and prints the result.
          **Finding the rest**
          Whether the loop is attempting at all: `puppet_scm_export_last_run_timestamp{instance="{{ $labels.instance }}"}`; recent means it is running and failing, as old as the success timestamp means it is not running. How long since the last success: `time() - puppet_scm_export_last_success_timestamp{instance="{{ $labels.instance }}"}`. The same two facts on the CIS board: `Last Successful Export` and `Export Failing`; a climbing age with Export Failing at No is the stopped loop.
          **Escalate**
          If the daemon is up and the loop still does not run after a restart, hand the PE administrator the `pobs-ctl status` output and the journal lines since the last success timestamp.
          **Known noise**
          A site whose export schedule is longer than the default should raise `observability::alerts::thresholds.scm_export_stale_seconds` and `scm_export_stale_human` together. Otherwise none known.
        where_panel: pobs-cis/Last Successful Export
        where: The "Last Successful Export" tile on the CIS board, read beside Export
          Failing, which together say whether the export is trying and erroring or
          has stopped running.
        thresholds: scm_export_stale_human, scm_export_stale_seconds
  - name: pobs-service_status
    rules:
    - alert: PuppetInfraServiceError
      expr: puppet_infra_service_up{state="error"} == 1
      for: 5m
      labels:
        severity: critical
        pobs: 'true'
      annotations:
        summary: "{{ $labels.component }} on {{ $labels.host }} is in the error state"
        description: |-
          **What is wrong**
          Trapperkeeper reports the `{{ $labels.component }}` component of `{{ $labels.service }}` on `{{ $labels.host }}` in the `error` state, and it has been there for five minutes. The component has faulted; it is not still starting.
          **Risk**
          Whatever the component backs is degraded or down on that host: catalogue compilation, filesync, the CA or the PCP broker, depending on the component. Agents served by that host fail or fall back to another compiler while this lasts.
          **Severity and why**
          Critical, and it pages. An `error` state is a declared fault in a PE service, so there is nothing to wait and see about; a component that is merely stuck starting or unreadable is the warning `PuppetInfraServiceNotRunning` instead.
          **When to act**
          Now.
          **What to do**
          1. Check: whether it is one component or the host. Read the TAM Check board's list of components out of the running state. One component on one host is a faulted service; several on the same host is the host itself, so check its disk, memory and the PostgreSQL and PuppetDB it depends on before touching the service.
          2. Check: the component's own status block, `/status/v1/services?level=debug` on the port for `{{ $labels.service }}`, which is 8140 for puppetserver, 8143 for orchestrator, 4433 for console, 8146 for patching_service and 8148 for workflow_service. The endpoint needs the host's own agent certificate, from `puppet config print hostcert`, `hostprivkey` and `localcacert`. A healthy block says `running` for every component; the faulted one carries the error text that says why.
          3. Then: run `systemctl status` and `journalctl` for the PE unit that owns the service on `{{ $labels.host }}`: pe-puppetserver, pe-orchestration-services, pe-console-services, pe-patching-service or pe-workflow-service. The journal has the stack trace or the dependency it could not reach.
          4. Last: restart that unit. On a multi-compiler estate, pull the host out of the load balancer first, since a restart drops every in-flight compile on it. A component that returns to `error` straight after the restart has a cause the journal names, so fix that before restarting again.
          5. Whatever the cause: the alert clears when the component reports `running` again, which a successful restart does on its own at the next poll.
          **Finding the rest**
          Everything else on the host that is not running: `puppet_infra_service_up{host="{{ $labels.host }}",state!="running"}`; more than this one row means the host, not the component. The same component across the estate: `puppet_infra_service_up{component="{{ $labels.component }}",state!="running"}`; several hosts at once points at something shared, such as PuppetDB or PostgreSQL. How long it has been in error: `puppet_infra_service_up{host="{{ $labels.host }}",component="{{ $labels.component }}",state="error"}` over a longer range.
          **Escalate**
          If a restart does not return the component to `running`, or the journal names a fault you cannot fix on the host, hand it to the PE administrator with the time the state changed, the `/status/v1/services?level=debug` output and the `journalctl` lines for the unit. If it points at PE itself, they take it to Puppet support with the same material.
          **Known noise**
          None known.
        where_panel: pobs-tam-check/Which Services, And On Which Host
        where: The "Which Services, And On Which Host" table on the TAM Check board,
          which lists every PE service component out of the running state with its
          host.
    - alert: PuppetInfraServiceNotRunning
      expr: puppet_infra_service_up{state!~"running|error"} == 1
      for: 15m
      labels:
        severity: warning
        pobs: 'true'
      annotations:
        summary: "{{ $labels.component }} on {{ $labels.host }} is stuck in state
          {{ $labels.state }}"
        description: |-
          **What is wrong**
          The `{{ $labels.component }}` component of `{{ $labels.service }}` on `{{ $labels.host }}` has sat in state `{{ $labels.state }}` for fifteen minutes. A `starting` that lasts this long never came up. An `unknown` means the status endpoint could not read the component's state, which is often the endpoint and not the component.
          **Risk**
          The component is not serving, though no fault has been declared. What that costs depends on the component: a stuck `server` on a compiler costs catalogues, a stuck `jruby-metrics` only costs the JRuby numbers this module reads.
          **Severity and why**
          Warning, so it waits for working hours. No fault has been declared and the component may be serving behind an unreadable status; a declared `error` is the critical `PuppetInfraServiceError`.
          **When to act**
          Working hours, unless the component backs something agents depend on, in which case treat it as `PuppetInfraServiceError` and act now.
          **What to do**
          1. Check: whether the rest of the host is up. Read the TAM Check board's list of components out of the running state. Only this component out is a stuck start; several on the same host is the host itself.
          2. Check: the component's own status block, `/status/v1/services?level=debug` on the port for `{{ $labels.service }}`, which is 8140 for puppetserver, 8143 for orchestrator, 4433 for console, 8146 for patching_service and 8148 for workflow_service. The endpoint needs the host's own agent certificate, from `puppet config print hostcert`, `hostprivkey` and `localcacert`. A block that says `running` for this component while the metric says `{{ $labels.state }}` means the collector's read of the endpoint is the problem, not the service.
          3. Likely cause: a start that is waiting on a dependency. Run `journalctl` for the PE unit that owns the service on `{{ $labels.host }}`: pe-puppetserver, pe-orchestration-services, pe-console-services, pe-patching-service or pe-workflow-service. It says why the component did not start, usually a database, a certificate or a port it could not reach. Fix that and the start completes on its own.
          4. Last: if the component is still stuck with nothing in the journal, restart that unit. On a multi-compiler estate, pull the host out of the load balancer first, since the restart drops every in-flight compile on it.
          5. Whatever the cause: the alert clears when the component reports `running`. A restart that completes clears it on its own at the next poll.
          **Finding the rest**
          Everything else on the host that is not running: `puppet_infra_service_up{host="{{ $labels.host }}",state!="running"}`. How long this has been going on: `puppet_infra_service_up{host="{{ $labels.host }}",component="{{ $labels.component }}",state="{{ $labels.state }}"}` over a longer range shows when the state first appeared; a start that coincides with a service restart or a PE upgrade is a start that never finished.
          **Escalate**
          If the journal names a dependency outside the host, or a restart does not bring the component up, hand it to the PE administrator with the time the state first appeared, the status block output and the journal lines.
          **Known noise**
          An `unknown` state that the status endpoint reports while the component serves normally is the endpoint, not the service; if it recurs on one component and the service is fine, silence that `component` and `host` pair in Alertmanager and raise it with the PE administrator as a status endpoint fault.
        where_panel: pobs-tam-check/Which Services, And On Which Host
        where: The "Which Services, And On Which Host" table on the TAM Check board,
          which lists every PE service component out of the running state with its
          host.
  - name: pobs-windows_compat
    rules:
    - record: node_boot_time_seconds
      expr: "(windows_system_boot_time_timestamp_seconds >= 1e9) or (windows_os_time
        - on(instance) group_left() (windows_system_boot_time_timestamp_seconds <
        1e9))"
    - record: node_cpu_seconds_total
      expr: sum without (core) (label_replace(windows_cpu_time_total, "cpu", "$1",
        "core", "(.*)"))
    - record: node_disk_io_time_seconds_total
      expr: sum without (volume) (label_replace(windows_logical_disk_read_seconds_total
        + windows_logical_disk_write_seconds_total, "device", "$1", "volume", "(.*)"))
    - record: node_disk_read_bytes_total
      expr: sum without (volume) (label_replace(windows_logical_disk_read_bytes_total,
        "device", "$1", "volume", "(.*)"))
    - record: node_disk_written_bytes_total
      expr: sum without (volume) (label_replace(windows_logical_disk_write_bytes_total,
        "device", "$1", "volume", "(.*)"))
    - record: node_filesystem_avail_bytes
      expr: sum without (volume) (label_replace(windows_logical_disk_free_bytes, "mountpoint",
        "$1", "volume", "(.*)"))
    - record: node_filesystem_size_bytes
      expr: sum without (volume) (label_replace(windows_logical_disk_size_bytes, "mountpoint",
        "$1", "volume", "(.*)"))
    - record: node_memory_Cached_bytes
      expr: windows_memory_cache_bytes
    - record: node_memory_MemAvailable_bytes
      expr: windows_memory_available_bytes
    - record: node_memory_MemTotal_bytes
      expr: windows_memory_physical_total_bytes
    - record: node_network_receive_bytes_total
      expr: sum without (nic) (label_replace(windows_net_bytes_received_total, "device",
        "$1", "nic", "(.*)"))
    - record: node_network_receive_drop_total
      expr: sum without (nic) (label_replace(windows_net_packets_received_discarded_total,
        "device", "$1", "nic", "(.*)"))
    - record: node_network_receive_errs_total
      expr: sum without (nic) (label_replace(windows_net_packets_received_errors_total,
        "device", "$1", "nic", "(.*)"))
    - record: node_network_transmit_bytes_total
      expr: sum without (nic) (label_replace(windows_net_bytes_sent_total, "device",
        "$1", "nic", "(.*)"))
    - record: node_network_transmit_drop_total
      expr: sum without (nic) (label_replace(windows_net_packets_outbound_discarded_total,
        "device", "$1", "nic", "(.*)"))
    - record: node_network_transmit_errs_total
      expr: sum without (nic) (label_replace(windows_net_packets_outbound_errors_total,
        "device", "$1", "nic", "(.*)"))
    - record: node_uname_info
      expr: label_replace(label_replace(windows_os_info, "sysname", "Windows", "",
        ""), "release", "$1", "version", "(.*)")
