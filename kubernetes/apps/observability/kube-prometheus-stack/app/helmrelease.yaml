---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 88.5.4
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
    - name: openebs
      namespace: openebs-system
  values:
    crds:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      rules:
        nodeExporterAlerting: true
        nodeExporterRecording: true
      # Disable specific rules that we override with custom thresholds
      disabled:
        NodeDiskIOSaturation: true # Custom rule with threshold of 100 instead of 10
        TargetDown: true # Replace with per-instance alerts and clean exclusions
        CephNodeDiskspaceWarning: true # Fix false positives from predict_linear on decreasing usage
        NodeFilesystemAlmostOutOfSpace: true # Custom rule with better exclusions for non-critical filesystems
        NodeFilesystemAlmostOutOfFiles: true # Custom rule with same exclusions; stock rule fires on Time Machine SMB mounts
        NodeFilesystemFilesFillingUp: true # Custom rule with same exclusions; stock rule has the same SMB exposure
    alertmanager:
      ingress:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/pod-selector: ""
          gethomepage.dev/group: Observability
          gethomepage.dev/name: "Alert Manager"
          gethomepage.dev/icon: alertmanager.png
          gethomepage.dev/description: Alert Managemnet
        ingressClassName: internal
        hosts: ["alertmanager.${SECRET_DOMAIN}"]
        pathType: Prefix
      alertmanagerSpec:
        useExistingSecret: true
        configSecret: alertmanager-secret
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 3Gi
    prometheusOperator:
      thanosImage:
        registry: quay.io
        repository: thanos/thanos
        tag: "v0.42.4"
        # This chart splits the digest into its own field instead of the
        # usual tag@sha256 pattern - it IS pinned, a future audit grepping
        # for "@sha256" here will not find it and should check this field.
        sha: b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8  # pragma: allowlist secret
    kubeApiServer:
      serviceMonitor:
        selector:
          k8s-app: kube-apiserver
    kubeScheduler:
      service:
        selector:
          k8s-app: kube-scheduler
    kubeControllerManager: &kubeControllerManager
      service:
        selector:
          k8s-app: kube-controller-manager
    kubeEtcd:
      <<: *kubeControllerManager # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      ingress:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Monitoring
          gethomepage.dev/pod-selector: ""
          gethomepage.dev/name: Prometheus
          gethomepage.dev/icon: prometheus.png
          gethomepage.dev/serviceMonitor: "http://prometheus.${SECRET_DOMAIN}"
          gethomepage.dev/description: Metric Gathering
          gethomepage.dev/widget.type: prometheus
          gethomepage.dev/widget.url: "http://prometheus.${SECRET_DOMAIN}"
          gethomepage.dev/widget.fields: '["targets_down"]'
        ingressClassName: internal
        hosts: ["prometheus.${SECRET_DOMAIN}"]
        pathType: Prefix
      prometheusSpec:
        scrapeInterval: 1m # Must match interval in Grafana Helm chart
        enableRemoteWriteReceiver: true
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        enableFeatures:
          - auto-gomemlimit
          - memory-snapshot-on-shutdown
          - new-service-discovery-manager
          - remote-write-receiver
        tsdb:
          outOfOrderTimeWindow: 168h  # Accept samples up to 1 week old for shitbox offline sync
        # Thanos sidecar configuration
        thanos:
          objectStorageConfig:
            existingSecret:
              name: thanos-objstore-secret
              key: objstore.yml
          # Enable uploading of already-compacted blocks for faster historical data migration
          additionalArgs:
            - name: shipper.upload-compacted
        thanosService:
          enabled: true
        thanosServiceMonitor:
          enabled: true
        externalLabels:
          cluster: home-ops
        retention: 7d
        retentionSize: 10GB
        resources:
          requests:
            cpu: 100m
            memory: 4096Mi
          limits:
            memory: 4096Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 20Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
      # 2026-08-31: gotk_reconcile_condition (used by the flux PrometheusRule
      # group below) was removed from helm-controller/kustomize-controller's
      # own metrics in this Flux version - confirmed live, its /metrics only
      # exposes gotk_reconcile_duration_seconds now. Flux's replacement is
      # this KSM custom-resource-state config reading .status.conditions
      # straight off the CRDs. NOT using --custom-resource-state-only: this
      # KSM instance also serves core resource metrics (pods/deployments/
      # pvcs above) that other dashboards and alerts depend on.
      rbac:
        extraRules:
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - kustomizations
              - helmreleases
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      stalled: [status, conditions, "[type=Stalled]", status]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      stalled: [status, conditions, "[type=Stalled]", status]
                      suspended: [spec, suspend]
    grafana:
      enabled: false
      forceDeployDashboards: true
