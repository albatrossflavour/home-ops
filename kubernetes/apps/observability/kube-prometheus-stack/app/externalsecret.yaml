---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
    template:
      engineVersion: v2
      data:
        # Yo dawg I heard you like go templating so I put go templates in your go templates
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            smtp_smarthost: 'smtp-relay.default.svc.cluster.local:25'
            smtp_from: 'tgreen@albatrossflavour.com'
          route:
            group_by: ["alertname", "job"]
            group_interval: 10m
            group_wait: 1m
            receiver: pushover
            repeat_interval: 12h
            routes:
              # 2026-09-01: dead-man's-switch. Watchdog fires permanently by
              # design (vector(1), always true) specifically so something can
              # prove the whole Prometheus -> Alertmanager pipeline is alive,
              # not just that a standalone unrelated pod can run and reach the
              # internet (which is all healthcheck-ping's separate CronJob
              # actually proves). Was null-routed - a matching Alertmanager
              # silence to 2029-10-26 also existed and had to be deleted live
              # (silences block notification dispatch upstream of routing
              # entirely, so the receiver change alone would have been a
              # no-op otherwise). repeat_interval here is Healthchecks.io's
              # configured Period (5m); Grace is set to 15m on that check -
              # Alertmanager runs single-replica, so a routine pod restart
              # creates a real multi-minute gap that shouldn't false-page.
              - receiver: watchdog-heartbeat
                group_interval: 5m
                group_wait: 0s
                matchers:
                  - alertname =~ "Watchdog"
                repeat_interval: 5m
              - receiver: "null"
                matchers:
                  - alertname =~ "InfoInhibitor"
              # Silence all alerts from non-cluster nodes (hex/dotty)
              - receiver: "null"
                matchers:
                  - instance =~ "hex\\.home\\.albatrossflavour\\.com:.*"
              - receiver: "null"
                matchers:
                  - instance =~ "dotty\\.albatrossflavour\\.com:.*"
              # Null-routed 2026-08-31 (was also carrying a now-removed
              # Alertmanager silence to 2029-11-04, which added nothing on
              # top of this route match - deleted for being redundant).
              # Reason: persistent BlueStore slow-ops false alarms.
              # CephHealthError still fires for actual critical issues.
              # Re-review if Ceph's failure modes change - this matches on
              # bare alertname with no scoping, so any future HEALTH_WARN
              # cause would also vanish silently.
              - receiver: "null"
                matchers:
                  - alertname = "CephHealthWarning"
              # Proxmox alerts: Group by resource ID to deduplicate across exporters
              - receiver: pushover
                group_by: ["alertname", "id"]
                group_wait: 30s
                group_interval: 10m
                repeat_interval: 12h
                matchers:
                  - component = "proxmox"
                  - severity != "info"
              - receiver: pushover
                continue: true
                matchers:
                  - severity = "critical"
              - receiver: pushover
                continue: true
                matchers:
                  - severity = "warning"
              # 2026-08-31: sys-admin-email had SMTP configured but no route
              # ever referenced it - dead config, not a real backup channel.
              # Wired in as a genuine parallel fallback for critical/warning
              # (continue: true above means pushover already fired; this
              # doesn't replace it). Motivating case: Alertmanager logs show
              # a real, self-recovered transient DNS failure resolving
              # api.pushover.net, which would have meant zero delivery of
              # any severity if it hadn't cleared on retry.
              - receiver: sys-admin-email
                matchers:
                  - severity =~ "critical|warning"
          inhibit_rules:
            # Deduplicate Proxmox alerts from multiple exporters
            - equal: ["alertname", "id"]
              source_matchers:
                - component = "proxmox"
              target_matchers:
                - component = "proxmox"
            # Standard severity inhibition
            - equal: ["alertname", "namespace"]
              source_matchers:
                - severity = "critical"
              target_matchers:
                - severity = "warning"
          receivers:
            - name: "null"
            - name: watchdog-heartbeat
              webhook_configs:
                - url: 'https://hc-ping.com/b942c208-8c54-4926-837f-d633468fc32b'
                  send_resolved: false
            - name: 'sys-admin-email'
              email_configs:
                - to: 'tgreen@albatrossflavour.com'
                  require_tls: false
            - name: pushover
              pushover_configs:
                - html: true
                  # 2026-08-31: dropped the per-alert label dump that used to
                  # sit here. Pushover's 1024-rune limit was cutting off the
                  # actual alert text on CephClusterHealthError/CephHealthError/
                  # HelmRelease-upgrade-failure notifications - the labels block
                  # scaled worst (printed per alert in a group_by-merged
                  # notification, so N grouped alerts meant N label dumps) and
                  # contributed least, since this repo's own alert descriptions
                  # already bake in namespace/name context directly.
                  message: |-
                    {{ "{{-" }} range .Alerts {{ "}}" }}
                      {{ "{{-" }} if ne .Annotations.description "" {{ "}}" }}
                        {{ "{{" }} .Annotations.description {{ "}}" }}
                      {{ "{{-" }} else if ne .Annotations.summary "" {{ "}}" }}
                        {{ "{{" }} .Annotations.summary {{ "}}" }}
                      {{ "{{-" }} else if ne .Annotations.message "" {{ "}}" }}
                        {{ "{{" }} .Annotations.message {{ "}}" }}
                      {{ "{{-" }} else {{ "}}" }}
                        Alert description not available
                      {{ "{{-" }} end {{ "}}" }}
                    {{ "{{-" }} end {{ "}}" }}
                  priority: |-
                    {{ "{{" }} if eq .Status "firing" {{ "}}" }}1{{ "{{" }} else {{ "}}" }}0{{ "{{" }} end {{ "}}" }}
                  send_resolved: true
                  sound: gamelan
                  # ttl: 1d
                  title: >-
                    [{{ "{{" }} .Status | toUpper {{ "}}" }}{{ "{{" }} if eq .Status "firing" {{ "}}" }}:{{ "{{" }} .Alerts.Firing | len {{ "}}" }}{{ "{{" }} end {{ "}}" }}]
                    {{ "{{" }} .CommonLabels.alertname {{ "}}" }}
                  token: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
                  url_title: View in Alertmanager
                  user_key: "{{ .PUSHOVER_USER_KEY }}"
  dataFrom:
    - extract:
        key: pushover
    - extract:
        key: alertmanager
