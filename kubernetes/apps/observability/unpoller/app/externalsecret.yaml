---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unpoller-secret
    template:
      engineVersion: v2
      data:
        # UniFi OS API key, minted on the controller. Unpoller treats api_key as
        # exclusive of user/pass, so the local `readonly` account is no longer
        # used. That account was locked out on 2026-11-11 when its password was
        # rotated and the copy here was not, and unpoller then served a frozen
        # snapshot for three days without anything noticing.
        UP_UNIFI_DEFAULT_API_KEY: "{{ .credential }}"
  dataFrom:
    - extract:
        key: unifi
