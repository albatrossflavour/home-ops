---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# A fine-grained PAT owned by albatrossflavour, scoped to home-ops only, with
# contents and pull-requests write. It opens the PR as a person rather than as
# a GitHub App or GITHUB_TOKEN so the PR triggers the required checks.
#
# Lives in the estate, not in GitHub: this job runs in the cluster precisely so
# that no repo-triggered code (a fork PR on a public repo) can reach this token
# or the client certificate beside it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pobs-alert-sync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pobs-alert-sync
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: pobs-alert-sync
        property: github_token
