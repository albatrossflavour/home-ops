---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: thanos
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Allow using official upstream Thanos images instead of Bitnami images
    global:
      security:
        allowInsecureImages: true

    # Use official upstream Thanos images, not Bitnami
    image:
      registry: quay.io
      repository: thanos/thanos
      tag: v0.42.4@sha256:b567818fe608067eb0f1d7c2c4fe361e7ad83c8a256234c97685f1d0bf670cc8

    # Object storage configuration
    existingObjstoreSecret: thanos-objstore-secret # pragma: allowlist secret
    objstoreConfig:
      type: s3
      config:
        insecure: true

    # Thanos Query - Aggregates data from sidecars and object storage
    query:
      enabled: true
      replicaCount: 1
      replicaLabel: ["__replica__"]
      dnsDiscovery:
        sidecarsService: prometheus-operated
        sidecarsNamespace: observability
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 2Gi

    # Query Frontend - Caching layer for queries (Grafana connects here)
    queryFrontend:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 1Gi
      ingress:
        enabled: true
        ingressClassName: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Observability
          gethomepage.dev/name: "Thanos Query"
          gethomepage.dev/icon: thanos.png
          gethomepage.dev/description: "Long-term metrics storage"
        hostname: thanos.${SECRET_DOMAIN}
        tls: true

    # Bucket Web - Browse object storage via web UI
    bucketweb:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      # Finding #18 (2026-09-02): the chart's own default NetworkPolicy
      # allowed ingress from anywhere and unrestricted egress, despite this
      # component having no ingress object anywhere in this repo - confirmed
      # live nothing outside the cluster reaches it (kubectl port-forward,
      # the likely actual access method, bypasses Service-level NetworkPolicy
      # anyway). Locked down to same-release-client-only ingress and scoped
      # egress to just its actual backend (minio) plus DNS.
      networkPolicy:
        allowExternal: false
        allowExternalEgress: false
        # Correction (2026-09-02): allowExternal: false above also cut off
        # Prometheus, which scrapes this component's /metrics on the same
        # 8080 http port via the chart's own ServiceMonitor. Confirmed live
        # via Hubble - every scrape was hitting "Policy denied DROPPED", so
        # locking bucketweb down had silently blinded its own metrics.
        # Scoped to the kube-prometheus-stack pod in this namespace only.
        extraIngress:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: prometheus
                    app.kubernetes.io/instance: kube-prometheus-stack
            ports:
              - port: 8080
                protocol: TCP
        extraEgress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: default
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: minio
            ports:
              - port: 9000
                protocol: TCP
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP

    # Store Gateway - Accesses historical data from object storage
    storegateway:
      enabled: true
      replicaCount: 1
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 10Gi
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 2Gi

    # Compactor - Downsamples and compacts object storage data
    compactor:
      enabled: true
      retentionResolutionRaw: 14d
      retentionResolution5m: 180d
      retentionResolution1h: 5y
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 10Gi
      resources:
        requests:
          cpu: 10m
          memory: 256Mi
        limits:
          memory: 1Gi

    # Ruler - Evaluates recording and alerting rules on historical data
    ruler:
      enabled: true
      replicaCount: 1
      alertmanagers:
        - http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
      config: |-
        groups:
          - name: "PrometheusWatcher"
            rules:
              - alert: "PrometheusDown"
                annotations:
                  summary: "Prometheus has disappeared from Thanos target discovery"
                  description: "Prometheus instance has been down for more than 5 minutes"
                expr: absent(up{job="kube-prometheus-stack-prometheus"})
                for: 5m
                labels:
                  severity: critical
                  component: monitoring
          - name: "HistoricalDataIntegrity"
            rules:
              - alert: "HistoricalHomeTemperatureDeleted"
                annotations:
                  summary: "Historical home temperature data from 2026-01-01 has been deleted"
                  description: "mqtt_temperature data from 2026-01-01T12:00:00Z (unix: 1767268800) is no longer accessible in Thanos. Data has been deleted from object storage."
                expr: absent(mqtt_temperature{job="mqtt-exporter"} @ 1767268800)
                for: 15m
                labels:
                  severity: critical
                  component: monitoring
      dnsDiscovery:
        enabled: true
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 10Gi
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi

    # Enable Prometheus metrics for all components
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
