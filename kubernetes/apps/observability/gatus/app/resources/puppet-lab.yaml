---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-puppet-lab-endpoints
  labels:
    gatus.io/enabled: "true"
data:
  puppet-lab.yaml: |
    endpoints:
      - name: Puppet Enterprise
        url: "https://puppet.lab.albatrossflavour.com/"
        group: "Puppet Lab"
        description: "Infrastructure Automation"
        tags: ["puppet", "automation", "critical", "lab"]
        interval: 2m
        client:
          insecure: true
        conditions:
          - "[STATUS] < 400"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: pushover

      - name: Puppet Server
        url: "https://puppet.lab.albatrossflavour.com:8140/status/v1/simple"
        group: "Puppet Lab"
        description: "Puppet Server status"
        tags: ["puppet", "automation", "critical", "lab"]
        interval: 2m
        client:
          insecure: true
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: pushover

      - name: CD4PE
        url: "https://cd4pe.lab.albatrossflavour.com/"
        group: "Puppet Lab"
        description: "Continuous Deployment"
        tags: ["puppet", "cicd", "automation", "lab"]
        interval: 2m
        client:
          insecure: true
        conditions:
          - "[STATUS] < 400"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: pushover

      - name: SCM
        url: "https://scm.lab.albatrossflavour.com/"
        group: "Puppet Lab"
        description: "Source Control Management"
        tags: ["puppet", "cicd", "automation", "lab"]
        interval: 2m
        client:
          insecure: true
        conditions:
          - "[STATUS] < 400"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: pushover

      # Disabled: SCE is not deployed on the rebuilt lab yet. This comes back with the SCE work.
      - name: SCE
        enabled: false
        url: "https://sce.lab.albatrossflavour.com/"
        group: "Puppet Lab"
        description: "Compliance Engine"
        tags: ["puppet", "compliance", "automation", "lab"]
        interval: 2m
        client:
          insecure: true
        conditions:
          - "[STATUS] < 400"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: pushover

      - name: Puppet Dashboard
        url: "https://dashboard.lab.albatrossflavour.com/api/health"
        group: "Puppet Lab"
        description: "Grafana, the Puppet Observability dashboard"
        tags: ["puppet", "monitoring", "dashboard", "lab"]
        interval: 2m
        client:
          insecure: true
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: pushover

      - name: POBS MCP
        url: "https://mcp.lab.albatrossflavour.com:10052/mcp"
        group: "Puppet Lab"
        description: "Puppet Observability MCP server"
        tags: ["puppet", "monitoring", "mcp", "lab"]
        interval: 2m
        method: POST
        headers:
          Content-Type: "application/json"
          Accept: "application/json, text/event-stream"
        body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"gatus","version":"1"}}}'
        # pobs-mcp wants an OAuth token while observability R1300 trials it.
        # Gatus fetches its own from authentik's pobs-mcp-machines client.
        client:
          insecure: true
          oauth2:
            token-url: "https://id.albatrossflavour.com/application/o/token/"
            client-id: "pobs-mcp-machines"
            client-secret: "$${POBS_MCP_MACHINES_CLIENT_SECRET}"
            scopes: ["openid", "profile"]
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: pushover
