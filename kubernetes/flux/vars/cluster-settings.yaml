---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  SETTING_EXAMPLE: Global settings for your cluster go in this file, this file is NOT encrypted
  # A literal dollar, for emitting an nginx variable into an ingress snippet. postBuild
  # substitution runs in strict mode and fails on any nginx variable it has never heard of,
  # and the documented doubled-dollar escape only helps where nginx accepts the brace form.
  # nginx rejects braces in an `if` condition, so build the name from this instead.
  NGINX_VAR: "$"
  THEME_PARK_THEME: aquamarine
  TZ: Australia/Sydney
