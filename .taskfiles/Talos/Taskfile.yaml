---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Machine configs are rendered and applied with topf
# (https://github.com/postfinance/topf). talhelper, which this file used
# until 2026-11-16, is archived and cannot render Talos 1.14 configs.
#
# topf reads topf.yaml and the patch directories beside it, and decrypts
# talsecret.sops.yaml through sops. Every topf command below sets
# SOPS_AGE_KEY_FILE itself: the root Taskfile's env block does not override a
# value already exported by the shell, and a shell pointing at a different
# age key makes the decrypt fail with "no identity matched".
vars:
  TOPF_DIR: "{{.KUBERNETES_DIR}}/bootstrap/talos/topf"
  TOPF_CONFIG_FILE: "{{.TOPF_DIR}}/topf.yaml"
  TALOS_CLUSTER_DIR: "{{.KUBERNETES_DIR}}/bootstrap/talos/clusterconfig"
  TALOS_SECRET_FILE: "{{.KUBERNETES_DIR}}/bootstrap/talos/talsecret.sops.yaml"
  HELMFILE_FILE: "{{.KUBERNETES_DIR}}/bootstrap/helmfile.yaml"
  TALOSCONFIG_FILE: "{{.TALOS_CLUSTER_DIR}}/talosconfig"
  # Any control-plane node; used to fetch the kubeconfig.
  CONTROLLER: "192.168.8.10"

env:
  TALOSCONFIG: "{{.TALOSCONFIG_FILE}}"

includes:
  maintenance:
    taskfile: ./Maintenance.yaml
    dir: "{{.ROOT_DIR}}"

tasks:

  bootstrap:
    desc: Bootstrap the Talos cluster
    # UNTESTED since the move to topf on 2026-11-16: this path only runs when
    # building a cluster from nodes in maintenance mode, and there has been
    # no cluster to build. Read it before relying on it.
    #
    # `SOPS_AGE_KEY_FILE="{{.AGE_FILE}}" topf apply --auto-bootstrap` applies each node's config (it detects
    # maintenance mode itself, so there is no --insecure flag), then
    # bootstraps etcd. If talsecret.sops.yaml does not exist, topf asks before
    # generating a new bundle and encrypts it on write when .sops.yaml has a
    # matching rule, which it does for talos/*.sops.yaml.
    dir: "{{.TOPF_DIR}}"
    cmds:
      - SOPS_AGE_KEY_FILE="{{.AGE_FILE}}" topf apply --auto-bootstrap
      - mkdir -p {{.TALOS_CLUSTER_DIR}}
      # Created empty and private first: the file holds the Talos admin key.
      - touch {{.TALOSCONFIG_FILE}} && chmod 600 {{.TALOSCONFIG_FILE}} && SOPS_AGE_KEY_FILE="{{.AGE_FILE}}" topf talosconfig > {{.TALOSCONFIG_FILE}}
      - task: fetch-kubeconfig
      - task: install-helm-apps
      - talosctl health --server=false
    preconditions:
      - msg: Missing topf config file
        sh: test -f {{.TOPF_CONFIG_FILE}}
      - msg: topf not found - see https://github.com/postfinance/topf/releases
        sh: command -v topf
      - msg: Missing Sops config file
        sh: test -f {{.SOPS_CONFIG_FILE}}
      - msg: Missing Sops Age key file
        sh: test -f {{.AGE_FILE}}

  fetch-kubeconfig:
    desc: Fetch kubeconfig
    # talosctl, not `topf kubeconfig`: topf's kubeconfig is a temporary admin
    # credential that expires after 12 hours.
    dir: "{{.KUBERNETES_DIR}}/bootstrap/talos"
    cmd: until talosctl kubeconfig --nodes {{.CONTROLLER}} --force {{.ROOT_DIR}}; do sleep 10; done
    preconditions:
      - msg: Missing talosconfig
        sh: test -f {{.TALOSCONFIG_FILE}}

  install-helm-apps:
    desc: Bootstrap core apps needed for Talos
    dir: "{{.KUBERNETES_DIR}}/bootstrap/talos"
    cmds:
      - until kubectl --kubeconfig {{.KUBECONFIG_FILE}} wait --for=condition=Ready=False nodes --all --timeout=600s; do sleep 10; done
      - helmfile --kubeconfig {{.KUBECONFIG_FILE}} --file {{.HELMFILE_FILE}} apply --skip-diff-on-install --suppress-diff
      - until kubectl --kubeconfig {{.KUBECONFIG_FILE}} wait --for=condition=Ready nodes --all --timeout=600s; do sleep 10; done
    preconditions:
      - msg: Missing kubeconfig
        sh: test -f {{.KUBECONFIG_FILE}}
      - msg: Missing helmfile
        sh: test -f {{.HELMFILE_FILE}}

  upgrade:
    desc: Upgrade Talos on a node
    dir: "{{.KUBERNETES_DIR}}/bootstrap/talos"
    cmds:
      # 15m drain: ingress-nginx's 300s shutdown races talosctl's 5m default.
      - talosctl --nodes {{.node}} upgrade --image {{.image}} --wait=true --timeout=30m --drain-timeout=15m --preserve=true --reboot-mode={{.mode}}
      - talosctl --nodes {{.node}} health --wait-timeout=10m --server=false
    vars:
      mode: '{{.mode | default "default"}}'
    requires:
      vars: ["node", "image"]
    preconditions:
      - msg: Missing talosconfig
        sh: test -f {{.TALOSCONFIG_FILE}}
      - msg: Unable to retrieve Talos config
        sh: talosctl config info >/dev/null 2>&1
      - msg: Node not found
        sh: talosctl --nodes {{.node}} get machineconfig >/dev/null 2>&1

  upgrade-k8s:
    desc: Upgrade Kubernetes across the cluster
    summary: |
      Upgrades Kubernetes to specified version with mandatory pre-flight validation.

      Usage:
        task talos:upgrade-k8s controller=192.168.8.10 to=v1.32.0

      IMPORTANT: Runs pre-flight checks automatically. Upgrade will be blocked if:
      - Cluster health issues detected
      - Backups are stale (>48h)
      - Failed pods exist
      - Ceph unhealthy
    dir: "{{.KUBERNETES_DIR}}/bootstrap/talos"
    requires:
      vars: ["controller", "to"]
    preconditions:
      - msg: Missing talosconfig
        sh: test -f {{.TALOSCONFIG_FILE}}
      - msg: Unable to retrieve Talos config
        sh: talosctl config info >/dev/null 2>&1
      - msg: Node not found
        sh: talosctl --nodes {{.controller}} get machineconfig >/dev/null 2>&1
    cmds:
      - echo "=== MANDATORY Pre-flight Validation ==="
      - task: maintenance:pre-flight
      - task: maintenance:backup-health
      - echo ""
      - echo "✓ Pre-flight checks passed - proceeding with Kubernetes upgrade to {{.to}}"
      - echo ""
      - echo "Press Ctrl+C within 10 seconds to abort..."
      - sleep 10
      - echo ""
      - echo "=== Starting Kubernetes Upgrade ==="
      - talosctl --nodes {{.controller}} upgrade-k8s --to {{.to}}
      - echo ""
      - echo "=== Post-upgrade Verification ==="
      - task: maintenance:verify

  nuke:
    desc: Resets nodes back to maintenance mode
    # UNTESTED since the move to topf on 2026-11-16, for the obvious reason.
    #
    # Keeps the old behaviour: without --force only the STATE and EPHEMERAL
    # partitions are wiped (--full=false), with --force the whole install
    # disk is. topf's own default is the full wipe, so --full is always
    # passed explicitly. topf asks for its own confirmation as well.
    dir: "{{.TOPF_DIR}}"
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: SOPS_AGE_KEY_FILE="{{.AGE_FILE}}" topf reset --graceful=false --full={{if eq .CLI_FORCE false}}false{{else}}true{{end}}
    preconditions:
      - msg: Missing topf config file
        sh: test -f {{.TOPF_CONFIG_FILE}}

  .reset:
    internal: true
    cmd: rm -rf {{.TALOS_CLUSTER_DIR}} {{.TALOS_SECRET_FILE}}
