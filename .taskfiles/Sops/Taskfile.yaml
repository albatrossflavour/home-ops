---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:

  age-keygen:
    desc: Initialize Age Key for Sops
    cmd: age-keygen --output {{.AGE_FILE}}
    status: ["test -f {{.AGE_FILE}}"]

  encrypt:
    desc: Encrypt all Kubernetes SOPS secrets
    cmds:
      - for: { var: file }
        task: .encrypt-file
        vars:
          file: "{{.ITEM}}"
    vars:
      file:
        sh: find "{{.KUBERNETES_DIR}}" -type f -name "*.sops.*" -exec grep -L "ENC\[AES256_GCM" {} \;

  .encrypt-file:
    internal: true
    cmd: sops --encrypt --in-place {{.file}}
    requires:
      vars: ["file"]
    preconditions:
      - msg: Missing Sops config file
        sh: test -f {{.SOPS_CONFIG_FILE}}
      - msg: Missing Sops Age key file
        sh: test -f {{.AGE_FILE}}

  rotate-key:
    desc: Re-key every known SOPS-encrypted file against .sops.yaml's current recipients and verify each still decrypts
    summary: |
      Step 3 of docs/operations/sops-age-key-rotation.md - run only after
      adding the new recipient to .sops.yaml (dual-key transition), and
      again after removing the old one. Loops `sops updatekeys` over every
      *.sops.yaml/.sops.yml file in the repo, then verifies each one still
      decrypts. Fails loudly (and stops) on the first file that doesn't -
      do not proceed to the in-cluster secret cutover if this fails.
    cmds:
      - for: { var: file }
        task: .rotate-key-file
        vars:
          file: "{{.ITEM}}"
    vars:
      # -name "*.sops.yaml" also matches the bare ".sops.yaml" config file
      # itself (the glob matches zero characters before the dot) - that
      # file is the encryption ruleset, not an encrypted secret, and isn't
      # decryptable at all. Excluded explicitly, not just by depth/path,
      # since a future nested .sops.yaml override would hit the same trap.
      file:
        sh: find "{{.ROOT_DIR}}" -type f \( -name "*.sops.yaml" -o -name "*.sops.yml" \) ! -name ".sops.yaml" ! -name ".sops.yml"

  .rotate-key-file:
    internal: true
    cmds:
      - sops updatekeys --yes {{.file}}
      - sops --decrypt {{.file}} > /dev/null
    requires:
      vars: ["file"]
    preconditions:
      - msg: Missing Sops config file
        sh: test -f {{.SOPS_CONFIG_FILE}}

  .reset:
    internal: true
    cmd: rm -rf {{.SOPS_CONFIG_FILE}}
