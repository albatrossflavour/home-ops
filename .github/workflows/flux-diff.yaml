---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flux Diff"

on:
  # No paths filter: both matrix legs of this workflow are REQUIRED status
  # checks, and a required check that never runs blocks the PR forever. See
  # the note in kubeconform.yaml. With no kubernetes/ changes the diff is
  # simply empty and no comment is posted.
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-diff:
    name: Flux Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        paths: ["kubernetes"]
        resources: ["helmrelease", "kustomization"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default

      - name: Diff Resources
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0@sha256:c0be852e30f299ce6a220cc992b0c21a2a0b0684cc17713b9d718e18d9c8beff
        with:
          args: >-
            diff ${{ matrix.resources }}
            --unified 6
            --path /github/workspace/pull/${{ matrix.paths }}/flux
            --path-orig /github/workspace/default/${{ matrix.paths }}/flux
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --sources "home-kubernetes"
            --output-file diff.patch

      # The diff goes to the comment step as a FILE, never as a `with:` input.
      #
      # It used to be interpolated into `message:`, which makes the whole diff
      # a single process argument. Linux caps one argument at 128KiB
      # (MAX_ARG_STRLEN), and a PR that moves a namespace blows straight
      # through that: renaming kyverno -> unified-compliance produced 950KiB on
      # the helmrelease leg and 580KiB on the kustomization one, because every
      # resource in the stack is removed and re-added. Both legs failed with
      # "Argument list too long" while starting node, AFTER generating a
      # perfectly good diff. Since both legs are required status checks, that
      # is a green change wearing a red X.
      #
      # `--limit-bytes` above does not save us; it is per-resource, so the
      # total still scales with how many resources moved.
      #
      # The old form also wrote the diff to $GITHUB_OUTPUT, which caps at 1MiB.
      # The helmrelease leg was at 950KiB, so that was the next wall anyway.
      #
      # Oversized comments are handled by the action's own `truncate: artifact`
      # default: too long for a comment body and it uploads the full diff as a
      # downloadable artifact and links it.
      - name: Generate Diff
        id: diff
        run: |
          cat diff.patch
          if [[ -s diff.patch ]]; then
            { echo '```diff'; cat diff.patch; echo '```'; } > comment.md
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.diff.outputs.present == 'true' }}
        name: Add comment
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
        with:
          message-id: "${{ github.event.pull_request.number }}/${{ matrix.paths }}/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message-path: comment.md
