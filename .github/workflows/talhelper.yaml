---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Talhelper"

# Renders and validates the Talos machine configs under
# kubernetes/bootstrap/talos/topf/.
#
# The workflow and its job are still called "Talhelper" although talhelper is
# gone (archived 2026-08-26, replaced by topf on 2026-11-16). "Talhelper" is a
# required status check in branch protection, and renaming the job without
# changing protection in the same step leaves every PR waiting on a check that
# never reports. Rename the two together, or not at all.
#
# Exists because of PR #1653 (2026-09-02), a routine Renovate kubelet bump to
# v1.37.0. Talos 1.13.9 cannot run Kubernetes 1.37, so the configs could not
# be rendered at all - but all four required checks passed, because none of
# them looked at the Talos config. The breakage sat undetected until someone
# next needed to change machine config.
#
# The bump also landed on top of pre-existing drift: talconfig said v1.35.4
# while every node had been running v1.36.3 since the 31 August upgrade, so
# rendering and applying would have silently DOWNGRADED kube-apiserver,
# controller-manager, scheduler and kubelet on whichever control plane node
# was touched first. Kubernetes does not support control plane downgrades.
#
# What this check does and does not cover. topf renders every node's config
# from topf.yaml and the patch files, and `talosctl validate` then checks each
# one, at the Talos version topf.yaml declares. That catches a patch that
# breaks rendering and a config the declared Talos version rejects. It knows
# nothing about what the nodes are running: only a dry-run against the live
# node (task talos:maintenance:apply-config) shows drift.

on:
  # No paths filter on pull_request, deliberately, same reasoning as
  # kubeconform.yaml. GitHub treats a required status check that never ran as
  # pending rather than passing, so a paths filter on a required check blocks
  # every PR that does not touch those paths. That is not hypothetical - see
  # PR #1661. This job takes a few seconds, which is cheaper than a required
  # check that silently does not apply.
  pull_request:
    branches: ["main"]
  # Also run on direct pushes to main. Branch protection lets admins bypass
  # required checks on purpose, for emergency fixes, but without this trigger
  # a bypassed push is never validated at all.
  push:
    branches: ["main"]
    paths: ["kubernetes/bootstrap/talos/**"]

env:
  # renovate: datasource=github-releases depName=postfinance/topf
  TOPF_VERSION: v0.6.2
  TOPF_DIR: ./kubernetes/bootstrap/talos/topf

jobs:
  talhelper:
    name: Talhelper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install topf
        shell: bash
        run: |
          set -euo pipefail
          TAR="topf_linux_amd64.tar.gz"
          BASE="https://github.com/postfinance/topf/releases/download/${TOPF_VERSION}"
          curl -sfLO "${BASE}/${TAR}"
          curl -sfL "${BASE}/topf_${TOPF_VERSION#v}_checksums.txt" -o checksums.txt
          grep " ${TAR}\$" checksums.txt | sha256sum -c -
          tar -xzf "${TAR}" topf
          sudo install -m 0755 topf /usr/local/bin/topf
          topf --version

      # talosctl at the version topf.yaml declares, so the validation uses the
      # same schema the nodes will. An older talosctl does not know config
      # documents added in a later Talos release and rejects them outright.
      - name: Install talosctl
        shell: bash
        run: |
          set -euo pipefail
          TALOS_VERSION="$(awk '/^talosVersion:/ {print $2}' "${TOPF_DIR}/topf.yaml")"
          test -n "${TALOS_VERSION}"
          BASE="https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}"
          curl -sfLO "${BASE}/talosctl-linux-amd64"
          curl -sfL "${BASE}/sha256sum.txt" -o sha256sum.txt
          grep " talosctl-linux-amd64\$" sha256sum.txt | sha256sum -c -
          sudo install -m 0755 talosctl-linux-amd64 /usr/local/bin/talosctl
          talosctl version --client

      # Render against a throwaway secret bundle.
      #
      # The real talsecret.sops.yaml is NOT decrypted here, and the age key
      # stays out of GitHub Actions: it decrypts every secret in the cluster
      # and cannot be recovered if lost. The topf directory is copied, pointed
      # at a bundle that `topf secrets` generates on the spot, and thrown away
      # with the runner. The output holds no real secrets.
      #
      # `topf render` does not validate what it writes. At Talos v1.14.6 it
      # happily rendered configs carrying both the old v1alpha1 fields and the
      # new 1.14 documents, which a node rejects. `talosctl validate` is what
      # catches that, so the two steps belong together.
      - name: Render and validate node configs
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cp -r "${TOPF_DIR}" "${WORK}/topf"
          cd "${WORK}/topf"
          sed -i 's#^secretsPath: .*#secretsPath: secrets.yaml#' topf.yaml
          grep -q '^secretsPath: secrets.yaml$' topf.yaml
          topf secrets --confirm=false > /dev/null
          topf render --output "${WORK}/out" --log-level warn
          count=0
          for f in "${WORK}"/out/*.yaml; do
            talosctl validate --mode metal --config "${f}"
            count=$((count + 1))
          done
          nodes="$(grep -c '^  - host: ' topf.yaml)"
          if [ "${count}" -ne "${nodes}" ]; then
            echo "rendered ${count} configs for ${nodes} nodes"
            exit 1
          fi
          rm -rf "${WORK}"
