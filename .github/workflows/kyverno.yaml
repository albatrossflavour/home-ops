---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Kyverno Policy"

on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**"]
  push:
    branches: ["main"]
    paths: ["kubernetes/**"]

env:
  KUBERNETES_DIR: ./kubernetes
  # Pinned to the version running in the cluster so CI and admission agree.
  KYVERNO_VERSION: v1.19.0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  kyverno:
    name: Kyverno Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # flux-local shells out to both of these, so they must be on PATH.
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # master, 2026-08-31

      - name: Setup Workflow Tools
        run: brew install fluxcd/tap/flux kustomize

      - name: Install flux-local
        run: pipx install flux-local

      - name: Install Kyverno CLI
        run: |
          curl -fsSL \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin kyverno
          kyverno version

      - name: Run Kyverno policy gate
        shell: bash
        run: bash ./scripts/kyverno-ci.sh ${{ env.KUBERNETES_DIR }}
