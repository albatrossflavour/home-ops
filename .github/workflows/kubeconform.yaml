---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Kubeconform"

on:
  # No paths filter on pull_request, deliberately. This is a REQUIRED status
  # check, and GitHub treats a required check that never ran as pending
  # rather than passing - so any PR not touching the filtered paths is
  # blocked permanently and needs an admin merge. That is not hypothetical:
  # PR #1661, which changed this very file, could not be merged normally.
  # Running it unconditionally costs about a minute on the rare PR that
  # touches nothing under kubernetes/, which is cheaper than a required
  # check that silently does not apply.
  pull_request:
    branches: ["main"]
  # Also run on direct pushes to main. Branch protection allows admins to
  # bypass the required checks (deliberately, for emergency fixes), but
  # without this trigger a bypassed push is never validated at all - it does
  # not just skip the gate, the workflow never runs. This gives the signal
  # even when nothing is blocking.
  push:
    branches: ["main"]
    paths: ["kubernetes/**"]

env:
  KUBERNETES_DIR: ./kubernetes

jobs:
  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # master, 2026-08-31

      - name: Setup Workflow Tools
        run: brew install fluxcd/tap/flux kubeconform kustomize

      - name: Run kubeconform
        shell: bash
        run: bash ./scripts/kubeconform.sh ${{ env.KUBERNETES_DIR }}
